html { font-size: calc(16px * var(--ts)); -webkit-text-size-adjust: 100%; height: 100%; }
body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 0.9375rem; line-height: 1.5; -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss03'; overflow: hidden; }
*, *::before, *::after { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
a { color: var(--brand-text); }
h1, h2, h3, h4, p, figure, blockquote { margin: 0; }
h1, h2, h3 { text-wrap: balance; letter-spacing: -0.018em; font-weight: 640; }
p { text-wrap: pretty; }
ul, ol { margin: 0; padding: 0; list-style: none; }
img, svg { max-width: 100%; }
[hidden] { display: none !important; }
.sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.i.sm { width: 18px; height: 18px; }
.i.xs { width: 15px; height: 15px; }
.i.lg { width: 28px; height: 28px; }
.i.fill { fill: currentColor; stroke: none; }
:focus { outline: none; }
:focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; border-radius: 10px; }
h1[tabindex="-1"]:focus, h2[tabindex="-1"]:focus, [data-autofocus][tabindex="-1"]:focus { outline: none; }
.muted { color: var(--fg-2); }
.faint { color: var(--fg-3); }
.small { font-size: 0.8125rem; }
.micro { font-size: 0.75rem; }
.strong { font-weight: 620; }
.num { font-variant-numeric: tabular-nums; }
.ok-t { color: var(--success-text); }
.warn-t { color: var(--warning-text); }
.err-t { color: var(--error); }
.brand-t { color: var(--brand-text); }
.teal-t { color: var(--teal-text); }
.coral-t { color: var(--coral-text); }
.center { text-align: center; }
.row-gap { display: flex; gap: var(--sp2); align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: var(--sp3); }
.stack-sm { display: flex; flex-direction: column; gap: var(--sp2); }
.stack-lg { display: flex; flex-direction: column; gap: var(--sp6); }
.spacer { flex: 1; }
.serif { font-family: var(--serif); letter-spacing: -0.01em; }
.display { font-family: var(--serif); font-weight: 600; font-size: 2.125rem; line-height: 1.08; letter-spacing: -0.015em; }
.display.xl { font-size: 2.75rem; line-height: 1.02; }
.display.md { font-size: 1.75rem; line-height: 1.12; }
.display.sm { font-size: 1.4rem; line-height: 1.18; }
.kicker { font-size: 0.8125rem; font-weight: 560; color: var(--fg-2); }
.demo-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 0.75rem; font-weight: 580; padding: 3px 9px; border-radius: 999px; background: var(--fill); color: var(--fg-2); vertical-align: middle; white-space: nowrap; }
.demo-tag .i { width: 13px; height: 13px; }
.src-line { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--fg-2); }
.src-line .i { width: 14px; height: 14px; color: var(--fg-3); }

/* ---------- Wordmark ---------- */
.wordmark { display: inline-flex; align-items: center; gap: 10px; color: var(--fg); text-decoration: none; }
.wordmark .mark { width: 30px; height: 30px; flex: none; }
.wordmark .wm-text { font-family: var(--serif); font-weight: 650; font-size: 1.3rem; letter-spacing: 0.14em; }
.wordmark.lg .mark { width: 40px; height: 40px; }
.wordmark.lg .wm-text { font-size: 1.6rem; }
.wordmark.inv { color: #fff; }

/* ============================================================
   Shell
   ============================================================ */
.app { position: fixed; inset: 0; display: flex; background: var(--bg); color: var(--fg); overflow: hidden; }
.main { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
.screens { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scroll-padding-top: 72px; }
.content { width: 100%; max-width: 640px; margin: 0 auto; padding: var(--sp2) var(--gutter) calc(var(--sp8) + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: var(--sp7); }
.content.wide { max-width: 1120px; }
.content.narrow { max-width: 520px; }
.content.tight { gap: var(--sp5); }
.screen.has-tabbar .content { padding-bottom: calc(var(--tabbar-h) + var(--sp8) + env(safe-area-inset-bottom, 0px)); }
.screen.has-footer .content { padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px)); }
.screen.has-tabbar.has-footer .content { padding-bottom: calc(var(--tabbar-h) + 120px + env(safe-area-inset-bottom, 0px)); }
.topbar { position: relative; z-index: 6; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--sp2); min-height: 56px; padding: calc(env(safe-area-inset-top, 0px) + 4px) 8px 2px; background: var(--bg); transition: box-shadow var(--dur), background var(--dur); }
.topbar.scrolled { box-shadow: 0 1px 0 var(--hair); }

/* bottom tab bar */

/* ============================================================
   Buttons
   ============================================================ */

/* ============================================================

   ============================================================ */

/* ============================================================
   Cards & sections

   ============================================================ */

/* pills */
.pill { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; background: var(--fill); color: var(--fg-2); flex: none; }

.pill.ok { background: var(--success-soft); color: var(--success-text); }
.pill.warn { background: var(--warning-soft); color: var(--warning-text); }
.pill.err { background: var(--error-soft); color: var(--error); }

.pill.outline { background: transparent; box-shadow: inset 0 0 0 1px var(--border-2); color: var(--fg-2); }

/* ============================================================
   Chips, segmented controls
   ============================================================ */

.seg > button { min-height: 38px; padding: 0 14px; border-radius: 10px; font-size: 0.875rem; font-weight: 580; color: var(--fg-2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background var(--dur), color var(--dur), box-shadow var(--dur); white-space: nowrap; }
.seg > button[aria-pressed="true"], .seg > button[aria-selected="true"], .seg > button[aria-checked="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(14,22,34,.12); }
.seg > button .i { width: 16px; height: 16px; }
/* underline tabs (trip sections) */
.utabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--border); }
.utabs::-webkit-scrollbar { display: none; }
.utabs button { position: relative; flex: none; min-height: 46px; padding: 0 12px; font-size: 0.9375rem; font-weight: 580; color: var(--fg-2); transition: color var(--dur); }
.utabs button::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2.5px; border-radius: 2px; background: var(--fg); transform: scaleX(0); transition: transform 240ms var(--ease-out); }
.utabs button[aria-selected="true"] { color: var(--fg); font-weight: 650; }
.utabs button[aria-selected="true"]::after { transform: scaleX(1); }
.utabs .count { font-size: 0.75rem; color: var(--fg-2); margin-left: 4px; }
@media (max-width: 440px) { .utabs button { padding: 0 9px; font-size: 0.875rem; } .utabs button::after { left: 9px; right: 9px; } .utabs .count { display: none; } }

/* ============================================================
   Forms
   ============================================================ */
.field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }

.input, .textarea, .select-field { width: 100%; min-height: 54px; padding: 0 16px; border-radius: var(--r-input); background: var(--surface); border: 1px solid var(--control); font-size: 1rem; transition: border-color var(--dur), box-shadow var(--dur); }
.select-field { display: flex; align-items: center; gap: 10px; text-align: left; }
.select-field .sf-v { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.select-field .sf-v.ph { color: var(--fg-2); }
.select-field > .i:last-child { color: var(--fg-2); width: 18px; height: 18px; }
.select-field:hover { border-color: var(--fg-2); }
.textarea { padding: 14px 16px; min-height: 104px; resize: vertical; line-height: 1.45; }
.input::placeholder, .textarea::placeholder { color: var(--fg-3); }

.search .clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); }
button.search-fake { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 0 18px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow-2), inset 0 0 0 1px var(--hair); color: var(--fg-2); font-size: 0.9375rem; text-align: left; }
button.search-fake:hover { background: var(--surface-2); }
.money-input { display: flex; align-items: center; min-height: 56px; border-radius: var(--r-input); background: var(--surface); border: 1px solid var(--control); overflow: hidden; transition: border-color var(--dur), box-shadow var(--dur); }

.money-input .cur-btn { display: inline-flex; align-items: center; gap: 4px; align-self: stretch; padding: 0 10px 0 14px; font-weight: 650; border-right: 1px solid var(--border); color: var(--fg); font-size: 0.9375rem; }

.two-fields { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp3); }
.switch { position: relative; width: 52px; height: 32px; border-radius: 999px; background: var(--border-2); flex: none; transition: background var(--dur) var(--ease); }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform var(--dur) var(--ease); }

[aria-checked="true"] > .switch::after { transform: translateX(20px); }
.switch-row { display: flex; align-items: center; gap: var(--sp3); min-height: 62px; padding: 10px var(--sp4); width: 100%; text-align: left; }
.switch-row:hover { background: var(--surface-2); }
.switch-row[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper .icon-btn { box-shadow: inset 0 0 0 1px var(--border-2); width: 40px; height: 40px; }
.stepper .icon-btn[disabled] { opacity: .35; }
.stepper output { min-width: 34px; text-align: center; font-weight: 660; font-size: 1.0625rem; font-variant-numeric: tabular-nums; }
.opt { position: relative; display: flex; align-items: center; gap: var(--sp3); padding: var(--sp4); border-radius: 18px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border-2); text-align: left; width: 100%; transition: box-shadow var(--dur), background var(--dur), transform 140ms var(--ease); }
.opt:hover { background: var(--surface-2); }
.opt:active { transform: scale(.99); }
.opt[aria-pressed="true"], .opt[aria-checked="true"] { box-shadow: inset 0 0 0 2px var(--brand); background: var(--brand-soft); }
.opt .opt-check { margin-left: auto; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--control); display: grid; place-items: center; flex: none; color: transparent; background: var(--surface); transition: background var(--dur), border-color var(--dur); }
.opt[aria-pressed="true"] .opt-check, .opt[aria-checked="true"] .opt-check { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.opt-check .i { width: 15px; height: 15px; stroke-width: 2.6; }
.opt .o-t { font-weight: 640; }
.opt .o-s { font-size: 0.8125rem; color: var(--fg-2); margin-top: 2px; }
.radio-row { display: flex; align-items: center; gap: var(--sp3); min-height: 58px; padding: 8px var(--sp4); width: 100%; text-align: left; border-radius: 14px; }
.radio-row .rdot { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--control); flex: none; display: grid; place-items: center; margin-left: auto; }
.radio-row[aria-checked="true"] .rdot { border-color: var(--brand); border-width: 2px; }
.radio-row[aria-checked="true"] .rdot::after { content: ''; width: 11px; height: 11px; border-radius: 50%; background: var(--brand); }
.radio-row:hover { background: var(--surface-2); }
.checkbox { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--control); display: grid; place-items: center; flex: none; color: transparent; background: var(--surface); transition: background var(--dur), border-color var(--dur); }
[aria-checked="true"] > .checkbox, [aria-pressed="true"] > .checkbox, .checkbox.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.checkbox .i { width: 15px; height: 15px; stroke-width: 2.6; }

/* ============================================================
   Progress, rings
   ============================================================ */
.bar { position: relative; height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
.bar.thin { height: 5px; }
.bar-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--brand); width: 0; transition: width 700ms var(--ease-out); }
.bar.teal .bar-fill { background: var(--teal); }
.bar.warn .bar-fill { background: var(--warning); }
.ring { display: block; }
.ring .ring-track { stroke: var(--track); }
.ring .ring-fill { stroke: var(--teal); transition: stroke-dashoffset 900ms var(--ease-out); }
.ring.brand .ring-fill { stroke: var(--brand); }
.ring-wrap { position: relative; display: grid; place-items: center; flex: none; }
.ring-wrap .ring-mid { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; align-content: center; }

/* ============================================================
   Notices, empty states, skeletons
   ============================================================ */
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; background: var(--mist); color: var(--fg); font-size: 0.875rem; line-height: 1.45; }
.notice > .i { width: 19px; height: 19px; flex: none; margin-top: 1px; color: var(--brand-text); }
.notice.warn { background: var(--warning-soft); }
.notice.warn > .i { color: var(--warning-text); }
.notice.error { background: var(--error-soft); }
.notice.error > .i { color: var(--error); }
.notice.success { background: var(--success-soft); }
.notice.success > .i { color: var(--success-text); }
.notice.sand { background: var(--sand); }
.notice.sand > .i { color: var(--fg-2); }
.notice.coral { background: var(--coral-soft); }
.notice.coral > .i { color: var(--coral-text); }
.notice .n-title { font-weight: 640; margin-bottom: 2px; }
.notice .n-body { flex: 1; min-width: 0; }
.notice .n-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--sp3); padding: var(--sp7) var(--sp5); }
.empty .empty-art { width: 128px; height: 96px; margin-bottom: var(--sp2); }
.empty h1, .empty h2, .empty h3 { font-size: 1.25rem; font-weight: 600; font-family: var(--serif); }
.empty p { color: var(--fg-2); max-width: 36ch; }
.empty .btn-row { justify-content: center; margin-top: var(--sp2); width: 100%; max-width: 380px; }
.sk { background: linear-gradient(90deg, var(--skeleton) 0%, var(--surface-2) 50%, var(--skeleton) 100%); background-size: 200% 100%; animation: shimmer 1.3s ease-in-out infinite; border-radius: 10px; }
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

/* key-value */
.kv { display: flex; flex-direction: column; margin: 0; }
.kv > div { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp4); padding: 13px 0; }
.kv > div + div { box-shadow: inset 0 1px 0 var(--hair); }
.kv dt { color: var(--fg-2); font-size: 0.875rem; flex: none; max-width: 48%; }
.kv dd { margin: 0; text-align: right; font-weight: 580; font-size: 0.9375rem; min-width: 0; overflow-wrap: anywhere; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.kv dd .sub { display: block; color: var(--fg-2); font-weight: 450; font-size: 0.8125rem; }
.kv.card { padding: 2px var(--sp5); }
details.more > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-weight: 620; font-size: 0.875rem; color: var(--brand-text); }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary .i { width: 16px; height: 16px; transition: transform var(--dur); }
details.more[open] > summary .i { transform: rotate(180deg); }

/* avatars */
.av { width: 36px; height: 36px; border-radius: 50%; display: inline-grid; place-items: center; font-weight: 680; font-size: 0.8125rem; flex: none; background: var(--av1); color: var(--av1-fg); letter-spacing: -0.01em; }
.av.t2 { background: var(--av2); color: var(--av2-fg); }
.av.t3 { background: var(--av3); color: var(--av3-fg); }
.av.t4 { background: var(--av4); color: var(--av4-fg); }
.av.sm { width: 28px; height: 28px; font-size: 0.6875rem; }
.av.xs { width: 22px; height: 22px; font-size: 0.5625rem; }
.av.lg { width: 56px; height: 56px; font-size: 1.125rem; }
.av.xl { width: 76px; height: 76px; font-size: 1.5rem; }
.av.pending { background: var(--surface); color: var(--fg-2); box-shadow: inset 0 0 0 1.5px dashed var(--control); border: 1.5px dashed var(--control); }
.av-stack { display: inline-flex; }
.av-stack .av { box-shadow: 0 0 0 2.5px var(--surface); }
.av-stack .av + .av { margin-left: -6px; }
.av-stack.on-photo .av { box-shadow: 0 0 0 2px rgba(255,255,255,.9); }

/* ============================================================
   Sheets, dialogs, toasts, motion
   ============================================================ */
.layer { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
.sheet-wrap, .dialog-layer { position: absolute; inset: 0; pointer-events: auto; }
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity 260ms var(--ease); }
.scrim.on { opacity: 1; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100% - 40px - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; background: var(--elevated); border-radius: 28px 28px 0 0; box-shadow: var(--shadow-3); transform: translateY(100%); transition: transform 340ms var(--ease-out); outline: none; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet.on { transform: translateY(0); }
.sheet.dragging { transition: none; }
.sheet.full { height: calc(100% - 24px - env(safe-area-inset-top, 0px)); }
.sheet-handle { width: 40px; height: 5px; border-radius: 3px; background: var(--border-2); margin: 8px auto 0; flex: none; cursor: grab; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp3); padding: 10px 12px 6px 24px; flex: none; touch-action: none; }
.sheet-head h2 { font-size: 1.1875rem; font-weight: 640; letter-spacing: -0.015em; }
.sheet-body { padding: 4px 24px 16px; overflow-y: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--sp4); overscroll-behavior: contain; }
.sheet-body.flush { padding-left: 8px; padding-right: 8px; }
.sheet-body.last { padding-bottom: 26px; }
.sheet-foot { padding: 12px 24px 18px; display: flex; flex-direction: column; gap: 8px; box-shadow: inset 0 1px 0 var(--hair); flex: none; background: var(--elevated); }
.sheet-foot.row-btns { flex-direction: row; }
.sheet-foot.row-btns .btn { flex: 1; }
.dialog-layer { display: grid; place-items: center; padding: var(--sp5); }
.dialog { position: relative; width: 100%; max-width: 400px; background: var(--elevated); border-radius: 26px; padding: var(--sp6); box-shadow: var(--shadow-3); transform: scale(.94); opacity: 0; transition: transform 220ms var(--ease-out), opacity 180ms; }
.dialog.on { transform: scale(1); opacity: 1; }
.dialog h2 { font-size: 1.1875rem; font-weight: 640; margin-bottom: 8px; }
.dialog p { color: var(--fg-2); }
.dialog .dialog-actions { display: flex; flex-direction: column; gap: 8px; margin-top: var(--sp5); }
.toasts { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(92vw, 460px); }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 16px; border-radius: 18px; background: var(--toast-bg); color: var(--toast-fg); box-shadow: var(--shadow-3); font-size: 0.875rem; font-weight: 500; animation: toastIn 300ms var(--ease-out); max-width: 100%; }
.toast .i { width: 20px; height: 20px; flex: none; }
.toast .t-msg { flex: 1; min-width: 0; }
.toast .t-msg small { display: block; opacity: .78; font-size: 0.75rem; margin-top: 1px; }
.toast .t-act { color: var(--toast-link); font-weight: 720; padding: 8px 10px; border-radius: 10px; min-height: 38px; }
.toast.out { animation: toastOut 220ms var(--ease) forwards; }
@keyframes toastIn { from { transform: translateY(14px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes toastOut { to { transform: translateY(8px); opacity: 0; } }

/* ============================================================
   Motion
   ============================================================ */
.screen.enter-push { animation: pushIn 320ms var(--ease-out); }
.screen.exit-push { animation: fadeOut 220ms var(--ease) forwards; }
.screen.enter-pop { animation: popIn 260ms var(--ease-out); }
.screen.exit-pop { animation: pushOutRight 260ms var(--ease) forwards; z-index: 2; }
.screen.enter-fade { animation: fadeIn 240ms var(--ease); }
.screen.exit-fade { animation: fadeOut 160ms var(--ease) forwards; }
.screen.enter-rise { animation: riseIn 380ms var(--ease-out); }
.screen.exit-rise { animation: fadeOut 200ms var(--ease) forwards; }
.screen.enter-shared { animation: fadeIn 260ms 120ms var(--ease) both; }
.screen.exit-shared { animation: fadeOut 240ms var(--ease) forwards; }
@keyframes pushIn { from { transform: translateX(28px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes popIn { from { transform: translateX(-16px); opacity: 0.6; } to { transform: none; opacity: 1; } }
@keyframes pushOutRight { to { transform: translateX(28px); opacity: 0; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes riseIn { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.shared-fly { position: fixed; z-index: 45; overflow: hidden; pointer-events: none; will-change: transform, border-radius; background-size: cover; background-position: center; }
.shared-fly img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shared-hide { visibility: hidden; }
.rise { animation: rise 460ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 50ms); }
.screen.no-anim .rise { animation: none; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.fade-swap { animation: fadeIn 240ms var(--ease); }
.pressed { transform: scale(.97) !important; }
.flash { animation: flash 1.4s var(--ease); }
@keyframes flash { 0%, 100% { box-shadow: var(--shadow-1), inset 0 0 0 1px var(--hair); } 20% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--teal) 35%, transparent), inset 0 0 0 1px var(--teal); } }
.app.rm *, .app.rm *::before, .app.rm *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; scroll-behavior: auto !important; }
}

/* ============================================================
   Desktop shell (≥ 1024px): sidebar, wider content, floating sheets
   ============================================================ */
@media (min-width: 1024px) {
  :root { --gutter: 32px; }
  .tabbar { display: none; }
  .screen.has-tabbar .content { padding-bottom: var(--sp9); }
  .screen.has-tabbar .footer-bar { bottom: 0; }
  .screen.has-tabbar .footer-bar::after { display: none; }
  .toasts { bottom: 24px; left: calc(50% + 124px); }
  .sidebar { display: flex; flex-direction: column; gap: 4px; width: 248px; flex: none; padding: 22px 14px 16px; background: var(--bg-2); box-shadow: inset -1px 0 0 var(--hair); overflow-y: auto; }
  .sidebar[hidden] { display: none !important; }
  .sb-brand { padding: 4px 10px 22px; }
  .sb-item { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 12px; border-radius: 12px; font-weight: 560; font-size: 0.9375rem; color: var(--fg-2); transition: background var(--dur), color var(--dur); }
  .sb-item:hover { background: var(--fill); color: var(--fg); }
  .sb-item[aria-current="page"] { background: var(--surface); color: var(--fg); font-weight: 640; box-shadow: var(--shadow-1), inset 0 0 0 1px var(--hair); }
  .sb-item[aria-current="page"] .i { color: var(--brand-text); }
  .sb-item .sb-count { margin-left: auto; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; background: var(--coral); color: var(--on-coral); font-size: 0.75rem; font-weight: 700; display: grid; place-items: center; }
  .sb-label { font-size: 0.75rem; font-weight: 620; color: var(--fg-2); padding: 18px 12px 6px; }
  .sb-trip { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; padding: 10px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--hair); text-align: left; transition: background var(--dur); }
  .sb-trip:hover { background: var(--surface-2); }
  .sb-trip .ph { height: 84px; border-radius: 12px; }
  .sb-trip .st-t { font-weight: 640; font-size: 0.9375rem; line-height: 1.2; padding: 0 4px; }
  .sb-trip .st-s { font-size: 0.8125rem; color: var(--fg-2); padding: 0 4px 2px; }
  .sb-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 18px; }
  .sb-demo { font-size: 0.75rem; color: var(--fg-2); line-height: 1.45; padding: 12px; border-radius: 14px; background: var(--fill); }
  .sb-demo strong { display: block; color: var(--fg); font-size: 0.8125rem; margin-bottom: 2px; }
  .sb-user { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 14px; text-align: left; }
  .sb-user:hover { background: var(--fill); }
  .sb-user .su-name { font-weight: 620; font-size: 0.875rem; }
  .sb-user .su-sub { font-size: 0.75rem; color: var(--fg-2); }
  .sheet { left: 50%; right: auto; bottom: auto; top: 50%; width: min(560px, calc(100vw - 48px)); max-height: min(780px, calc(100vh - 64px)); border-radius: 28px; transform: translate(-50%, -46%) scale(.97); opacity: 0; transition: transform 260ms var(--ease-out), opacity 200ms; }
  .sheet.on { transform: translate(-50%, -50%); opacity: 1; }
  .sheet.wide { width: min(760px, calc(100vw - 48px)); }
  .sheet-handle { display: none; }
  .sheet-head { padding-top: 18px; }
  .netbar { padding-top: 8px; }
}

/* ============================================================
   Category colours, shared bits
   ============================================================ */
.c-sights { --cat: var(--cat-sights); } .c-food { --cat: var(--cat-food); } .c-nature { --cat: var(--cat-nature); } .c-night { --cat: var(--cat-night); }
.c-shop { --cat: var(--cat-shop); } .c-exp { --cat: var(--cat-exp); } .c-travel { --cat: var(--cat-travel); } .c-stay { --cat: var(--cat-stay); }
.cat-tile { display: grid; place-items: center; background: color-mix(in srgb, var(--cat, var(--brand)) 13%, var(--surface)); color: var(--cat, var(--brand)); flex: none; overflow: hidden; }
.cat-tile .i { width: 22px; height: 22px; }
.row-thumb.cat-tile { width: 52px; height: 52px; border-radius: 14px; }
.warn-line { display: flex; gap: 7px; align-items: flex-start; font-size: 0.8125rem; line-height: 1.4; font-weight: 520; }
.warn-line .i { width: 16px; height: 16px; flex: none; margin-top: 1px; }
.warn-line.error { color: var(--error); }
.warn-line.warn { color: var(--warning-text); }
.warn-line.info { color: var(--fg-2); font-weight: 450; }
.est { display: inline-block; font-size: 0.6875rem; font-weight: 600; color: var(--fg-2); padding: 0 5px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--border-2); line-height: 1.5; vertical-align: 1px; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 0 color-mix(in srgb, var(--coral) 60%, transparent); animation: pulse 2s infinite; flex: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--coral) 55%, transparent); } 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
mark { background: color-mix(in srgb, var(--teal) 24%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
.heart-btn { position: absolute; top: 10px; right: 10px; z-index: 3; background: rgba(255,255,255,0.88); color: #17243A; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.heart-btn:hover { background: #fff; }
.heart-btn[aria-pressed="true"] { color: #C9503A; }
.heart-btn .i.fill { fill: currentColor; }
.no-select, .no-select * { user-select: none !important; -webkit-user-select: none !important; }
.foot-note { max-width: 60ch; margin: 0 auto; }
.share-link { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 14px; border-radius: 14px; background: var(--sand); }
.share-link .sl-url { flex: 1; min-width: 0; font-size: 0.875rem; overflow-wrap: anywhere; }
.input-row { display: flex; gap: 8px; }
.input-row .input { flex: 1; min-width: 0; }
fieldset.plain { border: 0; padding: 0; margin: 0; min-width: 0; }
fieldset.plain legend { padding: 0; margin-bottom: 8px; }
.quick-acts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.quick-acts button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; min-height: 78px; padding: 10px 4px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--hair); font-size: 0.75rem; font-weight: 600; text-align: center; transition: background var(--dur); }
.quick-acts button:hover { background: var(--surface-2); }
.quick-acts .i { color: var(--brand-text); }
.day-num { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--sand); font-weight: 680; font-size: 0.875rem; flex: none; font-variant-numeric: tabular-nums; }
.time-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
.time-slot { min-height: 44px; border-radius: 12px; background: var(--fill); font-weight: 600; font-size: 0.875rem; font-variant-numeric: tabular-nums; }
.time-slot:hover { background: var(--fill-2); }
.time-slot[aria-checked="true"] { background: var(--brand); color: var(--on-brand); }
.dp { display: flex; flex-direction: column; gap: 10px; }
.dp-head { display: flex; align-items: center; justify-content: space-between; }
.dp-title { font-weight: 660; font-size: 1.0625rem; }
.dp-dow, .dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px 0; text-align: center; }
.dp-dow span { font-size: 0.75rem; font-weight: 650; color: var(--fg-2); padding: 4px 0; }
.dp-cell { height: 44px; font-weight: 600; font-variant-numeric: tabular-nums; transition: background var(--dur), color var(--dur); position: relative; }
.dp-cell:hover:not([disabled]) { background: var(--fill); border-radius: 12px; }
.dp-cell.in { background: var(--brand-soft); color: var(--on-soft); }
.dp-cell.a, .dp-cell.b { background: var(--brand); color: var(--on-brand); border-radius: 12px; }
.dp-cell.a { border-radius: 12px 0 0 12px; } .dp-cell.b { border-radius: 0 12px 12px 0; }
.dp-cell.a:last-child, .dp-cell.a.b { border-radius: 12px; }
.dp-cell[disabled] { color: var(--fg-3); cursor: not-allowed; opacity: .5; }
.dp-sel { min-height: 40px; }

/* ============================================================
   Welcome & onboarding
   ============================================================ */
.scr-welcome { background: #0E1622; }
.wel { position: relative; height: 100%; display: flex; flex-direction: column; overflow: hidden; color: #fff; }
.wel-photo { position: absolute; inset: 0; }

/* ============================================================
   ATLAS — travel planning and trip management prototype.
   Fictional product. Demo data only: ATLAS does not book, rebook
   or check live availability, and travel times are estimates
   worked out from distance, never live transit data.
   ============================================================ */

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const delay = (ms) => new Promise((r) => setTimeout(r, ms));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
let _uidN = 0;
const uid = (p = 'id') => p + '_' + (++_uidN).toString(36) + Math.random().toString(36).slice(2, 6);
const sum = (arr, f = (x) => x) => arr.reduce((a, x) => a + f(x), 0);
const deepCopy = (o) => JSON.parse(JSON.stringify(o));
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function groupBy(arr, f) { const m = new Map(); arr.forEach((x) => { const k = f(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }); return m; }
const pad2 = (n) => String(n).padStart(2, '0');
const MINUS = '−';

/* ============================================================
   Money — integer minor units (pence, cents; yen have none).
   Conversions use fixed, clearly labelled demo rates so every
   session shows the same figures. Not live rates.
   ============================================================ */
const CUR = {
  GBP: { sym: '£', name: 'British pound', dp: 2 },
  JPY: { sym: '¥', name: 'Japanese yen', dp: 0 },
  EUR: { sym: '€', name: 'Euro', dp: 2 },
  USD: { sym: '$', name: 'US dollar', dp: 2 },
};
/* pence per one minor unit of each currency */
const FX = { date: '2026-10-14', GBP: 1, JPY: 0.5, EUR: 86, USD: 75 };
/* readable rate line: £1 = ¥200 */
function fxLine(cur) { if (cur === 'JPY') return '£1 = ¥200'; if (cur === 'EUR') return '£1 = €1.16'; if (cur === 'USD') return '£1 = $1.33'; return ''; }
function toGBP(minor, cur) { if (!cur || cur === 'GBP') return minor; if (cur === 'JPY') return Math.round(minor * FX.JPY); return Math.round(minor * FX[cur] / 100); }
function fromGBP(p, cur) { if (!cur || cur === 'GBP') return p; if (cur === 'JPY') return Math.round(p / FX.JPY); return Math.round(p * 100 / FX[cur]); }
function groupThousands(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function fmtMoney(m, cur = 'GBP', opts = {}) {
  const c = CUR[cur] || CUR.GBP;
  if (opts.hide) return c.sym + '••••';
  const neg = m < 0; const abs = Math.abs(Math.round(m));
  let body;
  if (c.dp === 0) body = groupThousands(abs);
  else if (opts.round) body = groupThousands(Math.round(abs / 100));
  else { const w = Math.floor(abs / 100), f = abs % 100; body = (opts.whole !== false && f === 0) ? groupThousands(w) : groupThousands(w) + '.' + pad2(f); }
  const sign = opts.sign === 'none' ? '' : neg ? MINUS : (opts.sign === 'always' && m > 0 ? '+' : '');
  return sign + c.sym + body;
}
/* money(p) — pence, shown in pounds */
function money(p, opts = {}) { return fmtMoney(p, 'GBP', opts); }
function minorFromInput(str, cur = 'GBP') {
  const s = String(str == null ? '' : str).replace(/[£$€¥,\s]/g, '');
  if (!s) return null;
  if ((CUR[cur] || CUR.GBP).dp === 0) { if (!/^\d+$/.test(s)) return null; return Number(s); }
  if (!/^\d+(\.\d{0,2})?$/.test(s) && !/^\.\d{1,2}$/.test(s)) return null;
  const [w, f = ''] = s.split('.');
  return Number(w || 0) * 100 + Number((f + '00').slice(0, 2));
}
function inputFromMinor(m, cur = 'GBP') { if (m == null) return ''; if ((CUR[cur] || CUR.GBP).dp === 0) return groupThousands(m); const w = Math.floor(m / 100), f = m % 100; return groupThousands(w) + (f ? '.' + pad2(f) : ''); }
/* Split a total into n parts that reconcile exactly (largest remainder) */
function splitEven(total, n) {
  const base = Math.trunc(total / n); const out = Array(n).fill(base);
  let rem = total - base * n; let i = 0;
  while (rem !== 0) { const step = rem > 0 ? 1 : -1; out[i % n] += step; rem -= step; i++; }
  return out;
}

/* ============================================================
   Dates and times. Day keys are 'YYYY-MM-DD'; day arithmetic
   runs through UTC so clock changes never shift a day. Wall-clock
   times inside a trip are minutes after local midnight in that
   day's time zone.
   ============================================================ */
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOW_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MON_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DAY_MS = 86400000;
function dk(y, m, d) { const t = new Date(Date.UTC(y, m - 1, d)); return t.getUTCFullYear() + '-' + pad2(t.getUTCMonth() + 1) + '-' + pad2(t.getUTCDate()); }

/* ============================================================
   Trip engine: itinerary timing, travel estimates, opening-hours
   checks, route suggestions, budget maths and splits.
   Pure functions of the trip object, so tests can run them in Node.
   ============================================================ */

/* ---------- Items and places ---------- */
function placeOf(item) { return item && item.placeId ? PLACE[item.placeId] || null : null; }
function itemTitle(item) { if (!item) return ''; if (item.title) return item.title; const p = placeOf(item); return p ? p.name : 'Untitled stop'; }
function itemCat(item) {

  if (item.kind === 'stay') return 'stay';

}

function itemStartLoc(item) { return item && item.placeId ? locOf(item.placeId) : null; }

function memberById(trip, id) { return (trip.members || []).find((m) => m.id === id) || null; }

/* ---------- Travel estimates ----------
   Worked out from straight-line distance with a detour factor and typical
   speeds. They are planning estimates, not live transit data. */
const EST = { detour: 1.3, walkKmh: 4.8, transitKmh: 25, transitWait: 8, taxiKmh: 20, taxiPickup: 4, walkMax: 15 };

  if (km < 0.05) return { km: 0, mode: 'none', min: 0, walk: 0, transit: 0, taxi: 0 };
  const walk = Math.round(km * EST.detour / EST.walkKmh * 60);
  const transit = Math.round(EST.transitWait + km * EST.detour / EST.transitKmh * 60);
  const taxi = Math.round(EST.taxiPickup + km * EST.detour / EST.taxiKmh * 60);

}
function legWith(leg, mode) { if (!leg || !mode || mode === leg.mode || leg.mode === 'none') return leg; return Object.assign({}, leg, { mode, min: leg[mode] }); }
const MODE_LABEL = { walk: 'Walk', transit: 'Train or bus', taxi: 'Taxi', none: 'Same place' };
const MODE_ICON = { walk: 'walk', transit: 'train', taxi: 'car', none: 'pin' };
const ceil5 = (m) => Math.ceil(m / 5) * 5;

/* ---------- Opening hours (typical hours, demo data) ---------- */
function hoursLabel(place, date, tz = 'Asia/Tokyo') {
  const h = place && place.hours;
  if (h === null || h === undefined) return 'Hours unknown';
  if (h.always) return 'Open all day';
  if (h.varies) return 'Hours vary';
  if (h.sun) { const s = sunTimes(date, place.lat, place.lon, tz); return `Sunrise to sunset, about ${hm(s.rise)}–${hm(s.set)}`; }
  if (date && closedOn(place, date)) return `Usually closed on ${fmtDay(date, 'wl')}s`;
  return `${hm(h.open)}–${hm(h.close)}${h.last != null ? `, last entry ${hm(h.last)}` : ''}`;
}
function closedOn(place, date) {
  const h = place.hours; if (!h || !h.closed || !h.closed.length) return false;
  if (h.openAnyway && date >= h.openAnyway[0] && date <= h.openAnyway[1]) return false;

}
/* Problems with visiting a place between start and end on a date */
function hoursCheck(place, date, start, end, tz = 'Asia/Tokyo') {
  const out = []; if (!place) return out;
  const h = place.hours;
  const tag = ' (typical hours, demo data)';
  if (h === null || h === undefined) { out.push({ level: 'info', code: 'unknown', text: 'Opening hours unknown. Check before you go.' }); return out; }
  if (h.always) return out;
  if (h.varies) { out.push({ level: 'info', code: 'varies', text: h.note || 'Hours vary. Check before you go.' }); return out; }
  if (h.sun) {
    const s = sunTimes(date, place.lat, place.lon, tz);
    if (start < s.rise) out.push({ level: 'warn', code: 'early', text: `Gates open at sunrise, about ${hm(s.rise)}` });
    if (end > s.set) out.push({ level: 'warn', code: 'late', text: `Gates close at sunset, about ${hm(s.set)}` });
    return out;
  }
  if (closedOn(place, date)) { out.push({ level: 'error', code: 'closed', text: `Usually closed on ${fmtDay(date, 'wl')}s${tag}` }); return out; }
  if (start < h.open) out.push({ level: 'warn', code: 'early', text: `Opens at ${hm(h.open)}${tag}` });
  if (h.last != null && start > h.last) out.push({ level: 'error', code: 'lastentry', text: `Last entry is ${hm(h.last)}${tag}` });
  else if (start >= h.close) out.push({ level: 'error', code: 'shut', text: `Closes at ${hm(h.close)}${tag}` });
  else if (end > h.close + 5) out.push({ level: 'warn', code: 'closes', text: `Closes at ${hm(h.close)}, ${dur(end - h.close)} before you’d leave${tag}` });
  return out;
}

/* ---------- Day schedule ---------- */
function stayCovers(trip, date) {
  return (trip.bookings || []).find((b) => b.type === 'stay' && b.status !== 'cancelled' && b.checkin.day < date && date <= b.checkout.day) || null;
}
function dayStartLoc(trip, dayIdx) { const d = trip.days[dayIdx]; const s = d && stayCovers(trip, d.date); return s ? locOf(s.placeId) : null; }
/* Lay out one day: every stop gets a start, end, the travel leg before it and its problems.
   order: optional array of item ids to schedule instead of the saved order (for previews). */
function scheduleDay(trip, dayIdx, order) {
  const day = trip.days[dayIdx];
  if (!day) return null;
  const ids = order || day.items;
  const rows = []; const dayWarn = [];
  let t = day.start; let prev = dayStartLoc(trip, dayIdx); let num = 0;
  let travelMin = 0, walkKm = 0, transitKm = 0, freeMin = 0;
  ids.forEach((id, idx) => {
    const item = trip.items[id]; if (!item) return;
    const loc = itemStartLoc(item);
    let leg = prev && loc ? legWith(legEstimate(prev, loc), item.mode) : null;
    const travel = leg ? leg.min : 0;
    const arrive = t + travel;
    const warns = [];
    let start;
    if (item.fixed != null) {
      start = item.fixed;
      const need = item.checkin ? start - item.checkin : start;
      if (arrive > start + 1) warns.push({ level: 'error', code: 'late', text: `You’d arrive ${dur(arrive - start)} after the booked time of ${hm(start)}` });
      else if (item.checkin && arrive > need + 1) warns.push({ level: 'warn', code: 'checkin', text: `You’d reach the airport ${dur(start - arrive)} before departure. Allow ${dur(item.checkin)} for international flights.` });
    } else if (item.at != null) {
      start = item.at;
      if (arrive > start + 1) warns.push({ level: 'error', code: 'overlap', text: `Overlaps the stop before by ${dur(arrive - start)}` });
    } else start = ceil5(arrive);
    const end = start + item.dur;
    const wait = Math.max(0, start - arrive);
    if (leg) { travelMin += leg.min; if (leg.mode === 'walk') walkKm += leg.km * EST.detour; else transitKm += leg.km; }
    if (wait >= 20 && idx > 0) freeMin += wait;
    const place = placeOf(item);
    if (place && item.kind === 'place') hoursCheck(place, day.date, start, end, day.tz).forEach((w) => warns.push(w));
    if (loc && !loc.outside) num++;
    rows.push({ id, item, idx, start, end, arrive, wait, leg, warnings: warns, loc, num: loc && !loc.outside ? num : null, booked: isBooked(trip, item) });
    if (item.kind === 'flight') { prev = null; t = end; }
    else { prev = itemEndLoc(item) || prev; t = end; }

  const endMin = last ? (last.item.kind === 'flight' ? last.start : last.end) : day.start;
  if (endMin > 23 * 60) dayWarn.push({ level: 'warn', code: 'long', text: `Long day: finishes at ${hm(endMin)}` });
  if (travelMin > 150) dayWarn.push({ level: 'info', code: 'travel', text: `About ${dur(travelMin)} of travel. Grouping nearby stops would save time.` });
  const places = rows.filter((r) => r.item.kind === 'place' || r.item.kind === 'custom').length;
  const pace = PACES[trip.pace] || PACES.balanced;
  if (places > pace.perDay + 2) dayWarn.push({ level: 'info', code: 'busy', text: `${places} activities is a lot for a ${pace.label.toLowerCase()} pace` });
  const sun = day.tz === 'Asia/Tokyo' ? sunTimes(day.date, 35.6812, 139.7671, day.tz) : null;
  const problems = rows.reduce((a, r) => a + r.warnings.filter((w) => w.level !== 'info').length, 0) + dayWarn.filter((w) => w.level !== 'info').length;
  return { day, dayIdx, rows, start: rows[0] ? rows[0].start : day.start, end: endMin, travelMin, walkKm, transitKm, freeMin, sun, dayWarn, problems,
    mapped: rows.filter((r) => r.num), unmapped: rows.filter((r) => !r.loc && r.item.kind !== 'flight'), outside: rows.some((r) => r.loc && r.loc.outside) };
}
function tripSchedule(trip) { return trip.days.map((_, i) => scheduleDay(trip, i)); }
function warningCount(trip) { return tripSchedule(trip).reduce((a, s) => a + s.problems, 0); }

/* What changed between two layouts of the same day (or two days after a move) */
function impactOf(before, after) {
  const key = (w, r) => r.id + ':' + w.code;
  const bw = new Set(before.rows.flatMap((r) => r.warnings.filter((w) => w.level !== 'info').map((w) => key(w, r))));
  const aw = after.rows.flatMap((r) => r.warnings.filter((w) => w.level !== 'info').map((w) => ({ k: key(w, r), w, r })));
  const added = aw.filter((x) => !bw.has(x.k));
  const resolved = before.rows.flatMap((r) => r.warnings.filter((w) => w.level !== 'info').map((w) => key(w, r))).filter((k) => !aw.some((x) => x.k === k));
  return { endDelta: after.end - before.end, travelDelta: after.travelMin - before.travelMin, added, resolved: resolved.length, end: after.end, travel: after.travelMin };
}

/* ---------- Route suggestion ----------

   timed stops, stops without a location and anything the person locks

function isAnchored(item) { return item.fixed != null || item.at != null || item.lock || !item.placeId || item.kind !== 'place'; }

function optimiseDay(trip, dayIdx, lockedIds = []) {

  ids.forEach((id, i) => { const it = trip.items[id]; if (!isAnchored(it) && !locked.has(id)) { slots.push(i); movable.push(id); } });
  const base = routeCost(trip, dayIdx, ids);
  let best = { order: ids, cost: base.cost, s: base.s };
  const tryOrder = (perm) => { const o = ids.slice(); slots.forEach((si, k) => { o[si] = perm[k]; }); const c = routeCost(trip, dayIdx, o); if (c.cost < best.cost - 0.5) best = { order: o, cost: c.cost, s: c.s }; };

    movable: movable.length, anchoredIds: ids.filter((id) => !movable.includes(id)) };
}

/* ---------- Placing and moving stops ---------- */
function findItemDay(trip, id) { for (let i = 0; i < trip.days.length; i++) { const j = trip.days[i].items.indexOf(id); if (j >= 0) return { dayIdx: i, index: j }; } const k = trip.ideas.indexOf(id); return k >= 0 ? { dayIdx: -1, index: k } : null; }

/* ---------- Budget ----------
   Every line has a status:

     confirmed  booked or committed, not paid yet
     paid       money spent
     refunded   paid and then returned (in part or full)

const BUDGET_CATS = {
  flights: { label: 'Flights', icon: 'plane' }, stay: { label: 'Stay', icon: 'bed' }, food: { label: 'Food and drink', icon: 'utensils' },
  activities: { label: 'Activities', icon: 'ticket' }, transport: { label: 'Getting around', icon: 'train' }, shopping: { label: 'Shopping', icon: 'bag' }, other: { label: 'Other', icon: 'receipt' },
};

    const cats = {}; Object.keys(BUDGET_CATS).forEach((c) => { cats[c] = {}; ['est', 'paid', 'confirmed', 'refunded', 'committed', 'estLeft', 'planned', 'over'].forEach((k) => { cats[c][k] = sum(parts, (p) => p.cats[c][k]); }); });

    const budget = sum(parts, (p) => p.budget);

    const c = cats[l.cat] || cats.other;

      if (l.status === 'estimated') c.est += toGBP(shareOf(l, m, l.amount), l.cur);
      else if (l.status === 'confirmed') c.confirmed += toGBP(shareOf(l, m), l.cur);
      else if (l.status === 'paid') { c.paid += toGBP(shareOf(l, m), l.cur); if (l.refunded) c.refunded += toGBP(shareOf(l, m, l.refunded), l.cur); }

/* Who owes whom from paid lines and recorded settlements (pence). Positive = is owed. */
function balances(trip) {

/* ---------- First-draft itinerary for a new trip ----------
   Picks places that match the chosen interests, groups them by area so
   each day stays in one part of the city, orders each day from the hotel
   by nearest neighbour and moves stops away from days they're closed. */
function draftPlan(opts) {
  const { start, nDays, interests = [], pace = 'balanced', hotel = 'hotel' } = opts;
  const per = Math.max(2, (PACES[pace] || PACES.balanced).perDay - 1);
  const pool = PLACES.filter((p) => !['travel', 'stay'].includes(p.cat) && !p.fictional && !p.generic)
    .map((p) => ({ p, score: (p.tags || []).filter((t) => interests.includes(t)).length + (p.img ? 0.3 : 0) }))
    .sort((a, b) => b.score - a.score || a.p.name.localeCompare(b.p.name));
  const days = Math.max(1, nDays);
  const want = Math.min(pool.length, per * days);
  const chosen = pool.slice(0, want).map((x) => x.p);
  // k-means on coordinates, seeded by spreading picks around the centroid by angle
  const cx = sum(chosen, (p) => p.lon) / (chosen.length || 1), cy = sum(chosen, (p) => p.lat) / (chosen.length || 1);
  const byAngle = chosen.slice().sort((a, b) => Math.atan2(a.lat - cy, a.lon - cx) - Math.atan2(b.lat - cy, b.lon - cx));

  let groups = [];
  for (let iter = 0; iter < 8; iter++) {
    groups = cents.map(() => []);
    const order = chosen.slice().sort((a, b) => a.name.localeCompare(b.name));
    order.forEach((p) => {
      const ranked = cents.map((c, i) => ({ i, d: haversineKm(c, p) })).sort((a, b) => a.d - b.d);
      const slot = ranked.find((r) => groups[r.i].length < per + 1) || ranked[0];
      groups[slot.i].push(p);
    });
    cents = groups.map((g, i) => (g.length ? { lat: sum(g, (p) => p.lat) / g.length, lon: sum(g, (p) => p.lon) / g.length } : cents[i]));
  }
  const dates = Array.from({ length: days }, (_, i) => addDays(start, i));
  // swap stops away from days they're usually closed
  groups.forEach((g, di) => g.forEach((p, k) => {
    if (!closedOn(p, dates[di])) return;
    for (let dj = 0; dj < days; dj++) { if (dj === di) continue; const swapIdx = groups[dj].findIndex((q) => !closedOn(q, dates[di]) && !closedOn(p, dates[dj])); if (swapIdx >= 0) { const q = groups[dj][swapIdx]; groups[dj][swapIdx] = p; g[k] = q; return; } }
  }));
  const home = locOf(hotel);
  return groups.map((g) => {
    const left = g.slice(); const out = []; let cur = home || (left[0] && { lat: left[0].lat, lon: left[0].lon });
    while (left.length) { left.sort((a, b) => haversineKm(cur, a) - haversineKm(cur, b)); const n = left.shift(); out.push(n.id); cur = { lat: n.lat, lon: n.lon }; }
    return out;
  });
}

/* ---------- Search ---------- */
function searchAll(q) {
  const n = normQ(q); if (!n) return { dests: [], places: [] };
  const hit = (s) => normQ(s).includes(n);
  const dests = DESTINATIONS.filter((d) => hit(d.name) || hit(d.country) || (d.hoods || []).some(hit));
  const places = PLACES.filter((p) => !['travel'].includes(p.cat) && (hit(p.name) || hit(p.area || '') || hit(p.ward || '') || hit((CATS[p.cat] || {}).label || '') || (p.tags || []).some((t) => hit(t))));
  return { dests, places };

/* ---------- Calendar export (.ics) ---------- */

/* ============================================================

function tripById(id) { return S.trips[id] || null; }

/* ---------- Permissions ---------- */
const ROLES = {
  owner: { label: 'Owner', sub: 'Full control, including budget, people and deleting the trip' },
  editor: { label: 'Can edit', sub: 'Change the itinerary, bookings and expenses' },
  viewer: { label: 'Can view', sub: 'See everything, comment and vote' },

function can(trip, action) {

  return action === 'comment' || action === 'vote' || action === 'view';
}
/* Returns true when allowed; otherwise explains why and returns false */
function guard(trip, action) {

  const owner = trip.members.find((m) => m.role === 'owner');
  toast(`You can view and comment on this trip. Ask ${owner ? owner.name.split(' ')[0] : 'the owner'} for edit access.`, { icon: 'lock' });
  return false;
}

/* ---------- Undo / redo ---------- */
const HIST = { past: [], future: [] };

  const snap = { tripId, label, data: JSON.stringify(trip) };
  const r = fn(trip);
  HIST.past.push(snap); if (HIST.past.length > 40) HIST.past.shift();

      $('[data-time]', c.foot).addEventListener('click', async () => { c.close('time'); const m = await pickTime({ title: `When should ${pl.name} start?`, value: r.start }); if (m == null) return; commit(t.id, `Add ${pl.name}`, (tr) => { addStop(tr, spec, di, { at: m }); }); backToDay(t, di); undoToast(`Added ${pl.name} at ${hm(m)}`, { sub: impactLine(before, scheduleDay(tripById(t.id), di)) }); });

}
function customStopSheet(t, di) {

        if (b.dataset.dur) { durM = +b.dataset.dur; $$('[data-dur]', c.body).forEach((x) => x.setAttribute('aria-checked', +x.dataset.dur === durM)); }
        if (b.hasAttribute('data-at')) { const m = await pickTime({ title: 'Start time', value: at }); if (m != null) { at = m; const v = $('.sf-v', b); v.textContent = hm(m); v.classList.remove('ph'); } }
      });

      $('[data-ok]', c.foot).addEventListener('click', () => {

/* ---------- Route optimisation ---------- */
const OPT = { locked: null, key: null };
SCREENS.optimise = {
  label: 'Optimise route', cls: 'scr-opt', footer: true,
  render: (p) => {
    const t = tripById(p.tripId); if (!t) return errorScreen();
    const di = p.day; const d = t.days[di];
    const key = t.id + ':' + di;
    if (OPT.key !== key) { OPT.key = key; OPT.locked = new Set(d.items.filter((id) => t.items[id].lock)); }
    const res = optimiseDay(t, di, [...OPT.locked]);
    const b = res.before, a = res.after;
    const anchorWhy = (it) => it.fixed != null ? (it.bookingId ? 'Booked time' : 'Fixed time') : it.at != null ? `Set for ${hm(it.at)}` : !it.placeId ? 'No location' : it.kind !== 'place' ? (it.kind === 'stay' ? 'Hotel' : 'Travel') : '';
    const stat = (s, other, k, fmt, better) => { const dv = s[k] - other[k]; return `<span class="cmp-v num">${fmt(s[k])}</span>${other !== s && dv ? `<span class="cmp-d ${better(dv) ? 'good' : 'bad'}">${dv > 0 ? '+' : MINUS}${fmt(Math.abs(dv))}</span>` : ''}`; };
    const moves = res.changed ? res.order.map((id, i) => ({ id, i, from: d.items.indexOf(id) })).filter((x) => x.i !== x.from && !isAnchored(t.items[x.id]) && !OPT.locked.has(x.id)) : [];

      <div class="ob-head"><p class="kicker">Day ${di + 1} · ${esc(fmtDay(d.date, 'wdml'))}</p><h1 class="display md">${res.changed ? `Save about ${dur(Math.max(0, res.saved))} of travel` : 'This day is already well ordered'}</h1>
      <p class="muted">ATLAS tries every order of the stops it’s allowed to move and picks the one with the least travel that doesn’t break opening hours or bookings. Travel times are estimates from distance.</p></div>
      <div class="cmp">
        <figure class="cmp-col"><figcaption>Current order</figcaption><div class="cmp-map" id="cmp-a"></div>
          <dl class="cmp-stats"><div><dt>Travel</dt><dd>${stat(b, b, 'travelMin', dur, (x) => x < 0)}</dd></div><div><dt>Day ends</dt><dd>${stat(b, b, 'end', hm, (x) => x < 0)}</dd></div><div><dt>To check</dt><dd><span class="cmp-v">${b.problems}</span></dd></div></dl></figure>
        <figure class="cmp-col${res.changed ? ' better' : ''}"><figcaption>${res.changed ? 'Suggested order' : 'Suggested (no change)'}</figcaption><div class="cmp-map" id="cmp-b"></div>
          <dl class="cmp-stats"><div><dt>Travel</dt><dd><span class="cmp-v num">${dur(a.travelMin)}</span>${a.travelMin !== b.travelMin ? `<span class="cmp-d ${a.travelMin < b.travelMin ? 'good' : 'bad'}">${a.travelMin < b.travelMin ? MINUS : '+'}${dur(Math.abs(a.travelMin - b.travelMin))}</span>` : ''}</dd></div><div><dt>Day ends</dt><dd><span class="cmp-v num">${hm(a.end)}</span>${a.end !== b.end ? `<span class="cmp-d ${a.end < b.end ? 'good' : 'bad'}">${a.end < b.end ? MINUS : '+'}${dur(Math.abs(a.end - b.end))}</span>` : ''}</dd></div><div><dt>To check</dt><dd><span class="cmp-v">${a.problems}</span></dd></div></dl></figure>
      </div>
      ${moves.length ? `<section class="sec">${secHead('What changes', '', '', '', true)}<ol class="moves">${a.rows.map((r) => { const m = moves.find((x) => x.id === r.id); return `<li class="${m ? 'moved' : ''}"><span class="mv-n">${r.idx + 1}</span><span class="mv-t">${esc(itemTitle(r.item))}</span><span class="mv-time num">${hm(r.start)}</span>${m ? `<span class="pill sm teal">was ${ordinal(m.from + 1)}</span>` : ''}</li>`; }).join('')}</ol></section>` : ''}
      <section class="sec" aria-labelledby="keep-h">${secHead('Keep in place', '', 'Locked stops keep their position. Booked and timed stops are always kept.', 'keep-h', true)}
        <ul class="list boxed">${d.items.map((id) => { const it = t.items[id]; const why = anchorWhy(it); return `<li><button class="switch-row" role="switch" aria-checked="${!!why || OPT.locked.has(id)}" ${why ? 'aria-disabled="true"' : ''} data-act="opt-lock" data-id="${id}">${thumb(it, 'row-thumb sm')}<span class="row-main"><span class="row-title">${esc(itemTitle(it))}</span><span class="row-sub">${why ? esc(why) + ', always kept' : OPT.locked.has(id) ? 'Locked' : 'Can move'}</span></span><span class="switch"></span></button></li>`; }).join('')}</ul></section>`,
      after: `<div class="footer-bar"><div class="fb-inner"><button class="btn btn-secondary lg" data-act="back" style="flex:0 0 auto">Keep current</button><button class="btn btn-primary lg" data-act="opt-apply" ${res.changed ? '' : 'disabled'}>${ic('sparkle', 'sm')}Apply suggestion</button></div></div>` });
  },
  mount: (el, p) => {
    const t = tripById(p.tripId); const res = optimiseDay(t, p.day, [...OPT.locked]);
    const opts = { interactive: false, controls: false, compact: true, padding: [26, 22, 26, 22] };
    const ma = mountMap($('#cmp-a', el), Object.assign({ rows: res.before.rows, label: 'Current route' }, opts));
    const mb = mountMap($('#cmp-b', el), Object.assign({ rows: res.after.rows, label: 'Suggested route' }, opts));
    setTimeout(() => mb.update({}, { animateRoute: true }), 300);
    return () => { ma.destroy(); mb.destroy(); };
  },
};
Object.assign(ACTIONS, {
  'opt-lock': (a) => { if (a.getAttribute('aria-disabled') === 'true') return; const id = a.dataset.id; if (OPT.locked.has(id)) OPT.locked.delete(id); else OPT.locked.add(id); refreshScreen(); },
  'opt-apply': () => {
    const p = currentEntry().params; const t = tripById(p.tripId);
    const res = optimiseDay(t, p.day, [...OPT.locked]); if (!res.changed) return;
    commit(t.id, `Optimise day ${p.day + 1}`, (tr) => { tr.days[p.day].items = res.order.slice(); Object.keys(tr.items).forEach((id) => { if (res.order.includes(id)) tr.items[id].draft = false; }); feed(tr, 'optimise', `reordered day ${p.day + 1} to save travel`); });
    OPT.key = null;
    backToDay(t, p.day);
    undoToast(`Day ${p.day + 1} reordered`, { sub: impactLine(res.before, scheduleDay(tripById(t.id), p.day)) + '. Route updated on the map.' });

});

/* ============================================================
   Day planner: every day as a column on a time grid. Drag a stop
   to any day and time (it snaps to 15 minutes), drag ideas in
   from the side panel, undo and redo. Keyboard: Alt + arrows move
   a focused stop by 15 minutes or a day; Enter opens its options.
   ============================================================ */
const PL = { hourPx: 64, from: 6, to: 24 };
const axisHour = (h) => (S.settings.clock === '12' ? `${h % 12 || 12} ${h % 24 < 12 ? 'AM' : 'PM'}` : pad2(h % 24) + ':00');
const plY = (min) => (min - PL.from * 60) / 60 * PL.hourPx;
function plannerCard(t, s, r) {
  const it = r.item; const flight = it.kind === 'flight';
  const top = Math.max(0, plY(r.start)); const end = Math.min(PL.to * 60, flight ? PL.to * 60 : r.end);
  const h = Math.max(30, plY(end) - plY(r.start) - 2);
  const bad = r.warnings.some((w) => w.level === 'error'), warn = r.warnings.some((w) => w.level === 'warn');
  const locked = flight || it.kind === 'arrival' || it.kind === 'transfer' || (it.fixed != null && it.bookingId);
  const legH = r.leg && r.leg.min ? Math.max(0, plY(r.arrive) - plY(r.arrive - r.leg.min)) : 0;
  const label = `${itemTitle(it)}, day ${s.dayIdx + 1}, ${hm(r.start)} to ${flight ? 'departure' : hm(r.end)}${bad ? ', has a clash' : warn ? ', check timing' : ''}${locked ? ', booked time' : ''}`;
  return `${legH > 4 ? `<div class="pl-leg ${r.leg.mode}" style="top:${plY(r.arrive - r.leg.min)}px;height:${legH}px" aria-hidden="true"><span>${esc(durShort(r.leg.min))}</span></div>` : ''}
    <div class="pl-card c-${itemCat(it)}${bad ? ' bad' : warn ? ' warn' : ''}${locked ? ' locked' : ''}${h < 44 ? ' short' : ''}" style="top:${top}px;height:${h}px" data-pl="${r.id}" data-day="${s.dayIdx}" tabindex="0" role="button" aria-label="${esc(label)}" aria-describedby="pl-help">
      <span class="plc-time num">${hm(r.start)}${flight ? '' : '–' + hm(r.end)}</span><span class="plc-t">${esc(itemTitle(it))}</span>
      ${locked ? `<span class="plc-lock">${ic('lock', 'xs')}</span>` : ''}${bad ? `<span class="plc-flag">${ic('alertCircle', 'xs')}</span>` : warn ? `<span class="plc-flag w">${ic('alert', 'xs')}</span>` : ''}
    </div>`;
}
SCREENS.planner = {
  label: 'Day planner', cls: 'scr-planner', chrome: false,
  render: (p) => {
    const t = tripById(p.tripId); if (!t) return errorScreen();
    const all = tripSchedule(t);
    const hours = Array.from({ length: PL.to - PL.from + 1 }, (_, i) => PL.from + i);
    const ideas = t.ideas.map((id) => t.items[id]).filter(Boolean);
    const canEdit = can(t, 'edit');
    return `${topbar({ title: 'Day planner', always: true, right: `<button class="icon-btn" data-act="pl-undo" aria-label="Undo" ${HIST.past.length ? '' : 'disabled'}>${ic('undo')}</button><button class="icon-btn" data-act="pl-redo" aria-label="Redo" ${HIST.future.length ? '' : 'disabled'}>${ic('redo')}</button>` })}
      <div class="pl-wrap">
        <div class="pl-head">
          <div><h1 class="display sm">${esc(t.name)} planner</h1><p class="small muted">${canEdit ? 'Drag stops to any day and time. They snap to 15 minutes. Booked times are locked.' : 'You can view the plan. Ask the owner for edit access to move things.'}</p></div>
          <div class="pl-legend" aria-hidden="true"><span><i class="lg-bad"></i>Clash</span><span><i class="lg-warn"></i>Check hours</span><span><i class="lg-lock"></i>Booked</span><span><i class="lg-leg"></i>Travel, est.</span></div>
        </div>
        <div class="pl-body">
          <div class="pl-scroll" id="pl-scroll" tabindex="-1">
            <div class="pl-grid" style="--cols:${t.days.length};--h:${(PL.to - PL.from) * PL.hourPx}px">
              <div class="pl-corner" aria-hidden="true"></div>
              ${all.map((s, i) => `<div class="pl-dayh${s.problems ? ' has-warn' : ''}" id="plh-${i}"><span class="pdh-d">Day ${i + 1}</span><span class="pdh-w">${esc(fmtDay(s.day.date, 'wdm'))}</span>${s.problems ? `<span class="pdh-p">${ic('alert', 'xs')}${s.problems}</span>` : ''}</div>`).join('')}
              <div class="pl-axis" aria-hidden="true">${hours.map((h) => `<span style="top:${(h - PL.from) * PL.hourPx}px">${axisHour(h)}</span>`).join('')}</div>
              ${all.map((s, i) => `<div class="pl-col${s.day.tz !== t.tz ? ' other-tz' : ''}" data-col="${i}" role="group" aria-labelledby="plh-${i}">
                ${hours.map((h) => `<i class="pl-hr" style="top:${(h - PL.from) * PL.hourPx}px"></i>`).join('')}
                ${s.sun ? `<i class="pl-sun" style="top:${plY(s.sun.set)}px" title="Sunset ${hm(s.sun.set)}"></i>` : ''}
                ${s.rows.map((r) => plannerCard(t, s, r)).join('')}
              </div>`).join('')}
            </div>
          </div>
          <section class="pl-ideas" aria-labelledby="pli-h">
            <h2 class="sec-title sans" id="pli-h">Ideas <span class="count">${ideas.length}</span></h2>
            <p class="small muted">Drag onto the grid, or press Enter to choose a day.</p>
            <ul>${ideas.map((it) => `<li><div class="pl-idea c-${itemCat(it)}" data-pl="${it.id}" data-day="-1" tabindex="0" role="button" aria-label="${esc(itemTitle(it))}, idea, ${esc(dur(it.dur))}" aria-describedby="pl-help">${thumb(it, 'pli-thumb')}<span><span class="plc-t">${esc(itemTitle(it))}</span><span class="plc-time">${esc(dur(it.dur))}</span></span></div></li>`).join('') || '<li class="muted small">No ideas yet.</li>'}</ul>

function setBudgetSheet(t) {

function lineSheet(t, id) {

  openSheet({ title: l.title, body: `
    <p class="bud-big sm"><span class="num">${esc(fmtMoney(l.amount, l.cur))}</span>${l.cur !== 'GBP' ? `<span class="bud-of">≈ ${esc(money(toGBP(l.amount, l.cur)))}</span>` : ''}</p>
    <div class="row-gap">${statusPill(l.status)}<span class="small muted">${esc(BUDGET_CATS[l.cat] ? BUDGET_CATS[l.cat].label : 'Other')}</span></div>

      ${kvRow('Paid by', l.paidBy ? esc(l.paidBy === me() ? 'You' : (memberById(t, l.paidBy) || {}).name) : l.status === 'estimated' ? 'Nobody — it’s an estimate' : 'Not paid yet')}
      ${shares.map((s) => kvRow((memberById(t, s.m) || { name: s.m }).name + (s.m === me() ? ' (you)' : ''), esc(fmtMoney(s.v, l.cur)), l.cur !== 'GBP' ? esc('≈ ' + money(toGBP(s.v, l.cur))) : '')).join('')}
      ${l.refunded ? kvRow('Refunded', esc(fmtMoney(l.refunded, l.cur)), 'Not counted in totals') : ''}
      ${l.at ? kvRow('Added', esc(ago(l.at))) : ''}
    </dl>
    ${l.cur !== 'GBP' ? `<p class="small muted">Converted at the fixed demo rate ${esc(fxLine(l.cur))}.</p>` : ''}
    ${bk ? `<button class="btn btn-secondary block" data-bk>${ic('ticket', 'sm')}Open booking ${esc(bk.ref)}</button>` : ''}`,
    foot: canEdit && l.status !== 'refunded' ? `${l.status !== 'paid' && l.status !== 'estimated' ? `<button class="btn btn-primary lg" data-paid>Mark as paid by you</button>` : ''}${l.status === 'paid' ? `<button class="btn btn-secondary lg" data-refund>Record a refund</button>` : ''}${!l.bookingId ? `<button class="btn btn-danger-ghost" data-del>Delete</button>` : ''}` : '',
    onMount: (c) => {
      const on = (sel, fn) => { const x = $(sel, c.sheet); if (x) x.addEventListener('click', fn); };
      on('[data-bk]', () => { c.close('nav'); go('booking', { tripId: t.id, id: bk.id }); });

      on('[data-refund]', () => { commit(t.id, `Refund ${l.title}`, (tr) => { const x = lineById(tr, id); x.refunded = x.amount; x.status = 'refunded'; }); c.close('ok'); refreshScreen({ full: true }); undoToast(`${l.title} refunded in full`, { sub: 'No longer counted in totals' }); });
      on('[data-del]', async () => { if (!(await confirmDialog({ title: `Delete ${l.title}?`, body: 'It’s removed from the budget for everyone.', confirm: 'Delete', danger: true }))) return; commit(t.id, `Delete ${l.title}`, (tr) => { tr.lines = tr.lines.filter((x) => x.id !== id); }); c.close('ok'); refreshScreen({ full: true }); undoToast(`Deleted ${l.title}`, { icon: 'trash' }); });

/* Earliest time on a day where a stop fits without new clashes */
function suggestSlot(t, di, itemId) {
  const base = scheduleDay(t, di);
  const baseErr = new Set(base.rows.flatMap((r) => r.warnings.filter((w) => w.level !== 'info').map((w) => r.id + w.code)));
  for (let m = t.days[di].start; m <= 21 * 60; m += 15) {
    const tmp = deepCopy(t); if (tmp.days[di].items.includes(itemId)) continue;
    tmp.days.forEach((d) => { d.items = d.items.filter((x) => x !== itemId); }); tmp.ideas = tmp.ideas.filter((x) => x !== itemId);
    tmp.days[di].items.push(itemId); placeStopAt(tmp, itemId, di, m);
    const s = scheduleDay(tmp, di);
    const bad = s.rows.some((r) => r.warnings.some((w) => w.level !== 'info' && (r.id === itemId || !baseErr.has(r.id + w.code))));
    if (!bad) return m;
  }
  return null;
}

ACTIONS['journal-write'] = (a) => {
  const t = tripById(a.dataset.id); if (!guard(t, 'comment')) return;
  const ci = currentDayIdx(t); const di = ci >= 0 ? ci : 0;
  const imgs = [...new Set(Object.values(t.items).filter((x) => findItemDay(t, x.id) && findItemDay(t, x.id).dayIdx >= 0).map(itemImg).filter(Boolean))];
  const chosen = []; const own = [];
  openSheet({ title: 'New journal entry', className: 'wide', body: `
    <div class="field"><label class="label" for="jw-t">What happened?</label><textarea id="jw-t" class="textarea" rows="4" placeholder="The best thing about today was…" data-autofocus></textarea></div>
    <div class="field"><span class="label" id="jw-p">Photos <span class="optional">(up to 3)</span></span>
      <div class="jw-grid" role="group" aria-labelledby="jw-p">${imgs.slice(0, 12).map((im) => `<button class="jw-pick" aria-pressed="false" data-img="${im}" aria-label="Use illustrative photo of ${esc((PLACES.find((x) => x.img === im) || {}).name || im)}">${photo(im)}<span class="jw-check">${ic('check')}</span></button>`).join('')}</div>
      <label class="btn btn-secondary sm upload-btn">${ic('camera', 'sm')}Add your own photo<input type="file" accept="image/*" class="sr" id="jw-file"></label>
      <p class="hint">Your own photos stay in this browser only. The others are illustrative images from the demo.</p>
      <div class="jw-own" id="jw-own"></div></div>`,
    foot: `<button class="btn btn-primary lg" data-ok>Add to journal</button>`,
    onMount: (c) => {
      c.body.addEventListener('click', (e) => { const b = e.target.closest('[data-img]'); if (!b) return; const im = b.dataset.img; const i = chosen.indexOf(im); if (i >= 0) chosen.splice(i, 1); else { if (chosen.length + own.length >= 3) { toast('Three photos per entry', { icon: 'info' }); return; } chosen.push(im); } b.setAttribute('aria-pressed', i < 0); });
      $('#jw-file', c.body).addEventListener('change', (e) => {
        const f = e.target.files[0]; if (!f) return;
        if (chosen.length + own.length >= 3) { toast('Three photos per entry', { icon: 'info' }); return; }
        const rd = new FileReader();
        rd.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, 900 / Math.max(im.width, im.height)); const cv = document.createElement('canvas'); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); const url = cv.toDataURL('image/jpeg', 0.72); own.push(url); $('#jw-own', c.body).insertAdjacentHTML('beforeend', `<div class="ph"><img src="${url}" alt="Your photo" class="in"></div>`); }; im.onerror = () => toast('That file couldn’t be read as an image', { icon: 'alertCircle' }); im.src = rd.result; };
        rd.readAsDataURL(f);
      });
      $('[data-ok]', c.foot).addEventListener('click', () => {
        const txt = $('#jw-t', c.body).value.trim(); if (!txt && !chosen.length && !own.length) { setFieldError($('#jw-t', c.body).closest('.field'), 'Write something or add a photo'); return; }
        commit(t.id, 'Journal entry', (tr) => { tr.journal.push({ id: uid('j'), dayIdx: di, by: me(), at: nowUTC(), text: txt, photos: [...chosen, ...own] }); });
        c.close('ok'); if (currentRoute() === 'journal') refreshScreen(); else go('journal', { tripId: t.id });
        toast('Added to the journal', { icon: 'book' });
      });
    } });
};

/* ---------- Recap ---------- */
function recapStats(t) {
  const sch = tripSchedule(t);
  const placeRows = sch.flatMap((s) => s.rows.filter((r) => r.item.kind === 'place'));
  const wards = new Set(placeRows.map((r) => (placeOf(r.item) || {}).ward).filter(Boolean));
  const walkKm = sum(sch, (s) => s.walkKm), transitKm = sum(sch, (s) => s.transitKm);
  const photos = sum(journalVisible(t), (j) => j.photos.length);
  const b = budgetFor(t, me());
  const fav = (t.favourites || []).map((id) => t.items[id]).filter(Boolean);
  return { sch, stops: placeRows.length, wards: wards.size, wardNames: [...wards], walkKm, transitKm, photos, b, fav };
}
SCREENS.recap = {
  label: 'Recap', cls: 'scr-recap', chrome: false,
  render: (p) => {
    const t = tripById(p.tripId); if (!t) return errorScreen();
    const st = tripStatus(t); const R = recapStats(t); const n = t.days.length;

    const dest = DEST[t.dest] || { name: 'the city' };
    const head = `${n <= 10 ? words[n] : n} unforgettable days in ${dest.name}.`;
    return `${topbar({ over: true, close: true, title: 'Recap', right: `<button class="icon-btn" data-act="recap-share" data-id="${t.id}" aria-label="Copy a summary to share">${ic('share')}</button>` })}
      <div class="scroll"><div class="recap">
        <section class="rc-hero">${photo(t.img, { cls: 'rc-ph', eager: true, scrim: true, tag: illustrative('tr2') })}<div class="rc-hero-t"><p class="rc-k">${esc(t.name)} · ${esc(fmtRange(t.start, t.end))}</p><h1 class="display xl">${esc(head)}</h1></div></section>
        <div class="rc-body">
          ${st !== 'past' ? noticeHTML({ tone: 'sand', icon: 'eye', title: 'Preview', body: 'The trip hasn’t finished, so this recap uses the plan rather than what happened.', actions: `<button class="btn btn-secondary sm" data-act="set-clock" data-v="after">Set the demo clock to after the trip</button>` }) : ''}
          <dl class="rc-stats">
            <div><dt>Places</dt><dd class="num">${R.stops}</dd></div>
            <div><dt>Wards explored</dt><dd class="num">${R.wards}</dd></div>
            <div><dt>On foot, est.</dt><dd class="num">${esc(fmtKm(R.walkKm))}</dd></div>
            <div><dt>By train and bus, est.</dt><dd class="num">${esc(fmtKm(R.transitKm))}</dd></div>
            <div><dt>Journal photos</dt><dd class="num">${R.photos}</dd></div>
            ${R.b.budget ? `<div><dt>${st === 'past' ? 'Spent' : 'Planned'}, your share</dt><dd class="num">${esc(money(R.b.tot.planned, { round: true }))}</dd></div>` : ''}
          </dl>
          <p class="rc-line serif">${esc(R.wardNames.length > 6 ? R.wardNames.slice(0, 6).join(', ') + ' and more' : listJoin(R.wardNames))} — ${R.b.budget ? (R.b.tot.planned <= R.b.budget ? `and ${money(R.b.budget - R.b.tot.planned, { round: true })} under budget.` : `and ${money(R.b.tot.planned - R.b.budget, { round: true })} over budget.`) : ''}</p>
          ${R.fav.length ? `<section class="sec">${secHead('Favourite moments', '', '', '', false)}<ul class="rc-favs">${R.fav.map((it) => `<li>${thumb(it, 'rc-fav-ph')}<span>${esc(itemTitle(it))}</span></li>`).join('')}</ul></section>` : ''}
          <section class="sec">${secHead('Day by day', '', '', '', false)}<ol class="rc-days">${R.sch.map((s, i) => { const firstImg = s.rows.map((r) => itemImg(r.item)).find(Boolean); return `<li>${firstImg ? photo(firstImg, { cls: 'rcd-ph' }) : `<span class="rcd-ph cat-tile c-travel">${ic('plane')}</span>`}<div><p class="rcd-d">Day ${i + 1} · ${esc(fmtDay(s.day.date, 'wdm'))}</p><p class="rcd-t">${esc(s.day.title || '')}</p><p class="small muted">${esc(s.rows.filter((r) => r.item.kind === 'place').map((r) => itemTitle(r.item)).slice(0, 4).join(', ') || 'Travel')}</p></div></li>`; }).join('')}</ol></section>
          <p class="small muted center">Distances are estimates from the plan. Photos are illustrative.</p>
          <div class="btn-row"><button class="btn btn-primary lg" data-act="go" data-route="journal" data-params='${jp({ tripId: t.id })}'>${ic('book', 'sm')}Open the journal</button><button class="btn btn-secondary lg" data-act="go" data-route="create">${ic('compass', 'sm')}Plan the next one</button></div>
        </div>
      </div></div>`;
  },
};
ACTIONS['recap-share'] = (a) => { const t = tripById(a.dataset.id); const R = recapStats(t); copyText(`${t.name}, ${fmtRange(t.start, t.end)}: ${R.stops} places across ${R.wards} wards, about ${fmtKm(R.walkKm)} on foot. Planned with ATLAS (demo).`, 'Summary copied'); };

/* ============================================================
   Profile, settings, demo controls, about
   ============================================================ */
SCREENS.profile = {
  tab: 'profile', label: 'Profile',

      <section class="sec" aria-labelledby="set-a">${secHead('Display', '', '', 'set-a', true)}<ul class="list boxed">
        ${pick('set-appearance', 'Appearance', { system: 'Match device', light: 'Light', dark: 'Dark' }[S.settings.appearance], 'sun')}
        ${pick('set-text', 'Text size', Math.round(S.settings.textScale * 100) + '%', 'textSize')}
        ${pick('set-clock-fmt', 'Time format', S.settings.clock === '12' ? '12-hour (2:30 PM)' : '24-hour (14:30)', 'clock')}
        ${pick('set-units', 'Distances', S.settings.units === 'mi' ? 'Miles' : 'Kilometres', 'route')}
        ${sw('reduceMotion', 'Reduce motion', 'Turns off photo transitions and animated routes', 'a11y')}
