        ${sw('homeTime', 'Show London time while away', '', 'globe')}
        ${sw('haptics', 'Vibration', 'On phones that support it', 'phone')}
      </ul></section>
      <section class="sec" aria-labelledby="set-n">${secHead('Notifications', '', 'Simulated in this demo', 'set-n', true)}<ul class="list boxed">
        ${['alerts', 'crew', 'votes', 'reminders'].map((k) => `<li><button class="switch-row" role="switch" aria-checked="${!!S.settings.notify[k]}" data-act="toggle-notify" data-k="${k}"><span class="row-ic">${ic({ alerts: 'bell', crew: 'users', votes: 'vote', reminders: 'clock' }[k], 'sm')}</span><span class="row-main"><span class="row-title">${esc({ alerts: 'Travel alerts', crew: 'Changes by other people', votes: 'New votes', reminders: 'Leave-by reminders' }[k])}</span></span><span class="switch"></span></button></li>`).join('')}
      </ul></section>
      <section class="sec" aria-labelledby="set-d">${secHead('Demo', '', '', 'set-d', true)}<ul class="list boxed">
        <li><button class="row" data-act="demo-controls"><span class="row-ic coral">${ic('sliders', 'sm')}</span><span class="row-main"><span class="row-title">Demo controls</span><span class="row-sub">${esc(CLOCK_BASES[clockMode()].label)}${isOffline() ? ' · offline' : ''}</span></span>${ic('chevR')}</button></li>
        <li><button class="row" data-act="export-data"><span class="row-ic">${ic('download', 'sm')}</span><span class="row-main"><span class="row-title">Download my data</span><span class="row-sub">Everything in this browser, as JSON</span></span>${ic('chevR')}</button></li>
        <li><button class="row" data-act="about"><span class="row-ic">${ic('info', 'sm')}</span><span class="row-main"><span class="row-title">About ATLAS</span></span>${ic('chevR')}</button></li>
        <li><button class="row danger" data-act="sign-out">${ic('logout', 'sm')}<span class="row-main"><span class="row-title">Sign out</span></span></button></li>

};
Object.assign(ACTIONS, {
  'toggle-setting': (a) => { const k = a.dataset.k; S.settings[k] = !S.settings[k]; save(); applySettings(); a.setAttribute('aria-checked', S.settings[k]); },
  'toggle-notify': (a) => { const k = a.dataset.k; S.settings.notify[k] = !S.settings.notify[k]; save(); a.setAttribute('aria-checked', S.settings.notify[k]); },
  'set-appearance': async () => { const v = await pickOption({ title: 'Appearance', value: S.settings.appearance, options: [{ value: 'system', label: 'Match device' }, { value: 'light', label: 'Light' }, { value: 'dark', label: 'Dark', sub: 'Midnight blue with muted teal' }] }); if (v) setSetting('appearance', v); },
  'set-text': async () => { const v = await pickOption({ title: 'Text size', value: S.settings.textScale, options: [{ value: 1, label: '100%', sub: 'Default' }, { value: 1.15, label: '115%' }, { value: 1.3, label: '130%' }] }); if (v) setSetting('textScale', v); },
  'set-clock-fmt': async () => { const v = await pickOption({ title: 'Time format', value: S.settings.clock, options: [{ value: '12', label: '12-hour', sub: '2:30 PM' }, { value: '24', label: '24-hour', sub: '14:30' }] }); if (v) setSetting('clock', v); },
  'set-units': async () => { const v = await pickOption({ title: 'Distances', value: S.settings.units, options: [{ value: 'km', label: 'Kilometres' }, { value: 'mi', label: 'Miles' }] }); if (v) setSetting('units', v); },
  'export-data': () => saveFile('atlas-demo-data.json', JSON.stringify(S, null, 2), 'application/json'),
  'sign-out': async () => { if (!(await confirmDialog({ title: 'Sign out?', body: 'Your demo trips stay in this browser.', confirm: 'Sign out' }))) return; S.onboarded = false; save(); resetTo(['welcome'], 'fade'); },
  'about': () => openSheet({ title: 'About ATLAS', body: `
    <p class="serif" style="font-size:1.25rem">The world, beautifully organised.</p>
    <p class="muted">ATLAS is a fictional product built as a working prototype. Everything here is demo data.</p>
    <ul class="about-list">
      <li>${ic('ticket', 'sm')}<span>ATLAS doesn’t book, rebook or cancel anything, and never claims something is available. Bookings, references and operators are invented.</span></li>
      <li>${ic('route', 'sm')}<span>Travel times are estimates from straight-line distance with typical speeds — not live transit data. Directions open in your own maps app.</span></li>
      <li>${ic('clock', 'sm')}<span>Opening hours are typical hours written for the demo. Sunrise and sunset are calculated.</span></li>
      <li>${ic('coins', 'sm')}<span>Currency conversions use fixed demo rates (${esc(fxLine('JPY'))}), not live rates.</span></li>
      <li>${ic('image', 'sm')}<span>Photos are illustrative and were generated with AI for this demo. They are not photos of the exact places.</span></li>
      <li>${ic('map', 'sm')}<span>${esc(MAP_CREDIT)}, Ministry of Land, Infrastructure, Transport and Tourism, Japan. Prepared via the japan-topography and JapanCityGeoJson projects.</span></li>
      <li>${ic('bell', 'sm')}<span>Alerts and other people’s activity are simulated.</span></li>
    </ul>` }),
  'demo-controls': () => demoControls(),
  'set-clock': (a) => setClock(a.dataset.v),
});
function setClock(v) {
  S.clock = v; CLOCK.since = Date.now(); save(); closeAllSheets();
  renderSidebar(); updateChrome();
  const t = mainTrip();
  const r = currentRoute();
  if (v === 'during' && t && (r === 'today' || r === 'explore')) refreshScreen({ full: true });
  else if (v === 'after' && t && r === 'recap') refreshScreen({ full: true });
  else refreshScreen({ full: true });
  toast(CLOCK_BASES[v].label, { icon: 'clock', sub: CLOCK_BASES[v].sub });
}
function demoControls() {
  const t = mainTrip();
  openSheet({ title: 'Demo controls', className: 'wide', body: `
    <p class="small muted">Move through the trip’s story and try the edge cases. Everything here is simulated.</p>
    <fieldset class="field plain"><legend class="label">Demo clock</legend><div class="stack-sm" role="radiogroup" aria-label="Demo clock">${Object.entries(CLOCK_BASES).map(([k, b]) => `<button class="opt" role="radio" aria-checked="${clockMode() === k}" data-clock="${k}"><span><span class="o-t">${esc(b.label)}</span><span class="o-s" style="display:block">${esc(b.sub)}</span></span><span class="opt-check">${ic('check')}</span></button>`).join('')}</div></fieldset>
    <ul class="list boxed">
      <li><button class="switch-row" role="switch" aria-checked="${isOffline()}" data-d="offline"><span class="row-ic">${ic('wifiOff', 'sm')}</span><span class="row-main"><span class="row-title">Pretend to be offline</span></span><span class="switch"></span></button></li>
      <li><button class="switch-row" role="switch" aria-checked="${!!S.demo.flightCancelled}" data-d="cancel"><span class="row-ic">${ic('plane', 'sm')}</span><span class="row-main"><span class="row-title">Cancel the flight home</span><span class="row-sub">Shows a cancellation alert and what to do</span></span><span class="switch"></span></button></li>
      <li><button class="switch-row" role="switch" aria-checked="${!!S.demo.mapFail}" data-d="map"><span class="row-ic">${ic('map', 'sm')}</span><span class="row-main"><span class="row-title">Make the map fail to load</span><span class="row-sub">The Map tab falls back to a list</span></span><span class="switch"></span></button></li>
      ${t ? `<li><button class="switch-row" role="switch" aria-checked="${S.me !== 'alex'}" data-d="viewer"><span class="row-ic">${ic('eye', 'sm')}</span><span class="row-main"><span class="row-title">Use the app as Mia (view only)</span><span class="row-sub">Shows what happens without edit access</span></span><span class="switch"></span></button></li>` : ''}
    </ul>
    <button class="btn btn-danger-ghost block" data-d="reset">${ic('refresh', 'sm')}Reset the demo</button>`,
    onMount: (c) => c.body.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-clock],[data-d]'); if (!b) return;
      if (b.dataset.clock) { setClock(b.dataset.clock); return; }
      const d = b.dataset.d;
      if (d === 'offline') { S.net = isOffline() ? 'online' : 'offline'; if (!isOffline()) S.pendingSync = 0; }
      if (d === 'cancel') { S.demo.flightCancelled = !S.demo.flightCancelled; S.demo.cancelledAt = nowUTC() - 25 * 60000; }
      if (d === 'map') { S.demo.mapFail = !S.demo.mapFail; }
      if (d === 'viewer') { S.me = S.me === 'alex' ? 'mia' : 'alex'; }
      if (d === 'reset') { if (!(await confirmDialog({ title: 'Reset the demo?', body: 'All changes go back to the original trip, in this browser only.', confirm: 'Reset', danger: true }))) return; resetDemo(); closeAllSheets(); applySettings(); renderSidebar(); resetTo(['explore']); toast('Demo reset'); return; }
      if (b.getAttribute('role') === 'switch') b.setAttribute('aria-checked', b.getAttribute('aria-checked') !== 'true');
      save(); updateChrome(); refreshScreen({ full: true });
      toast({ offline: isOffline() ? 'You’re offline (simulated)' : 'Back online', cancel: S.demo.flightCancelled ? 'Flight home cancelled (simulated)' : 'Flight home restored', map: S.demo.mapFail ? 'Map will fail to load' : 'Map restored', viewer: S.me === 'alex' ? 'Back to your own view' : 'Using the app as Mia, who can view' }[d], { icon: 'sliders' });
    }) });
}

/* ============================================================
   Boot
   ============================================================ */
function boot() {
  S = loadState();
  els.app = $('#app'); els.sidebar = $('#sidebar'); els.screens = $('#screens'); els.tabbar = $('#tabbar');
  els.sheetLayer = $('#sheet-layer'); els.toasts = $('#toasts'); els.netbar = $('#netbar');
  applySettings(); renderChrome(); bindGlobal();
  const hash = (location.hash || '').replace('#', '');
  if (hash === 'reset') resetDemo();
  if (!S.onboarded && hash !== 'demo') resetTo(['welcome'], 'none');
  else { if (hash === 'demo') { S.onboarded = true; save(); } resetTo(['explore'], 'none'); }
  // re-lay out maps and split views when crossing the desktop breakpoint
  const mq = window.matchMedia('(min-width: 1024px)');
  const onMQ = () => { closeAllSheets(); refreshScreen({ full: true }); };
  if (mq.addEventListener) mq.addEventListener('change', onMQ); else if (mq.addListener) mq.addListener(onMQ);
  window.addEventListener('offline', () => { S.net = 'offline'; save(); updateChrome(); });
  window.addEventListener('online', () => { if (S.net === 'offline') ACTIONS['go-online'](); });
  setInterval(() => { const r = currentRoute(); if (r === 'today' && !topSheet() && !document.querySelector('.is-dragging')) refreshScreen(); }, 60000);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
