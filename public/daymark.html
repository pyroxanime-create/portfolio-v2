};
/* Inline sparkline (static) */
function sparkSVG(vals, w = 120, h = 36) {
  if (!vals.length) return '';
  const mx = Math.max(...vals, 1), mn = Math.min(...vals, 0);
  const x = (i) => (i / Math.max(1, vals.length - 1)) * (w - 4) + 2; const y = (v) => h - 3 - ((v - mn) / (mx - mn || 1)) * (h - 6);
  const pts = vals.map((v, i) => [x(i), y(v)]);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path class="a" d="${pathFrom(pts)}L${x(vals.length - 1)} ${h}L${x(0)} ${h}Z"/><path class="l" d="${pathFrom(pts)}"/><circle cx="${x(vals.length - 1)}" cy="${y(vals[vals.length - 1])}" r="3" fill="var(--brand)"/></svg>`;
}
/* Cumulative series for a category (or all spending) through a period */
function cumulativeSeries(start, upto, opts = {}) {
  const by = new Map(); spendLines(start, upto, opts).forEach((l) => by.set(l.d, (by.get(l.d) || 0) - l.amt));
  const out = []; let run = 0;
  for (let d = start; d <= upto; d = addDays(d, 1)) { run += by.get(d) || 0; out.push({ d, v: run }); }
  return out;
}

  if (v.state === 'near') return { icon: 'alert', text: `${money(v.remaining)} left for the next ${plural(v.P.daysLeft, 'day')}.` };

async function exportFile(filename, text, type) {
  let dl = null;
  try { dl = window.claude && window.claude.use ? await Promise.race([window.claude.use('downloads'), delay(1500).then(() => null)]) : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data: text }); toast('Saved ' + filename); return; }
    catch (e) { const code = e && e.code; if (code === 'declined') { toast('Download cancelled', { icon: 'info' }); return; } if (code === 'rate_limited') { toast('A download is already waiting for you to confirm', { icon: 'info' }); return; } }
  }
  try {
    const blob = new Blob([text], { type }); const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch (e) { /* ignore */ }
  const sh = openSheet({ title: 'Your export', body: `<p class="muted">If the download didn’t start, copy the data below and paste it into a spreadsheet.</p><label class="sr" for="exp-t">Export data</label><textarea class="textarea" id="exp-t" readonly style="min-height:220px;font-family:ui-monospace,Menlo,monospace;font-size:.75rem">${esc(text)}</textarea>`, foot: `<button class="btn btn-primary block" id="exp-copy">${ic('copy', 'sm')}Copy</button>` });
  $('#exp-copy', sh.el).addEventListener('click', () => copyText(text, 'Copied. Paste it into a spreadsheet.'));
}

      if (k === 'expire') { const f = acct('acc_spend'); if (f.status === 'ok') expireConnection('acc_spend'); else reconnect('acc_spend'); s.setAttribute('aria-checked', String(acct('acc_spend').status !== 'ok')); toast(acct('acc_spend').status !== 'ok' ? 'Fern now needs reconnecting' : 'Fern reconnected', { icon: 'info' }); }
      if (k === 'sync') { sh.close(); doSync(); }
    }
  });
};

/* ============================================================
   Boot
   ============================================================ */
const DEEP_LINKS = { home: 'home', activity: 'activity', spending: 'spending', budgets: 'budgets', savings: 'savings', insights: 'insights', forecast: 'forecast', recurring: 'recurring', reports: 'reports', accounts: 'accounts', settings: 'settings' };
function boot() {
  const hash = (location.hash || '').replace('#', '');
  const stored = loadState();
  if (stored && hash !== 'reset') { S = stored; CLOCK.elapsed = S.clockElapsed || 0; CLOCK.since = Date.now(); bump(); }
  else { S = buildDemo('full'); S.onboarded = !!(DEEP_LINKS[hash] || hash === 'demo'); CLOCK.elapsed = 0; CLOCK.since = Date.now(); bump(); save(true); }
  if (hash === 'welcome') S.onboarded = false;
  if ((DEEP_LINKS[hash] || hash === 'demo') && !S.onboarded) S.onboarded = true;
  Object.assign(els, { app: $('#app'), sidebar: $('#sidebar'), screens: $('#screens'), tabbar: $('#tabbar'), sheetLayer: $('#sheet-layer'), toasts: $('#toasts'), syncbar: $('#syncbar') });
  els.sheetLayer.style.pointerEvents = 'none';
  document.documentElement.lang = 'en-GB';
  applySettings();
  renderChrome();
  bindGlobal();
  if (!S.onboarded) resetTo(['welcome'], 'none');
  else resetTo([DEEP_LINKS[hash] || 'home'], 'none');

  let pending = false;
  onChange((kind) => {
    if (kind === 'settings') applySettings();
    if (pending) return; pending = true;
    requestAnimationFrame(() => { pending = false; refreshScreen(); });
  });
  setInterval(() => save(), 15000);
  window.addEventListener('pagehide', () => save(true));
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(true); });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => refreshScreen());
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
