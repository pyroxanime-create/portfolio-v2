html { font-size: calc(16px * var(--ts)); -webkit-text-size-adjust: 100%; height: 100%; }
body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 0.9375rem; line-height: 1.5; -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss01'; overflow: hidden; }
* , *::before, *::after { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
a { color: var(--brand-text); }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; letter-spacing: -0.01em; }
p { text-wrap: pretty; }
ul, ol { margin: 0; padding: 0; list-style: none; }
img, svg { max-width: 100%; }
[hidden] { display: none !important; }
.sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.num, .tnum { font-variant-numeric: tabular-nums; }
.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.i.sm { width: 18px; height: 18px; }
.i.xs { width: 16px; height: 16px; }
.i.lg { width: 28px; height: 28px; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
h1[tabindex="-1"]:focus, h2[tabindex="-1"]:focus, [data-autofocus][tabindex="-1"]:focus { outline: none; }
.muted { color: var(--fg-2); }
.small { font-size: 0.8125rem; }
.micro { font-size: 0.75rem; }
.strong { font-weight: 600; }
.pos { color: var(--success); }
.neg { color: var(--fg); }
.warn-t { color: var(--warning); }
.err-t { color: var(--error); }
.center { text-align: center; }
.row-gap { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: var(--s3); }
.stack-lg { display: flex; flex-direction: column; gap: var(--s6); }
.spacer { flex: 1; }
.eyebrow { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--fg-2); }
.demo-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--lavender); color: var(--on-lavender); vertical-align: middle; }

/* ---------- Wordmark ---------- */
.wordmark { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 0.14em; font-size: 0.9375rem; color: var(--fg); }
.wordmark .mark { width: 30px; height: 30px; }
.wordmark.lg .mark { width: 40px; height: 40px; }
.wordmark.lg { font-size: 1.125rem; gap: 12px; }

/* ============================================================
   Shell
   ============================================================ */
.app { position: fixed; inset: 0; display: flex; background: var(--bg); color: var(--fg); overflow: hidden; }
.main { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
.screens { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scroll-padding-top: 72px; }
.content { width: 100%; max-width: 600px; margin: 0 auto; padding: var(--s2) var(--gutter) calc(var(--s8) + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: var(--s7); }
.screen.has-tabbar .content { padding-bottom: calc(var(--tabbar-h) + var(--s8) + env(safe-area-inset-bottom, 0px)); }
.screen.has-footer .content { padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px)); }
.content.tight { gap: var(--s5); }

/* top bar for pushed screens */
.topbar { position: relative; z-index: 3; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--s2); min-height: 56px; padding: calc(env(safe-area-inset-top, 0px) + 4px) 8px 4px; background: var(--bg); }
.topbar.scrolled { box-shadow: 0 1px 0 var(--border); }
.tb-side { display: flex; align-items: center; gap: 2px; min-width: 0; }
.tb-side.right { justify-content: flex-end; }
.tb-title { font-weight: 600; font-size: 1rem; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 56vw; opacity: 0; transition: opacity var(--dur) var(--ease); }
.topbar.scrolled .tb-title, .topbar.always .tb-title { opacity: 1; }
.progress-dots { display: flex; gap: 6px; }
.progress-dots span { width: 22px; height: 4px; border-radius: 4px; background: var(--border-2); }
.progress-dots span.on { background: var(--brand); }

/* page heading (large title) */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s3) var(--s4); padding-top: var(--s2); flex-wrap: wrap; }
.page-head h1 { font-size: 1.875rem; line-height: 1.15; font-weight: 650; letter-spacing: -0.02em; }
.page-head .sub { margin-top: 6px; color: var(--fg-2); }
.ph-actions { display: flex; gap: var(--s2); flex: none; }
.home-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: calc(env(safe-area-inset-top, 0px) + 12px) var(--gutter) 4px; max-width: 600px; width: 100%; margin: 0 auto; }
.home-head h1 { font-size: 1.5rem; font-weight: 650; letter-spacing: -0.02em; line-height: 1.2; }
.home-head .sub { color: var(--fg-2); font-size: 0.9375rem; margin-top: 2px; }
.head-actions { display: flex; align-items: center; gap: 6px; }

/* bottom tab bar (mobile) */
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3); border-top: 1px solid var(--border); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; border-radius: 14px; color: var(--fg-2); font-size: 0.6875rem; font-weight: 550; letter-spacing: 0.01em; position: relative; transition: color var(--dur) var(--ease); }
.tab .i { width: 24px; height: 24px; }
.tab .tab-pill { display: grid; place-items: center; width: 52px; height: 30px; border-radius: 999px; transition: background var(--dur) var(--ease); }
.tab[aria-current="page"] { color: var(--fg); }
.tab[aria-current="page"] .tab-pill { background: var(--lime); color: var(--on-lime); }
.tab:active .tab-pill { transform: scale(.94); }
.tab-dot { position: absolute; top: 6px; right: calc(50% - 22px); width: 8px; height: 8px; border-radius: 50%; background: var(--error); box-shadow: 0 0 0 2px var(--surface); }

/* sidebar (desktop) */
.sidebar { display: none; }

/* sync status bar */
.syncbar { display: flex; align-items: center; gap: 10px; padding: 10px var(--gutter); font-size: 0.8125rem; background: var(--warning-soft); color: var(--warning); border-bottom: 1px solid var(--border); }
.syncbar.info { background: var(--sage); color: var(--fg); }
.syncbar .i { width: 18px; height: 18px; }
.syncbar .btn { margin-left: auto; }
.syncbar .sb-msg { flex: 1; min-width: 0; }

/* ============================================================
   Buttons
   ============================================================ */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: var(--r-btn); font-weight: 600; font-size: 0.9375rem; line-height: 1.2; white-space: nowrap; user-select: none; transition: background var(--dur) var(--ease), color var(--dur) var(--ease), transform 120ms var(--ease), box-shadow var(--dur) var(--ease), opacity var(--dur); text-decoration: none; }
.btn.lg { min-height: 56px; font-size: 1rem; padding: 0 24px; }
.btn.sm { min-height: 36px; padding: 0 14px; font-size: 0.8125rem; border-radius: 12px; }
.btn.block { display: flex; width: 100%; }
.btn:active:not([disabled]):not([aria-disabled="true"]) { transform: scale(0.98); }
.btn-primary { background: var(--brand); color: var(--on-brand); }
.btn-primary:hover { background: var(--brand-hover); }
.btn-primary:active { background: var(--brand-press); }
.btn-lime { background: var(--lime); color: var(--on-lime); }
.btn-lime:hover { background: var(--lime-2); }
.btn-secondary { background: var(--surface); color: var(--fg); box-shadow: inset 0 0 0 1px var(--border-2); }
.btn-secondary:hover { background: var(--surface-2); }
.btn-tertiary { background: var(--sage); color: var(--fg); }
.btn-tertiary:hover { background: var(--sage-2); }
.btn-ghost { color: var(--brand-text); }
.btn-ghost:hover { background: var(--sage); }
.btn-danger { background: var(--error); color: #fff; }
.app[data-appearance="dark"] .btn-danger, .btn-danger { color: var(--surface); }
.btn-danger-ghost { color: var(--error); }
.btn-danger-ghost:hover { background: var(--error-soft); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.45; cursor: not-allowed; }
.btn[aria-busy="true"] { color: transparent !important; pointer-events: none; }
.btn[aria-busy="true"]::after { content: ''; position: absolute; width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; color: var(--on-brand); }
.btn-secondary[aria-busy="true"]::after, .btn-ghost[aria-busy="true"]::after, .btn-tertiary[aria-busy="true"]::after { color: var(--fg); }
@keyframes spin { to { transform: rotate(360deg); } }
.icon-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; color: var(--fg); position: relative; transition: background var(--dur) var(--ease); flex: none; }
.icon-btn:hover { background: var(--surface-3); }
.icon-btn.sm { width: 36px; height: 36px; border-radius: 12px; }
.icon-btn.filled { background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); }
.icon-btn .badge { position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--error); color: #fff; font-size: 0.625rem; font-weight: 700; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--bg); }
.link { color: var(--brand-text); font-weight: 600; font-size: 0.875rem; display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 2px; text-decoration: none; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.link .i { width: 16px; height: 16px; }
.btn-row { display: flex; gap: var(--s3); flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 140px; }
.avatar-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--lavender); color: var(--on-lavender); font-weight: 650; font-size: 0.875rem; }

/* ============================================================
   Cards & sections
   ============================================================ */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--shadow-1); }
.card.pad { padding: var(--s5); }
.card.pad-lg { padding: var(--s6); }
.card.flat { box-shadow: none; }
button.card, a.card { display: block; width: 100%; text-align: left; text-decoration: none; color: inherit; transition: transform 160ms var(--ease), box-shadow var(--dur) var(--ease), border-color var(--dur); }
button.card:hover, a.card:hover { border-color: var(--border-2); box-shadow: var(--shadow-2); }
button.card:active { transform: scale(0.99); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
.card-title { font-size: 1.0625rem; font-weight: 620; letter-spacing: -0.005em; }
.card-sub { color: var(--fg-2); font-size: 0.875rem; }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-top: var(--s4); }
.sec { display: flex; flex-direction: column; gap: var(--s3); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); }
.sec-title { font-size: 1.25rem; font-weight: 640; letter-spacing: -0.015em; }
.sec-sub { color: var(--fg-2); font-size: 0.875rem; }
.divider { height: 1px; background: var(--border); border: 0; margin: 0; }
.chev { color: var(--fg-3); }

/* hero card (forest) */
.hero-card { position: relative; overflow: hidden; border-radius: 24px; padding: var(--s6); background: var(--hero); color: var(--on-hero); isolation: isolate; }
.hero-card .hero-art { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.hero-card .hero-label { color: var(--on-hero-2); font-size: 0.875rem; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.hero-card .icon-btn { color: var(--on-hero); }
.hero-card .icon-btn:hover { background: rgba(255,255,255,.1); }
.hero-card .hero-sub { color: var(--on-hero-2); font-size: 0.875rem; }
.big-num { font-size: 2.875rem; font-weight: 640; letter-spacing: -0.035em; line-height: 1.05; font-feature-settings: 'tnum' 0, 'cv11'; }
.big-num .dec { font-size: 0.55em; letter-spacing: -0.01em; opacity: 0.85; margin-left: 1px; }
.stat-num { font-size: 2.25rem; font-weight: 640; letter-spacing: -0.03em; line-height: 1.1; }
.stat-num .dec { font-size: 0.6em; opacity: 0.8; }
.mid-num { font-size: 1.5rem; font-weight: 640; letter-spacing: -0.02em; line-height: 1.15; }
.hero-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: var(--s5); }
.hero-chip { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px; background: rgba(255,255,255,.1); color: var(--on-hero); font-size: 0.8125rem; font-weight: 550; }
.hero-chip:hover { background: rgba(255,255,255,.16); }
.hero-chip .inst { width: 22px; height: 22px; font-size: 0.625rem; border-radius: 7px; }

/* ============================================================
   Rows & lists
   ============================================================ */
.list { display: flex; flex-direction: column; }
.list.boxed { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); overflow: hidden; }
.list.boxed > li + li > .row, .list.boxed > .row + .row, .list.lined > li + li > .row { border-top: 1px solid var(--border); }
.row { display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: 64px; padding: 10px var(--s4); text-align: left; color: inherit; text-decoration: none; background: transparent; transition: background var(--dur) var(--ease); }
.row.compact { min-height: 52px; padding: 8px var(--s4); }
.list.flush .row { padding-left: 0; padding-right: 0; }
button.row:hover, a.row:hover { background: var(--surface-2); }
.list.flush button.row:hover { background: transparent; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-title { font-weight: 560; font-size: 0.9375rem; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-title.wrap { white-space: normal; }
.row-sub { color: var(--fg-2); font-size: 0.8125rem; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.row-sub.wrap { white-space: normal; display: block; }
.row-end { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: none; text-align: right; }
.row-amt { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 0.9375rem; white-space: nowrap; }
.row-amt.pos { color: var(--success); }
.row-amt.xfer { color: var(--fg-2); }
.row-amt.excl { color: var(--fg-2); text-decoration: line-through; text-decoration-thickness: 1px; }
.row-meta { color: var(--fg-2); font-size: 0.75rem; white-space: nowrap; }
.day-head { display: flex; justify-content: space-between; align-items: baseline; padding: var(--s4) 2px var(--s2); font-size: 0.8125rem; font-weight: 600; color: var(--fg-2); position: sticky; top: 0; background: var(--bg); z-index: 1; }
.day-head .num { font-weight: 500; }

/* category icon, merchant monogram, institution logo */
.cat-ic { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; flex: none; background: var(--cb, var(--surface-3)); color: var(--ci, var(--fg)); }
.cat-ic .i { width: 20px; height: 20px; }
.cat-ic.sm { width: 32px; height: 32px; border-radius: 10px; }
.cat-ic.sm .i { width: 17px; height: 17px; }
.cat-ic.lg { width: 56px; height: 56px; border-radius: 18px; }
.cat-ic.lg .i { width: 26px; height: 26px; }
.cat-ic.pending { box-shadow: inset 0 0 0 1.5px var(--ci); background: transparent; }
.swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; background: var(--sw); }
.mono { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 650; font-size: 0.8125rem; letter-spacing: 0.02em; }
.mono.lg { width: 72px; height: 72px; font-size: 1.375rem; }
.mono.sm { width: 32px; height: 32px; font-size: 0.6875rem; }
.mono1 { background: var(--mono1-bg); color: var(--mono1-fg); } .mono2 { background: var(--mono2-bg); color: var(--mono2-fg); } .mono3 { background: var(--mono3-bg); color: var(--mono3-fg); }
.mono4 { background: var(--mono4-bg); color: var(--mono4-fg); } .mono5 { background: var(--mono5-bg); color: var(--mono5-fg); } .mono6 { background: var(--mono6-bg); color: var(--mono6-fg); }
.inst { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; font-weight: 750; font-size: 1rem; }
.inst.sm { width: 28px; height: 28px; border-radius: 9px; font-size: 0.75rem; }
.inst.lg { width: 56px; height: 56px; border-radius: 17px; font-size: 1.375rem; }
.inst1 { background: var(--inst1-bg); color: var(--inst1-fg); } .inst2 { background: var(--inst2-bg); color: var(--inst2-fg); } .inst3 { background: var(--inst3-bg); color: var(--inst3-fg); }
.inst4 { background: var(--inst4-bg); color: var(--inst4-fg); } .inst5 { background: var(--inst5-bg); color: var(--inst5-fg); } .inst6 { background: var(--inst6-bg); color: var(--inst6-fg); }

/* pills / status */
.pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; background: var(--surface-3); color: var(--fg-2); }
.pill .i { width: 14px; height: 14px; stroke-width: 2.2; }
.pill.ok { background: var(--success-soft); color: var(--success); }
.pill.near { background: var(--warning-soft); color: var(--warning); }
.pill.over { background: var(--error-soft); color: var(--error); }
.pill.info { background: var(--lavender); color: var(--on-lavender); }
.pill.brand { background: var(--brand-soft); color: var(--brand-text); }
.pill.pending { background: transparent; box-shadow: inset 0 0 0 1px var(--border-2); color: var(--fg-2); }
.pill.lime { background: var(--lime); color: var(--on-lime); }

/* ============================================================
   Chips, segmented controls
   ============================================================ */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; margin: -2px 0; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip { display: inline-flex; align-items: center; gap: 6px; flex: none; min-height: 38px; padding: 0 14px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border-2); font-size: 0.875rem; font-weight: 550; color: var(--fg); transition: background var(--dur), color var(--dur), box-shadow var(--dur); }
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"], .chip[aria-checked="true"], .chip.on { background: var(--fg); color: var(--bg); box-shadow: none; }
.chip .i { width: 16px; height: 16px; }
.chip .count { font-size: 0.75rem; background: var(--lime); color: var(--on-lime); border-radius: 999px; padding: 0 6px; min-width: 18px; text-align: center; font-weight: 700; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 14px; background: var(--surface-3); }
.seg.block { display: flex; }
.seg.block > button { flex: 1; }
.seg > button { min-height: 38px; padding: 0 14px; border-radius: 11px; font-size: 0.875rem; font-weight: 580; color: var(--fg-2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background var(--dur), color var(--dur), box-shadow var(--dur); white-space: nowrap; }
.seg > button[aria-pressed="true"], .seg > button[aria-selected="true"], .seg > button[aria-checked="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-1), 0 0 0 1px var(--border); }
.seg > button .i { width: 16px; height: 16px; }
.select-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px 0 14px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border-2); font-weight: 580; font-size: 0.875rem; }
.select-btn .i { width: 16px; height: 16px; color: var(--fg-2); }
.select-btn:hover { background: var(--surface-2); }

/* ============================================================
   Forms
   ============================================================ */
.field { display: flex; flex-direction: column; gap: 6px; }
.label { font-size: 0.875rem; font-weight: 600; color: var(--fg); }
.label .optional { font-weight: 450; color: var(--fg-2); }
.hint { font-size: 0.8125rem; color: var(--fg-2); }
.err { font-size: 0.8125rem; color: var(--error); display: flex; align-items: flex-start; gap: 6px; font-weight: 500; }
.err .i { width: 16px; height: 16px; margin-top: 2px; }
.input, .textarea, .select { width: 100%; min-height: 54px; padding: 0 16px; border-radius: var(--r-input); background: var(--surface); border: 1px solid var(--control); font-size: 1rem; transition: border-color var(--dur), box-shadow var(--dur); }
.textarea { padding: 14px 16px; min-height: 110px; resize: vertical; line-height: 1.45; }
.input::placeholder, .textarea::placeholder { color: var(--fg-3); }
.input:focus, .textarea:focus, .select:focus { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); outline: none; }
.field.invalid .input, .field.invalid .amount-box { border-color: var(--error); }
.field.invalid .input:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--error) 22%, transparent); }
.input-wrap { position: relative; display: flex; align-items: center; }
.input-wrap .input { padding-right: 52px; }
.input-wrap .icon-btn { position: absolute; right: 5px; }
.search { position: relative; }
.search .i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--fg-2); width: 20px; height: 20px; pointer-events: none; }
.search .input { padding-left: 46px; min-height: 50px; border-radius: 999px; border-color: var(--border-2); background: var(--surface); }
.search .clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); }
.amount-box { display: flex; align-items: baseline; justify-content: center; gap: 2px; padding: var(--s5) var(--s4); border-radius: 20px; background: var(--surface); border: 1px solid var(--control); transition: border-color var(--dur), box-shadow var(--dur); }
.amount-box:focus-within { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
.amount-box .cur { font-size: 2rem; font-weight: 600; color: var(--fg-2); }
.amount-box input { border: 0; background: transparent; font-size: 2.75rem; font-weight: 650; letter-spacing: -0.03em; width: 6ch; min-width: 2ch; text-align: left; font-variant-numeric: tabular-nums; padding: 0; outline: none; }
.amount-box.sm input { font-size: 1.75rem; }
.amount-box.sm .cur { font-size: 1.375rem; }
.amount-box.sm { padding: var(--s3) var(--s4); }
.switch { position: relative; width: 52px; height: 32px; border-radius: 999px; background: var(--border-2); flex: none; transition: background var(--dur) var(--ease); }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform var(--dur) var(--ease); }
.switch[aria-checked="true"], [aria-checked="true"] > .switch { background: var(--brand); }
.switch[aria-checked="true"]::after, [aria-checked="true"] > .switch::after { transform: translateX(20px); }

.switch-row { display: flex; align-items: center; gap: var(--s3); min-height: 64px; padding: 10px var(--s4); width: 100%; text-align: left; }
.opt { position: relative; display: flex; align-items: center; gap: var(--s3); padding: var(--s4); border-radius: 18px; background: var(--surface); border: 1.5px solid var(--border); text-align: left; width: 100%; transition: border-color var(--dur), background var(--dur), box-shadow var(--dur); }
.opt:hover { border-color: var(--border-2); }
.opt[aria-pressed="true"], .opt[aria-checked="true"] { border-color: var(--brand); background: var(--sage); }
.opt .opt-check { margin-left: auto; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--control); display: grid; place-items: center; flex: none; color: transparent; }
.opt[aria-pressed="true"] .opt-check, .opt[aria-checked="true"] .opt-check { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.opt-check .i { width: 15px; height: 15px; stroke-width: 2.6; }
.opt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.opt.tile { flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; padding: 14px 8px; font-size: 0.8125rem; font-weight: 560; min-height: 92px; }
.opt.tile .opt-check { position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; }
.radio-row { display: flex; align-items: center; gap: var(--s3); min-height: 56px; padding: 8px var(--s4); width: 100%; text-align: left; }
.radio-row .rdot { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--control); flex: none; display: grid; place-items: center; }
.radio-row[aria-checked="true"] .rdot { border-color: var(--brand); }
.radio-row[aria-checked="true"] .rdot::after { content: ''; width: 12px; height: 12px; border-radius: 50%; background: var(--brand); }
.radio-row:hover { background: var(--surface-2); }
.checkbox { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--control); display: grid; place-items: center; flex: none; color: transparent; }
[aria-checked="true"] > .checkbox, .checkbox.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.checkbox .i { width: 15px; height: 15px; stroke-width: 2.6; }
input[type="range"] { width: 100%; accent-color: var(--brand); height: 32px; }
input[type="date"], input[type="month"] { min-height: 54px; }

/* ============================================================
   Progress, rings, meters
   ============================================================ */
.bar { position: relative; height: 10px; border-radius: 999px; background: var(--progress-track); overflow: visible; }
.bar.thin { height: 6px; }
.bar.thick { height: 14px; }
.bar-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--progress-ok); width: 0; transition: width 700ms var(--ease-out), background var(--dur); }
.bar.near .bar-fill { background: var(--warning-fill); }
.bar.over .bar-fill { background: var(--error-fill); }
.bar.lime .bar-fill { background: var(--lime); }
.bar-over { position: absolute; top: 0; bottom: 0; right: 0; border-radius: 0 999px 999px 0; background: repeating-linear-gradient(135deg, var(--error-fill) 0 4px, color-mix(in srgb, var(--error-fill) 55%, var(--surface)) 4px 7px); }
.bar-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; border-radius: 2px; background: var(--fg); opacity: 0.55; transform: translateX(-1px); }
.bar-legend { display: flex; justify-content: space-between; gap: var(--s3); font-size: 0.8125rem; color: var(--fg-2); }
.hero-card .bar { background: rgba(255,255,255,.14); }
.hero-card .bar-fill { background: var(--lime); }
.ring { display: block; }
.ring .ring-track { stroke: var(--progress-track); }
.ring .ring-fill { stroke: var(--brand); transition: stroke-dashoffset 900ms var(--ease-out); }
.ring.lime .ring-fill { stroke: var(--lime); }
.ring-wrap { position: relative; display: grid; place-items: center; flex: none; }
.ring-wrap .ring-mid { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring-mid .ring-pct { font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

/* ============================================================
   Notices, empty states, skeletons
   ============================================================ */
.notice { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s4); border-radius: 16px; background: var(--sage); color: var(--fg); font-size: 0.875rem; line-height: 1.45; }
.notice .i { width: 20px; height: 20px; flex: none; margin-top: 1px; }
.notice.warn { background: var(--warning-soft); }
.notice.warn > .i { color: var(--warning); }
.notice.error { background: var(--error-soft); }
.notice.error > .i { color: var(--error); }
.notice.success { background: var(--success-soft); }
.notice.success > .i { color: var(--success); }
.notice.lav { background: var(--lavender); color: var(--on-lavender); }
.notice .n-title { font-weight: 650; margin-bottom: 2px; }
.notice .n-body { flex: 1; min-width: 0; }
.notice .n-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--s3); padding: var(--s7) var(--s5); }
.empty .empty-art { width: 120px; height: 96px; margin-bottom: var(--s2); }
.empty h2, .empty h3 { font-size: 1.125rem; font-weight: 640; }
.empty p { color: var(--fg-2); max-width: 34ch; }
.empty .btn-row { justify-content: center; margin-top: var(--s2); }
.empty.card { padding: var(--s7) var(--s5); }
.sk { background: linear-gradient(90deg, var(--skeleton) 0%, var(--skeleton-hi) 50%, var(--skeleton) 100%); background-size: 200% 100%; animation: shimmer 1.3s ease-in-out infinite; border-radius: 10px; }
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

/* key-value rows */
.kv { display: flex; flex-direction: column; }
.kv > div { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s4); padding: 14px 0; }
.kv > div + div { border-top: 1px solid var(--border); }
.kv dt { color: var(--fg-2); font-size: 0.875rem; flex: none; }
.kv dd { margin: 0; text-align: right; font-weight: 550; font-size: 0.9375rem; min-width: 0; overflow-wrap: anywhere; }
.kv dd .sub { display: block; color: var(--fg-2); font-weight: 450; font-size: 0.8125rem; }
.kv.card { padding: 4px var(--s5); }

/* tables (chart alternatives, reports) */
.tbl-wrap { overflow-x: auto; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); }
.tbl { width: 100%; border-collapse: collapse; font-size: 0.875rem; font-variant-numeric: tabular-nums; }
.tbl caption { text-align: left; padding: 12px 16px 4px; font-weight: 600; }
.tbl th, .tbl td { padding: 10px 16px; text-align: right; white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl thead th { color: var(--fg-2); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); }
.tbl tbody tr + tr td { border-top: 1px solid var(--border); }
.tbl td.nodata { color: var(--fg-2); font-style: italic; }
details.alt { border-radius: 16px; }
details.alt > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-weight: 600; font-size: 0.875rem; color: var(--brand-text); }
details.alt > summary::-webkit-details-marker { display: none; }
details.alt > summary .i { width: 16px; height: 16px; transition: transform var(--dur); }
details.alt[open] > summary .i { transform: rotate(180deg); }

/* ============================================================
   Charts
   ============================================================ */
.chart { position: relative; width: 100%; user-select: none; -webkit-user-select: none; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--fg-2); font-size: 11px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.chart .grid line { stroke: var(--grid); stroke-width: 1; }
.chart .axis line { stroke: var(--axis); stroke-width: 1; }
.chart .zero { stroke: var(--axis); stroke-width: 1; }
.chart .line-actual { fill: none; stroke: var(--brand); stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
.chart .line-est { fill: none; stroke: var(--brand); stroke-width: 2.25; stroke-dasharray: 2 5; stroke-linecap: round; opacity: .95; }
.app[data-appearance="light"] .chart .line-est { stroke: #2E9E7E; }
.chart .band { fill: var(--brand); opacity: 0.10; }
.chart .area { fill: var(--brand); opacity: 0.08; }
.chart .line-prev { fill: none; stroke: var(--fg-3); stroke-width: 1.75; stroke-dasharray: 4 4; }
.chart .line-budget { fill: none; stroke: var(--warning); stroke-width: 1.5; stroke-dasharray: 6 4; }
.chart .today-line { stroke: var(--fg); stroke-width: 1; stroke-dasharray: 2 3; opacity: .5; }
.chart .cross { stroke: var(--fg); stroke-width: 1; opacity: .6; }
.chart .dot { stroke: var(--surface); stroke-width: 2; }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .bar-in { fill: var(--brand); }
.chart .bar-out { fill: var(--lavender-2); }
.app[data-appearance="dark"] .chart .bar-out { fill: #8C80D9; }
.chart .bar-partial { opacity: 0.55; }
.chart .bar-sel { opacity: 1; }
.chart .nodata-rect { fill: url(#hatch); opacity: 0.6; }
.chart .ev-dot { fill: var(--surface); stroke: var(--fg-2); stroke-width: 1.5; }
.chart .ev-dot.in { stroke: var(--success); }
.chart-tip { position: absolute; z-index: 5; pointer-events: none; min-width: 120px; max-width: 220px; padding: 10px 12px; border-radius: 12px; background: var(--toast-bg); color: var(--toast-fg); font-size: 0.8125rem; box-shadow: var(--shadow-3); transform: translate(-50%, calc(-100% - 12px)); white-space: nowrap; }
.chart-tip .tt-v { font-weight: 700; font-size: 0.9375rem; font-variant-numeric: tabular-nums; }
.chart-tip .tt-l { opacity: 0.8; font-size: 0.75rem; }
.chart-tip .tt-row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.chart-tip .tt-key { width: 12px; height: 2px; border-radius: 2px; flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.8125rem; color: var(--fg-2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend .k-line { width: 18px; height: 0; border-top: 2.25px solid var(--brand); }
.legend .k-dash { width: 18px; height: 0; border-top: 2.25px dotted var(--brand); }
.legend .k-band { width: 14px; height: 10px; border-radius: 3px; background: color-mix(in srgb, var(--brand) 16%, transparent); }
.legend .k-bar { width: 10px; height: 10px; border-radius: 3px; }
.legend .k-prev { width: 18px; height: 0; border-top: 1.75px dashed var(--fg-3); }
.legend .k-budget { width: 18px; height: 0; border-top: 1.5px dashed var(--warning); }
.legend .k-hatch { width: 14px; height: 10px; border-radius: 3px; background: repeating-linear-gradient(135deg, var(--border-2) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1px var(--border-2); }

/* donut */
.donut-wrap { position: relative; width: min(260px, 72vw); aspect-ratio: 1; margin: 0 auto; }
.donut-wrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
.donut-seg { cursor: pointer; transition: opacity var(--dur) var(--ease), transform 260ms var(--ease-out); transform-origin: 50% 50%; outline: none; }
.donut-seg.dim { opacity: 0.28; }
.donut-seg.sel { transform: scale(1.04); }
.donut-seg:focus-visible { opacity: 1; filter: drop-shadow(0 0 0 var(--focus)); }
.donut-mid { position: absolute; inset: 22%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2px; pointer-events: none; }
.donut-mid .dm-l { font-size: 0.8125rem; color: var(--fg-2); font-weight: 550; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.donut-mid .dm-v { font-size: 1.625rem; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.donut-mid .dm-s { font-size: 0.8125rem; color: var(--fg-2); }
.cat-list .row { min-height: 58px; }
.cat-list .row[aria-pressed="true"] { background: var(--sage); }
.cat-share { width: 100%; height: 4px; background: var(--progress-track); border-radius: 4px; margin-top: 6px; overflow: hidden; }
.cat-share > span { display: block; height: 100%; border-radius: 4px; background: var(--sw); }

/* sparkline */
.spark { display: block; width: 100%; height: 40px; }
.spark path.l { fill: none; stroke: var(--brand); stroke-width: 2; }
.spark path.a { fill: var(--brand); opacity: .08; }

/* ============================================================
   Sheets, dialogs, toasts
   ============================================================ */
.layer { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
.sheet-wrap, .dialog-layer { position: absolute; inset: 0; pointer-events: auto; }
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity 260ms var(--ease); }
.scrim.on { opacity: 1; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100% - 40px - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; background: var(--surface); border-radius: 26px 26px 0 0; box-shadow: var(--shadow-3); transform: translateY(100%); transition: transform 340ms var(--ease-out); outline: none; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet.on { transform: translateY(0); }
.sheet.dragging { transition: none; }
.sheet.full { height: calc(100% - 24px - env(safe-area-inset-top, 0px)); }
.sheet-handle { width: 40px; height: 5px; border-radius: 3px; background: var(--border-2); margin: 8px auto 0; flex: none; cursor: grab; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: 10px 12px 6px 22px; flex: none; touch-action: none; }
.sheet-head h2 { font-size: 1.1875rem; font-weight: 650; letter-spacing: -0.01em; }
.sheet-body { padding: 4px 22px 16px; overflow-y: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--s4); overscroll-behavior: contain; }
.sheet-body.flush { padding-left: 6px; padding-right: 6px; }
.sheet-body.last { padding-bottom: 24px; }
.sheet-foot { padding: 12px 22px 18px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--border); flex: none; background: var(--surface); }
.sheet-foot.row-btns { flex-direction: row; }
.sheet-foot.row-btns .btn { flex: 1; }
.dialog-layer { display: grid; place-items: center; padding: var(--s5); }
.dialog { position: relative; width: 100%; max-width: 380px; background: var(--surface); border-radius: 24px; padding: var(--s6); box-shadow: var(--shadow-3); transform: scale(.94); opacity: 0; transition: transform 220ms var(--ease-out), opacity 180ms; }
.dialog.on { transform: scale(1); opacity: 1; }
.dialog h2 { font-size: 1.1875rem; font-weight: 650; margin-bottom: 8px; }
.dialog p { color: var(--fg-2); }
.dialog .dialog-actions { display: flex; flex-direction: column; gap: 8px; margin-top: var(--s5); }
.toasts { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(92vw, 440px); }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 16px; border-radius: 16px; background: var(--toast-bg); color: var(--toast-fg); box-shadow: var(--shadow-3); font-size: 0.9rem; font-weight: 520; animation: toastIn 260ms var(--ease-out); max-width: 100%; }
.toast .i { width: 20px; height: 20px; flex: none; }
.toast .t-msg { flex: 1; min-width: 0; }
.toast .t-act { color: var(--toast-link); font-weight: 700; padding: 8px 10px; border-radius: 10px; min-height: 36px; }
.toast.out { animation: toastOut 220ms var(--ease) forwards; }
@keyframes toastIn { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes toastOut { to { transform: translateY(8px); opacity: 0; } }

/* pull to refresh */
.ptr { position: absolute; left: 50%; top: 0; z-index: 4; width: 40px; height: 40px; margin-left: -20px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow-2); display: grid; place-items: center; transform: translateY(-60px); transition: transform 240ms var(--ease); color: var(--brand-text); }
.ptr.pulling { transition: none; }
.ptr.spinning .i { animation: spin .8s linear infinite; }

/* ============================================================
   Motion
   ============================================================ */
.screen.enter-push { animation: pushIn 300ms var(--ease-out); }
.screen.exit-push { animation: fadeOut 220ms var(--ease) forwards; }
.screen.enter-pop { animation: popIn 260ms var(--ease-out); }
.screen.exit-pop { animation: pushOutRight 260ms var(--ease) forwards; z-index: 2; }
.screen.enter-fade { animation: fadeIn 220ms var(--ease); }
.screen.exit-fade { animation: fadeOut 160ms var(--ease) forwards; }
@keyframes pushIn { from { transform: translateX(28px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes popIn { from { transform: translateX(-16px); opacity: 0.6; } to { transform: none; opacity: 1; } }
@keyframes pushOutRight { to { transform: translateX(28px); opacity: 0; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; } }
.rise { animation: rise 420ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 45ms); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.pulse-once { animation: pulseOnce 900ms var(--ease-out); }
@keyframes pulseOnce { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--brand) 40%, transparent); } 100% { box-shadow: 0 0 0 14px transparent; } }
.fade-swap { animation: fadeIn 260ms var(--ease); }
.app.rm *, .app.rm *::before, .app.rm *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; scroll-behavior: auto !important; }
}

/* ============================================================
   Onboarding
   ============================================================ */
.ob { min-height: 100%; display: flex; flex-direction: column; max-width: 520px; margin: 0 auto; width: 100%; padding: calc(env(safe-area-inset-top, 0px) + 20px) var(--gutter) calc(24px + env(safe-area-inset-bottom, 0px)); gap: var(--s6); }
.ob-top { display: flex; align-items: center; justify-content: space-between; }
.ob-hero { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: var(--s6); }
.ob h1 { font-size: 2rem; line-height: 1.12; font-weight: 680; letter-spacing: -0.03em; }
.ob .lead { color: var(--fg-2); font-size: 1.0625rem; line-height: 1.5; }
.ob-actions { display: flex; flex-direction: column; gap: var(--s2); }
.ob-art { position: relative; width: 100%; max-width: 360px; aspect-ratio: 1.08; margin: 0 auto; }
.ob-step-head { display: flex; flex-direction: column; gap: var(--s2); }
.ob-step-head h1 { font-size: 1.75rem; }
.goal-opt { align-items: flex-start; }
.goal-opt .go-ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--lime-soft); color: var(--fg); flex: none; }
.goal-opt[aria-pressed="true"] .go-ic { background: var(--lime); color: var(--on-lime); }
.goal-opt .go-t { font-weight: 640; font-size: 1rem; }
.goal-opt .go-s { color: var(--fg-2); font-size: 0.875rem; margin-top: 2px; }
.bank-flow { display: flex; flex-direction: column; gap: var(--s5); }
.consent-list li { display: flex; gap: var(--s3); align-items: flex-start; padding: 10px 0; }
.consent-list li .i { color: var(--brand-text); margin-top: 1px; }
.fake-bank { border-radius: 24px; border: 1.5px dashed var(--border-2); padding: var(--s5); display: flex; flex-direction: column; gap: var(--s4); background: var(--surface-2); }
.steps-anim li { display: flex; align-items: center; gap: 12px; padding: 10px 0; color: var(--fg-2); }
.steps-anim li.done { color: var(--fg); }
.steps-anim li .st-ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); flex: none; }
.steps-anim li.done .st-ic { background: var(--brand); color: var(--on-brand); }
.steps-anim li.active .st-ic::after { content: ''; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--brand); border-right-color: transparent; animation: spin .7s linear infinite; }
.steps-anim .st-ic .i { width: 16px; height: 16px; stroke-width: 2.4; }

/* ============================================================
   Home dashboard
   ============================================================ */
.dash { display: grid; grid-template-columns: 1fr; gap: var(--s4); }
.dash > * { min-width: 0; }
.spend-card .sc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s3); }
.spend-card .mid-num { margin-top: 6px; }
.spend-split { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); margin-top: var(--s4); }
.mini-stat { padding: 12px 14px; border-radius: 16px; background: var(--surface-2); }
.mini-stat .ms-l { font-size: 0.75rem; color: var(--fg-2); font-weight: 550; }
.mini-stat .ms-v { font-weight: 650; font-size: 1.0625rem; font-variant-numeric: tabular-nums; margin-top: 2px; letter-spacing: -0.01em; }
.mini-stat .ms-s { font-size: 0.75rem; color: var(--fg-2); }
.goal-mini { display: flex; align-items: center; gap: var(--s4); }
.insight-mini { background: var(--lavender); border-color: transparent; color: var(--on-lavender); }
.insight-mini .card-sub, .insight-mini .muted { color: var(--on-lavender); opacity: .85; }
.insight-mini .link { color: var(--on-lavender); }
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s2); }
.quick button { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px; border-radius: 18px; font-size: 0.75rem; font-weight: 580; color: var(--fg); text-align: center; }
.quick button:hover { background: var(--surface-2); }
.quick .q-ic { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-1); }
.bill-row .mono { width: 36px; height: 36px; font-size: 0.75rem; }
.demo-banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: var(--lavender); color: var(--on-lavender); font-size: 0.8125rem; }
.demo-banner .i { width: 18px; height: 18px; }
.demo-banner button { margin-left: auto; font-weight: 650; text-decoration: underline; text-underline-offset: 3px; min-height: 32px; }

/* accounts */
.acc-card { display: flex; flex-direction: column; gap: var(--s4); }
.acc-top { display: flex; align-items: center; gap: var(--s3); }
.acc-bal { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.acc-status { display: flex; align-items: center; gap: 6px; font-size: 0.8125rem; color: var(--fg-2); }
.acc-status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
.acc-status.bad .dot { background: var(--warning-fill); }
.acc-status.bad { color: var(--warning); }

/* activity */
.act-tools { display: flex; flex-direction: column; gap: var(--s3); position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 4px 0 8px; margin-top: -4px; }
.filter-summary { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 0.8125rem; color: var(--fg-2); }
.txn-detail-head { display: flex; flex-direction: column; align-items: center; gap: var(--s2); text-align: center; padding-top: var(--s2); }
.txn-detail-head .amt { font-size: 2.5rem; font-weight: 660; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1.1; margin-top: 6px; }
.txn-detail-head .amt.pos { color: var(--success); }
.txn-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s2); }
.txn-actions button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); font-size: 0.75rem; font-weight: 580; min-height: 76px; justify-content: center; }
.txn-actions button:hover { background: var(--surface-2); }
.split-line { display: grid; grid-template-columns: 1fr 120px 40px; gap: 8px; align-items: center; }
.split-line .select-btn { width: 100%; justify-content: space-between; min-height: 52px; }
.split-line .amount-box { padding: 6px 10px; border-radius: 14px; }
.split-line .amount-box input { font-size: 1.0625rem; width: 100%; }
.split-line .amount-box .cur { font-size: 1rem; }

/* spending analytics */
.spend-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.vs-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 0.8125rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-3); color: var(--fg-2); }
.vs-chip.down { background: var(--success-soft); color: var(--success); }
.vs-chip.up { background: var(--warning-soft); color: var(--warning); }
.vs-chip .i { width: 14px; height: 14px; stroke-width: 2.2; }

/* budgets */
.budget-total .bt-nums { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); flex-wrap: wrap; }
.card.budget-card { display: flex; flex-direction: column; gap: var(--s3); padding: var(--s5); }
.budget-card .bc-top { display: flex; align-items: center; gap: var(--s3); }
.budget-card .bc-name { font-weight: 620; font-size: 1rem; }
.budget-card .bc-figs { display: flex; justify-content: space-between; gap: var(--s3); font-size: 0.875rem; color: var(--fg-2); }
.budget-card .bc-figs strong { color: var(--fg); font-weight: 620; font-variant-numeric: tabular-nums; }
.budget-card .bc-msg { font-size: 0.8125rem; color: var(--fg-2); display: flex; gap: 6px; align-items: flex-start; }
.budget-card .bc-msg .i { width: 16px; height: 16px; margin-top: 2px; }
.budget-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s3); }
.budget-grid > li, .goal-grid > li, .dash > * { min-width: 0; }
.stat-trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); }
.stat-trio > div { padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); min-width: 0; }
.stat-trio .st-l { font-size: 0.75rem; color: var(--fg-2); font-weight: 550; }
.stat-trio .st-v { font-weight: 650; font-variant-numeric: tabular-nums; font-size: 1.0625rem; letter-spacing: -0.01em; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.preview-card { border: 1.5px dashed var(--border-2); border-radius: var(--r-card); padding: var(--s4); background: var(--surface-2); }
.preview-card .eyebrow { margin-bottom: 10px; }

/* savings */
.goal-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); }
.goal-grid.list-mode { grid-template-columns: 1fr; }
.goal-card { display: flex; flex-direction: column; gap: var(--s3); padding: var(--s4); min-height: 200px; position: relative; }
.goal-card .gc-ic { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; background: var(--lime-soft); }
.goal-card .gc-name { font-weight: 640; font-size: 0.9875rem; line-height: 1.25; }
.goal-card .gc-figs { font-size: 0.8125rem; color: var(--fg-2); }
.goal-card .gc-figs strong { color: var(--fg); font-size: 1.0625rem; font-weight: 650; display: block; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.goal-card .gc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.list-mode .goal-card { flex-direction: row; align-items: center; min-height: 0; }
.list-mode .goal-card .gc-body { flex: 1; min-width: 0; }
.goal-hero { display: flex; flex-direction: column; align-items: center; gap: var(--s3); text-align: center; }
.goal-hero .gh-saved { font-size: 1.75rem; font-weight: 660; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
.milestones { display: flex; justify-content: space-between; gap: 6px; }
.milestones li { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--fg-2); text-align: center; }
.milestones .ms-dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); color: var(--fg-2); }
.milestones .hit .ms-dot { background: var(--lime); color: var(--on-lime); }
.milestones .hit { color: var(--fg); font-weight: 600; }
.milestones .ms-dot .i { width: 15px; height: 15px; stroke-width: 2.4; }
.celebrate { position: absolute; inset: 0; pointer-events: none; display: grid; place-items: center; }
.celebrate .burst { width: 140px; height: 140px; border-radius: 50%; border: 3px solid var(--lime); animation: burst 900ms var(--ease-out) forwards; }
@keyframes burst { from { transform: scale(.6); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
.icon-pick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.icon-pick .opt.tile { min-height: 84px; }

/* insights */
.insight-card { padding: var(--s5); display: flex; flex-direction: column; gap: var(--s3); }
.insight-card.win { background: var(--lavender); border-color: transparent; color: var(--on-lavender); }
.insight-card.win .muted, .insight-card.win .ic-meta { color: var(--on-lavender); opacity: .85; }
.insight-card.win .link { color: var(--on-lavender); }
.insight-card .ic-kicker { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; }
.insight-card .ic-title { font-size: 1.1875rem; font-weight: 650; letter-spacing: -0.015em; line-height: 1.25; }
.insight-card .ic-body { font-size: 0.9375rem; line-height: 1.5; }
.insight-card .ic-meta { font-size: 0.75rem; color: var(--fg-2); }
.insight-card .ic-foot { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
.insight-card .ic-foot .spacer { flex: 1; }
.pair-bars { display: flex; flex-direction: column; gap: 8px; }
.pair-bars .pb-row { display: grid; grid-template-columns: 74px 1fr 76px; gap: 10px; align-items: center; font-size: 0.8125rem; }
.pair-bars .pb-track { height: 12px; border-radius: 6px; background: color-mix(in srgb, currentColor 10%, transparent); overflow: hidden; }
.pair-bars .pb-fill { height: 100%; border-radius: 6px; background: currentColor; opacity: .8; }
.pair-bars .pb-fill.now { opacity: 1; background: var(--brand); }
.insight-card.win .pair-bars .pb-fill.now { background: var(--on-lavender); }
.pair-bars .pb-v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.mono-stack { display: flex; }
.mono-stack .mono { width: 34px; height: 34px; font-size: 0.6875rem; box-shadow: 0 0 0 2.5px var(--surface); }
.mono-stack .mono + .mono { margin-left: -8px; }
.hub-links { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); }
.hub-links button { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; padding: 14px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border); text-align: left; min-height: 112px; }
.hub-links button:hover { border-color: var(--border-2); box-shadow: var(--shadow-2); }
.hub-links .hl-ic { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--sage); }
.hub-links .hl-t { font-weight: 640; font-size: 0.875rem; line-height: 1.25; }
.hub-links .hl-v { font-size: 0.8125rem; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.ask-box { display: flex; flex-direction: column; gap: var(--s3); padding: var(--s5); }
.ask-form { display: flex; gap: 8px; }
.ask-form .input { min-height: 50px; border-radius: 999px; padding-left: 18px; }
.ask-form .btn { min-height: 50px; border-radius: 999px; padding: 0 18px; flex: none; }
.ask-sugg { display: flex; gap: 8px; flex-wrap: wrap; }
.ask-sugg button { font-size: 0.8125rem; padding: 8px 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); text-align: left; min-height: 36px; }
.ask-sugg button:hover { background: var(--sage); }
.ask-answer { border-top: 1px solid var(--border); padding-top: var(--s3); display: flex; flex-direction: column; gap: var(--s2); }
.ask-answer .q { font-size: 0.8125rem; color: var(--fg-2); }
.ask-answer .a { font-size: 0.9375rem; line-height: 1.5; }

let _announceT = null;
function announce(msg, assertive = false) {
  if (typeof document === 'undefined') return;
  const el = document.getElementById(assertive ? 'live-assertive' : 'live-polite');
  if (!el) return;
  el.textContent = '';
  clearTimeout(_announceT);

}
function haptic(kind = 'light') {
  if (typeof S === 'undefined' || !S || !S.settings || !S.settings.haptics) return;
  const pat = { light: 8, select: 6, success: [12, 60, 18], warning: [20, 50, 20] }[kind] || 8;
  try { navigator.vibrate && navigator.vibrate(pat); } catch (e) { /* unsupported */ }
}

  if (f.cats && f.cats.length && !f.cats.includes(t.cat) && !(t.splits && t.splits.some((s) => f.cats.includes(s.cat)))) return false;

/* ---------- Accounts & sync (simulated) ---------- */
function syncAll() {
  return new Promise((resolve) => {
    S.sync.state = 'syncing'; emit('sync');
    setTimeout(() => {
      if (S.sim.failNextSync) {
        S.sim.failNextSync = false;
        S.sync.state = 'failed'; S.sync.failedAt = nowStamp(); S.sync.failedAcc = 'acc_spend';
        commit('sync'); resolve({ ok: false });
        return;
      }
      const stamp = nowStamp();
      let news = [];
      // the pending Uber fare settles at its final amount
      const uber = S.txns.find((t) => t.mkey === 'uber' && t.status === 'pending');
      if (uber) { uber.status = 'posted'; uber.authAmt = uber.amt; if (uber.settle != null) uber.amt = uber.settle; delete uber.settle; news.push({ kind: 'settled', t: uber }); }
      const tfl = S.txns.find((t) => t.mkey === 'tfl' && t.status === 'pending');
      if (tfl) { tfl.status = 'posted'; news.push({ kind: 'settled', t: tfl }); }
      if (!S.sync.newTxnAdded && accounts().some((a) => a.id === 'acc_spend')) {
        S.sync.newTxnAdded = true;
        const tx = { id: uid('tx'), d: today(), t: nowHM(), acc: 'acc_spend', mkey: 'grind', merchant: 'Grind', desc: 'GRIND COFFEE', cat: 'eating', amt: -385, status: 'pending' };
        const rule = S.rules.find((r) => r.mkey === tx.mkey); if (rule) tx.cat = rule.cat;
        S.txns.unshift(tx); news.push({ kind: 'new', t: tx });
      }
      accounts().forEach((a) => { if (a.status === 'ok') a.lastSync = stamp; });
      S.sync.last = stamp; S.sync.state = 'ok'; delete S.sync.failedAcc;
      commit('sync'); resolve({ ok: true, news });
    }, 1300);
  });
}
function expireConnection(id) { const a = acct(id); a.status = 'expired'; a.expiredAt = nowStamp(); commit('accounts'); }

  else { S.txns = S.txns.filter((t) => t.acc !== id); S.accounts = S.accounts.filter((x) => x.id !== id); }
  // keep transfer pairs honest: a transfer whose other leg vanished is still not spending

}
function connectDemoInstitution(instId, picks) {
  // In demo mode, connecting either demo bank loads Alex's sample accounts for that institution.
  const full = buildDemo('full', { first: S.user.first, last: S.user.last, email: S.user.email, aims: S.user.aims });
  const wanted = full.accounts.filter((a) => picks.includes(a.id) && !S.accounts.some((x) => x.id === a.id && !x.removed));
  if (!wanted.length) return 0;
  const ids = new Set(wanted.map((a) => a.id));
  S.accounts = S.accounts.filter((a) => !ids.has(a.id)).concat(wanted.map((a) => Object.assign(a, { lastSync: nowStamp(), consentReview: addDays(today(), 90) })));

  return (title ? `<div class="tt-l">${esc(title)}</div>` : '') + rows.map((r) => `<div class="tt-row">${r.key ? `<span class="tt-key" style="background:${r.key}"></span>` : ''}<span class="tt-v">${esc(r.v)}</span>${r.l ? `<span class="tt-l">${esc(r.l)}</span>` : ''}</div>`).join('');
}
function placeTip(el, x, y, html) {
  let tip = $('.chart-tip', el);
  if (!tip) { tip = document.createElement('div'); tip.className = 'chart-tip'; tip.setAttribute('aria-hidden', 'true'); el.appendChild(tip); }
  tip.innerHTML = html; tip.hidden = false;

function hideTip(el) { const t = $('.chart-tip', el); if (t) t.hidden = true; }
/* Shared scrubbing for X-indexed charts */
function scrubbable(el, svgNode, n, xAt, onIndex, opts = {}) {
  let idx = opts.initial != null ? opts.initial : null;
  const set = (i, viaKey) => { idx = clamp(i, 0, n - 1); onIndex(idx, viaKey); };
  const nearest = (clientX) => { const r = svgNode.getBoundingClientRect(); const x = clientX - r.left; let best = 0, bd = 1e9; for (let i = 0; i < n; i++) { const d = Math.abs(xAt(i) - x); if (d < bd) { bd = d; best = i; } } return best; };
  svgNode.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' || e.buttons || e.pointerType === 'pen') set(nearest(e.clientX)); });
  svgNode.addEventListener('pointerdown', (e) => set(nearest(e.clientX)));
  svgNode.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') { onIndex(null); } });
  svgNode.setAttribute('tabindex', '0');
  svgNode.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); set((idx == null ? (opts.keyStart != null ? opts.keyStart : 0) : idx + (e.key === 'ArrowRight' ? 1 : -1)), true); }

}

const CHART_RENDER = {
  /* ---- Cash-flow forecast: history (solid) + estimate (dashed) + likely range band ---- */
  forecast(el, F, opts, W) {
    const H = opts.height || 240; const padL = 52, padR = 12, padT = 16, padB = 28;
    const hist = F.history.slice(0, -1).map((p) => ({ d: p.d, v: p.v, kind: 'actual' }));
    const proj = F.days.map((p) => ({ d: p.d, v: p.v, lo: p.lo, hi: p.hi, kind: 'est', events: p.events }));
    const all = hist.concat(proj);
    const n = all.length;
    const vals = all.map((p) => p.v).concat(F.variable ? proj.map((p) => p.lo).concat(proj.map((p) => p.hi)) : []);
    let lo = Math.min(0, ...vals), hi = Math.max(...vals);
    const T = niceTicks(lo, hi, 4);
    const x = (i) => padL + (i / (n - 1)) * (W - padL - padR);
    const y = (v) => padT + (1 - (v - T.lo) / (T.hi - T.lo)) * (H - padT - padB);
    const ti = hist.length; // index of today
    let g = '<g class="grid">' + T.ticks.map((t) => `<line x1="${padL}" x2="${W - padR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/>`).join('') + '</g>';
    g += T.ticks.map((t) => `<text x="${padL - 8}" y="${(y(t) + 4).toFixed(1)}" text-anchor="end">${esc(moneyCompact(t))}</text>`).join('');
    if (T.lo < 0) g += `<line class="zero" x1="${padL}" x2="${W - padR}" y1="${y(0)}" y2="${y(0)}" stroke-width="1.5"/>`;
    // x labels by priority (today, payday, start, end); drop any that would collide
    const cands = [[ti, 'Today'], [all.findIndex((p) => p.d === F.payday), 'Payday'], [0, fmtDay(all[0].d, 'dm')], [n - 1, fmtDay(all[n - 1].d, 'dm')]].filter(([i]) => i >= 0);
    const placed = [];
    cands.forEach(([i, txt]) => { const xx = x(i); const wdt = txt.length * 6.4; const cx = i === 0 ? xx + wdt / 2 : i === n - 1 ? xx - wdt / 2 : xx; if (placed.some((p) => Math.abs(p.cx - cx) < (p.w + wdt) / 2 + 10)) return; placed.push({ x: xx, cx, w: wdt, i, txt }); });
    placed.forEach(({ x: xx, i, txt }) => { const anchor = i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'; g += `<text x="${xx.toFixed(1)}" y="${H - 8}" text-anchor="${anchor}">${esc(txt)}</text>`; });
    if (F.variable) {
      const top = proj.map((p, k) => [x(ti + k), y(p.hi)]), bot = proj.map((p, k) => [x(ti + k), y(p.lo)]).reverse();
      g += `<path class="band" d="${pathFrom(top.concat(bot))}Z"/>`;
    }
    g += `<line class="today-line" x1="${x(ti)}" x2="${x(ti)}" y1="${padT}" y2="${H - padB}"/>`;
    if (F.payday) { const pi = all.findIndex((p) => p.d === F.payday); if (pi > 0) g += `<line class="today-line" x1="${x(pi)}" x2="${x(pi)}" y1="${padT}" y2="${H - padB}" style="opacity:.25"/>`; }
    g += `<path class="line-actual" d="${pathFrom(hist.map((p, i) => [x(i), y(p.v)]).concat([[x(ti), y(F.start)]]))}"/>`;
    g += `<path class="line-est" d="${pathFrom(proj.map((p, k) => [x(ti + k), y(p.v)]))}"/>`;
    // event markers
    proj.forEach((p, k) => { if (p.events && p.events.length) { const inc = p.events.some((e) => e.amt > 0); g += `<circle class="ev-dot ${inc ? 'in' : ''}" cx="${x(ti + k).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.5"/>`; } });
    if (F.beforePay) { const bi = all.findIndex((p) => p.d === F.beforePay.d && p.kind === 'est'); if (bi > 0) g += `<circle cx="${x(bi)}" cy="${y(all[bi].v)}" r="5.5" fill="var(--lime)" stroke="var(--brand)" stroke-width="2"/>`; }
    g += `<g class="sel"></g>`;
    el.innerHTML = svgEl(W, H, g);
    const svg = $('svg', el);
    svg.setAttribute('aria-label', `Balance chart. Use left and right arrow keys to read each day. ${F.beforePay ? 'Estimated ' + money(F.beforePay.v, { round: true }) + ' before payday.' : ''}`);
    svg.setAttribute('role', 'img');
    const sel = $('.sel', svg);
    scrubbable(el, svg, n, x, (i, viaKey) => {
      if (i == null) { sel.innerHTML = ''; hideTip(el); return; }
      const p = all[i];
      sel.innerHTML = `<line class="cross" x1="${x(i)}" x2="${x(i)}" y1="${padT}" y2="${H - padB}"/><circle class="dot" cx="${x(i)}" cy="${y(p.v)}" r="5" fill="var(--brand)"/>`;
      const rows = [{ v: money(p.v, { round: false }), l: p.kind === 'actual' ? 'Recorded' : 'Estimated' }];
      if (p.kind === 'est' && F.variable && i !== ti) rows.push({ v: `${money(p.lo, { round: true })} – ${money(p.hi, { round: true })}`, l: 'Likely range' });
      if (p.events && p.events.length) p.events.slice(0, 3).forEach((e) => rows.push({ v: money(e.amt, { sign: 'always' }), l: e.label.replace('Savings plan · ', 'Savings: ') }));
      placeTip(el, x(i), y(p.v), tipHTML(rows, relDay(p.d) === 'Today' ? 'Today' : fmtDay(p.d, 'wdm')));
      if (viaKey) announce(`${fmtDay(p.d, 'wlong')}: ${p.kind === 'actual' ? 'recorded' : 'estimated'} balance ${money(p.v)}${p.events && p.events.length ? '. ' + p.events.map((e) => e.label + ' ' + money(e.amt, { sign: 'always' })).join(', ') : ''}`);
    }, { keyStart: ti });
  },

  /* ---- Cumulative spending through a period vs last period and a budget pace line ---- */
  cumulative(el, M, opts, W) {
    const H = opts.height || 200; const padL = 46, padR = 12, padT = 14, padB = 26;
    const n = M.days; // days in period
    const maxV = Math.max(M.limit || 0, ...M.cur.map((p) => p.v), ...(M.prev || []).map((p) => p.v), 100);

    const x = (i) => padL + (i / Math.max(1, n - 1)) * (W - padL - padR);
    const y = (v) => padT + (1 - (v - T.lo) / (T.hi - T.lo)) * (H - padT - padB);
    let g = '<g class="grid">' + T.ticks.map((t) => `<line x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}"/>`).join('') + '</g>';
    g += T.ticks.map((t) => `<text x="${padL - 8}" y="${y(t) + 4}" text-anchor="end">${esc(moneyCompact(t))}</text>`).join('');
    [0, Math.floor((n - 1) / 2), n - 1].forEach((i, k) => { g += `<text x="${x(i)}" y="${H - 7}" text-anchor="${k === 0 ? 'start' : k === 2 ? 'end' : 'middle'}">${esc(fmtDay(addDays(M.start, i), 'dm'))}</text>`; });
    if (M.limit) g += `<path class="line-budget" d="M${x(0)} ${y(0)}L${x(n - 1)} ${y(M.limit)}"/><text x="${W - padR}" y="${y(M.limit) - 6}" text-anchor="end" style="fill:var(--warning);font-weight:600">Budget ${esc(money(M.limit, { whole: true }))}</text>`;
    if (M.prev && M.prev.length) g += `<path class="line-prev" d="${pathFrom(M.prev.map((p, i) => [x(i), y(p.v)]))}"/>`;
    if (M.cur.length) {
      const pts = M.cur.map((p, i) => [x(i), y(p.v)]);
      g += `<path class="area" d="${pathFrom(pts)}L${x(M.cur.length - 1)} ${y(0)}L${x(0)} ${y(0)}Z"/>`;
      g += `<path class="line-actual" d="${pathFrom(pts)}"/>`;
      const last = M.cur[M.cur.length - 1];
      g += `<circle class="dot" cx="${x(M.cur.length - 1)}" cy="${y(last.v)}" r="5" fill="var(--brand)"/>`;
      if (M.projected != null && M.cur.length < n) g += `<path class="line-est" d="M${x(M.cur.length - 1)} ${y(last.v)}L${x(n - 1)} ${y(M.projected)}"/>`;
    }
    g += '<g class="sel"></g>';
    el.innerHTML = svgEl(W, H, g);
    const svg = $('svg', el); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', (opts.label || 'Cumulative spending') + '. Use arrow keys to read each day.');
    const sel = $('.sel', svg);
    scrubbable(el, svg, n, x, (i, viaKey) => {
      if (i == null) { sel.innerHTML = ''; hideTip(el); return; }
      const d = addDays(M.start, i);
      const c = M.cur[i], p = M.prev ? M.prev[i] : null;
      const yy = c ? y(c.v) : p ? y(p.v) : y(0);
      sel.innerHTML = `<line class="cross" x1="${x(i)}" x2="${x(i)}" y1="${padT}" y2="${H - padB}"/>` + (c ? `<circle class="dot" cx="${x(i)}" cy="${y(c.v)}" r="5" fill="var(--brand)"/>` : '');
      const rows = [];
      if (c) rows.push({ v: money(c.v), l: M.curLabel || 'This period', key: 'var(--brand)' });
      else rows.push({ v: '—', l: 'Not yet' });
      if (p) rows.push({ v: money(p.v), l: M.prevLabel || 'Last period', key: 'var(--fg-3)' });
      placeTip(el, x(i), yy, tipHTML(rows, 'By ' + fmtDay(d, 'wdm')));
      if (viaKey) announce(`By ${fmtDay(d, 'wlong')}: ${c ? money(c.v) + ' spent' : 'no data yet'}${p ? ', compared with ' + money(p.v) + ' last time' : ''}`);
    }, { keyStart: Math.max(0, M.cur.length - 1) });
  },

  /* ---- Monthly income vs expenses: grouped bars with partial / no-data months ---- */
  incomeBars(el, M, opts, W) {
    const H = opts.height || 230; const padL = 46, padR = 8, padT = 14, padB = 30;
    const months = M.months; const n = months.length;
    const maxV = Math.max(100, ...months.filter((m) => !m.nodata).map((m) => Math.max(m.income, m.spending)));
    const T = niceTicks(0, maxV, 4);
    const slot = (W - padL - padR) / n;
    const bw = Math.min(22, (slot - 10) / 2);
    const y = (v) => padT + (1 - (v - T.lo) / (T.hi - T.lo)) * (H - padT - padB);
    const base = y(0);
    let g = '<g class="grid">' + T.ticks.map((t) => `<line x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}"/>`).join('') + '</g>';
    g += T.ticks.map((t) => `<text x="${padL - 8}" y="${y(t) + 4}" text-anchor="end">${esc(moneyCompact(t))}</text>`).join('');
    const rbar = (x0, w, v, cls) => { const h = Math.max(0, base - y(v)); if (h < 1) return ''; const r = Math.min(4, w / 2, h); return `<path class="${cls}" d="M${x0} ${base}V${base - h + r}Q${x0} ${base - h} ${x0 + r} ${base - h}H${x0 + w - r}Q${x0 + w} ${base - h} ${x0 + w} ${base - h + r}V${base}Z"/>`; };
    months.forEach((m, i) => {
      const cx = padL + slot * i + slot / 2;
      const sel = M.selected === m.m;
      if (m.nodata) { g += `<rect class="nodata-rect" x="${cx - bw - 1}" y="${padT}" width="${bw * 2 + 2}" height="${base - padT}" rx="4"/><text x="${cx}" y="${base - 8}" text-anchor="middle" style="font-size:10px">No data</text>`; }
      else {
        g += `<g class="${m.partial ? 'bar-partial' : ''} ${sel ? 'bar-sel' : ''}">` + rbar(cx - bw - 1, bw, m.income, 'bar-in') + rbar(cx + 1, bw, m.spending, 'bar-out') + '</g>';

      }

      if (sel) g += `<rect x="${cx - slot / 2 + 3}" y="${padT - 6}" width="${slot - 6}" height="${H - padT - padB + 8}" rx="10" fill="var(--fg)" opacity="0.05"/>`;
    });
    g += `<line class="zero" x1="${padL}" x2="${W - padR}" y1="${base}" y2="${base}"/><g class="sel"></g>`;
    el.innerHTML = svgEl(W, H, g);

    const xAt = (i) => padL + slot * i + slot / 2;

    scrubbable(el, svg, n, xAt, (i, viaKey) => {
      if (i == null) { hideTip(el); return; }
      cur = i;
      const m = months[i];
      const rows = m.nodata ? [{ v: 'No data', l: 'before your accounts were connected' }] : [{ v: money(m.income, { round: true }), l: 'Income', key: 'var(--brand)' }, { v: money(m.spending, { round: true }), l: 'Spending', key: 'var(--lavender-2)' }, { v: money(m.income - m.spending, { round: true, sign: 'always' }), l: 'Net' }];
      placeTip(el, xAt(i), m.nodata ? padT + 40 : y(Math.max(m.income, m.spending)), tipHTML(rows, mkLabel(m.m, true) + (m.partial && !m.nodata ? ' (so far)' : '')));
      if (viaKey) announce(`${mkLabel(m.m, true)}${m.partial ? ', so far' : ''}: ${m.nodata ? 'no data' : 'income ' + money(m.income) + ', spending ' + money(m.spending)}`);
    }, { keyStart: Math.max(0, cur) });
    svg.addEventListener('click', () => { if (cur >= 0 && opts.onSelect && !months[cur].nodata) opts.onSelect(months[cur].m); });
    svg.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && cur >= 0 && opts.onSelect && !months[cur].nodata) { e.preventDefault(); opts.onSelect(months[cur].m); } });
  },

  /* ---- Simple bars per day/week (budget detail) ---- */
  simpleBars(el, M, opts, W) {
    const H = opts.height || 170; const padL = 40, padR = 6, padT = 12, padB = 26;
    const n = M.items.length; const maxV = Math.max(100, ...M.items.map((b) => b.v), M.ref || 0);
    const T = niceTicks(0, maxV, 3);
    const slot = (W - padL - padR) / n; const bw = Math.min(24, Math.max(3, slot - (n > 20 ? 2 : 8)));
    const y = (v) => padT + (1 - v / T.hi) * (H - padT - padB); const base = y(0);
    let g = '<g class="grid">' + T.ticks.map((t) => `<line x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}"/>`).join('') + '</g>';

    g += `<line class="zero" x1="${padL}" x2="${W - padR}" y1="${base}" y2="${base}"/><g class="sel"></g>`;
    el.innerHTML = svgEl(W, H, g);

    const sel = $('.sel', svg); const xAt = (i) => padL + slot * i + slot / 2;

      placeTip(el, xAt(i), y(b.v), tipHTML([{ v: b.future ? 'Not yet' : money(b.v), l: b.sub || '' }], b.full || b.label));
      if (viaKey) announce(`${b.full || b.label}: ${b.future ? 'not yet' : money(b.v)}`);
    }, { keyStart: Math.max(0, M.items.findIndex((b) => b.future) - 1) });
  },

  /* ---- Goal: saved over time (step) + plan projection to the target ---- */
  goal(el, M, opts, W) {
    const H = opts.height || 200; const padL = 46, padR = 12, padT = 16, padB = 26;
    const pts = M.series; const proj = M.proj || [];
    const allD = pts.map((p) => p.d).concat(proj.map((p) => p.d));
    const d0 = allD[0], d1 = allD[allD.length - 1] > M.end ? allD[allD.length - 1] : M.end;
    const span = Math.max(1, daysBetween(d0, d1));
    const T = niceTicks(0, Math.max(M.target, ...pts.map((p) => p.v)), 4);
    const x = (d) => padL + (daysBetween(d0, d) / span) * (W - padL - padR);
    const y = (v) => padT + (1 - v / T.hi) * (H - padT - padB);
    let g = '<g class="grid">' + T.ticks.map((t) => `<line x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}"/>`).join('') + '</g>';
    g += T.ticks.map((t) => `<text x="${padL - 8}" y="${y(t) + 4}" text-anchor="end">${esc(moneyCompact(t))}</text>`).join('');
    g += `<line x1="${padL}" x2="${W - padR}" y1="${y(M.target)}" y2="${y(M.target)}" stroke="var(--lime-2)" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${padL + 4}" y="${y(M.target) - 6}" style="fill:var(--fg);font-weight:600">Target ${esc(money(M.target, { whole: true }))}</text>`;
    const step = []; pts.forEach((p, i) => { if (i) step.push([x(p.d), y(pts[i - 1].v)]); step.push([x(p.d), y(p.v)]); });
    step.push([x(M.today), y(pts.length ? pts[pts.length - 1].v : 0)]);
    if (step.length) { g += `<path class="area" d="${pathFrom(step)}L${x(M.today)} ${y(0)}L${x(d0)} ${y(0)}Z"/><path class="line-actual" d="${pathFrom(step)}"/>`; }
    if (proj.length) { const pp = [[x(M.today), y(pts.length ? pts[pts.length - 1].v : 0)]].concat(proj.map((p) => [x(p.d), y(p.v)])); g += `<path class="line-est" d="${pathFrom(pp)}"/>`; }
    if (M.targetDate) g += `<line class="today-line" x1="${x(M.targetDate)}" x2="${x(M.targetDate)}" y1="${padT}" y2="${H - padB}" style="opacity:.3"/>`;
    [d0, M.today, d1].forEach((d, k) => { g += `<text x="${x(d)}" y="${H - 7}" text-anchor="${k === 0 ? 'start' : k === 2 ? 'end' : 'middle'}">${esc(k === 1 ? 'Today' : fmtDay(d, 'mys'))}</text>`; });
    el.innerHTML = svgEl(W, H, g, opts.label);
  },

  /* ---- Donut ---- */
  donut(el, M, opts) {
    const size = 260, R = 120, r = 82, cx = size / 2, cy = size / 2;
    const total = sum(M.items, (s) => Math.max(0, s.value));
    let a0 = -Math.PI / 2; const gap = M.items.length > 1 ? 0.018 : 0;
    const segs = M.items.filter((s) => s.value > 0).map((s) => {
      const frac = s.value / total; const a1 = a0 + frac * Math.PI * 2;
      const st = a0 + gap / 2, en = Math.max(st + 0.001, a1 - gap / 2);
      const large = en - st > Math.PI ? 1 : 0;
      const p = (ang, rad) => [cx + rad * Math.cos(ang), cy + rad * Math.sin(ang)];
      const [x1, y1] = p(st, R), [x2, y2] = p(en, R), [x3, y3] = p(en, r), [x4, y4] = p(st, r);
      const d = frac >= 0.9999 ? `M${cx} ${cy - R}A${R} ${R} 0 1 1 ${cx - 0.01} ${cy - R}ZM${cx} ${cy - r}A${r} ${r} 0 1 0 ${cx + 0.01} ${cy - r}Z` : `M${x1} ${y1}A${R} ${R} 0 ${large} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${large} 0 ${x4} ${y4}Z`;
      a0 = a1;
      return { ...s, d, frac };
    });
    const sel = M.selected;
    el.innerHTML = `<div class="donut-wrap"><svg viewBox="0 0 ${size} ${size}" role="group" aria-label="${esc(opts.label || 'Spending by category')}">${segs.map((s, i) => `<g class="donut-seg ${sel && sel !== s.key ? 'dim' : ''} ${sel === s.key ? 'sel' : ''}" data-key="${esc(s.key)}" tabindex="${(sel ? sel === s.key : i === 0) ? 0 : -1}" role="button" aria-pressed="${sel === s.key}" aria-label="${esc(s.label)}: ${esc(money(s.value))}, ${Math.round(s.frac * 100)}%"><path d="${s.d}" style="fill:var(--cat-${s.color || catVar(s.key)})"/></g>`).join('')}</svg><div class="donut-mid">${M.mid}</div></div>`;
    const keys = segs.map((s) => s.key);
    $$('.donut-seg', el).forEach((gEl, i) => {
      gEl.addEventListener('click', () => opts.onSelect && opts.onSelect(gEl.dataset.key === sel ? null : gEl.dataset.key));
      gEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); opts.onSelect && opts.onSelect(gEl.dataset.key === sel ? null : gEl.dataset.key); }
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
          e.preventDefault(); const j = (i + (e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : -1) + keys.length) % keys.length;
          const nx = $$('.donut-seg', el)[j]; $$('.donut-seg', el).forEach((s) => s.setAttribute('tabindex', '-1')); nx.setAttribute('tabindex', '0'); nx.focus();
