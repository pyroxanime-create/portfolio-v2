  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);

}

}

.device[data-appearance="dark"] { --page: #0A0B0D; --page-ink: #F3F4F6; --bg: #111214; --surface: #1A1B1F; --surface-2: #232429; --surface-3: #2C2E34; --fg: #F3F4F6; --fg-2: #A0A7B4; --fg-3: #6B7280; --border: #2A2C32; --border-strong: #3A3D45; --border-control: #6B7280; --primary: #6358FF; --primary-press: #5145F0; --on-primary: #FFFFFF; --primary-text: #ADA7FF; --primary-soft: #25224B; --on-primary-soft: #CBC6FF; --success: #3CCB94; --success-soft: #102A20; --warning: #F2A33A; --warning-text: #FFB861; --warning-soft: #2D2112; --error: #FF8075; --error-soft: #341714; --scrim: rgba(0, 0, 0, 0.6); --toast-bg: #F3F4F6; --toast-fg: #111214; --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4); --shadow-2: 0 16px 40px -8px rgba(0, 0, 0, 0.7); --shadow-device: 0 40px 90px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.06); --skeleton: #23252A; --skeleton-hi: #2C2E34; --paper: #1F2024; --av1-bg: #2A2752; --av1-fg: #CBC6FF; --av2-bg: #14322A; --av2-fg: #8EE3C0; --av3-bg: #3A2414; --av3-fg: #F7B98C; --av4-bg: #16283C; --av4-fg: #9CC7F2; --av5-bg: #3A1A26; --av5-fg: #F4A6BF; --av6-bg: #33291A; --av6-fg: #E3CB8F; color-scheme: dark; }

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--page-ink);
  font-family: var(--font);
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
input, select, textarea { font: inherit; color: inherit; }
svg { display: block; }
.sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.tnum { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1, "cv11" 1; }

/* ---------- Stage & device ---------- */
.stage {
  min-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 56px;
  padding-block: 24px;
  padding-inline: 24px;
}
.device {
  --ts: 1;
  --fs-hero: calc(40px * var(--ts));
  --fs-hero-sm: calc(32px * var(--ts));
  --fs-title: calc(28px * var(--ts));
  --fs-h2: calc(20px * var(--ts));
  --fs-card: calc(17px * var(--ts));
  --fs-body: calc(15px * var(--ts));
  --fs-label: calc(13.5px * var(--ts));
  --fs-caption: calc(12px * var(--ts));
  --kb: 0px;
  position: relative;
  flex: none;
  width: 393px;
  height: min(852px, calc(100vh - 48px));
  min-height: 640px;
  border-radius: 54px;
  background: var(--bg);
  color: var(--fg);
  box-shadow: 0 0 0 11px #0C0D10, 0 0 0 12px #2A2C33, var(--shadow-device);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  font-size: var(--fs-body);
  line-height: 1.45;
  isolation: isolate;
}
.statusbar {
  flex: none;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 30px 0 38px;
  font-size: 15px;
  font-weight: 600;
  color: var(--fg);
  background: var(--bg);
  position: relative;
  z-index: 40;
}
.statusbar .island { position: absolute; left: 50%; top: 11px; width: 120px; height: 34px; margin-left: -60px; background: #000; border-radius: 20px; }
.statusbar .sb-icons { display: flex; gap: 6px; align-items: center; }
.statusbar .sb-icons svg { width: 17px; height: 17px; }
.home-indicator { position: absolute; bottom: 7px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--fg); opacity: .85; z-index: 60; pointer-events: none; }

@media (max-width: 899px), (max-height: 680px) {
  html, body { overflow: hidden; }
  .stage { padding: 0; height: 100%; min-height: 0; display: block; }
  .device { width: 100%; height: 100%; min-height: 0; border-radius: 0; box-shadow: none; max-width: 560px; margin: 0 auto; }
  .statusbar, .home-indicator { display: none; }
  .console { display: none !important; }
}

/* ---------- App container ---------- */
.app { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
.screens { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); will-change: transform, opacity; }
.screen.enter-push { animation: pushIn .3s var(--ease-out) both; z-index: 2; }
.screen.exit-push { animation: pushOut .3s var(--ease-out) both; z-index: 1; }
.screen.enter-pop { animation: popIn .28s var(--ease-out) both; z-index: 1; }
.screen.exit-pop { animation: popOut .28s var(--ease-out) both; z-index: 2; }
.screen.enter-fade { animation: fadeIn .2s ease both; z-index: 2; }
.screen.exit-fade { animation: fadeOut .16s ease both; z-index: 1; }
.screen.enter-up { animation: upIn .34s var(--ease-out) both; z-index: 3; }
@keyframes pushIn { from { transform: translateX(32%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pushOut { to { transform: translateX(-14%); opacity: 0; } }
@keyframes popIn { from { transform: translateX(-14%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes popOut { to { transform: translateX(32%); opacity: 0; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes upIn { from { transform: translateY(6%); opacity: 0; } to { transform: none; opacity: 1; } }

.topbar { flex: none; height: 52px; display: flex; align-items: center; gap: 4px; padding: 0 8px; position: relative; z-index: 3; background: var(--bg); }
.topbar .tb-title { flex: 1; text-align: center; font-weight: 600; font-size: var(--fs-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
.topbar .tb-side { width: 88px; display: flex; align-items: center; }
.topbar .tb-side.right { justify-content: flex-end; }
.icon-btn { width: 44px; height: 44px; border-radius: 22px; display: inline-grid; place-items: center; color: var(--fg); flex: none; position: relative; transition: background .15s; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:active { background: var(--surface-3); }
.icon-btn .i { width: 22px; height: 22px; }
.icon-btn[aria-disabled="true"] { color: var(--fg-3); }
.badge-dot { position: absolute; top: 9px; right: 10px; min-width: 9px; height: 9px; border-radius: 5px; background: var(--primary); box-shadow: 0 0 0 2px var(--bg); }
.text-link { color: var(--primary-text); font-weight: 600; font-size: var(--fs-label); padding: 10px 8px; border-radius: 10px; min-height: 44px; display: inline-flex; align-items: center; gap: 4px; }
.text-link:hover { background: var(--primary-soft); }

.progress { display: flex; gap: 4px; justify-content: center; flex: 1; }
.progress span { width: 22px; height: 4px; border-radius: 2px; background: var(--surface-3); transition: background .3s; }
.progress span.on { background: var(--primary); }

.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding: 0 20px 32px; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
.scroll.pad-top { padding-top: 8px; }
.footer { flex: none; padding: 12px 20px 18px; background: var(--bg); position: relative; z-index: 3; margin-bottom: var(--kb); transition: margin-bottom .2s var(--ease); display: grid; gap: 10px; }
.footer.sep { border-top: 1px solid var(--border); }
.device:not(.mobile) .screen:not(.has-tabbar) .footer { padding-bottom: 30px; }
.footer-note { font-size: var(--fs-caption); color: var(--fg-2); text-align: center; line-height: 1.4; }
.has-tabbar .footer { padding-bottom: 12px; }

/* ---------- Typography ---------- */
.title { font-size: var(--fs-title); font-weight: 600; letter-spacing: -0.022em; line-height: 1.15; margin: 6px 0 20px; text-wrap: balance; }
.title:focus { outline: none; }
.title-sub { margin: -12px 0 20px; color: var(--fg-2); font-size: var(--fs-body); text-wrap: pretty; }
.sh { font-size: var(--fs-h2); font-weight: 600; letter-spacing: -0.015em; margin: 0; line-height: 1.2; }
.sh-row { display: flex; align-items: center; justify-content: space-between; margin: 28px 0 10px; gap: 12px; min-height: 44px; }
.group-label { font-size: var(--fs-label); font-weight: 500; color: var(--fg-2); margin: 24px 0 8px; }
.muted { color: var(--fg-2); }
.small { font-size: var(--fs-label); }
.caption { font-size: var(--fs-caption); color: var(--fg-2); }
.strong { font-weight: 600; }
.center { text-align: center; }
p { margin: 0; }

/* ---------- Icons & flags ---------- */
.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.i.sm { width: 16px; height: 16px; }
.i.lg { width: 24px; height: 24px; }
.flag { position: relative; display: inline-block; border-radius: 50%; overflow: hidden; flex: none; width: 24px; height: 24px; vertical-align: middle; }
.flag svg { width: 100%; height: 100%; }
.flag::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(17, 24, 39, .1); }

/* ---------- Avatars ---------- */
.avatar { position: relative; flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: calc(15px * var(--ts)); letter-spacing: .01em; }
.avatar.lg { width: 72px; height: 72px; font-size: 24px; }
.avatar.xl { width: 84px; height: 84px; font-size: 28px; }
.avatar.sm { width: 32px; height: 32px; font-size: 12px; }
.avatar .flag { position: absolute; right: -3px; bottom: -3px; width: 18px; height: 18px; box-shadow: 0 0 0 2px var(--surface); }
.avatar.lg .flag, .avatar.xl .flag { width: 26px; height: 26px; right: -2px; bottom: -2px; box-shadow: 0 0 0 3px var(--bg); }
.av1 { background: var(--av1-bg); color: var(--av1-fg); }
.av2 { background: var(--av2-bg); color: var(--av2-fg); }
.av3 { background: var(--av3-bg); color: var(--av3-fg); }
.av4 { background: var(--av4-bg); color: var(--av4-fg); }
.av5 { background: var(--av5-bg); color: var(--av5-fg); }
.av6 { background: var(--av6-bg); color: var(--av6-fg); }
.av-me { background: var(--fg); color: var(--bg); }

/* ---------- Buttons ---------- */
.btn {
  height: 54px; width: 100%; border-radius: var(--r-btn);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-size: calc(16px * var(--ts)); font-weight: 600; letter-spacing: -0.005em;
  transition: transform .14s var(--ease), background-color .14s, color .14s, box-shadow .14s, opacity .14s;
  position: relative; user-select: none; -webkit-tap-highlight-color: transparent; padding: 0 18px; white-space: nowrap;
}
.btn:active:not([disabled]):not([aria-disabled="true"]) { transform: scale(.98); }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-press); }
.btn-secondary { background: var(--primary-soft); color: var(--on-primary-soft); }
.btn-secondary:hover { filter: brightness(.97); }
.btn-outline { background: var(--surface); color: var(--fg); box-shadow: inset 0 0 0 1px var(--border-strong); }
.btn-outline:hover { background: var(--surface-2); }
.btn-ghost { background: transparent; color: var(--primary-text); }
.btn-ghost:hover { background: var(--primary-soft); }
.btn-danger { background: var(--error); color: #fff; }
.btn-danger-ghost { background: transparent; color: var(--error); }
.btn-danger-ghost:hover { background: var(--error-soft); }
.btn[disabled], .btn[aria-disabled="true"] { background: var(--surface-3); color: var(--fg-2); cursor: not-allowed; box-shadow: none; }
.btn-ghost[disabled], .btn-ghost[aria-disabled="true"] { background: transparent; color: var(--fg-3); }
.btn.sm { height: 40px; font-size: var(--fs-label); border-radius: 12px; width: auto; padding: 0 14px; }
.btn.md { height: 46px; font-size: var(--fs-body); border-radius: 13px; }
.btn .i { width: 19px; height: 19px; }
.btn.is-loading { color: transparent !important; pointer-events: none; }
.btn.is-loading::after { content: ""; position: absolute; width: 20px; height: 20px; border-radius: 50%; border: 2.2px solid var(--on-primary); border-right-color: transparent; animation: spin .7s linear infinite; }
.btn-secondary.is-loading::after, .btn-outline.is-loading::after { border-color: var(--primary-text); border-right-color: transparent; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 2.4px solid var(--primary-soft); border-top-color: var(--primary); animation: spin .8s linear infinite; flex: none; }
.spinner.lg { width: 36px; height: 36px; border-width: 3px; }

:where(button, a, input, select, textarea, [tabindex]):focus-visible { outline: 2.5px solid var(--primary); outline-offset: 2px; border-radius: 10px; }
.btn:focus-visible { outline-offset: 3px; border-radius: var(--r-btn); }

/* ---------- Cards, rows, lists ---------- */
.card { background: var(--surface); border-radius: var(--r-card); border: 1px solid var(--border); }
.card.pad { padding: 20px; }
.card + .card { margin-top: 12px; }
.list { background: var(--surface); border-radius: var(--r-card); border: 1px solid var(--border); padding: 0 16px; }
.row { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 12px 0; width: 100%; position: relative; }
.list > .row + .row, .list > * + .row, .rows > .row + .row { border-top: 1px solid var(--border); }
button.row, a.row { cursor: pointer; text-decoration: none; color: inherit; }
button.row:focus-visible { outline-offset: -2px; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-title { font-weight: 600; font-size: var(--fs-body); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub { font-size: var(--fs-label); color: var(--fg-2); line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub.wrap, .row-title.wrap { white-space: normal; }
/* Large text: let row text wrap instead of truncating (WCAG 1.4.4) */
.device.ts-large .row-title, .device.ts-large .row-sub { white-space: normal; overflow-wrap: anywhere; }
.row-end { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: none; }
.row-end .i { color: var(--fg-3); }
.row .chev { color: var(--fg-3); }
.tile-icon { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--surface-2); color: var(--fg); flex: none; }
.tile-icon.accent { background: var(--primary-soft); color: var(--on-primary-soft); }
.tile-icon.round { border-radius: 50%; }

.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 13px 0; min-height: 48px; }
.kv + .kv { border-top: 1px solid var(--border); }
.kv .k { color: var(--fg-2); font-size: var(--fs-body); display: inline-flex; align-items: center; gap: 6px; }
.kv .v { font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.kv.total .k { color: var(--fg); font-weight: 600; }
.kv.total .v { font-weight: 700; }
.kv.btnish { width: 100%; cursor: pointer; }
.kv.btnish .v { display: inline-flex; align-items: center; gap: 6px; }
.kv .info { color: var(--fg-3); width: 17px; height: 17px; }

/* ---------- Status pills ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 12px; font-size: var(--fs-caption); font-weight: 600; white-space: nowrap; letter-spacing: .005em; }
.pill .i { width: 13px; height: 13px; stroke-width: 2.4; }
.pill.s-success { background: var(--success-soft); color: var(--success); }
.pill.s-progress { background: var(--primary-soft); color: var(--on-primary-soft); }
.pill.s-warning { background: var(--warning-soft); color: var(--warning-text); }
.pill.s-error { background: var(--error-soft); color: var(--error); }
.pill.s-neutral { background: var(--surface-2); color: var(--fg-2); }
.status-text { font-size: var(--fs-label); display: inline-flex; align-items: center; gap: 4px; }
.status-text.s-success { color: var(--success); }
.status-text.s-progress { color: var(--primary-text); }
.status-text.s-warning { color: var(--warning-text); }
.status-text.s-error { color: var(--error); }
.status-text.s-neutral { color: var(--fg-2); }

/* ---------- Callouts ---------- */
.callout { display: flex; gap: 12px; padding: 14px 16px; border-radius: 16px; background: var(--surface-2); font-size: var(--fs-label); line-height: 1.45; align-items: flex-start; }
.callout .i { margin-top: 1px; }
.callout strong { display: block; font-size: var(--fs-body); margin-bottom: 2px; }
.callout.info { background: var(--primary-soft); color: var(--on-primary-soft); }
.callout.warn { background: var(--warning-soft); color: var(--warning-text); }
.callout.warn strong, .callout.err strong { color: inherit; }
.callout.err { background: var(--error-soft); color: var(--error); }
.callout.ok { background: var(--success-soft); color: var(--success); }
.callout .callout-body { flex: 1; min-width: 0; }
.callout .callout-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.callout .callout-actions .btn { width: auto; }
.callout.warn .btn-outline, .callout.err .btn-outline { background: var(--surface); }
.stack { display: grid; gap: 12px; }
.stack-sm { display: grid; gap: 8px; }
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; } .mt20 { margin-top: 20px; } .mt24 { margin-top: 24px; } .mt32 { margin-top: 32px; }

/* ---------- Fields ---------- */
.field { display: grid; gap: 7px; }
.field + .field { margin-top: 18px; }
.field > label, .field .label { font-size: var(--fs-label); font-weight: 500; color: var(--fg); }
.field .opt { color: var(--fg-2); font-weight: 400; }
.input {
  height: 56px; width: 100%; border-radius: var(--r-input); border: 1px solid var(--border-control);
  background: var(--surface); padding: 0 16px; font-size: calc(16px * var(--ts)); color: var(--fg);
  transition: border-color .15s, box-shadow .15s; outline: none;
}
.input::placeholder { color: var(--fg-2); }
.input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.input.mono { font-variant-numeric: tabular-nums; letter-spacing: .02em; font-feature-settings: "tnum" 1, "zero" 1; font-size: calc(15px * var(--ts)); } /* ER-02: a full 27-character IBAN fits a 390 px screen */
.input[aria-invalid="true"] { border-color: var(--error); }
.input[aria-invalid="true"]:focus { box-shadow: 0 0 0 3px var(--error-soft); }
select.input { appearance: none; background-image: none; padding-right: 44px; }
.select-wrap { position: relative; }
.select-wrap .i { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--fg-2); }
.hint { font-size: var(--fs-label); color: var(--fg-2); line-height: 1.4; }
.err-msg { font-size: var(--fs-label); color: var(--error); display: flex; gap: 6px; align-items: flex-start; line-height: 1.4; }
.err-msg .i { width: 16px; height: 16px; margin-top: 1px; }
.ok-msg { font-size: var(--fs-label); color: var(--success); display: flex; gap: 6px; align-items: center; }
.ok-msg .i { width: 16px; height: 16px; }
.picker-btn { height: 56px; width: 100%; border-radius: var(--r-input); border: 1px solid var(--border-control); background: var(--surface); padding: 0 14px 0 14px; display: flex; align-items: center; gap: 12px; font-size: calc(16px * var(--ts)); }
.picker-btn .grow { flex: 1; text-align: left; }
.picker-btn .i { color: var(--fg-2); }
.picker-btn:hover { border-color: var(--fg-2); }

.search { position: relative; }
.search .i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--fg-2); pointer-events: none; }
.search input { height: 48px; width: 100%; border-radius: 14px; border: 1px solid var(--border-control); background: var(--surface); padding: 0 44px 0 44px; font-size: calc(16px * var(--ts)); outline: none; transition: background .15s, border-color .15s, box-shadow .15s; }
.search input::placeholder { color: var(--fg-2); }
.search input:focus { background: var(--surface); border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.search input::-webkit-search-cancel-button { display: none; }
.search .clear { position: absolute; right: 2px; top: 2px; width: 44px; height: 44px; display: grid; place-items: center; color: var(--fg-2); border-radius: 12px; }
.search .clear .i { position: static; transform: none; }

.seg { display: flex; padding: 3px; border-radius: 13px; background: var(--surface-2); gap: 2px; }
.seg button, .c-seg button, .chip, .key { text-align: center; }
.seg button { flex: 1; min-height: 40px; border-radius: 10px; font-size: var(--fs-label); font-weight: 600; color: var(--fg-2); transition: background .15s, color .15s, box-shadow .15s; padding: 0 8px; }
.seg button[aria-pressed="true"], .seg button[aria-checked="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-1); }

.switch { position: relative; width: 51px; height: 31px; border-radius: 16px; background: var(--surface-3); flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .2); transition: transform .2s var(--ease); }
.switch[aria-checked="true"] { background: var(--primary); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.switch[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 20px 4px; margin: 0 -20px; }
.chips::-webkit-scrollbar { display: none; }
.chip { height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--border-strong); background: var(--surface); font-size: var(--fs-label); font-weight: 500; white-space: nowrap; flex: none; transition: background .15s, color .15s, border-color .15s; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary); color: var(--on-primary-soft); font-weight: 600; }
.chip:hover { border-color: var(--fg-3); }

.checkrow { display: flex; gap: 12px; align-items: flex-start; padding: 6px 0; cursor: pointer; font-size: var(--fs-label); line-height: 1.45; }
.checkbox { width: 22px; height: 22px; border-radius: 7px; border: 1.6px solid var(--border-control); background: var(--surface); flex: none; display: grid; place-items: center; transition: background .15s, border-color .15s; margin-top: 1px; }
.checkbox .i { width: 15px; height: 15px; stroke-width: 2.8; color: var(--on-primary); opacity: 0; }
[aria-checked="true"] > .checkbox { background: var(--primary); border-color: var(--primary); }
[aria-checked="true"] > .checkbox .i { opacity: 1; }

/* ---------- Skeleton ---------- */
.sk { background: linear-gradient(90deg, var(--skeleton) 0%, var(--skeleton-hi) 40%, var(--skeleton) 80%); background-size: 300% 100%; animation: shimmer 1.4s ease-in-out infinite; border-radius: 8px; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.sk-row { display: flex; gap: 14px; align-items: center; padding: 14px 0; }
.sk-circle { width: 44px; height: 44px; border-radius: 50%; flex: none; }
.sk-line { height: 12px; }

/* ---------- Tab bar ---------- */
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--border); padding: 6px 4px 6px; position: relative; z-index: 5; transition: transform .25s var(--ease), opacity .2s; }
.tabbar[hidden] { display: none !important; }
.device:not(.mobile) .tabbar { padding-bottom: 22px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 50px; justify-content: center; color: var(--fg-2); font-size: calc(11.5px * var(--ts)); font-weight: 500; border-radius: 12px; position: relative; }
.tab .i { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--primary-text); font-weight: 600; }
.tab[aria-current="page"] .i { stroke-width: 2.1; }
.tab .tab-dot { position: absolute; top: 5px; left: 50%; margin-left: 7px; width: 8px; height: 8px; border-radius: 4px; background: var(--primary); box-shadow: 0 0 0 2px var(--surface); }

/* ---------- Sheets, dialogs, toasts, banners ---------- */
.layer { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .25s ease; pointer-events: auto; }
.scrim.on { opacity: 1; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 90%;
  background: var(--surface); border-radius: 26px 26px 0 0; box-shadow: var(--shadow-2);
  transform: translateY(105%); transition: transform .34s var(--ease-out);
  display: flex; flex-direction: column; pointer-events: auto; outline: none;
}
.sheet.on { transform: none; }
.sheet.dragging { transition: none; }
.sheet.tall { height: 90%; }
.sheet-handle { width: 40px; height: 5px; border-radius: 3px; background: var(--border-strong); margin: 8px auto 0; flex: none; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 6px 8px 4px 20px; flex: none; touch-action: none; min-height: 52px; }
.sheet-head h2 { flex: 1; margin: 0; font-size: var(--fs-card); font-weight: 600; letter-spacing: -0.01em; }
.sheet-body { overflow-y: auto; padding: 4px 20px 20px; flex: 1; min-height: 0; overscroll-behavior: contain; }
.sheet-foot { padding: 12px 20px 20px; flex: none; display: grid; gap: 10px; border-top: 1px solid var(--border); }
.device:not(.mobile) .sheet-foot, .device:not(.mobile) .sheet-body.last { padding-bottom: 30px; }
.sheet .search { margin-bottom: 8px; }

.dialog-wrap { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; pointer-events: auto; }
.dialog { width: 100%; max-width: 330px; background: var(--surface); border-radius: 22px; padding: 22px 20px 16px; box-shadow: var(--shadow-2); transform: scale(.94); opacity: 0; transition: transform .22s var(--ease-out), opacity .18s; position: relative; }
.dialog.on { transform: none; opacity: 1; }
.dialog h2 { margin: 0 0 6px; font-size: var(--fs-card); font-weight: 600; }
.dialog p { color: var(--fg-2); font-size: var(--fs-body); }
.dialog .dialog-actions { display: grid; gap: 8px; margin-top: 20px; }

.toasts { position: absolute; left: 0; right: 0; bottom: 96px; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 70; pointer-events: none; padding: 0 16px; }
.toast { background: var(--toast-bg); color: var(--toast-fg); padding: 11px 16px; border-radius: 14px; font-size: var(--fs-label); font-weight: 500; display: flex; gap: 8px; align-items: center; box-shadow: var(--shadow-2); animation: toastIn .26s var(--ease-out) both; max-width: 100%; pointer-events: auto; }
.toast .i { width: 17px; height: 17px; }
.toast.out { animation: toastOut .2s ease both; }
@keyframes toastIn { from { transform: translateY(12px); opacity: 0; } }
@keyframes toastOut { to { transform: translateY(8px); opacity: 0; } }

.banners { position: absolute; top: 8px; left: 10px; right: 10px; z-index: 80; display: grid; gap: 8px; pointer-events: none; }
.banner { pointer-events: auto; background: color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow-2); padding: 12px 12px 12px 14px; display: flex; gap: 12px; align-items: center; animation: bannerIn .36s var(--ease-out) both; touch-action: pan-y; }
.banner.out { animation: bannerOut .24s ease both; }
.banner .b-icon { width: 38px; height: 38px; border-radius: 11px; background: var(--fg); color: var(--bg); display: grid; place-items: center; flex: none; }
.banner .b-icon svg { width: 22px; height: 22px; }
.banner .b-main { flex: 1; min-width: 0; }
.banner .b-title { font-weight: 600; font-size: var(--fs-label); display: flex; justify-content: space-between; gap: 8px; }
.banner .b-title span { font-weight: 400; color: var(--fg-2); font-size: var(--fs-caption); }
.banner .b-body { font-size: var(--fs-label); color: var(--fg-2); line-height: 1.35; }
@keyframes bannerIn { from { transform: translateY(-120%); } }
@keyframes bannerOut { to { transform: translateY(-130%); opacity: 0; } }

.offline-bar { flex: none; display: flex; align-items: center; gap: 10px; padding: 9px 20px; background: var(--fg); color: var(--bg); font-size: var(--fs-label); font-weight: 500; }
.offline-bar .i { width: 17px; height: 17px; }

/* ---------- Home ---------- */
.home-head { display: flex; align-items: center; gap: 8px; padding: 4px 12px 0 20px; height: 56px; flex: none; }
.wordmark { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .16em; font-size: 14px; color: var(--fg); }
.wordmark .mark { width: 24px; height: 24px; }
.home-head .spacer { flex: 1; }
.me-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--fg); color: var(--bg); font-weight: 600; font-size: 14px; margin-left: 2px; }
.greeting { font-size: var(--fs-title); font-weight: 600; letter-spacing: -0.022em; margin: 10px 0 18px; line-height: 1.15; }
.greeting:focus { outline: none; }
.balance-card { background: var(--surface); border-radius: 24px; border: 1px solid var(--border); padding: 20px 20px 18px; position: relative; overflow: hidden; }
.balance-card .bc-label { display: flex; align-items: center; justify-content: space-between; color: var(--fg-2); font-size: var(--fs-label); font-weight: 500; margin-bottom: 2px; }
.balance-card .bc-label .icon-btn { width: 40px; height: 40px; margin: -10px -10px -10px 0; color: var(--fg-2); }
.balance-amt { font-size: var(--fs-hero); font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; margin: 2px 0 6px; font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1, "cv11" 1; min-height: 1.1em; }
.balance-amt .minor { color: var(--fg-2); font-weight: 500; }
.balance-sub { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: var(--fs-label); color: var(--fg-2); }
.balance-sub span { display: inline-flex; align-items: center; gap: 6px; }
.balance-sub .flag { width: 16px; height: 16px; }
.balance-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
.balance-actions .btn { height: 50px; }
.recips-scroll { display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 2px 20px 4px; scroll-snap-type: x proximity; scroll-padding-inline: 20px; }
.recips-scroll::-webkit-scrollbar { display: none; }
.recip-pill { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 64px; flex: none; font-size: var(--fs-caption); font-weight: 500; color: var(--fg); scroll-snap-align: start; border-radius: 14px; padding: 2px 0 4px; }
.recip-pill .avatar { width: 56px; height: 56px; font-size: 18px; }
.recip-pill .avatar .flag { width: 20px; height: 20px; }
.recip-pill .nm { max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recip-pill .new { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; border: 1.5px dashed var(--border-strong); color: var(--primary-text); background: var(--surface); }
.active-card { display: flex; gap: 14px; align-items: center; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; width: 100%; margin-top: 12px; }
.active-card .row-main { gap: 4px; }
.mini-steps { display: flex; gap: 3px; margin-top: 4px; }
.mini-steps span { flex: 1; height: 3px; border-radius: 2px; background: var(--surface-3); }
.mini-steps span.on { background: var(--success); }
.mini-steps span.cur { background: var(--primary); }
.mini-steps span.warn { background: var(--warning); }
.rate-strip { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; width: 100%; margin-top: 12px; }
.ptr { position: absolute; top: 0; left: 50%; width: 36px; height: 36px; margin-left: -18px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow-2); display: grid; place-items: center; z-index: 6; transform: translateY(-60px); color: var(--primary-text); pointer-events: none; opacity: 0; transition: opacity .15s; }
.ptr.pulling, .ptr.spinning { opacity: 1; }
.ptr .i { transition: transform .1s; }
.ptr.spinning .i { animation: spin .8s linear infinite; }

/* ---------- Success ---------- */
.success { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px 0 8px; }
.check-anim { width: 88px; height: 88px; margin-bottom: 26px; color: var(--success); }
.check-anim circle { stroke-dasharray: 252; stroke-dashoffset: 252; animation: draw .45s var(--ease-out) forwards; }
.check-anim path { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .35s var(--ease-out) .3s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.rise { animation: rise .45s var(--ease-out) both; }
.rise.d1 { animation-delay: .32s; } .rise.d2 { animation-delay: .42s; } .rise.d3 { animation-delay: .52s; } .rise.d4 { animation-delay: .62s; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
.success h1 { font-size: var(--fs-title); font-weight: 600; letter-spacing: -0.022em; margin: 0 0 10px; line-height: 1.15; text-wrap: balance; }
.success h1:focus { outline: none; }
.success .amt-line { font-size: calc(19px * var(--ts)); font-weight: 600; font-variant-numeric: tabular-nums; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
.success .amt-line .i { color: var(--fg-3); }
.success .lead { color: var(--fg-2); margin-top: 12px; max-width: 30ch; text-wrap: pretty; }
.success-meta { margin-top: 24px; width: 100%; text-align: left; }

/* ---------- Tracking timeline ---------- */
.track-sum { display: flex; align-items: center; gap: 14px; padding: 16px; }
.track-sum .big { font-size: calc(24px * var(--ts)); font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.timeline { padding: 8px 16px; }
.t-step { display: grid; grid-template-columns: 28px 1fr; gap: 14px; position: relative; width: 100%; text-align: left; padding: 10px 0; min-height: 56px; }
.t-step::before { content: ""; position: absolute; left: 13px; top: 38px; bottom: -10px; width: 2px; background: var(--border); }
.t-step:last-child::before { display: none; }
.t-step.done::before { background: var(--success); }
.t-node { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--border-strong); background: var(--surface); position: relative; z-index: 1; }
.t-node .i { width: 15px; height: 15px; stroke-width: 2.6; }
.t-step.done .t-node { background: var(--success); border-color: var(--success); color: #fff; }
.t-step.current .t-node { border-color: var(--primary); background: var(--primary-soft); }
.t-step.current .t-node::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
.t-step.current .t-node::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--primary); opacity: 0; animation: pulse 2s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(.7); opacity: .6; } 100% { transform: scale(1.25); opacity: 0; } }
.t-step.warn .t-node { background: var(--warning-soft); border-color: var(--warning); color: var(--warning-text); }
.t-step.err .t-node { background: var(--error-soft); border-color: var(--error); color: var(--error); }
.t-step.neutral .t-node { background: var(--surface-2); border-color: var(--fg-3); color: var(--fg-2); }
.t-body { min-width: 0; padding-top: 3px; }
.t-title { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.t-step.pending .t-title { color: var(--fg-2); font-weight: 500; }
.t-time { font-size: var(--fs-label); color: var(--fg-2); font-weight: 400; font-variant-numeric: tabular-nums; white-space: nowrap; }
.t-step.current .t-time { color: var(--primary-text); font-weight: 600; }
.t-step.warn .t-time { color: var(--warning-text); font-weight: 600; }
.t-step.err .t-time { color: var(--error); font-weight: 600; }
.t-desc { font-size: var(--fs-label); color: var(--fg-2); margin-top: 4px; line-height: 1.45; display: none; }
.t-step[aria-expanded="true"] .t-desc { display: block; }
.t-step .t-action { margin-top: 10px; }

/* ---------- Details & receipt ---------- */
.detail-hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 6px 0 22px; }
.status-icon { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 14px; position: relative; }
.status-icon .i { width: 28px; height: 28px; stroke-width: 2.2; }

.status-icon.s-progress { background: var(--primary-soft); color: var(--on-primary-soft); }
.status-icon.s-warning { background: var(--warning-soft); color: var(--warning-text); }
.status-icon.s-error { background: var(--error-soft); color: var(--error); }

.detail-hero .big { font-size: var(--fs-hero); font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1.1; margin: 6px 0 8px; }
.copy-btn { display: inline-flex; align-items: center; gap: 6px; color: var(--primary-text); font-weight: 600; font-family: inherit; min-height: 32px; padding: 4px 6px; margin: -4px -6px; border-radius: 8px; }
.copy-btn:hover { background: var(--primary-soft); }

.action-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
.action-tile { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px 12px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border); font-size: var(--fs-caption); font-weight: 600; text-align: center; line-height: 1.25; }
.action-tile:hover { background: var(--surface-2); }
.action-tile .tile-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--primary-soft); color: var(--on-primary-soft); }

.paper { background: var(--paper); border-radius: 18px; border: 1px solid var(--border); padding: 24px 22px; position: relative; font-size: var(--fs-label); }
.paper::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 10px; background: radial-gradient(circle at 6px 10px, var(--bg) 5px, transparent 5.5px) 0 0 / 12px 10px repeat-x; }
.paper .p-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.paper .p-title { font-size: var(--fs-card); font-weight: 600; margin: 0 0 4px; }
.paper .p-sec { border-top: 1px dashed var(--border-strong); margin-top: 16px; padding-top: 14px; }
.paper .p-sec h2 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-2); }
.paper .p-kv { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
.paper .p-kv span:first-child { color: var(--fg-2); }
.paper .p-kv span:last-child { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; min-width: 0; }
.paper .p-total { font-size: var(--fs-body); font-weight: 700; }
.paper .p-foot { margin-top: 18px; font-size: 11px; color: var(--fg-2); line-height: 1.5; }

/* ---------- Empty states ---------- */
/* ---------- Accordion ---------- */
.acc { border-top: 1px solid var(--border); }
.acc:first-child { border-top: 0; }
.acc button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 0; font-weight: 600; text-align: left; min-height: 52px; }
.acc button .i { color: var(--fg-2); transition: transform .2s; }
.acc button[aria-expanded="true"] .i { transform: rotate(180deg); }
.acc .acc-body { padding: 0 0 16px; color: var(--fg-2); font-size: var(--fs-label); line-height: 1.5; }

/* ---------- Console (desktop demo panel) ---------- */
.console {
  width: 340px; flex: none; align-self: center; max-height: calc(100vh - 48px); overflow-y: auto;
  color: var(--page-ink); font-size: 13.5px; line-height: 1.5; padding: 4px 6px 4px 2px; scrollbar-width: thin;
}
.console .c-brand { display: flex; align-items: center; gap: 10px; }
.console .c-brand .wordmark { color: var(--page-ink); font-size: 15px; }
.console .c-kicker { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-2); margin-left: auto; border: 1px solid var(--border-strong); padding: 3px 8px; border-radius: 999px; }
.console h1 { font-size: 26px; line-height: 1.15; letter-spacing: -0.025em; font-weight: 600; margin: 18px 0 8px; text-wrap: balance; }
.console .c-lead { color: var(--fg-2); margin: 0 0 18px; text-wrap: pretty; }
.c-sec { border-top: 1px solid var(--border-strong); padding: 14px 0 12px; }
.c-sec h2 { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-2); margin: 0 0 8px; }
.c-toggle { display: flex; align-items: center; gap: 12px; width: 100%; padding: 6px 0; min-height: 40px; text-align: left; }
.c-toggle span.lbl { flex: 1; }
.c-toggle .switch { width: 40px; height: 24px; background: var(--border-strong); }
.c-toggle .switch[aria-checked="true"] { background: var(--primary); }
.c-toggle .switch::after { width: 20px; height: 20px; }
.c-toggle .switch[aria-checked="true"]::after { transform: translateX(16px); }
.c-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.c-btn { height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--fg); font-size: 12.5px; font-weight: 500; }
.c-btn:hover { border-color: var(--primary); color: var(--primary-text); }
.c-btn[disabled] { opacity: .45; cursor: not-allowed; }
.c-note { font-size: 12px; color: var(--fg-2); margin-top: 6px; }
.c-tasks { margin: 0; padding-left: 20px; display: grid; gap: 4px; color: var(--page-ink); }
.c-tasks li::marker { color: var(--fg-2); font-variant-numeric: tabular-nums; }
.c-contrast { width: 100%; border-collapse: collapse; font-size: 12px; }
.c-contrast td { padding: 4px 0; border-bottom: 1px solid var(--border); }
.c-contrast td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.c-contrast .sw { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -2px; margin-right: 8px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.c-contrast .pass { color: var(--success); }
.c-contrast .fail { color: var(--error); }
.c-seg { display: flex; gap: 4px; }
.c-seg button { flex: 1; height: 32px; border-radius: 9px; border: 1px solid var(--border-strong); background: var(--surface); font-size: 12.5px; font-weight: 500; color: var(--fg-2); }
.c-seg button[aria-pressed="true"] { border-color: var(--primary); color: var(--on-primary-soft); background: var(--primary-soft); font-weight: 600; }

/* ---------- Motion preferences ---------- */
.device.rm *, .device.rm *::before, .device.rm *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; scroll-behavior: auto !important; }
}
.device.rm .sk, .device.rm .spinner, .device.rm .btn.is-loading::after { animation-duration: 1.4s !important; animation-iteration-count: infinite !important; }
@media (prefers-reduced-motion: reduce) { .spinner, .btn.is-loading::after { animation-duration: 1.2s !important; animation-iteration-count: infinite !important; } .sk { animation: none !important; } }

@media (forced-colors: active) {
  .btn, .chip, .method, .xcard, .card, .list { border: 1px solid CanvasText; }
  .t-node { forced-color-adjust: none; }
}
.console-inline { font-size: var(--fs-label); line-height: 1.5; }
.console-inline .c-sec:first-child { border-top: 0; padding-top: 0; }
.prefix-wrap { position: relative; }
.prefix-wrap .pfx { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--fg-2); font-size: calc(16px * var(--ts)); pointer-events: none; font-variant-numeric: tabular-nums; }
.prefix-wrap .input { padding-left: 34px; }
.prefix-wrap .pfx + .input[id="f-mobile"] { padding-left: 64px; }
@property --p { syntax: '<number>'; inherits: false; initial-value: 1; }

.success-meta .row-sub { white-space: normal; }
.rate-strip .row-sub { white-space: normal; }
.tx-row .row-title { white-space: normal; overflow-wrap: anywhere; }
.tx-row .row-sub { white-space: normal; flex-wrap: wrap; }
.balance-actions .btn { padding: 0 10px; min-width: 0; }

/* ---------- Usability test mode ---------- */
body.tm-on .console { display: none; }
.device.tm-on #ra-sample { display: none !important; }
.tm-bar { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 16px; background: var(--toast-bg); color: var(--toast-fg); font-size: var(--fs-label); position: relative; z-index: 6; }
.tm-bar[hidden] { display: none; }
.tm-bar-t { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tm-bar-b { min-height: 36px; padding: 0 12px; border-radius: 10px; font-weight: 600; color: var(--toast-fg); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--toast-fg) 40%, transparent); }
.tm-bar-b.tm-done { background: var(--primary); color: var(--on-primary); box-shadow: none; }
.tm-card-wrap { position: absolute; inset: 0; z-index: 90; display: grid; place-items: center; padding: 20px; background: var(--scrim); }
.tm-card { width: 100%; max-width: 360px; max-height: 100%; overflow: auto; background: var(--surface); color: var(--fg); border-radius: 22px; padding: 24px 22px 20px; box-shadow: var(--shadow-2); display: grid; gap: 12px; outline: none; }
.tm-over { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--primary-text); }
.tm-title { margin: 0; font-size: 22px; line-height: 1.2; letter-spacing: -0.01em; }
.tm-say { margin: 0; font-size: calc(16px * var(--ts)); line-height: 1.45; }
.tm-ref { margin: 0; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); font-size: var(--fs-label); line-height: 1.45; font-variant-numeric: tabular-nums; }
.tm-note { margin: 0; font-size: var(--fs-label); color: var(--fg-2); line-height: 1.45; }
.tm-fac { border-top: 1px solid var(--border); padding-top: 10px; }
.tm-fac summary { cursor: pointer; font-weight: 600; font-size: var(--fs-label); min-height: 44px; display: flex; align-items: center; }
.tm-dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 6px 0 10px; font-size: var(--fs-label); }
.tm-dl dt { color: var(--fg-2); }
.tm-dl dd { margin: 0; overflow-wrap: anywhere; }
.tm-code { display: block; font-size: 11px; line-height: 1.4; padding: 10px; border-radius: 10px; background: var(--surface-2); overflow-wrap: anywhere; user-select: all; }
.tm-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }


/* ==========================================================
   Global Plus — identity verification layer on top of GLOBAL's system.
   Camera surfaces are dark in both themes on purpose (like a real camera),
   so they carry their own scoped tokens.
   ========================================================== */
.device { --cam-bg: #07080B; --cam-fg: #F5F6FA; --cam-fg-2: #B9BFCC; --cam-line: rgba(255,255,255,.16); --cam-ok: #3CCB94; --cam-warn: #FFB861; --cam-accent: #8C86FF; }

/* ---------- Intro ---------- */
.gp-hero { position: relative; height: 168px; margin: 4px 0 18px; border-radius: 24px; background: linear-gradient(160deg, var(--primary-soft), var(--surface-2) 70%); overflow: hidden; }
.gp-hero svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.gp-kicker { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-caption); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--primary-text); margin-bottom: 6px; }
.gp-kicker .flag { width: 16px; height: 16px; }
.need { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.need li { display: flex; gap: 14px; align-items: flex-start; padding: 12px 0; }
.need li + li { border-top: 1px solid var(--border); }
.need .tile-icon { width: 40px; height: 40px; border-radius: 12px; }
.need .n-main { flex: 1; min-width: 0; padding-top: 1px; }
.need .n-title { font-weight: 600; line-height: 1.3; }
.need .n-sub { font-size: var(--fs-label); color: var(--fg-2); line-height: 1.4; margin-top: 2px; }
.res-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); text-align: left; min-height: 60px; }
.res-row .flag { width: 28px; height: 28px; }
.res-row .row-main { gap: 0; }
.res-row .chg { color: var(--primary-text); font-weight: 600; font-size: var(--fs-label); }
.priv { display: flex; gap: 10px; align-items: flex-start; font-size: var(--fs-label); color: var(--fg-2); line-height: 1.45; margin-top: 16px; }
.priv .i { width: 18px; height: 18px; color: var(--fg-3); margin-top: 1px; }

/* ---------- Route choice ---------- */
.route { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: start; width: 100%; text-align: left; padding: 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); transition: border-color .15s, box-shadow .15s, background .15s; }
.route + .route { margin-top: 10px; }
.route:hover { border-color: var(--border-strong); }
.route[aria-checked="true"] { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.route .tile-icon { width: 44px; height: 44px; }
.route .r-title { font-weight: 600; line-height: 1.3; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.route .r-desc { font-size: var(--fs-label); color: var(--fg-2); line-height: 1.45; margin-top: 4px; }
.route .r-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; font-size: var(--fs-caption); color: var(--fg-2); }
.route .r-meta span { display: inline-flex; align-items: center; gap: 5px; }
.route .r-meta .i { width: 14px; height: 14px; }
.radio { width: 22px; height: 22px; border-radius: 50%; border: 1.6px solid var(--border-control); display: grid; place-items: center; margin-top: 2px; }
.radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); transform: scale(0); transition: transform .15s var(--ease); }
[aria-checked="true"] > .radio { border-color: var(--primary); }
[aria-checked="true"] > .radio::after { transform: scale(1); }
.pill.rec { background: var(--success-soft); color: var(--success); }
.or-line { display: flex; align-items: center; gap: 12px; color: var(--fg-2); font-size: var(--fs-caption); margin: 22px 0 10px; }
.or-line::before, .or-line::after { content: ""; flex: 1; height: 1px; background: var(--border); }

/* ---------- Document list ---------- */
.doc-thumb { width: 52px; height: 36px; flex: none; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1px var(--border); background: var(--surface-2); }
.doc-thumb svg { width: 100%; height: 100%; }
.doc-thumb.book { width: 40px; height: 52px; border-radius: 5px; }

/* ---------- Number entry ---------- */
.num-input { height: 64px; font-size: calc(22px * var(--ts)); font-weight: 600; letter-spacing: .08em; font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1, "zero" 1; padding: 0 52px 0 18px; }
.num-wrap { position: relative; }
.num-wrap .state { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; display: grid; place-items: center; }
.num-wrap .state .i { width: 22px; height: 22px; }
.num-wrap .state.ok { color: var(--success); }
.num-wrap .state.bad { color: var(--error); }
.num-wrap .reveal { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); }
.num-meter { display: flex; gap: 4px; margin-top: 10px; }
.num-meter span { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-3); transition: background .2s; }
.num-meter span.on { background: var(--primary); }
.num-meter.done span { background: var(--success); }
.sample-link { font-size: var(--fs-caption); color: var(--fg-2); display: inline-flex; gap: 6px; align-items: center; border: 1px dashed var(--border-strong); border-radius: 10px; padding: 6px 10px; min-height: 36px; }
.sample-link:hover { color: var(--primary-text); border-color: var(--primary); }
.why { margin-top: 18px; }

/* ---------- Consent ---------- */
.c-facts { display: grid; gap: 0; }
.c-fact { display: grid; grid-template-columns: 40px 1fr; gap: 14px; padding: 14px 0; }
.c-fact + .c-fact { border-top: 1px solid var(--border); }
.c-fact .tile-icon { width: 40px; height: 40px; border-radius: 12px; }
.c-fact .f-k { font-weight: 600; line-height: 1.3; }
.c-fact .f-v { font-size: var(--fs-label); color: var(--fg-2); line-height: 1.45; margin-top: 2px; }
.law-tag { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-caption); font-weight: 600; color: var(--fg-2); background: var(--surface-2); border-radius: 8px; padding: 4px 8px; margin-bottom: 12px; }
.law-tag .i { width: 13px; height: 13px; }
.sign-box { margin-top: 6px; }
.sign-box .input { font-family: "Inter", sans-serif; font-style: italic; font-size: calc(19px * var(--ts)); }

/* ---------- Camera (shared) ---------- */
.screen.cam { background: var(--cam-bg); color: var(--cam-fg); }
.cam .topbar { background: transparent; }
.cam .icon-btn { color: var(--cam-fg); }
.cam .icon-btn:hover { background: rgba(255,255,255,.08); }
.cam .tb-title { color: var(--cam-fg); }
.cam-body { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; padding: 0 20px; position: relative; }
.cam-step { font-size: var(--fs-caption); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--cam-fg-2); margin-top: 2px; }
.cam-title { font-size: calc(22px * var(--ts)); font-weight: 600; letter-spacing: -0.015em; text-align: center; margin: 6px 0 4px; line-height: 1.2; text-wrap: balance; }
.cam-title:focus { outline: none; }
.cam-sub { color: var(--cam-fg-2); font-size: var(--fs-label); text-align: center; max-width: 30ch; line-height: 1.45; text-wrap: pretty; }
.cam-stage { position: relative; width: 100%; flex: 1; min-height: 220px; display: grid; place-items: center; margin: 14px 0 8px; }
.cam-feed { position: absolute; inset: 0; border-radius: 26px; overflow: hidden; background: radial-gradient(120% 90% at 50% 40%, #3A3530 0%, #1E1C1A 55%, #0D0C0B 100%); animation: camReveal 1.4s var(--ease-out) both; }
.cam-feed::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 2px, transparent 2px 5px); pointer-events: none; }
.cam-feed .table { position: absolute; left: -10%; right: -10%; bottom: -8%; height: 62%; background: linear-gradient(180deg, #5B4A3A, #3B2F25); transform: perspective(500px) rotateX(38deg); transform-origin: bottom; border-radius: 30px 30px 0 0; }
@keyframes camReveal { 0% { filter: blur(14px) brightness(.15); } 100% { filter: none; } }
.vf { position: relative; width: 86%; aspect-ratio: 1.586; z-index: 2; }
.vf.book { width: 74%; aspect-ratio: 1.42; }
.vf .corner { position: absolute; width: 30px; height: 30px; border: 3.5px solid var(--cam-fg); transition: border-color .25s, transform .3s var(--ease); }
.vf .corner.tl { left: -6px; top: -6px; border-right: 0; border-bottom: 0; border-radius: 12px 0 0 0; }
.vf .corner.tr { right: -6px; top: -6px; border-left: 0; border-bottom: 0; border-radius: 0 12px 0 0; }
.vf .corner.bl { left: -6px; bottom: -6px; border-right: 0; border-top: 0; border-radius: 0 0 0 12px; }
.vf .corner.br { right: -6px; bottom: -6px; border-left: 0; border-top: 0; border-radius: 0 0 12px 0; }
.vf.ready .corner { border-color: var(--cam-ok); }
.vf.warn .corner { border-color: var(--cam-warn); }
.vf.far .corner.tl { transform: translate(14px, 12px); } .vf.far .corner.tr { transform: translate(-14px, 12px); }
.vf.far .corner.bl { transform: translate(14px, -12px); } .vf.far .corner.br { transform: translate(-14px, -12px); }
.vf .doc { position: absolute; inset: 0; border-radius: 12px; overflow: hidden; transition: transform .7s var(--ease-out), opacity .4s, filter .5s; box-shadow: 0 14px 30px rgba(0,0,0,.45); }
.vf .doc svg { width: 100%; height: 100%; display: block; }
.vf.far .doc { transform: scale(.72) rotate(-7deg) translate(-6%, 8%); }
.vf.tilt .doc { transform: scale(.93) rotate(3deg); }
.vf.blur .doc { filter: blur(2.4px); }
.vf .glare { position: absolute; inset: 0; border-radius: 12px; background: radial-gradient(40% 55% at 70% 30%, rgba(255,255,255,.85), rgba(255,255,255,0) 70%); opacity: 0; transition: opacity .4s; pointer-events: none; }
.vf.glaring .glare { opacity: 1; }
.vf .scanline { position: absolute; left: 4%; right: 4%; height: 2px; top: 8%; background: linear-gradient(90deg, transparent, var(--cam-ok), transparent); box-shadow: 0 0 12px var(--cam-ok); opacity: 0; }
.vf.ready .scanline { opacity: 1; animation: scan 1.1s ease-in-out infinite alternate; }
@keyframes scan { to { top: 92%; } }

  r = (s * 10) % 11; if (r === 10) r = 0; return r === n[10];

  requestAnimationFrame(() => requestAnimationFrame(() => { sheet.classList.add('on'); scrim.classList.add('on'); }));
  scrim.addEventListener('click', () => { if (dismissible) ctl.close('scrim'); });
  wrap.addEventListener('click', (e) => { if (e.target.closest('[data-sheet-close]')) ctl.close('button'); });
  try { onMount && onMount(ctl); } catch (e) { console.error(e); }
  if (S.settings.pl) requestAnimationFrame(plApply);
  setTimeout(() => { const f = $('[data-autofocus]', sheet); try { (f || sheet).focus({ preventScroll: true }); } catch (e) { /* ignore */ } }, 60);
  return ctl;
}

/* ---------- Pseudo-localisation ----------
   Swaps letters for accented look-alikes and pads every string by ~35%,
   so layouts are tested against longer languages before translation. */
const PL_MAP = { a: 'á', b: 'ƀ', c: 'ç', d: 'ð', e: 'é', f: 'ƒ', g: 'ĝ', h: 'ĥ', i: 'î', j: 'ĵ', k: 'ķ', l: 'ļ', m: 'ɱ', n: 'ñ', o: 'ö', p: 'þ', q: 'ǫ', r: 'ŕ', s: 'š', t: 'ţ', u: 'û', v: 'ṽ', w: 'ŵ', x: 'ẋ', y: 'ý', z: 'ž', A: 'Å', B: 'Ɓ', C: 'Ç', D: 'Ð', E: 'É', F: 'Ƒ', G: 'Ĝ', H: 'Ĥ', I: 'Î', J: 'Ĵ', K: 'Ķ', L: 'Ļ', M: 'Ṁ', N: 'Ñ', O: 'Ö', P: 'Þ', Q: 'Ǫ', R: 'Ŕ', S: 'Š', T: 'Ţ', U: 'Û', V: 'Ṽ', W: 'Ŵ', X: 'Ẋ', Y: 'Ý', Z: 'Ž' };
const _plDone = new WeakSet();
function plText(s) {
  if (!/[A-Za-z]{2,}/.test(s)) return s;
  const core = s.trim();
  const lead = s.match(/^\s*/)[0], trail = s.match(/\s*$/)[0];
  const t = core.replace(/[A-Za-z]/g, (c) => PL_MAP[c] || c);
  const pad = Math.max(2, Math.round(core.length * 0.35));
  return lead + '[' + t + ' ' + '~'.repeat(pad - 2) + ']' + trail;
}
function plApply() {
  if (!S.settings.pl) return;
  [els.screens, els.sheetLayer, els.toasts].forEach((root) => {
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(n) {
        if (_plDone.has(n)) return NodeFilter.FILTER_REJECT;
        const p = n.parentElement; if (!p) return NodeFilter.FILTER_REJECT;
        if (p.closest('svg, [data-nopl], .demo-fab, script, style')) return NodeFilter.FILTER_REJECT;
        return /[A-Za-z]{2,}/.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      },
    });
    const list = []; let n; while ((n = w.nextNode())) list.push(n);
    list.forEach((t) => { t.nodeValue = plText(t.nodeValue); _plDone.add(t); });
  });
}

    <div class="cam-body">
      <p class="cam-step">${two ? `Photo ${side === 'back' ? 2 : 1} of 2` : 'Photo 1 of 1'}</p>

        <div class="vf ${D.kind === 'book' ? 'book' : ''} far" id="vf">
          <div class="doc">${docSvg(S.docId, side, { expired: false })}</div>
          <div class="glare"></div><div class="scanline"></div>
          <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
        </div>
        <div class="coach" id="coach" aria-hidden="true"><span class="dot"></span><span class="t">Looking for your card…</span></div>

      <button class="cam-link" data-act="help" data-topic="capture">${ic('help')}Having trouble?</button>
    </div>`;
  },
  mount(el, p) {
    if (S.sim.camBlocked) return null;
    const D = DOCS[S.docId], side = p.side || 'front';
    const kind = side === 'back' ? (D.back === 'barcode' ? 'barcode' : 'back') : (D.kind === 'book' ? 'book' : 'card');
    const vf = $('#vf', el), coach = $('#coach', el);
    const timers = [];
    let done = false;
    const setBeat = ([, cls, msg, tone]) => {
      vf.className = 'vf' + (D.kind === 'book' ? ' book ' : ' ') + cls;
      coach.className = 'coach' + (tone ? ' ' + tone : '');
      $('.t', coach).textContent = msg;
      announce(msg);
      if (tone === 'warn') cue('warning');
      if (S.settings.pl) requestAnimationFrame(plApply);
    };
    const shoot = () => {
      if (done) return; done = true;
      timers.forEach(clearTimeout);
      vf.className = 'vf' + (D.kind === 'book' ? ' book ' : ' ') + 'ready';
      $('#flash', el).classList.add('on'); cue('success');
      announce(side === 'back' ? 'Back captured' : 'Photo captured');
      S.shots[side] = true;
      timers.push(setTimeout(() => {
        if (side === 'front' && D.sides.length > 1) go('capture', { side: 'back' }, { replace: true, anim: 'fade' });
        else go('shotreview', {}, { replace: true, anim: 'fade' });
      }, 650));
    };
    const beats = BEATS[kind];
    const speed = reducedMotion() ? 0.7 : 1;
    beats.forEach((b) => timers.push(setTimeout(() => (b[1] === 'shot' ? shoot() : setBeat(b)), b[0] * speed)));
    el._shoot = shoot;
    return () => { done = true; timers.forEach(clearTimeout); };
  },
};

SCREENS.pin = {
  label: 'Enter your card PIN',
  render(p) {
    return `${topbar({})}
    <div class="scroll" style="display:flex;flex-direction:column">

      <div class="pin-dots" id="pin-dots" role="img" aria-label="0 of 6 digits entered">${'<span></span>'.repeat(6)}</div>
      <p class="err-msg" id="pin-err" style="justify-content:center" ${p.err ? '' : 'hidden'}>${ic('alertCircle')}<span>${p.err ? `That PIN didn’t work. You have ${S.pinTries} more ${S.pinTries === 1 ? 'try' : 'tries'}.` : ''}</span></p>
      <div style="flex:1"></div>
      <div class="keypad" aria-label="PIN keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button class="key" data-act="pin-key" data-k="${n}">${n}</button>`).join('')}<span></span><button class="key" data-act="pin-key" data-k="0">0</button><button class="key" data-act="pin-key" data-k="del" aria-label="Delete">${ic('backspace')}</button></div>
    </div>`;
  },
  mount(el) {
    el._pin = '';
    const onKey = (e) => { if (/^\d$/.test(e.key)) pinKey(e.key); else if (e.key === 'Backspace') pinKey('del'); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);

function pinKey(k) {
  const el = nav.current.el; if (!el || currentRoute() !== 'pin') return;
  if (k === 'del') el._pin = el._pin.slice(0, -1); else if (el._pin.length < 6) el._pin += k;
  const dots = $('#pin-dots', el);
  $$('span', dots).forEach((s, i) => s.classList.toggle('on', i < el._pin.length));
  dots.setAttribute('aria-label', `${el._pin.length} of 6 digits entered`);
  cue('light');
  if (el._pin.length === 6) setTimeout(() => nextStep('pin'), 220);
}
ACTIONS['pin-key'] = (b) => pinKey(b.dataset.k);

SCREENS.chip = {
  label: 'Read the chip',
  render() {
    const de = S.market === 'DE';
    const card = de ? eidCardSvg() : `<svg viewBox="0 0 320 202" xmlns="http://www.w3.org/2000/svg"><rect width="320" height="202" rx="14" fill="${PAL[DOCS[S.docId].pal].band}"/><circle cx="160" cy="92" r="40" fill="none" stroke="#E7C873" stroke-width="4"/><path d="M120 92h80M160 52c-14 12-20 26-20 40s6 28 20 40" stroke="#E7C873" stroke-width="3" fill="none"/><rect x="128" y="150" width="64" height="16" rx="3" fill="none" stroke="#E7C873" stroke-width="3"/><circle cx="150" cy="158" r="3" fill="#E7C873"/><path d="M158 158h26" stroke="#E7C873" stroke-width="3"/></svg>`;
    return `${topbar({})}
    <div class="scroll">
      <h1 class="title">${de ? 'Hold your ID card to your phone' : 'Read your passport’s chip'}</h1>
      <p class="title-sub">${de ? 'Put the card flat on a table and rest the top of your phone on it. Keep still until it finishes.' : 'Your passport has a chip. Reading it is quicker and stronger than a photo alone. Rest the top of your phone on the back cover.'}</p>
      <div class="nfc-stage" id="nfc"><div class="card">${card}</div><div class="phone"></div><div class="waves"><span></span><span></span><span></span></div></div>
      <div class="read-bar" id="rb" role="progressbar" aria-label="Reading chip" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
      <div class="read-label"><span id="rl">${de ? 'Waiting for your card…' : 'Ready when you are'}</span><span id="rp">0%</span></div>
      <div id="chip-msg" class="mt16"></div>
    </div>
    <div class="footer" id="chip-foot">
      ${de ? '' : '<button class="btn btn-primary" data-act="chip-start">Read chip</button><button class="btn btn-ghost md" data-act="chip-skip">Skip and use the photo only</button>'}
    </div>`;
  },
  mount(el) {
    const timers = [];
    el._read = () => {
      const de = S.market === 'DE';
      $('#chip-foot', el).innerHTML = '';
      $('#nfc', el).classList.add('reading');
      $('#rl', el).textContent = 'Reading chip… keep still';
      announce('Reading chip. Keep still.');
      let pc = 0;
      const failAt = de && S.sim.wrongPin ? 38 : 999;
      const tick = () => {
        pc = Math.min(100, pc + 7 + Math.round(Math.random() * 6));
        if (pc >= failAt) {
          S.pinTries -= 1; cue('error');
          $('#nfc', el).classList.remove('reading');
          go('pin', { err: true }, { replace: true, anim: 'fade' });
          S.sim.wrongPin = false; emit('sim');
          return;
        }
        $('#rb span', el).style.width = pc + '%'; $('#rb', el).setAttribute('aria-valuenow', pc); $('#rp', el).textContent = pc + '%';
        if (pc < 100) timers.push(setTimeout(tick, reducedMotion() ? 150 : 260));
        else {
          $('#rb', el).classList.add('done'); $('#nfc', el).classList.add('done');
          $('#rl', el).textContent = 'Chip read'; cue('success');
          $('#chip-msg', el).innerHTML = `<div class="callout ok" role="status">${ic('shieldCheck')}<div class="callout-body"><strong>${de ? 'Card and PIN confirmed' : 'Chip read'}</strong>${de ? 'The chip’s signature is valid and matches your card.' : 'Your passport’s chip signature is valid.'}</div></div>`;
          S.chipDone = true;
          timers.push(setTimeout(() => nextStep('chip'), 1100));
        }
      };
      timers.push(setTimeout(tick, 500));
    };
    if (S.market === 'DE') timers.push(setTimeout(el._read, 900));
    return () => timers.forEach(clearTimeout);
  },
};
ACTIONS['chip-start'] = () => nav.current.el._read();
ACTIONS['chip-skip'] = () => nextStep('chip');

SCREENS.selfiecam = {

  label: 'Selfie',
  render() {
    if (S.sim.camBlocked) return `${camTop('', 'selfie')}<div class="cam-body">${camBlocked()}</div>`;
    const C = 2 * Math.PI * 120;
    return `${camTop('', 'selfie')}

  render() {

    return `${topbar({ back: false, step: null })}

      </div>
    </div>`;

  mount(el) {
    const items = $$('.chk-list li', el);
    const timers = [];
    const sp = reducedMotion() ? 0.6 : 1;
    let o = S.sim.outcome;
    if (!(OUTCOMES[S.routeId] || []).includes(o)) o = 'approve';
    if (S.nameOnId && o === 'name') o = 'approve';
    const stopAt = { glare: 0, expired: 1, name: 2, mismatch: 1 }[o];
    items.forEach((li, i) => {
      timers.push(setTimeout(() => {
        if (stopAt != null && i > stopAt) return;

        const n = items[i + 1]; if (n && !(stopAt != null && i + 1 > stopAt)) { n.className = ''; $('.st', n).innerHTML = '<span class="spinner" aria-hidden="true"></span>'; }
      }, (900 + i * 1000) * sp));
    });
    const end = (stopAt != null ? stopAt + 1 : items.length) * 1000 + 700;
    timers.push(setTimeout(() => {
      if (['glare', 'expired', 'name', 'mismatch'].includes(o)) { S.sim.outcome = 'approve'; emit('sim'); go('retry', { cause: o }, { replace: true, anim: 'fade' }); }

  },
};

  render('pop');
}

function jump(j) {
  closeAllSheets(true);
  const m = mkt();
  if (!S.flow) { S.routeId = m.routes[0]; S.flow = { route: S.routeId, steps: m.steps[S.routeId].slice(), startedAt: Date.now() }; }
  const r = S.routeId;
  if (j === 'start') { restartFlow(); return; }
  if (j === 'home') { resetTo(['home'], 'fade'); return; }
  if (!S.docId && m.docs.length) S.docId = m.docs[0];
  const N = NUMBERS[m.number === 'bvn' ? (S.numKind || 'bvn') : m.number];
  if (N && !S.number) S.number = N.sample;
  if (['approved', 'review', 'declined'].includes(j)) { S.verify = { status: 'none' }; resetTo(['start', j], 'fade'); return; }
  if (j === 'retry') { const c = (OUTCOMES[r] || []).find((o) => ['glare', 'expired', 'name', 'mismatch'].includes(o)); if (!c) return; resetTo(['start', 'doctype', { route: 'retry', params: { cause: c } }], 'fade'); return; }
  const steps = m.steps[r];
  const i = steps.indexOf(j);
  const stack = ['start', ...steps.slice(0, Math.max(0, i)).filter(stepApplies), j];
  resetTo(stack, 'fade');
}

  if (t.at) { S.verify = { status: 'none' }; S.routeId = 'photo'; resetTo(['start', t.at], 'none'); }
  els.tm.hidden = false;
  els.tm.innerHTML = `<span class="tm-bar-t"><span class="tm-n">Task ${i + 1} of ${TASKS.length}</span>${esc(t.text)}</span><button class="tm-bar-b" data-c="tm-skip">Skip</button><button class="tm-bar-b tm-done" data-c="tm-done">Done</button>`;
  announce(`Task ${i + 1}. ${t.text}`);
}
function endTask(result) {
  S.test.log[S.test.i] = { result, ms: Date.now() - S.test.started };
  if (S.test.i + 1 < TASKS.length) startTask(S.test.i + 1);
  else {
    els.tm.hidden = true;
    openSheet({ title: 'Session summary', body: `<p class="small muted">Copy these into the note sheet. Times run from when each task appeared.</p><div class="card pad mt12">${TASKS.map((t, i) => { const l = S.test.log[i] || {}; return `<div class="kv"><span class="k">Task ${i + 1}</span><span class="v">${l.ms != null ? esc(elapsedText(l.ms)) : '–'} · ${esc(l.result || 'not run')}</span></div>`; }).join('')}</div>`, foot: '<button class="btn btn-primary" data-c="tm-exit">Exit test mode</button>' });
  }
}
function setTestMode(on) {
  S.test.on = on; S.test.log = [];
  document.body.classList.toggle('tm-on', on);
  els.device.classList.toggle('tm-on', on);
  if (on) startTask(0); else { els.tm.hidden = true; renderConsole(); setMarket('GB', true); }
}

function bindConsole() {
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-c]'); if (!b) return;
    const c = b.dataset.c;
    if (c === 'mkt') { closeAllSheets(true); setMarket(b.dataset.m); }
    else if (c === 'usstate') { S.usState = b.dataset.s; emit('sim'); toast(b.dataset.s === 'IL' ? 'Illinois: written consent before the face scan' : 'New York: standard consent', 'mapPin'); if (currentRoute() === 'consent') rerender(); }
    else if (c === 'route') { closeAllSheets(true); S.flow = null; nav.stack = [{ route: 'start', params: {} }]; startRoute(b.dataset.r); }
    else if (c === 'outcome') { S.sim.outcome = b.dataset.o; emit('sim'); toast('Next check: ' + OUT_LABEL[b.dataset.o], 'sliders'); }
    else if (c === 'jump') jump(b.dataset.j);
    else if (c === 'nfc') { S.sim.nfc = !S.sim.nfc; emit('sim'); }
    else if (c === 'cam') { S.sim.camBlocked = !S.sim.camBlocked; emit('sim'); if (['capture', 'selfiecam'].includes(currentRoute())) rerender(); }
    else if (c === 'pin') { S.sim.wrongPin = !S.sim.wrongPin; emit('sim'); }
    else if (c === 'appear') { S.settings.appearance = b.dataset.a; applySettings(); emit('settings'); }
    else if (c === 'ts') { S.settings.textScale = +b.dataset.v; applySettings(); emit('settings'); }
    else if (c === 'pl') { S.settings.pl = !S.settings.pl; applySettings(); emit('settings'); if (S.settings.pl) plApply(); else { closeAllSheets(true); rerender(); } }
    else if (c === 'rm') { S.settings.reduceMotion = !S.settings.reduceMotion; applySettings(); emit('settings'); }
    else if (c === 'test') setTestMode(true);
    else if (c === 'tm-done') endTask('completed');
    else if (c === 'tm-skip') endTask('skipped');
    else if (c === 'tm-exit') { closeAllSheets(); setTestMode(false); }
  });
}
ACTIONS.demo = () => { const ctl = openSheet({ title: 'Prototype controls', body: consoleHtml(true) }); ctl.sheet.dataset.console = '1'; };
ACTIONS.back = () => back();
ACTIONS['close-flow'] = () => resetTo(['start'], 'fade');

/* ============================================================
   Boot
   ============================================================ */
function updateClock() { const el = document.getElementById('sb-time'); if (el) { const d = new Date(); el.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); } }
function boot() {
  Object.assign(els, { device: $('#device'), screens: $('#screens'), sheetLayer: $('#sheet-layer'), toasts: $('#toasts'), console: $('#console'), tm: $('#tm-bar') });
  els.sheetLayer.style.pointerEvents = 'none';
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const fn = ACTIONS[b.dataset.act]; if (!fn) return;
    e.preventDefault();
    fn(b, e);
  });
  bindConsole();
  const h = location.hash.slice(1).toUpperCase();
  if (MARKETS[h]) S.market = h;
  applySettings();
  resetTo(['start'], 'none');
  renderConsole();
  updateClock(); setInterval(updateClock, 15000);
  window.addEventListener('resize', () => { applySettings(); });
  window.addEventListener('hashchange', () => { const c = location.hash.slice(1).toUpperCase(); if (MARKETS[c] && c !== S.market) setMarket(c); });
}
boot();
</script>
