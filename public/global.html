}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--page-ink);
  font-family: var(--font);
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
input, select, textarea { font: inherit; color: inherit; }
svg { display: block; }
.sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.tnum { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1, "cv11" 1; }

/* ---------- Stage & device ---------- */
.stage {
  min-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 56px;
  padding-block: 24px;
  padding-inline: 24px;
}
.device {
  --ts: 1;
  --fs-hero: calc(40px * var(--ts));
  --fs-hero-sm: calc(32px * var(--ts));
  --fs-title: calc(28px * var(--ts));
  --fs-h2: calc(20px * var(--ts));
  --fs-card: calc(17px * var(--ts));
  --fs-body: calc(15px * var(--ts));
  --fs-label: calc(13.5px * var(--ts));
  --fs-caption: calc(12px * var(--ts));
  --kb: 0px;
  position: relative;
  flex: none;
  width: 393px;
  height: min(852px, calc(100vh - 48px));
  min-height: 640px;
  border-radius: 54px;
  background: var(--bg);
  color: var(--fg);
  box-shadow: 0 0 0 11px #0C0D10, 0 0 0 12px #2A2C33, var(--shadow-device);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  font-size: var(--fs-body);
  line-height: 1.45;
  isolation: isolate;
}
.statusbar {
  flex: none;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 30px 0 38px;
  font-size: 15px;
  font-weight: 600;
  color: var(--fg);
  background: var(--bg);
  position: relative;
  z-index: 40;
}
.statusbar .island { position: absolute; left: 50%; top: 11px; width: 120px; height: 34px; margin-left: -60px; background: #000; border-radius: 20px; }
.statusbar .sb-icons { display: flex; gap: 6px; align-items: center; }
.statusbar .sb-icons svg { width: 17px; height: 17px; }
.home-indicator { position: absolute; bottom: 7px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--fg); opacity: .85; z-index: 60; pointer-events: none; }

@media (max-width: 899px), (max-height: 680px) {
  html, body { overflow: hidden; }
  .stage { padding: 0; height: 100%; min-height: 0; display: block; }
  .device { width: 100%; height: 100%; min-height: 0; border-radius: 0; box-shadow: none; max-width: 560px; margin: 0 auto; }
  .statusbar, .home-indicator { display: none; }
  .console { display: none !important; }
}

/* ---------- App container ---------- */
.app { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
.screens { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); will-change: transform, opacity; }
.screen.enter-push { animation: pushIn .3s var(--ease-out) both; z-index: 2; }
.screen.exit-push { animation: pushOut .3s var(--ease-out) both; z-index: 1; }
.screen.enter-pop { animation: popIn .28s var(--ease-out) both; z-index: 1; }
.screen.exit-pop { animation: popOut .28s var(--ease-out) both; z-index: 2; }
.screen.enter-fade { animation: fadeIn .2s ease both; z-index: 2; }
.screen.exit-fade { animation: fadeOut .16s ease both; z-index: 1; }
.screen.enter-up { animation: upIn .34s var(--ease-out) both; z-index: 3; }
@keyframes pushIn { from { transform: translateX(32%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pushOut { to { transform: translateX(-14%); opacity: 0; } }
@keyframes popIn { from { transform: translateX(-14%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes popOut { to { transform: translateX(32%); opacity: 0; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes upIn { from { transform: translateY(6%); opacity: 0; } to { transform: none; opacity: 1; } }

.topbar { flex: none; height: 52px; display: flex; align-items: center; gap: 4px; padding: 0 8px; position: relative; z-index: 3; background: var(--bg); }
.topbar .tb-title { flex: 1; text-align: center; font-weight: 600; font-size: var(--fs-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
.topbar .tb-side { width: 88px; display: flex; align-items: center; }
.topbar .tb-side.right { justify-content: flex-end; }
.icon-btn { width: 44px; height: 44px; border-radius: 22px; display: inline-grid; place-items: center; color: var(--fg); flex: none; position: relative; transition: background .15s; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:active { background: var(--surface-3); }
.icon-btn .i { width: 22px; height: 22px; }
.icon-btn[aria-disabled="true"] { color: var(--fg-3); }
.badge-dot { position: absolute; top: 9px; right: 10px; min-width: 9px; height: 9px; border-radius: 5px; background: var(--primary); box-shadow: 0 0 0 2px var(--bg); }
.text-link { color: var(--primary-text); font-weight: 600; font-size: var(--fs-label); padding: 10px 8px; border-radius: 10px; min-height: 44px; display: inline-flex; align-items: center; gap: 4px; }
.text-link:hover { background: var(--primary-soft); }

.progress { display: flex; gap: 4px; justify-content: center; flex: 1; }
.progress span { width: 22px; height: 4px; border-radius: 2px; background: var(--surface-3); transition: background .3s; }
.progress span.on { background: var(--primary); }

.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding: 0 20px 32px; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
.scroll.pad-top { padding-top: 8px; }
.footer { flex: none; padding: 12px 20px 18px; background: var(--bg); position: relative; z-index: 3; margin-bottom: var(--kb); transition: margin-bottom .2s var(--ease); display: grid; gap: 10px; }
.footer.sep { border-top: 1px solid var(--border); }
.device:not(.mobile) .screen:not(.has-tabbar) .footer { padding-bottom: 30px; }
.footer-note { font-size: var(--fs-caption); color: var(--fg-2); text-align: center; line-height: 1.4; }
.has-tabbar .footer { padding-bottom: 12px; }

/* ---------- Typography ---------- */
.title { font-size: var(--fs-title); font-weight: 600; letter-spacing: -0.022em; line-height: 1.15; margin: 6px 0 20px; text-wrap: balance; }
.title:focus { outline: none; }
.title-sub { margin: -12px 0 20px; color: var(--fg-2); font-size: var(--fs-body); text-wrap: pretty; }
.sh { font-size: var(--fs-h2); font-weight: 600; letter-spacing: -0.015em; margin: 0; line-height: 1.2; }
.sh-row { display: flex; align-items: center; justify-content: space-between; margin: 28px 0 10px; gap: 12px; min-height: 44px; }
.group-label { font-size: var(--fs-label); font-weight: 500; color: var(--fg-2); margin: 24px 0 8px; }
.muted { color: var(--fg-2); }
.small { font-size: var(--fs-label); }
.caption { font-size: var(--fs-caption); color: var(--fg-2); }
.strong { font-weight: 600; }
.center { text-align: center; }
p { margin: 0; }

/* ---------- Icons & flags ---------- */
.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.i.sm { width: 16px; height: 16px; }
.i.lg { width: 24px; height: 24px; }
.flag { position: relative; display: inline-block; border-radius: 50%; overflow: hidden; flex: none; width: 24px; height: 24px; vertical-align: middle; }
.flag svg { width: 100%; height: 100%; }
.flag::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(17, 24, 39, .1); }

/* ---------- Avatars ---------- */
.avatar { position: relative; flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: calc(15px * var(--ts)); letter-spacing: .01em; }
.avatar.lg { width: 72px; height: 72px; font-size: 24px; }
.avatar.xl { width: 84px; height: 84px; font-size: 28px; }
.avatar.sm { width: 32px; height: 32px; font-size: 12px; }
.avatar .flag { position: absolute; right: -3px; bottom: -3px; width: 18px; height: 18px; box-shadow: 0 0 0 2px var(--surface); }
.avatar.lg .flag, .avatar.xl .flag { width: 26px; height: 26px; right: -2px; bottom: -2px; box-shadow: 0 0 0 3px var(--bg); }
.av1 { background: var(--av1-bg); color: var(--av1-fg); }
.av2 { background: var(--av2-bg); color: var(--av2-fg); }
.av3 { background: var(--av3-bg); color: var(--av3-fg); }
.av4 { background: var(--av4-bg); color: var(--av4-fg); }
.av5 { background: var(--av5-bg); color: var(--av5-fg); }
.av6 { background: var(--av6-bg); color: var(--av6-fg); }
.av-me { background: var(--fg); color: var(--bg); }

/* ---------- Buttons ---------- */
.btn {
  height: 54px; width: 100%; border-radius: var(--r-btn);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-size: calc(16px * var(--ts)); font-weight: 600; letter-spacing: -0.005em;
  transition: transform .14s var(--ease), background-color .14s, color .14s, box-shadow .14s, opacity .14s;
  position: relative; user-select: none; -webkit-tap-highlight-color: transparent; padding: 0 18px; white-space: nowrap;
}
.btn:active:not([disabled]):not([aria-disabled="true"]) { transform: scale(.98); }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-press); }
.btn-secondary { background: var(--primary-soft); color: var(--on-primary-soft); }
.btn-secondary:hover { filter: brightness(.97); }
.btn-outline { background: var(--surface); color: var(--fg); box-shadow: inset 0 0 0 1px var(--border-strong); }
.btn-outline:hover { background: var(--surface-2); }
.btn-ghost { background: transparent; color: var(--primary-text); }
.btn-ghost:hover { background: var(--primary-soft); }
.btn-danger { background: var(--error); color: #fff; }
.btn-danger-ghost { background: transparent; color: var(--error); }
.btn-danger-ghost:hover { background: var(--error-soft); }
.btn[disabled], .btn[aria-disabled="true"] { background: var(--surface-3); color: var(--fg-2); cursor: not-allowed; box-shadow: none; }
.btn-ghost[disabled], .btn-ghost[aria-disabled="true"] { background: transparent; color: var(--fg-3); }
.btn.sm { height: 40px; font-size: var(--fs-label); border-radius: 12px; width: auto; padding: 0 14px; }
.btn.md { height: 46px; font-size: var(--fs-body); border-radius: 13px; }
.btn .i { width: 19px; height: 19px; }
.btn.is-loading { color: transparent !important; pointer-events: none; }
.btn.is-loading::after { content: ""; position: absolute; width: 20px; height: 20px; border-radius: 50%; border: 2.2px solid var(--on-primary); border-right-color: transparent; animation: spin .7s linear infinite; }
.btn-secondary.is-loading::after, .btn-outline.is-loading::after { border-color: var(--primary-text); border-right-color: transparent; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 2.4px solid var(--primary-soft); border-top-color: var(--primary); animation: spin .8s linear infinite; flex: none; }
.spinner.lg { width: 36px; height: 36px; border-width: 3px; }

:where(button, a, input, select, textarea, [tabindex]):focus-visible { outline: 2.5px solid var(--primary); outline-offset: 2px; border-radius: 10px; }
.btn:focus-visible { outline-offset: 3px; border-radius: var(--r-btn); }

/* ---------- Cards, rows, lists ---------- */
.card { background: var(--surface); border-radius: var(--r-card); border: 1px solid var(--border); }
.card.pad { padding: 20px; }
.card + .card { margin-top: 12px; }
.list { background: var(--surface); border-radius: var(--r-card); border: 1px solid var(--border); padding: 0 16px; }
.row { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 12px 0; width: 100%; position: relative; }
.list > .row + .row, .list > * + .row, .rows > .row + .row { border-top: 1px solid var(--border); }
button.row, a.row { cursor: pointer; text-decoration: none; color: inherit; }
button.row:focus-visible { outline-offset: -2px; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-title { font-weight: 600; font-size: var(--fs-body); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub { font-size: var(--fs-label); color: var(--fg-2); line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub.wrap, .row-title.wrap { white-space: normal; }
/* Large text: let row text wrap instead of truncating (WCAG 1.4.4) */
.device.ts-large .row-title, .device.ts-large .row-sub { white-space: normal; overflow-wrap: anywhere; }
.row-end { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: none; }
.row-end .i { color: var(--fg-3); }
.row .chev { color: var(--fg-3); }
.tile-icon { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--surface-2); color: var(--fg); flex: none; }
.tile-icon.accent { background: var(--primary-soft); color: var(--on-primary-soft); }
.tile-icon.round { border-radius: 50%; }

.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 13px 0; min-height: 48px; }
.kv + .kv { border-top: 1px solid var(--border); }
.kv .k { color: var(--fg-2); font-size: var(--fs-body); display: inline-flex; align-items: center; gap: 6px; }
.kv .v { font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.kv.total .k { color: var(--fg); font-weight: 600; }
.kv.total .v { font-weight: 700; }
.kv.btnish { width: 100%; cursor: pointer; }
.kv.btnish .v { display: inline-flex; align-items: center; gap: 6px; }
.kv .info { color: var(--fg-3); width: 17px; height: 17px; }

/* ---------- Status pills ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 12px; font-size: var(--fs-caption); font-weight: 600; white-space: nowrap; letter-spacing: .005em; }
.pill .i { width: 13px; height: 13px; stroke-width: 2.4; }
.pill.s-success { background: var(--success-soft); color: var(--success); }
.pill.s-progress { background: var(--primary-soft); color: var(--on-primary-soft); }
.pill.s-warning { background: var(--warning-soft); color: var(--warning-text); }
.pill.s-error { background: var(--error-soft); color: var(--error); }
.pill.s-neutral { background: var(--surface-2); color: var(--fg-2); }
.status-text { font-size: var(--fs-label); display: inline-flex; align-items: center; gap: 4px; }
.status-text.s-success { color: var(--success); }
.status-text.s-progress { color: var(--primary-text); }
.status-text.s-warning { color: var(--warning-text); }
.status-text.s-error { color: var(--error); }
.status-text.s-neutral { color: var(--fg-2); }

/* ---------- Callouts ---------- */
.callout { display: flex; gap: 12px; padding: 14px 16px; border-radius: 16px; background: var(--surface-2); font-size: var(--fs-label); line-height: 1.45; align-items: flex-start; }
.callout .i { margin-top: 1px; }
.callout strong { display: block; font-size: var(--fs-body); margin-bottom: 2px; }
.callout.info { background: var(--primary-soft); color: var(--on-primary-soft); }
.callout.warn { background: var(--warning-soft); color: var(--warning-text); }
.callout.warn strong, .callout.err strong { color: inherit; }
.callout.err { background: var(--error-soft); color: var(--error); }
.callout.ok { background: var(--success-soft); color: var(--success); }
.callout .callout-body { flex: 1; min-width: 0; }
.callout .callout-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.callout .callout-actions .btn { width: auto; }
.callout.warn .btn-outline, .callout.err .btn-outline { background: var(--surface); }
.stack { display: grid; gap: 12px; }
.stack-sm { display: grid; gap: 8px; }
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; } .mt20 { margin-top: 20px; } .mt24 { margin-top: 24px; } .mt32 { margin-top: 32px; }

/* ---------- Fields ---------- */
.field { display: grid; gap: 7px; }
.field + .field { margin-top: 18px; }
.field > label, .field .label { font-size: var(--fs-label); font-weight: 500; color: var(--fg); }
.field .opt { color: var(--fg-2); font-weight: 400; }
.input {
  height: 56px; width: 100%; border-radius: var(--r-input); border: 1px solid var(--border-control);
  background: var(--surface); padding: 0 16px; font-size: calc(16px * var(--ts)); color: var(--fg);
  transition: border-color .15s, box-shadow .15s; outline: none;
}
.input::placeholder { color: var(--fg-2); }
.input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.input.mono { font-variant-numeric: tabular-nums; letter-spacing: .02em; font-feature-settings: "tnum" 1, "zero" 1; font-size: calc(15px * var(--ts)); } /* ER-02: a full 27-character IBAN fits a 390 px screen */
.input[aria-invalid="true"] { border-color: var(--error); }
.input[aria-invalid="true"]:focus { box-shadow: 0 0 0 3px var(--error-soft); }
select.input { appearance: none; background-image: none; padding-right: 44px; }
.select-wrap { position: relative; }
.select-wrap .i { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--fg-2); }
.hint { font-size: var(--fs-label); color: var(--fg-2); line-height: 1.4; }
.err-msg { font-size: var(--fs-label); color: var(--error); display: flex; gap: 6px; align-items: flex-start; line-height: 1.4; }
.err-msg .i { width: 16px; height: 16px; margin-top: 1px; }
.ok-msg { font-size: var(--fs-label); color: var(--success); display: flex; gap: 6px; align-items: center; }
.ok-msg .i { width: 16px; height: 16px; }
.picker-btn { height: 56px; width: 100%; border-radius: var(--r-input); border: 1px solid var(--border-control); background: var(--surface); padding: 0 14px 0 14px; display: flex; align-items: center; gap: 12px; font-size: calc(16px * var(--ts)); }
.picker-btn .grow { flex: 1; text-align: left; }
.picker-btn .i { color: var(--fg-2); }
.picker-btn:hover { border-color: var(--fg-2); }

.search { position: relative; }
.search .i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--fg-2); pointer-events: none; }
.search input { height: 48px; width: 100%; border-radius: 14px; border: 1px solid var(--border-control); background: var(--surface); padding: 0 44px 0 44px; font-size: calc(16px * var(--ts)); outline: none; transition: background .15s, border-color .15s, box-shadow .15s; }
.search input::placeholder { color: var(--fg-2); }
.search input:focus { background: var(--surface); border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.search input::-webkit-search-cancel-button { display: none; }
.search .clear { position: absolute; right: 2px; top: 2px; width: 44px; height: 44px; display: grid; place-items: center; color: var(--fg-2); border-radius: 12px; }
.search .clear .i { position: static; transform: none; }

.seg { display: flex; padding: 3px; border-radius: 13px; background: var(--surface-2); gap: 2px; }
.seg button, .c-seg button, .chip, .key { text-align: center; }
.seg button { flex: 1; min-height: 40px; border-radius: 10px; font-size: var(--fs-label); font-weight: 600; color: var(--fg-2); transition: background .15s, color .15s, box-shadow .15s; padding: 0 8px; }
.seg button[aria-pressed="true"], .seg button[aria-checked="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-1); }

.switch { position: relative; width: 51px; height: 31px; border-radius: 16px; background: var(--surface-3); flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .2); transition: transform .2s var(--ease); }
.switch[aria-checked="true"] { background: var(--primary); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.switch[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 20px 4px; margin: 0 -20px; }
.chips::-webkit-scrollbar { display: none; }
.chip { height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--border-strong); background: var(--surface); font-size: var(--fs-label); font-weight: 500; white-space: nowrap; flex: none; transition: background .15s, color .15s, border-color .15s; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary); color: var(--on-primary-soft); font-weight: 600; }
.chip:hover { border-color: var(--fg-3); }

.checkrow { display: flex; gap: 12px; align-items: flex-start; padding: 6px 0; cursor: pointer; font-size: var(--fs-label); line-height: 1.45; }
.checkbox { width: 22px; height: 22px; border-radius: 7px; border: 1.6px solid var(--border-control); background: var(--surface); flex: none; display: grid; place-items: center; transition: background .15s, border-color .15s; margin-top: 1px; }
.checkbox .i { width: 15px; height: 15px; stroke-width: 2.8; color: var(--on-primary); opacity: 0; }
[aria-checked="true"] > .checkbox { background: var(--primary); border-color: var(--primary); }
[aria-checked="true"] > .checkbox .i { opacity: 1; }

/* ---------- Skeleton ---------- */
.sk { background: linear-gradient(90deg, var(--skeleton) 0%, var(--skeleton-hi) 40%, var(--skeleton) 80%); background-size: 300% 100%; animation: shimmer 1.4s ease-in-out infinite; border-radius: 8px; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.sk-row { display: flex; gap: 14px; align-items: center; padding: 14px 0; }
.sk-circle { width: 44px; height: 44px; border-radius: 50%; flex: none; }
.sk-line { height: 12px; }

/* ---------- Tab bar ---------- */
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--border); padding: 6px 4px 6px; position: relative; z-index: 5; transition: transform .25s var(--ease), opacity .2s; }
.tabbar[hidden] { display: none !important; }
.device:not(.mobile) .tabbar { padding-bottom: 22px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 50px; justify-content: center; color: var(--fg-2); font-size: calc(11.5px * var(--ts)); font-weight: 500; border-radius: 12px; position: relative; }
.tab .i { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--primary-text); font-weight: 600; }
.tab[aria-current="page"] .i { stroke-width: 2.1; }
.tab .tab-dot { position: absolute; top: 5px; left: 50%; margin-left: 7px; width: 8px; height: 8px; border-radius: 4px; background: var(--primary); box-shadow: 0 0 0 2px var(--surface); }

/* ---------- Sheets, dialogs, toasts, banners ---------- */
.layer { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .25s ease; pointer-events: auto; }
.scrim.on { opacity: 1; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 90%;
  background: var(--surface); border-radius: 26px 26px 0 0; box-shadow: var(--shadow-2);
  transform: translateY(105%); transition: transform .34s var(--ease-out);
  display: flex; flex-direction: column; pointer-events: auto; outline: none;
}
.sheet.on { transform: none; }
.sheet.dragging { transition: none; }
.sheet.tall { height: 90%; }
.sheet-handle { width: 40px; height: 5px; border-radius: 3px; background: var(--border-strong); margin: 8px auto 0; flex: none; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 6px 8px 4px 20px; flex: none; touch-action: none; min-height: 52px; }
.sheet-head h2 { flex: 1; margin: 0; font-size: var(--fs-card); font-weight: 600; letter-spacing: -0.01em; }
.sheet-body { overflow-y: auto; padding: 4px 20px 20px; flex: 1; min-height: 0; overscroll-behavior: contain; }
.sheet-foot { padding: 12px 20px 20px; flex: none; display: grid; gap: 10px; border-top: 1px solid var(--border); }
.device:not(.mobile) .sheet-foot, .device:not(.mobile) .sheet-body.last { padding-bottom: 30px; }
.sheet .search { margin-bottom: 8px; }

.dialog-wrap { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; pointer-events: auto; }
.dialog { width: 100%; max-width: 330px; background: var(--surface); border-radius: 22px; padding: 22px 20px 16px; box-shadow: var(--shadow-2); transform: scale(.94); opacity: 0; transition: transform .22s var(--ease-out), opacity .18s; position: relative; }
.dialog.on { transform: none; opacity: 1; }
.dialog h2 { margin: 0 0 6px; font-size: var(--fs-card); font-weight: 600; }
.dialog p { color: var(--fg-2); font-size: var(--fs-body); }
.dialog .dialog-actions { display: grid; gap: 8px; margin-top: 20px; }

.toasts { position: absolute; left: 0; right: 0; bottom: 96px; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 70; pointer-events: none; padding: 0 16px; }
.toast { background: var(--toast-bg); color: var(--toast-fg); padding: 11px 16px; border-radius: 14px; font-size: var(--fs-label); font-weight: 500; display: flex; gap: 8px; align-items: center; box-shadow: var(--shadow-2); animation: toastIn .26s var(--ease-out) both; max-width: 100%; pointer-events: auto; }
.toast .i { width: 17px; height: 17px; }
.toast.out { animation: toastOut .2s ease both; }
@keyframes toastIn { from { transform: translateY(12px); opacity: 0; } }
@keyframes toastOut { to { transform: translateY(8px); opacity: 0; } }

.banners { position: absolute; top: 8px; left: 10px; right: 10px; z-index: 80; display: grid; gap: 8px; pointer-events: none; }
.banner { pointer-events: auto; background: color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow-2); padding: 12px 12px 12px 14px; display: flex; gap: 12px; align-items: center; animation: bannerIn .36s var(--ease-out) both; touch-action: pan-y; }
.banner.out { animation: bannerOut .24s ease both; }
.banner .b-icon { width: 38px; height: 38px; border-radius: 11px; background: var(--fg); color: var(--bg); display: grid; place-items: center; flex: none; }
.banner .b-icon svg { width: 22px; height: 22px; }
.banner .b-main { flex: 1; min-width: 0; }
.banner .b-title { font-weight: 600; font-size: var(--fs-label); display: flex; justify-content: space-between; gap: 8px; }
.banner .b-title span { font-weight: 400; color: var(--fg-2); font-size: var(--fs-caption); }
.banner .b-body { font-size: var(--fs-label); color: var(--fg-2); line-height: 1.35; }
@keyframes bannerIn { from { transform: translateY(-120%); } }
@keyframes bannerOut { to { transform: translateY(-130%); opacity: 0; } }

.offline-bar { flex: none; display: flex; align-items: center; gap: 10px; padding: 9px 20px; background: var(--fg); color: var(--bg); font-size: var(--fs-label); font-weight: 500; }
.offline-bar .i { width: 17px; height: 17px; }

/* ---------- Home ---------- */
.home-head { display: flex; align-items: center; gap: 8px; padding: 4px 12px 0 20px; height: 56px; flex: none; }
.wordmark { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .16em; font-size: 14px; color: var(--fg); }
.wordmark .mark { width: 24px; height: 24px; }
.home-head .spacer { flex: 1; }
.me-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--fg); color: var(--bg); font-weight: 600; font-size: 14px; margin-left: 2px; }
.greeting { font-size: var(--fs-title); font-weight: 600; letter-spacing: -0.022em; margin: 10px 0 18px; line-height: 1.15; }
.greeting:focus { outline: none; }
.balance-card { background: var(--surface); border-radius: 24px; border: 1px solid var(--border); padding: 20px 20px 18px; position: relative; overflow: hidden; }
.balance-card .bc-label { display: flex; align-items: center; justify-content: space-between; color: var(--fg-2); font-size: var(--fs-label); font-weight: 500; margin-bottom: 2px; }
.balance-card .bc-label .icon-btn { width: 40px; height: 40px; margin: -10px -10px -10px 0; color: var(--fg-2); }
.balance-amt { font-size: var(--fs-hero); font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; margin: 2px 0 6px; font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1, "cv11" 1; min-height: 1.1em; }
.balance-amt .minor { color: var(--fg-2); font-weight: 500; }
.balance-sub { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: var(--fs-label); color: var(--fg-2); }
.balance-sub span { display: inline-flex; align-items: center; gap: 6px; }
.balance-sub .flag { width: 16px; height: 16px; }
.balance-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
.balance-actions .btn { height: 50px; }
.recips-scroll { display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 2px 20px 4px; scroll-snap-type: x proximity; scroll-padding-inline: 20px; }
.recips-scroll::-webkit-scrollbar { display: none; }
.recip-pill { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 64px; flex: none; font-size: var(--fs-caption); font-weight: 500; color: var(--fg); scroll-snap-align: start; border-radius: 14px; padding: 2px 0 4px; }
.recip-pill .avatar { width: 56px; height: 56px; font-size: 18px; }
.recip-pill .avatar .flag { width: 20px; height: 20px; }
.recip-pill .nm { max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recip-pill .new { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; border: 1.5px dashed var(--border-strong); color: var(--primary-text); background: var(--surface); }
.active-card { display: flex; gap: 14px; align-items: center; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; width: 100%; margin-top: 12px; }
.active-card .row-main { gap: 4px; }
.mini-steps { display: flex; gap: 3px; margin-top: 4px; }
.mini-steps span { flex: 1; height: 3px; border-radius: 2px; background: var(--surface-3); }
.mini-steps span.on { background: var(--success); }
.mini-steps span.cur { background: var(--primary); }
.mini-steps span.warn { background: var(--warning); }
.rate-strip { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; width: 100%; margin-top: 12px; }
.ptr { position: absolute; top: 0; left: 50%; width: 36px; height: 36px; margin-left: -18px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow-2); display: grid; place-items: center; z-index: 6; transform: translateY(-60px); color: var(--primary-text); pointer-events: none; opacity: 0; transition: opacity .15s; }
.ptr.pulling, .ptr.spinning { opacity: 1; }
.ptr .i { transition: transform .1s; }
.ptr.spinning .i { animation: spin .8s linear infinite; }

/* ---------- Transaction rows ---------- */
.tx-amt { font-weight: 600; font-variant-numeric: tabular-nums; font-size: var(--fs-body); white-space: nowrap; }
.tx-amt2 { font-size: var(--fs-label); color: var(--fg-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tx-row .row-sub { display: flex; gap: 6px; align-items: center; }
.tx-row .status-text .i { width: 14px; height: 14px; stroke-width: 2.2; }
.date-group { font-size: var(--fs-label); font-weight: 500; color: var(--fg-2); margin: 22px 0 6px; position: sticky; top: 0; background: var(--bg); padding: 6px 0; z-index: 1; }
.date-group:first-child { margin-top: 8px; }

/* ---------- Amount screen ---------- */
.to-chip { display: inline-flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; border-radius: 24px; background: var(--surface); border: 1px solid var(--border); margin: -6px 0 18px; font-size: var(--fs-label); max-width: 100%; }
.to-chip .avatar { width: 32px; height: 32px; font-size: 12px; }
.to-chip .avatar .flag { width: 14px; height: 14px; right: -2px; bottom: -2px; }
.to-chip b { font-weight: 600; }
.to-chip .text-link { min-height: 32px; padding: 4px 6px; margin: -4px -6px -4px 2px; }
.xcards { position: relative; display: grid; gap: 8px; }
#card-send { padding-bottom: 22px; }
#card-recv { padding-top: 20px; }
.xcard { background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 16px 16px 16px 20px; transition: border-color .18s, box-shadow .18s; position: relative; cursor: text; }
.xcard.focused { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.xcard.invalid { border-color: var(--error); }
.xcard-label { font-size: var(--fs-label); color: var(--fg-2); font-weight: 500; display: flex; align-items: center; gap: 8px; min-height: 20px; }
.xcard-label .fixed-tag { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--on-primary-soft); background: var(--primary-soft); padding: 2px 7px; border-radius: 6px; }
.xcard-row { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
.amt-field { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 2px; }
.amt-sym { font-size: var(--fs-hero-sm); font-weight: 600; color: var(--fg); letter-spacing: -0.02em; line-height: 1.2; flex: none; }
.amt-field.empty .amt-sym { color: var(--fg-3); }
.amt-input { flex: 1; min-width: 0; width: 100%; border: 0; outline: none; background: transparent; padding: 0; font-size: var(--fs-hero-sm); font-weight: 600; letter-spacing: -0.025em; color: var(--fg); line-height: 1.2; font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1, "cv11" 1; caret-color: var(--primary); }
.amt-input::placeholder { color: var(--fg-3); }
.amt-input:focus-visible { outline: none; }
.amt-input.shrink1 { font-size: calc(28px * var(--ts)); }
.amt-input.shrink2 { font-size: calc(24px * var(--ts)); }
.amt-input.tween { color: var(--primary-text); transition: color .6s; }
.amt-field.shrink1 .amt-sym { font-size: calc(28px * var(--ts)); }
.amt-field.shrink2 .amt-sym { font-size: calc(24px * var(--ts)); }
.cur-btn { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 10px 0 6px; border-radius: 22px; background: var(--surface-2); font-weight: 600; font-size: var(--fs-body); flex: none; transition: background .15s; }
.cur-btn:hover { background: var(--surface-3); }
.cur-btn .flag { width: 30px; height: 30px; }
.cur-btn .i { width: 16px; height: 16px; color: var(--fg-2); }
.cur-btn.locked .i { width: 14px; height: 14px; }
.xcard-foot { margin-top: 8px; font-size: var(--fs-caption); color: var(--fg-2); display: flex; justify-content: space-between; gap: 8px; min-height: 17px; }
.xcard-foot.err { color: var(--error); }
.xcard-foot.warn { color: var(--warning-text); }
.swap-btn { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); display: grid; place-items: center; color: var(--primary-text); z-index: 2; box-shadow: 0 0 0 5px var(--bg); transition: background .15s, color .15s; }
.swap-btn:hover { background: var(--primary-soft); }
.swap-btn .i { transition: transform .32s var(--ease-out); }
.swap-btn[aria-disabled="true"] { color: var(--fg-3); }
.swap-btn[aria-disabled="true"]:hover { background: var(--surface); }
.mode-cap { font-size: var(--fs-caption); color: var(--fg-2); margin: 10px 4px 0; text-align: center; }

.rail { position: relative; margin: 22px 0 0; padding-left: 4px; }
.rail::before { content: ""; position: absolute; left: 19px; top: 18px; bottom: 18px; width: 1.5px; background: var(--border-strong); }
.rail-row { display: flex; align-items: center; gap: 14px; min-height: 46px; position: relative; width: 100%; border-radius: 12px; }
button.rail-row:hover .rail-label { color: var(--fg); }
.rail-op { width: 31px; height: 31px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--border-strong); display: grid; place-items: center; font-weight: 600; font-size: 15px; color: var(--fg-2); flex: none; position: relative; z-index: 1; font-variant-numeric: tabular-nums; }
.rail-op .i { width: 15px; height: 15px; stroke-width: 2.1; }
.rail-val { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 0; transition: color .4s; }
.rail-val.flash { color: var(--primary-text); }
.rail-label { flex: 1; color: var(--fg-2); font-size: var(--fs-label); display: inline-flex; align-items: center; gap: 6px; justify-content: flex-end; text-align: right; transition: color .15s; }
.rail-label .i { width: 16px; height: 16px; color: var(--fg-3); }
.rail-row.total .rail-val { font-weight: 700; }
.rail-row.total .rail-op { border-color: var(--fg); color: var(--fg); }
.tag { font-size: 11px; font-weight: 600; letter-spacing: .03em; padding: 2px 7px; border-radius: 6px; text-transform: uppercase; }
.tag.live { background: var(--surface-2); color: var(--fg-2); }
.tag.locked { background: var(--success-soft); color: var(--success); }
.tag.ind { background: var(--warning-soft); color: var(--warning-text); }
.rate-note { margin-top: 14px; font-size: var(--fs-caption); color: var(--fg-2); text-align: center; min-height: 34px; line-height: 1.4; text-wrap: pretty; }
.rate-note .upd { color: var(--primary-text); font-weight: 600; }

/* ---------- Breakdown ---------- */
.pair { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 4px 0 18px; }
.pair-side { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.pair-side .flag { width: 36px; height: 36px; }
.pair-amt { font-weight: 600; font-size: calc(19px * var(--ts)); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; white-space: nowrap; }
.pair-arrow { width: 36px; height: 36px; border-radius: 50%; background: var(--primary-soft); color: var(--on-primary-soft); display: grid; place-items: center; flex: none; }
.receive-hero { padding: 18px 20px; border-top: 1px solid var(--border); background: var(--surface-2); border-radius: 0 0 var(--r-card) var(--r-card); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.receive-hero .k { font-weight: 600; }
.receive-hero .v { font-size: calc(30px * var(--ts)); font-weight: 600; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.validity { display: flex; align-items: center; gap: 10px; font-size: var(--fs-label); color: var(--fg-2); }
.ring { width: 22px; height: 22px; border-radius: 50%; flex: none; background: conic-gradient(var(--success) calc(var(--p, 1) * 360deg), var(--surface-3) 0); -webkit-mask: radial-gradient(circle at center, transparent 6.5px, #000 7px); mask: radial-gradient(circle at center, transparent 6.5px, #000 7px); transition: --p 1s linear; }
.ring.low { background: conic-gradient(var(--warning) calc(var(--p, 1) * 360deg), var(--surface-3) 0); }
.validity b { color: var(--fg); font-variant-numeric: tabular-nums; font-weight: 600; }

/* ---------- Payment methods ---------- */
.method { display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: 20px; background: var(--surface); border: 1.5px solid var(--border); width: 100%; transition: border-color .15s, background .15s, box-shadow .15s; text-align: left; }
.method + .method { margin-top: 10px; }
.method:hover { border-color: var(--border-strong); }
.method[aria-checked="true"] { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.radio { width: 22px; height: 22px; border-radius: 50%; border: 1.8px solid var(--border-control); flex: none; display: grid; place-items: center; transition: border-color .15s; }
.radio::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--primary); transform: scale(0); transition: transform .18s var(--ease-out); }
[aria-checked="true"] .radio { border-color: var(--primary); }
[aria-checked="true"] .radio::after { transform: scale(1); }
.method .m-extra { margin-top: 8px; font-size: var(--fs-caption); }
.method-block { margin-top: 10px; }
.method-block .method + .callout { margin-top: 8px; }

/* ---------- Review ---------- */
.recipient-card { display: flex; gap: 14px; align-items: center; padding: 16px; }
.recipient-card .row-main { gap: 3px; }
.edit-link { color: var(--primary-text); font-size: var(--fs-label); font-weight: 600; padding: 8px 10px; border-radius: 10px; min-height: 40px; display: inline-flex; align-items: center; flex: none; }
.edit-link:hover { background: var(--primary-soft); }
.money-split { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--border); }
.money-split > div { padding: 16px; display: grid; gap: 2px; }
.money-split > div + div { border-left: 1px solid var(--border); }
.money-split .k { font-size: var(--fs-label); color: var(--fg-2); }
.money-split .v { font-size: calc(22px * var(--ts)); font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.money-split .v.em { color: var(--fg); }
.section-head { display: flex; align-items: center; justify-content: space-between; margin: 24px 0 8px; min-height: 40px; }
.section-head h2 { font-size: var(--fs-card); font-weight: 600; margin: 0; }
.purpose-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.purpose-grid .chip { height: auto; min-height: 40px; padding: 8px 14px; white-space: normal; text-align: left; }
.ref-input { height: 50px; }

/* ---------- Authorisation ---------- */
.auth { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 8px 4px 4px; }
.auth h2 { font-size: var(--fs-h2); font-weight: 600; margin: 4px 0 6px; letter-spacing: -0.015em; }
.auth .auth-amt { font-size: var(--fs-body); color: var(--fg-2); }
.auth .auth-amt b { color: var(--fg); font-weight: 600; }
.faceid { width: 96px; height: 96px; margin: 26px auto 18px; position: relative; color: var(--primary-text); }
.faceid svg { width: 100%; height: 100%; }
.faceid .scan { stroke-dasharray: 4 6; animation: dash 1s linear infinite; }
.faceid.ok { color: var(--success); }
.faceid.fail { color: var(--error); animation: nod .4s ease 2; }
@keyframes dash { to { stroke-dashoffset: -20; } }
@keyframes nod { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.auth-status { min-height: 22px; font-size: var(--fs-label); color: var(--fg-2); font-weight: 500; }
.pin-dots { display: flex; gap: 16px; justify-content: center; margin: 22px 0 8px; }
.pin-dots span { width: 13px; height: 13px; border-radius: 50%; border: 1.6px solid var(--fg-2); transition: background .12s, border-color .12s; }
.pin-dots span.on { background: var(--fg); border-color: var(--fg); }
.pin-dots.err span { border-color: var(--error); }
.pin-dots.err { animation: nod .35s ease 1; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; width: 100%; max-width: 300px; }
.key { height: 56px; border-radius: 16px; font-size: 24px; font-weight: 500; display: grid; place-items: center; background: var(--surface-2); font-variant-numeric: tabular-nums; transition: background .1s, transform .1s; }
.key:active { background: var(--surface-3); transform: scale(.96); }
.key.blank { background: transparent; pointer-events: none; }
.key.fn { background: transparent; font-size: var(--fs-label); font-weight: 600; color: var(--fg-2); }
.key .i { width: 24px; height: 24px; }

/* ---------- Success ---------- */
.success { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px 0 8px; }
.check-anim { width: 88px; height: 88px; margin-bottom: 26px; color: var(--success); }
.check-anim circle { stroke-dasharray: 252; stroke-dashoffset: 252; animation: draw .45s var(--ease-out) forwards; }
.check-anim path { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .35s var(--ease-out) .3s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.rise { animation: rise .45s var(--ease-out) both; }
.rise.d1 { animation-delay: .32s; } .rise.d2 { animation-delay: .42s; } .rise.d3 { animation-delay: .52s; } .rise.d4 { animation-delay: .62s; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
.success h1 { font-size: var(--fs-title); font-weight: 600; letter-spacing: -0.022em; margin: 0 0 10px; line-height: 1.15; text-wrap: balance; }
.success h1:focus { outline: none; }
.success .amt-line { font-size: calc(19px * var(--ts)); font-weight: 600; font-variant-numeric: tabular-nums; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
.success .amt-line .i { color: var(--fg-3); }
.success .lead { color: var(--fg-2); margin-top: 12px; max-width: 30ch; text-wrap: pretty; }
.success-meta { margin-top: 24px; width: 100%; text-align: left; }

/* ---------- Tracking timeline ---------- */
.track-sum { display: flex; align-items: center; gap: 14px; padding: 16px; }
.track-sum .big { font-size: calc(24px * var(--ts)); font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.timeline { padding: 8px 16px; }
.t-step { display: grid; grid-template-columns: 28px 1fr; gap: 14px; position: relative; width: 100%; text-align: left; padding: 10px 0; min-height: 56px; }
.t-step::before { content: ""; position: absolute; left: 13px; top: 38px; bottom: -10px; width: 2px; background: var(--border); }
.t-step:last-child::before { display: none; }
.t-step.done::before { background: var(--success); }
.t-node { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--border-strong); background: var(--surface); position: relative; z-index: 1; }
.t-node .i { width: 15px; height: 15px; stroke-width: 2.6; }
.t-step.done .t-node { background: var(--success); border-color: var(--success); color: #fff; }
.t-step.current .t-node { border-color: var(--primary); background: var(--primary-soft); }
.t-step.current .t-node::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
.t-step.current .t-node::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--primary); opacity: 0; animation: pulse 2s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(.7); opacity: .6; } 100% { transform: scale(1.25); opacity: 0; } }
.t-step.warn .t-node { background: var(--warning-soft); border-color: var(--warning); color: var(--warning-text); }
.t-step.err .t-node { background: var(--error-soft); border-color: var(--error); color: var(--error); }
.t-step.neutral .t-node { background: var(--surface-2); border-color: var(--fg-3); color: var(--fg-2); }
.t-body { min-width: 0; padding-top: 3px; }
.t-title { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.t-step.pending .t-title { color: var(--fg-2); font-weight: 500; }
.t-time { font-size: var(--fs-label); color: var(--fg-2); font-weight: 400; font-variant-numeric: tabular-nums; white-space: nowrap; }
.t-step.current .t-time { color: var(--primary-text); font-weight: 600; }
.t-step.warn .t-time { color: var(--warning-text); font-weight: 600; }
.t-step.err .t-time { color: var(--error); font-weight: 600; }
.t-desc { font-size: var(--fs-label); color: var(--fg-2); margin-top: 4px; line-height: 1.45; display: none; }
.t-step[aria-expanded="true"] .t-desc { display: block; }
.t-step .t-action { margin-top: 10px; }

/* ---------- Details & receipt ---------- */
.detail-hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 6px 0 22px; }
.status-icon { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 14px; position: relative; }
.status-icon .i { width: 28px; height: 28px; stroke-width: 2.2; }
.status-icon.s-success { background: var(--success-soft); color: var(--success); }
.status-icon.s-progress { background: var(--primary-soft); color: var(--on-primary-soft); }
.status-icon.s-warning { background: var(--warning-soft); color: var(--warning-text); }
.status-icon.s-error { background: var(--error-soft); color: var(--error); }
.status-icon.s-neutral { background: var(--surface-2); color: var(--fg-2); }
.detail-hero .big { font-size: var(--fs-hero); font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1.1; margin: 6px 0 8px; }
.copy-btn { display: inline-flex; align-items: center; gap: 6px; color: var(--primary-text); font-weight: 600; font-family: inherit; min-height: 32px; padding: 4px 6px; margin: -4px -6px; border-radius: 8px; }
.copy-btn:hover { background: var(--primary-soft); }
.copy-btn .i { width: 16px; height: 16px; }
.action-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
.action-tile { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px 12px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border); font-size: var(--fs-caption); font-weight: 600; text-align: center; line-height: 1.25; }
.action-tile:hover { background: var(--surface-2); }
.action-tile .tile-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--primary-soft); color: var(--on-primary-soft); }

.paper { background: var(--paper); border-radius: 18px; border: 1px solid var(--border); padding: 24px 22px; position: relative; font-size: var(--fs-label); }
.paper::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 10px; background: radial-gradient(circle at 6px 10px, var(--bg) 5px, transparent 5.5px) 0 0 / 12px 10px repeat-x; }
.paper .p-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.paper .p-title { font-size: var(--fs-card); font-weight: 600; margin: 0 0 4px; }
.paper .p-sec { border-top: 1px dashed var(--border-strong); margin-top: 16px; padding-top: 14px; }
.paper .p-sec h2 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-2); }
.paper .p-kv { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
.paper .p-kv span:first-child { color: var(--fg-2); }
.paper .p-kv span:last-child { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; min-width: 0; }
.paper .p-total { font-size: var(--fs-body); font-weight: 700; }
.paper .p-foot { margin-top: 18px; font-size: 11px; color: var(--fg-2); line-height: 1.5; }

/* ---------- Empty states ---------- */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 40px 16px 24px; }
.empty svg.illo { width: 132px; height: 104px; margin-bottom: 20px; }
.empty h2 { font-size: var(--fs-h2); font-weight: 600; margin: 0 0 6px; letter-spacing: -0.015em; }
.empty p { color: var(--fg-2); max-width: 30ch; margin: 0 auto; text-wrap: pretty; }
.empty .btn { margin-top: 20px; width: auto; min-width: 200px; }

/* ---------- Profile ---------- */
.profile-hero { display: flex; align-items: center; gap: 16px; padding: 4px 0 8px; }
.profile-hero .avatar { width: 64px; height: 64px; font-size: 22px; }
.verified { display: inline-flex; align-items: center; gap: 4px; color: var(--success); font-size: var(--fs-caption); font-weight: 600; }
.verified .i { width: 14px; height: 14px; stroke-width: 2.4; }
.setting-row .switch { margin-left: 8px; }
.text-preview { padding: 16px; border-radius: 16px; background: var(--surface-2); margin-top: 12px; }

/* ---------- Support chat ---------- */
.chat { display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px; }
.msg { max-width: 82%; padding: 10px 14px; border-radius: 18px; font-size: var(--fs-body); line-height: 1.4; animation: rise .28s var(--ease-out) both; white-space: pre-line; }
.msg.them { background: var(--surface); border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 6px; }
.msg.me { background: var(--primary); color: var(--on-primary); align-self: flex-end; border-bottom-right-radius: 6px; }
.msg-meta { font-size: var(--fs-caption); color: var(--fg-2); margin: 6px 4px 0; }
.msg-meta.me { align-self: flex-end; }
.typing { display: inline-flex; gap: 4px; padding: 14px; }
.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-3); animation: blink 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }
.composer { display: flex; gap: 8px; align-items: center; }
.composer .input { height: 48px; border-radius: 24px; }
.composer .send { width: 48px; height: 48px; border-radius: 24px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; flex: none; }
.composer .send[disabled] { background: var(--surface-3); color: var(--fg-3); }
.context-chip { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); font-size: var(--fs-label); margin: 4px 0 14px; }
.quick-replies { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }

/* ---------- Lock ---------- */
.lock { position: absolute; inset: 0; z-index: 90; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; animation: fadeIn .2s ease both; }
.lock .wordmark { font-size: 16px; margin-bottom: 40px; }
.lock .wordmark .mark { width: 30px; height: 30px; }
.lock h1 { font-size: var(--fs-h2); font-weight: 600; margin: 0 0 6px; }

/* ---------- Verification ---------- */
.v-step { display: flex; gap: 14px; align-items: flex-start; padding: 16px 0; }
.v-step + .v-step { border-top: 1px solid var(--border); }
.v-num { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-weight: 600; font-size: var(--fs-label); flex: none; }
.v-step.done .v-num { background: var(--success); color: #fff; }
.v-step.done .v-num .i { width: 15px; height: 15px; stroke-width: 2.6; }
.selfie { width: 150px; height: 150px; border-radius: 50%; margin: 10px auto 16px; border: 3px dashed var(--border-strong); display: grid; place-items: center; color: var(--fg-3); position: relative; }
.selfie.scanning { border-color: var(--primary); border-style: solid; color: var(--primary-text); }
.selfie.scanning::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--primary); animation: spin 1s linear infinite; }
.selfie.done { border-color: var(--success); border-style: solid; color: var(--success); }
.selfie .i { width: 56px; height: 56px; stroke-width: 1.4; }

/* ---------- Accordion ---------- */
.acc { border-top: 1px solid var(--border); }
.acc:first-child { border-top: 0; }
.acc button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 0; font-weight: 600; text-align: left; min-height: 52px; }
.acc button .i { color: var(--fg-2); transition: transform .2s; }
.acc button[aria-expanded="true"] .i { transform: rotate(180deg); }
.acc .acc-body { padding: 0 0 16px; color: var(--fg-2); font-size: var(--fs-label); line-height: 1.5; }

/* ---------- Scam warning ---------- */
.scam-hero { width: 64px; height: 64px; border-radius: 20px; background: var(--error-soft); color: var(--error); display: grid; place-items: center; margin: 8px 0 18px; }
.scam-hero .i { width: 32px; height: 32px; }
.bullets { display: grid; gap: 14px; margin: 18px 0 0; padding: 0; list-style: none; }
.bullets li { display: flex; gap: 12px; align-items: flex-start; line-height: 1.45; }
.bullets li .i { color: var(--error); margin-top: 2px; }

/* ---------- Console (desktop demo panel) ---------- */
.console {
  width: 340px; flex: none; align-self: center; max-height: calc(100vh - 48px); overflow-y: auto;
  color: var(--page-ink); font-size: 13.5px; line-height: 1.5; padding: 4px 6px 4px 2px; scrollbar-width: thin;
}
.console .c-brand { display: flex; align-items: center; gap: 10px; }
.console .c-brand .wordmark { color: var(--page-ink); font-size: 15px; }

function ibanMod97(iban) {
  const s = iban.slice(4) + iban.slice(0, 4);
  let rem = 0;
  for (const ch of s) {
    const v = /[A-Z]/.test(ch) ? String(ch.charCodeAt(0) - 55) : ch;
    for (const dgt of v) rem = (rem * 10 + Number(dgt)) % 97;
  }
  return rem;
}
function abaValid(r) {
  if (!/^\d{9}$/.test(r)) return false;
  const d = r.split('').map(Number);
  return (3 * (d[0] + d[3] + d[6]) + 7 * (d[1] + d[4] + d[7]) + (d[2] + d[5] + d[8])) % 10 === 0;
}
function clabeCheck(first17) {
  const w = [3, 7, 1];
  let sum = 0;
  for (let i = 0; i < 17; i++) sum += (Number(first17[i]) * w[i % 3]) % 10;
  return (10 - (sum % 10)) % 10;
}
function luhn(num) {
  let sum = 0, dbl = false;
  for (let i = num.length - 1; i >= 0; i--) {
    let d = Number(num[i]);
    if (dbl) { d *= 2; if (d > 9) d -= 9; }
    sum += d; dbl = !dbl;
  }
  return sum % 10 === 0;
}
function groupBy(str, sizes) {
  let out = [], i = 0, k = 0;
  while (i < str.length) {
    const sz = Array.isArray(sizes) ? (sizes[k] || sizes[sizes.length - 1]) : sizes;
    out.push(str.slice(i, i + sz));
    i += sz; k++;
  }
  return out.join(' ');
}

function maskAccount(r) {
  const d = r.details || {};
  if (d.iban) return 'IBAN ' + d.iban.slice(0, 4) + ' •••• ' + d.iban.slice(-4);
  if (d.clabe) return 'CLABE •••• ' + d.clabe.slice(-4);

  if (d.sortCode) return d.sortCode.replace(/(\d{2})(?=\d)/g, '$1-') + ' · •••• ' + d.account.slice(-4);
  if (d.account) return (d.bank ? d.bank + ' · ' : d.ifsc && IFSC_BANKS[d.ifsc.slice(0, 4)] ? IFSC_BANKS[d.ifsc.slice(0, 4)] + ' · ' : '') + '•••• ' + d.account.slice(-4);
  return 'Bank account';
}
function maskShort(r) {
  const d = r.details || {};
  const v = d.iban || d.clabe || d.mobile || d.account || '';
  return '•••• ' + v.slice(-4);
}
function bankLine(r) {
  const d = r.details || {};
  if (d.ifsc) return (IFSC_BANKS[d.ifsc.slice(0, 4)] || 'Bank') + ' · ' + d.ifsc;
  if (d.bic) return 'BIC ' + d.bic;
  if (d.routing) return (d.accountType || 'Checking') + ' · Routing ' + d.routing;

  if (d.bsb) return 'BSB ' + d.bsb.replace(/^(\d{3})/, '$1-');

  if (m.type === 'balance') return m.label;
  if (m.type === 'bank') return `${m.label} •••• ${m.last4}`;
  return `${m.label} •••• ${m.last4}`;
}
function methodsFor(src) {
  return allMethods().filter((m) => (m.type === 'balance' && m.cur === src) || (m.type === 'bank' && m.cur === src) || m.type === 'card');
}
function liveRate(src, dst) { return S.rates[dst] / S.rates[src]; }
function totalBalanceGBP() {
  return S.balances.GBP + S.balances.EUR / BASE_RATES.EUR + S.balances.USD / BASE_RATES.USD;
}
function transfersTo(rid) { return S.transfers.filter((t) => t.recipientId === rid); }
function lastTransferTo(rid) { return transfersTo(rid)[0]; }

/* ---------- Quote maths ----------
   Fees are added on top of the amount converted.
   send mode:    receive = floor(send × rate) to the recipient currency's minor unit
   receive mode: send    = ceil(receive ÷ rate) to 2dp so the recipient gets at least the amount asked for
*/
function computeQuote({ src, dst, mode, amount, rate, methodId, methodsList }) {
  const cor = corridorFor(src, dst) || { pct: 0, eta: 1 };
  const dS = minorUnits(src), dD = minorUnits(dst);
  let send, receive;
  if (mode === 'receive') { receive = roundTo(amount || 0, dD); send = receive > 0 ? ceilTo(receive / rate, dS) : 0; }
  else { send = roundTo(amount || 0, dS); receive = floorTo(send * rate, dD); }
  const m = methodsList === undefined ? getMethod(methodId) : getMethod(methodId, methodsList);
  const fixed = send > 0 ? FIXED_FEE[src] || 0.4 : 0;
  const variable = roundTo(send * cor.pct, dS);
  const methodFee = m && m.type === 'card' ? roundTo(send * CARD_FEE_PCT, dS) : 0;
  const feeTotal = roundTo(fixed + variable + methodFee, dS);
  return { send, receive, rate, total: roundTo(send + feeTotal, dS), fee: { fixed, variable, pct: cor.pct, method: methodFee, methodType: m ? m.type : null, total: feeTotal } };
}
function etaFor(src, dst, methodId, from = Date.now()) {
  const cor = corridorFor(src, dst) || { eta: 1 };
  const m = getMethod(methodId);
  const extra = m && m.type === 'bank' ? 1 : 0;
  return addWorkingDays(from, cor.eta + extra);
}

/* ---------- Transfer status helpers ---------- */
function hasEvent(t, type) { return t.events.some((e) => e.type === type); }
function eventAt(t, type) { const e = [...t.events].reverse().find((x) => x.type === type); return e ? e.at : null; }
function stageOf(t) {
  let s = 'created';
  STAGES.forEach((st) => { if (hasEvent(t, st)) s = st; });
  return s;
}
function statusOf(t) {
  const last = t.events[t.events.length - 1];
  if (hasEvent(t, 'completed')) return 'completed';
  if (hasEvent(t, 'cancelled')) return 'cancelled';
  if (hasEvent(t, 'returned')) return 'returned';
  if (hasEvent(t, 'failed')) return 'failed';
  if (hasEvent(t, 'verification') && !hasEvent(t, 'verified')) return 'verification';
  if (hasEvent(t, 'delayed')) return 'delayed';
  return 'processing';
}
function isTerminal(t) { return ['completed', 'cancelled', 'returned', 'failed'].includes(statusOf(t)); }
function canCancel(t) { return !isTerminal(t) && !hasEvent(t, 'sent'); }

/* ---------- Provider event ticker (simulated payment-provider webhooks) ---------- */
function applyEvent(t, type, at = Date.now(), quiet = false) {
  if (isTerminal(t)) return;
  t.events.push({ type, at });
  if (type === 'delayed') t.eta = addWorkingDays(t.eta, 2);
  if (type === 'returned' || type === 'failed' || type === 'cancelled') refundTransfer(t);
  if (type === 'completed') t.completedAt = at;
  if (!quiet) notifyForEvent(t, type);
}
function refundTransfer(t) {
  const m = getMethod(t.methodId);
  if (m && m.type === 'balance' && !t.refunded) {
    S.balances[m.cur] = roundTo(S.balances[m.cur] + t.total, 2);
    t.refunded = true;
  }
}
const EVENT_NOTICE = {
  funded: (t) => ({ kind: 'updates', title: 'Payment confirmed', body: `Your ${fmt(t.total, t.src)} transfer to ${t.snap.name} is being processed.` }),
  sent: (t) => ({ kind: 'updates', title: 'Sent to their bank', body: `${fmt(t.receive, t.dst)} is on its way to ${firstName(t.snap.name)}’s bank. Expected ${arrivalPhrase(t.eta)}.` }),
  completed: (t) => ({ kind: 'updates', title: 'Money delivered', body: `${fmt(t.receive, t.dst)} is now in ${t.snap.name}’s account.` }),
  verification: (t) => ({ kind: 'security', title: 'Action needed', body: `Verify your identity so we can send ${fmt(t.receive, t.dst)} to ${t.snap.name}.` }),
  delayed: (t) => ({ kind: 'delays', title: 'Transfer delayed', body: `${t.snap.name}’s bank is taking longer than usual. New estimate: ${arrivalLabel(t.eta)}.` }),
  returned: (t) => ({ kind: 'updates', title: 'Transfer returned', body: `${t.snap.name}’s bank returned the money. We’ve refunded ${fmt(t.total, t.src)}.` }),
  failed: (t) => ({ kind: 'updates', title: 'Transfer failed', body: `We couldn’t complete your transfer to ${t.snap.name}. ${t.refunded ? 'Your money has been refunded.' : ''}` }),
};
function notifyForEvent(t, type) {
  const f = EVENT_NOTICE[type];
  if (!f) return;
  const n = f(t);
  const prefs = S.settings.notif;
  if (n.kind === 'updates' && (!prefs.updates || !t.notify)) return;
  if (n.kind === 'delays' && !prefs.delays) return;
  pushNotification({ ...n, transferId: t.id });
}
function pushNotification(n) {
  const note = { id: uid('n'), at: Date.now(), read: false, ...n };
  S.notifications.unshift(note);
  if (S.notifications.length > 40) S.notifications.length = 40;
  emit('notification', note);
}
function tick() {
  if (!S) return;
  const now = Date.now();
  let changed = false;
  S.transfers.forEach((t) => {
    if (!t.schedule || !t.schedule.length) return;
    // provider events are only received while online
    if (isOffline()) return;
    while (t.schedule.length && t.schedule[0].at <= now) {
      const ev = t.schedule.shift();
      if (isTerminal(t)) { t.schedule = []; break; }
      if (ev.type === 'verification') { applyEvent(t, 'verification', ev.at); t.schedule = []; changed = true; break; }
      applyEvent(t, ev.type, Math.max(ev.at, now - 2000));
      changed = true;
    }

}
function isOffline() { return S.sim.offline || (typeof navigator !== 'undefined' && navigator.onLine === false); }

/* ---------- Simulated market movement ---------- */
function driftRates(force) {
  if (isOffline()) return;
  const r = S.rates;
  Object.keys(r).forEach((k) => {
    if (k === 'GBP') return;
    const base = BASE_RATES[k];
    const step = force != null ? force : (Math.random() - 0.5) * 0.0011;
    r[k] = clamp(r[k] * (1 + step), base * 0.9965, base * 1.0035);
  });
  S.ratesAt = Date.now();
  checkAlerts();
  save();
  emit('rates');
}
function checkAlerts() {
  S.alerts.forEach((a) => {
    if (!a.active) return;
    const rate = liveRate(a.src, a.dst);
    if (rate >= a.target) {
      a.active = false; a.triggeredAt = Date.now();
      if (S.settings.notif.rates) pushNotification({ kind: 'rates', title: 'Rate alert', body: `1 ${a.src} is now ${rateNum(rate)} ${a.dst}, above your target of ${rateNum(a.target)}.` });
    }
  });
}

/* ============================================================
   Mock payment API. Every call has realistic latency and can fail the way a
   real provider can: offline, expired quotes, declined cards, dropped
   connections. Submission is idempotent: the same key never creates two transfers.
   ============================================================ */

class ApiError extends Error {
  constructor(code, message) { super(message || code); this.code = code; }
}
const api = {
  async _net(ms) {
    if (isOffline()) { await delay(250); throw new ApiError('offline', 'You’re offline.'); }
    await delay(ms + Math.random() * ms * 0.4);
    if (isOffline()) throw new ApiError('offline', 'You’re offline.');
  },

  async quote({ src, dst, lock }) {
    await this._net(lock ? 520 : 380);
    const st = corridorStatus(src, dst);
    if (!st.ok) throw new ApiError('unsupported', st.reason);
    const rate = liveRate(src, dst);
    const guaranteed = !!lock && corridorFor(src, dst).guar;
    const now = Date.now();
    return { id: uid('q'), src, dst, rate, createdAt: now, guaranteed, locked: !!lock, expiresAt: guaranteed ? now + QUOTE_TTL : null };
  },

  async verifyPayee({ iban, name }) {
    await this._net(700);
    const holder = PAYEE_REGISTRY[iban];
    if (!holder) return { result: 'unavailable' };
    const a = normName(name), b = normName(holder);
    if (a === b) return { result: 'match', holder };
    const [af, ...ar] = a.split(' '), [bf, ...br] = b.split(' ');
    const aLast = ar.join(' '), bLast = br.join(' ');
    if (levenshtein(a, b) <= 2 || (aLast === bLast && af[0] === bf[0]) || (af === bf && levenshtein(aLast, bLast) <= 2)) return { result: 'close', holder };
    return { result: 'nomatch' };
  },

  async submitTransfer(payload, idemKey) {
    if (isOffline()) { await delay(300); throw new ApiError('offline'); }
    await delay(900 + Math.random() * 300);
    if (isOffline()) throw new ApiError('offline');
    // Idempotency: a retried request returns the transfer already created.
    if (S.idem[idemKey]) return { transfer: getTransfer(S.idem[idemKey]), replay: true };
    const m = getMethod(payload.methodId);
    if (m.type === 'card' && S.sim.declineCard) throw new ApiError('declined', 'Your card payment was declined.');
    if (m.type === 'card' && payload.send > CARD_MAX) throw new ApiError('limit', 'Card payments are limited to ' + fmt(CARD_MAX, payload.src) + '.');
    if (m.type === 'balance' && S.balances[m.cur] < payload.total) throw new ApiError('insufficient', 'Not enough money in your balance.');
    if (payload.quote.guaranteed && payload.quote.expiresAt < Date.now() - 1500) throw new ApiError('expired', 'Your exchange rate has expired.');

    const t = createTransfer(payload);
    S.idem[idemKey] = t.id;
    save();
    if (S.sim.dropNext) {
      // The transfer was created, but the response never reaches the app.
      S.sim.dropNext = false;
      save();
      emit('sim');
      throw new ApiError('timeout', 'The connection dropped before we heard back.');
    }
    return { transfer: t, replay: false };
  },

  async lookupByKey(idemKey) {
    await this._net(900);
    const id = S.idem[idemKey];
    return id ? getTransfer(id) : null;
  },

  async refresh() {
    await this._net(650);
    tick();
    return true;
  },

  async cancel(id) {
    await this._net(700);
    const t = getTransfer(id);
    if (!canCancel(t)) throw new ApiError('too-late', 'This transfer has already been sent to the recipient’s bank, so it can’t be cancelled.');
    t.schedule = [];
    applyEvent(t, 'cancelled', Date.now(), true);
    save();
    return t;
  },

  async addMoney(amount, cur = 'GBP') {
    await this._net(900);
    S.balances[cur] = roundTo(S.balances[cur] + amount, 2);
    save();
    return S.balances[cur];
  },

  async submitVerification(id) {
    await this._net(1100);
    const t = getTransfer(id);
    t.events.push({ type: 'verified', at: Date.now() });
    const now = Date.now();
    t.schedule = [
      { type: 'processing', at: now + 3 * SECOND },
      { type: 'sent', at: now + 30 * SECOND },
      { type: 'completed', at: now + 100 * SECOND },
    ];
    save();
    return t;
  },

  async addCard({ number, exp, name }) {
    await this._net(1300);
    const network = number[0] === '4' ? 'Visa' : /^5[1-5]|^2[2-7]/.test(number) ? 'Mastercard' : 'Card';
    const card = { id: uid('card'), type: 'card', network, label: network + ' debit', last4: number.slice(-4), exp, holder: name };
    S.methods.push(card);
    save();
    return card;
  },
};

function createTransfer(p) {
  const now = Date.now();
  const r = getRecipient(p.recipientId);
  const m = getMethod(p.methodId);
  const t = {
    id: uid('t'), ref: makeRef(), recipientId: r.id, snap: snapRecipient(r),
    src: p.src, dst: p.dst, send: p.send, receive: p.receive, fee: p.fee, total: p.total, rate: p.quote.rate, guaranteed: p.quote.guaranteed,
    methodId: m.id, methodLabel: methodLabelFor(m.id), createdAt: now, eta: etaFor(p.src, p.dst, m.id, now),
    events: [{ type: 'created', at: now }], schedule: [], notify: p.notify !== false,
    reference: p.reference || '', purpose: p.purpose || null,
  };
  if (m.type === 'balance') S.balances[m.cur] = roundTo(S.balances[m.cur] - p.total, 2);
  const fundDelay = m.type === 'bank' ? 22 * SECOND : 3 * SECOND;
  if (S.sim.requireVerification) {
    t.schedule = [{ type: 'funded', at: now + fundDelay }, { type: 'verification', at: now + fundDelay + 4 * SECOND }];
    S.sim.requireVerification = false;
    emit('sim');
  } else {
    t.schedule = [
      { type: 'funded', at: now + fundDelay },
      { type: 'processing', at: now + fundDelay + 4 * SECOND },
      { type: 'sent', at: now + fundDelay + 38 * SECOND },
      { type: 'completed', at: now + fundDelay + 110 * SECOND },
    ];
  }
  S.transfers.unshift(t);
  r.lastUsed = now;
  if (!S.recentCurrencies.includes(p.dst)) S.recentCurrencies.unshift(p.dst);
  else S.recentCurrencies = [p.dst, ...S.recentCurrencies.filter((c) => c !== p.dst)];
  S.recentCurrencies = S.recentCurrencies.slice(0, 4);
  return t;
}

/* ============================================================
   UI infrastructure: navigation stack, transitions, tab bar, sheets,
   dialogs, toasts, banners, pull-to-refresh, keyboard inset, app lock
   ============================================================ */

const SCREENS = {};
const ACTIONS = {};
const nav = { stack: [], current: null };
const TABS = [
  { id: 'home', label: 'Home', icon: 'home' },
  { id: 'transfers', label: 'Transfers', icon: 'transfers' },
  { id: 'activity', label: 'Activity', icon: 'activity' },
  { id: 'profile', label: 'Profile', icon: 'user' },

const els = {};
function reducedMotion() { return S.settings.reduceMotion || window.matchMedia('(prefers-reduced-motion: reduce)').matches; }

/* ---------- Navigation ---------- */
function go(route, params = {}, opts = {}) {
  saveScroll();

  render(opts.anim || 'push');
}

}

  return true;
}

  render(anim);
}
function switchTab(tab) {

    return;

function render(anim = 'push') {

  if (!cur.def.live) return;

  cur.cleanup = cur.def.mount ? cur.def.mount(cur.el, cur.entry.params, cur.entry) : null;

/* ---------- Tab bar ---------- */

/* ---------- Shared screen chrome ---------- */

/* ---------- Sheets ---------- */
const sheetStack = [];
function openSheet({ title, body = '', foot = '', className = '', onMount, onClose, label, dismissible = true, id } = {}) {

  wrap.className = 'sheet-wrap';
  const prevFocus = document.activeElement;
  const titleId = uid('st');

    <div class="sheet ${className}" role="dialog" aria-modal="true" aria-labelledby="${titleId}" tabindex="-1" ${id ? `id="${id}"` : ''}>
      <div class="sheet-handle" aria-hidden="true"></div>

      <div class="sheet-body${foot ? '' : ' last'}">${body}</div>

    dismissible,

    close(reason) {

  };
  sheetStack.push(ctl);
  requestAnimationFrame(() => requestAnimationFrame(() => { sheet.classList.add('on'); scrim.classList.add('on'); }));
  scrim.addEventListener('click', () => { if (ctl.dismissible) ctl.close('scrim'); });
  wrap.addEventListener('click', (e) => { if (e.target.closest('[data-sheet-close]')) ctl.close('button'); });
  // drag to dismiss from the handle/header
  const head = $('.sheet-head', sheet), handle = $('.sheet-handle', sheet);
  let startY = null, dy = 0;
  const down = (e) => { if (!ctl.dismissible || e.target.closest('button')) return; startY = e.clientY; dy = 0; sheet.classList.add('dragging'); try { e.target.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } };
  const move = (e) => { if (startY == null) return; dy = Math.max(0, e.clientY - startY); sheet.style.transform = `translateY(${dy}px)`; };
  const up = () => { if (startY == null) return; sheet.classList.remove('dragging'); sheet.style.transform = ''; if (dy > 90) ctl.close('drag'); startY = null; };
  [head, handle].forEach((h) => { h.addEventListener('pointerdown', down); h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up); });
  try { onMount && onMount(ctl); } catch (e) { console.error(e); }
  setTimeout(() => {
    const f = $('[data-autofocus]', sheet);
    try { (f || sheet).focus({ preventScroll: true }); } catch (e) { /* ignore */ }
  }, 60);
  return ctl;
}
function closeAllSheets() { [...sheetStack].reverse().forEach((s) => s.close('nav')); }

/* ---------- Dialog ---------- */
function confirmDialog({ title, body, confirm = 'Confirm', cancel = 'Cancel', danger = false }) {
  return new Promise((resolve) => {
    const layer = els.sheetLayer;
    layer.style.pointerEvents = 'auto';
    const prevFocus = document.activeElement;
    const wrap = document.createElement('div');
    const tid = uid('dt');
    wrap.innerHTML = `<div class="scrim"></div><div class="dialog-wrap"><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="${tid}" aria-describedby="${tid}b">
      <h2 id="${tid}">${esc(title)}</h2><p id="${tid}b">${esc(body)}</p>
      <div class="dialog-actions"><button class="btn md ${danger ? 'btn-danger' : 'btn-primary'}" data-r="1">${esc(confirm)}</button><button class="btn md btn-ghost" data-r="0">${esc(cancel)}</button></div></div></div>`;
    layer.appendChild(wrap);
    const dlg = $('.dialog', wrap), scrim = $('.scrim', wrap);
    if (nav.current) nav.current.el.inert = true;
    els.tabbar.inert = true;
    sheetStack.forEach((s) => { s.sheet.inert = true; });
    requestAnimationFrame(() => requestAnimationFrame(() => { dlg.classList.add('on'); scrim.classList.add('on'); }));
    const done = (v) => {
      dlg.classList.remove('on'); scrim.classList.remove('on');
      setTimeout(() => { wrap.remove(); if (!layer.children.length) layer.style.pointerEvents = 'none'; }, 200);
      if (sheetStack.length) sheetStack[sheetStack.length - 1].sheet.inert = false;
      else { if (nav.current) nav.current.el.inert = false; els.tabbar.inert = false; }
      document.removeEventListener('keydown', onKey, true);
      if (prevFocus && document.contains(prevFocus)) try { prevFocus.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
      resolve(v);
    };
    const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } };
    document.addEventListener('keydown', onKey, true);
    wrap.addEventListener('click', (e) => { const b = e.target.closest('[data-r]'); if (b) done(b.dataset.r === '1'); });
    scrim.addEventListener('click', () => done(false));
    setTimeout(() => $('[data-r="0"]', wrap).focus(), 40);
  });
}

/* ---------- Pull to refresh ---------- */
function enablePTR(screenEl, onRefresh) {
  const sc = $('.scroll', screenEl);
  if (!sc) return () => {};
  const ind = document.createElement('div');
  ind.className = 'ptr';
  ind.setAttribute('aria-hidden', 'true');
  ind.innerHTML = ic('refresh');
  screenEl.appendChild(ind);
  let y0 = null, dist = 0, busy = false;
  const ts = (e) => { if (busy || sc.scrollTop > 0) { y0 = null; return; } y0 = e.touches[0].clientY; dist = 0; };
  const tm = (e) => {
    if (y0 == null) return;
    dist = e.touches[0].clientY - y0;
    if (dist > 0 && sc.scrollTop <= 0) {
      const d = Math.min(90, dist * 0.5);
      ind.classList.add('pulling');
      ind.style.transform = `translateY(${d - 48 + 60}px)`;
      $('.i', ind).style.transform = `rotate(${d * 4}deg)`;
      if (e.cancelable) e.preventDefault();
    }
  };
  const te = async () => {
    if (y0 == null) return;
    y0 = null;
    const topOff = screenEl.querySelector('.topbar, .home-head');
    if (dist * 0.5 > 60) {
      busy = true; ind.classList.add('spinning'); ind.style.transform = `translateY(${(topOff ? topOff.offsetHeight : 0) + 8}px)`;
      haptic('light');
      try { await onRefresh(); } finally { busy = false; ind.classList.remove('spinning', 'pulling'); ind.style.transform = ''; }
    } else { ind.classList.remove('pulling'); ind.style.transform = ''; }
  };
  sc.addEventListener('touchstart', ts, { passive: true });
  sc.addEventListener('touchmove', tm, { passive: false });
  sc.addEventListener('touchend', te);
  return () => { sc.removeEventListener('touchstart', ts); sc.removeEventListener('touchmove', tm); sc.removeEventListener('touchend', te); ind.remove(); };
}

function watchIdle() {
