/* ---------- Global delegated actions ---------- */
function bindGlobal() {
  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-act]');
    if (!a || a.closest('[inert]')) return;
    if (a.getAttribute('aria-disabled') === 'true' && !a.dataset.allowDisabled) { e.preventDefault(); return; }
    const fn = ACTIONS[a.dataset.act];
    if (fn) { e.preventDefault(); fn(a, e); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      const s = topSheet();
      if (s && s.dismissible) { e.preventDefault(); s.close('escape'); return; }
    }
    if (e.key === 'Tab') {
      // keep focus inside the topmost modal surface
      const scope = $('#lock') || (topSheet() && topSheet().sheet);
      if (!scope) return;
      const f = $$('button:not([disabled]):not([hidden]), input:not([disabled]), select, textarea, [tabindex]:not([tabindex="-1"])', scope).filter((x) => x.offsetParent !== null);
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  });
}

async function copyText(text, msg = 'Copied') {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove();
    } catch (e2) { ok = false; }
  }
  if (ok) { toast(msg); haptic('light'); announce(msg); }
  else toast('Couldn’t copy. Select the text to copy it manually.', 'alertCircle');

}

/* ============================================================
   Transfer flow: Recipient → Amount → Breakdown → Payment → Review →
   Authorisation → Submitted
   ============================================================ */

let DRAFT = null;
let SUBMITTING = false;
function newDraft(o = {}) {
  DRAFT = Object.assign({
    id: uid('d'), recipientId: null, src: 'GBP', dst: 'EUR', mode: 'send', amount: 0,
    methodId: 'bal-GBP', quote: null, rateChange: null, needsAck: false, purpose: null, scamAck: false, mismatchAck: false,
    reference: '', notify: true, saveTemplate: false, idemKey: null, dirty: false, flow: 'recipient-first', origin: 'new',
  }, o);
  if (!DRAFT.methodId || !methodsFor(DRAFT.src).some((m) => m.id === DRAFT.methodId)) DRAFT.methodId = 'bal-' + DRAFT.src;
  return DRAFT;
}
function ensureDraft() { if (!DRAFT) newDraft(); return DRAFT; }
function prefillFromHistory() {
  const last = DRAFT.recipientId && lastTransferTo(DRAFT.recipientId);
  if (last && last.src === DRAFT.src && last.dst === DRAFT.dst) { DRAFT.amount = last.send; DRAFT.mode = 'send'; DRAFT.prefilled = true; }
}
function flowStep(route) {
  const order = DRAFT && DRAFT.flow === 'amount-first' ? ['amount', 'recipients', 'quote', 'payment', 'review'] : ['recipients', 'amount', 'quote', 'payment', 'review'];
  return [order.indexOf(route) + 1, 5];
}
function draftRate() {
  const d = DRAFT;
  if (d.quote && d.quote.locked && d.quote.src === d.src && d.quote.dst === d.dst) return d.quote.rate;
  return liveRate(d.src, d.dst);
}
function draftCalc(methodId) {
  const d = DRAFT;
  return computeQuote({ src: d.src, dst: d.dst, mode: d.mode, amount: d.amount, rate: draftRate(), methodId: methodId || d.methodId });
}
function quoteState() {
  const q = DRAFT && DRAFT.quote;
  if (!q || !q.locked || q.src !== DRAFT.src || q.dst !== DRAFT.dst) return 'none';
  if (!q.guaranteed) return 'indicative';
  return Date.now() >= q.expiresAt ? 'expired' : 'valid';
}
function validityHtml() {
  const q = DRAFT.quote, st = quoteState();
  if (st === 'valid') {
    const left = q.expiresAt - Date.now();
    return `<div class="validity" role="timer" aria-live="off"><span class="ring ${left < 30000 ? 'low' : ''}" style="--p:${clamp(left / QUOTE_TTL, 0, 1)}" aria-hidden="true"></span><span>Rate guaranteed for <b class="vt">${mmss(left)}</b></span></div>`;
  }
  if (st === 'indicative') return `<div class="validity">${ic('info', 'sm')}<span>Estimated rate. ${CUR[DRAFT.dst].name} rates can’t be guaranteed in advance.</span></div>`;
  return '';
}
/* Keeps ring + countdown in sync; re-renders the screen at the moment of expiry */
function startCountdown(el, onExpire) {
  let wasValid = quoteState() === 'valid';
  let warned = false;
  const id = setInterval(() => {
    const st = quoteState();
    if (st === 'valid') {
      const left = DRAFT.quote.expiresAt - Date.now();
      $$('.validity .vt', el).forEach((n) => { n.textContent = mmss(left); });
      $$('.validity .ring', el).forEach((n) => { n.style.setProperty('--p', clamp(left / QUOTE_TTL, 0, 1)); n.classList.toggle('low', left < 30000); });
      if (left < 30000 && !warned) { warned = true; announce('Your guaranteed rate expires in 30 seconds.'); }
    } else if (wasValid && st === 'expired') {
      wasValid = false;
      announce('Your exchange rate has expired. Get an updated rate to continue.', true);
      haptic('warning');
      onExpire && onExpire();
    }
  }, 1000);
  return () => clearInterval(id);
}
async function lockQuote() {
  const d = DRAFT;
  const prev = d.quote && d.quote.locked && d.quote.src === d.src && d.quote.dst === d.dst ? d.quote : null;
  const prevCalc = prev ? computeQuote({ src: d.src, dst: d.dst, mode: d.mode, amount: d.amount, rate: prev.rate, methodId: d.methodId }) : null;
  const q = await api.quote({ src: d.src, dst: d.dst, lock: true });
  d.quote = q;
  setTimeout(renderConsole, 0);
  if (prev && Math.abs(prev.rate - q.rate) > 1e-9) {
    d.rateChange = { oldRate: prev.rate, newRate: q.rate, oldCalc: prevCalc, newCalc: draftCalc() };
    d.needsAck = true;
  } else { d.rateChange = null; d.needsAck = false; }
  return q;
}
function rateChangeCallout() {
  const rc = DRAFT.rateChange;
  if (!rc || !DRAFT.needsAck) return '';
  const better = rc.newRate > rc.oldRate;
  const line = DRAFT.mode === 'receive'
    ? `You’ll now pay <b>${esc(fmt(rc.newCalc.total, DRAFT.src))}</b> instead of ${esc(fmt(rc.oldCalc.total, DRAFT.src))}.`
    : `They’ll now receive <b>${esc(fmt(rc.newCalc.receive, DRAFT.dst))}</b> instead of ${esc(fmt(rc.oldCalc.receive, DRAFT.dst))}.`;
  return `<div class="callout ${better ? 'info' : 'warn'} mt16" role="alert">${ic('refresh')}<div class="callout-body"><strong>The rate has changed</strong>
    The rate moved from ${rateNum(rc.oldRate)} to ${rateNum(rc.newRate)}. ${line}
    <div class="callout-actions"><button class="btn sm btn-primary" data-act="accept-rate">Accept new rate</button></div></div></div>`;
}
function expiredCallout() {
  if (quoteState() !== 'expired') return '';
  return `<div class="callout warn mt16" role="alert">${ic('clock')}<div class="callout-body"><strong>Your exchange rate has expired.</strong>
    Guaranteed rates last 2 minutes. Get an updated rate to continue. If it changes, we’ll show you the new amounts before you send.
    <div class="callout-actions"><button class="btn sm btn-primary" data-act="requote" id="requote-btn">${ic('refresh')}<span>Get updated rate</span></button></div></div></div>`;
}
Object.assign(ACTIONS, {
  'accept-rate': () => { DRAFT.needsAck = false; haptic('light'); announce('New rate accepted.'); refreshScreen(); },
  requote: async (a) => {
    a.classList.add('is-loading');
    try { await lockQuote(); haptic('light'); announce(DRAFT.needsAck ? 'The rate has changed. Review the new amounts.' : 'Rate updated and guaranteed for 2 minutes.'); }
    catch (e) { toast(e.code === 'offline' ? 'You’re offline. Connect to get an updated rate.' : 'Couldn’t get a rate. Try again.', e.code === 'offline' ? 'wifiOff' : 'alertCircle'); }
    refreshScreen();
  },
});

        body: `<div style="display:flex;gap:14px;align-items:center;margin-bottom:14px">${curFlag(DRAFT.dst, 44)}<p class="small" style="line-height:1.5">${esc(r.name)}’s bank account in ${esc(COUNTRY[r.country].name)} holds ${esc(CUR[DRAFT.dst].plural)}, so the receiving currency is set by their account.</p></div><p class="muted small">To send a different currency, choose another recipient or add new account details.</p>`,

  swap: (a) => {
    const d = DRAFT;
    const r = getRecipient(d.recipientId);
    if (r) {
      haptic('warning');
      openSheet({ title: 'Swapping isn’t available', body: `<p class="small" style="line-height:1.55">${esc(r.name)}’s account receives ${esc(CUR[d.dst].plural)}, so you can’t send the other way to this recipient. You can still change the currency you send from.</p>` });
      return;
    }
    const st = corridorStatus(d.dst, d.src);
    if (!st.ok) { haptic('warning'); openSheet({ title: `You can’t send from ${d.dst}`, body: `<p class="small" style="line-height:1.55">${esc(st.reason)}</p>` }); return; }

});
function pickCurrency(side) {
  const d = DRAFT;
  const isSrc = side === 'src';
  const current = isSrc ? d.src : d.dst;
  const items = isSrc ? SOURCES : DEST_ORDER;
  const status = (c) => isSrc ? corridorStatus(c, d.dst) : corridorStatus(d.src, c);
  const row = (c) => {
    const st = status(c);
    const sub = isSrc ? (st.ok ? `${CUR[c].name} · balance ${fmt(S.balances[c], c)}` : st.reason) : (st.ok ? CUR[c].name : st.reason);
    return `<button class="row" data-cur="${c}" ${st.ok ? '' : 'aria-disabled="true"'} aria-label="${esc(`${c}, ${CUR[c].name}. ${st.ok ? (c === current ? 'Selected' : '') : 'Not available. ' + st.reason}`)}">${curFlag(c, 34)}<span class="row-main" aria-hidden="true"><span class="row-title">${c}</span><span class="row-sub${st.ok ? '' : ' wrap'}">${esc(sub)}</span></span>${c === current ? `<span style="color:var(--primary-text)">${ic('check')}</span>` : ''}</button>`;
  };
  openSheet({
    title: isSrc ? 'Send from' : 'They receive',
    className: isSrc ? '' : 'tall',
    body: `${isSrc ? '' : `<div class="search"><label class="sr" for="cur-search">Search currencies</label>${ic('search')}<input id="cur-search" type="search" placeholder="Search currency or country" autocomplete="off" data-autofocus></div>`}<div id="cur-list"></div>`,
    onMount(ctl) {
      const list = $('#cur-list', ctl.el), inp = $('#cur-search', ctl.el);
      const draw = () => {
        const q = inp ? normName(inp.value) : '';
        const match = (c) => !q || normName(`${c} ${CUR[c].name} ${COUNTRIES.filter((x) => x.cur === c).map((x) => x.name).join(' ')}`).includes(q);
        if (isSrc) { list.innerHTML = `<div class="list">${items.map(row).join('')}</div><p class="caption mt12">GLOBAL balances hold GBP, EUR and USD.</p>`; return; }
        const avail = items.filter((c) => status(c).ok && match(c)), unavailable = items.filter((c) => !status(c).ok && match(c));
        const recent = q ? [] : S.recentCurrencies.filter((c) => status(c).ok && c !== d.src).slice(0, 3);
        list.innerHTML = (recent.length ? `<div class="group-label">Recently used</div><div class="list">${recent.map(row).join('')}</div>` : '')
          + (avail.length ? `<div class="group-label">Available from ${d.src}</div><div class="list">${avail.filter((c) => !recent.includes(c)).map(row).join('')}</div>` : '')
          + (unavailable.length ? `<div class="group-label">Not available from ${d.src}</div><div class="list">${unavailable.map(row).join('')}</div>` : '')
          + (!avail.length && !unavailable.length ? `<p class="muted center mt24">No currencies match “${esc(inp.value)}”.</p>` : '');
      };
      draw();
      if (inp) inp.addEventListener('input', draw);
      list.addEventListener('click', (e) => {
        const b = e.target.closest('[data-cur]'); if (!b) return;
        if (b.getAttribute('aria-disabled') === 'true') { haptic('warning'); announce(status(b.dataset.cur).reason); return; }
        const c = b.dataset.cur;
        ctl.close('pick');
        haptic('select');
        if (c === current) return;
        if (isSrc) { d.src = c; d.methodId = 'bal-' + c; } else d.dst = c;
        const sc = nav.current.el;
        sc._setCurBtns();
        sc._refreshQuote('currency');
        announce(isSrc ? `Now sending from ${CUR[c].plural}.` : `They now receive ${CUR[c].plural}.`);
      });
    },
  });
}

  if (r && !transfersTo(r.id).length && !d.purpose) out.push('Tell us what this payment is for to continue.');
  if (r && (r.nameCheck === 'nomatch' || r.nameCheck === 'close') && !d.mismatchAck) out.push('Confirm you’ve checked the recipient’s details.');
  return out;
}

const DEMO_PASSCODE = '246810';
let pinFails = 0, pinLockedUntil = 0;
function faceSvg() {
  return `<svg viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M14 30V22a8 8 0 0 1 8-8h8M66 14h8a8 8 0 0 1 8 8v8M82 66v8a8 8 0 0 1-8 8h-8M30 82h-8a8 8 0 0 1-8-8v-8"/>
    <path d="M36 38v5M60 38v5M48 38v15h-4M38 62c5 5 15 5 20 0"/>
    <circle class="scan" cx="48" cy="48" r="44" stroke-width="1.6" opacity=".5"/></svg>`;

/* Generic authentication sheet. Resolves true/false. If onAuthed is given, the sheet stays open and hands over control. */
function authenticate({ title, subtitle, amountHtml = '', passcode = false, allowCancel = true, onAuthed } = {}) {
  return new Promise((resolve) => {
    let settled = false;
    const finish = (v, ctl) => { if (settled) return; settled = true; if (v && onAuthed) onAuthed(ctl); else if (ctl && !(v && onAuthed)) ctl.close('auth'); resolve(v); };
    const ctl = openSheet({
      title: '', label: title, dismissible: allowCancel,
      body: `<div class="auth" id="auth-body"></div>`,
      onClose: (reason) => { if (!settled) { settled = true; resolve(false); } },
      onMount(c) {
        const body = $('#auth-body', c.el);
        const head = `<h2>${esc(title)}</h2>${amountHtml ? `<p class="auth-amt">${amountHtml}</p>` : subtitle ? `<p class="auth-amt">${esc(subtitle)}</p>` : ''}`;
        const face = () => {
          if (!S.settings.faceId) { pin(); return; }
          body.innerHTML = `${head}<div class="faceid" id="fid">${faceSvg()}</div><p class="auth-status" id="fid-status" role="status">Look at your phone to confirm with Face ID</p>
            <div class="stack-sm mt16" style="width:100%"><button class="btn btn-ghost md" id="use-pin">Use passcode instead</button>${allowCancel ? '<button class="btn btn-ghost md" data-sheet-close style="color:var(--fg-2)">Cancel</button>' : ''}</div>`;
          $('#use-pin', body).addEventListener('click', pin);
          const t = setTimeout(() => {
            if (!document.contains(body)) return;
            const fid = $('#fid', body), stt = $('#fid-status', body);
            if (!fid) return;
            if (S.sim.faceIdFail) {
              fid.classList.add('fail'); stt.textContent = 'Face not recognised'; haptic('error'); announce('Face not recognised. Try again or use your passcode.', true);
              const again = document.createElement('button');
              again.className = 'btn btn-secondary md'; again.textContent = 'Try Face ID again';
              again.addEventListener('click', face);
              $('.stack-sm', body).prepend(again);
              again.focus();
            } else {
              fid.classList.add('ok'); $('.scan', fid).style.display = 'none'; stt.textContent = 'Confirmed'; haptic('success'); announce('Face ID confirmed');
              setTimeout(() => finish(true, c), 380);
            }
          }, 1250);
          c._t = t;
        };
        const pin = () => {
          clearTimeout(c._t);
          let code = '';
          const lockedFor = () => Math.max(0, pinLockedUntil - Date.now());
          body.innerHTML = `${head}<p class="auth-status" id="pin-status" role="status">Enter your 6-digit passcode</p>
            <div class="pin-dots" id="pin-dots" aria-hidden="true">${'<span></span>'.repeat(6)}</div>
            <p class="caption">Prototype passcode: 2 4 6 8 1 0</p>
            <div class="keypad" role="group" aria-label="Passcode keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button class="key" data-k="${n}">${n}</button>`).join('')}<button class="key fn" ${allowCancel ? 'data-sheet-close' : 'disabled'}>${allowCancel ? 'Cancel' : ''}</button><button class="key" data-k="0">0</button><button class="key fn" data-k="del" aria-label="Delete">${ic('backspace')}</button></div>`;
          const dots = $('#pin-dots', body), stt = $('#pin-status', body);
          const paint = () => $$('span', dots).forEach((s, i) => s.classList.toggle('on', i < code.length));
          const press = (k) => {
            if (lockedFor()) return;
            if (k === 'del') { code = code.slice(0, -1); paint(); return; }
            if (code.length >= 6) return;
            code += k; paint(); haptic('select');
            stt.textContent = `${code.length} of 6 digits entered`;
            if (code.length === 6) setTimeout(check, 120);
          };
          const check = () => {
            if (code === DEMO_PASSCODE) { pinFails = 0; stt.textContent = 'Passcode accepted'; haptic('success'); setTimeout(() => finish(true, c), 200); return; }
            pinFails++; code = ''; paint(); dots.classList.remove('err'); void dots.offsetWidth; dots.classList.add('err'); haptic('error');
            if (pinFails >= 5) {
              pinLockedUntil = Date.now() + 30000; pinFails = 0;
              const tick2 = setInterval(() => { const l = lockedFor(); if (!document.contains(stt)) { clearInterval(tick2); return; } stt.textContent = l ? `Too many attempts. Try again in ${Math.ceil(l / 1000)} seconds.` : 'Enter your 6-digit passcode'; if (!l) clearInterval(tick2); }, 500);
              announce('Too many incorrect attempts. Try again in 30 seconds.', true);
            } else { stt.textContent = `Incorrect passcode. ${5 - pinFails} attempt${5 - pinFails === 1 ? '' : 's'} left.`; announce(stt.textContent, true); }
          };
          body.addEventListener('click', (e) => { const k = e.target.closest('[data-k]'); if (k) press(k.dataset.k); });
          c._key = (e) => { if (/^\d$/.test(e.key)) { e.preventDefault(); press(e.key); } else if (e.key === 'Backspace') { e.preventDefault(); press('del'); } };
          document.addEventListener('keydown', c._key);
          setTimeout(() => { const f = $('[data-k="1"]', body); if (f) f.focus({ preventScroll: true }); }, 80);
        };
        c._cleanup = () => { clearTimeout(c._t); if (c._key) document.removeEventListener('keydown', c._key); };
        if (passcode) pin(); else face();
      },
    });
    const origClose = ctl.close;
    ctl.close = (r) => { ctl._cleanup && ctl._cleanup(); origClose(r); };
  });
}

/* Build the timeline only from stages the provider has actually reported, plus pending ones */
function timelineSteps(t) {
  const st = statusOf(t);
  const steps = [];
  const reached = STAGES.filter((s) => hasEvent(t, s));
  const lastStage = reached[reached.length - 1];
  STAGES.forEach((s) => {
    const at = eventAt(t, s);
    if (at) steps.push({ key: s, label: STAGE_LABEL[s], desc: STAGE_DESC[s], state: 'done', time: whenLabel(at) });
  });
  if (hasEvent(t, 'verification')) {
    const verified = hasEvent(t, 'verified');
    const idx = steps.findIndex((x) => x.key === 'funded');
    steps.splice(idx + 1, 0, verified
      ? { key: 'verified', label: 'Identity verified', desc: 'Thanks for confirming it’s you. We’ve continued processing your transfer.', state: 'done', time: whenLabel(eventAt(t, 'verified')) }
      : { key: 'verification', label: 'Verification required', desc: 'We need to confirm your identity before we can continue. This usually takes about 2 minutes.', state: 'warn', time: 'Action needed' });
  }
  if (st === 'cancelled') { steps.push({ key: 'cancelled', label: 'Cancelled', desc: t.refunded ? `You cancelled this transfer. ${fmt(t.total, t.src)} was returned to your balance.` : 'You cancelled this transfer before it was sent. Any money taken will be returned to the original payment method within 3 working days.', state: 'neutral', time: whenLabel(eventAt(t, 'cancelled')) }); return steps; }
  if (st === 'failed') { steps.push({ key: 'failed', label: 'Transfer failed', desc: t.failureReason || 'We couldn’t complete this transfer. Nothing was sent to the recipient.', state: 'err', time: whenLabel(eventAt(t, 'failed')) }); return steps; }
  if (st === 'returned') { steps.push({ key: 'returned', label: 'Returned by their bank', desc: t.failureReason || `The recipient’s bank sent the money back. We’ve refunded ${fmt(t.total, t.src)}.`, state: 'warn', time: whenLabel(eventAt(t, 'returned')) }); return steps; }
  if (st === 'completed') return steps;
  // pending stages after the last reached one
  const nextIdx = STAGES.indexOf(lastStage) + 1;
  STAGES.slice(nextIdx).forEach((s, i) => {
    const isCurrent = i === 0 && st !== 'verification';
    steps.push({ key: s, label: STAGE_LABEL[s], desc: STAGE_DESC[s], state: isCurrent ? (st === 'delayed' ? 'warn' : 'current') : 'pending', time: isCurrent ? (st === 'delayed' ? 'Delayed' : 'In progress') : 'Pending' });
  });
  if (st === 'delayed') {
    const cur = steps.find((x) => x.state === 'warn' && x.key !== 'verification');
    if (cur) cur.desc = `${t.snap.name}’s bank is taking longer than usual to process the payment. Our latest estimate is ${arrivalLabel(t.eta)}. We’ll update you if this changes.`;
  }
  return steps;
}
function timelineHtml(t) {
  return `<div class="timeline" role="list">${timelineSteps(t).map((s, i) => {
    const icon = s.state === 'done' ? ic('check') : s.state === 'warn' ? ic(s.key === 'verification' ? 'alert' : s.key === 'returned' ? 'undo' : 'clock') : s.state === 'err' ? ic('x') : s.state === 'neutral' ? ic('ban') : '';
    const stateWord = { done: 'Completed', current: 'Current status', pending: 'Pending', warn: 'Needs attention', err: 'Failed', neutral: 'Stopped' }[s.state];

const ACT_FILTERS = [
  { id: 'all', label: 'All' },

const actState = { filter: 'all', q: '', shown: 12 };
function filterTransfers() {
  const q = normQ(actState.q);
  const qRaw = actState.q.trim().toLowerCase();
  return S.transfers.filter((t) => {
    const st = statusOf(t);
    if (actState.filter === 'completed' && st !== 'completed') return false;
    if (actState.filter === 'processing' && !['processing', 'verification', 'delayed'].includes(st)) return false;
    if (actState.filter === 'problem' && !['failed', 'returned', 'cancelled'].includes(st)) return false;
    if (!qRaw) return true;
    const d = new Date(t.createdAt);
    const hay = normQ([t.snap.name, t.dst, CUR[t.dst].name, COUNTRY[t.snap.country].name, MON_LONG[d.getMonth()], MON[d.getMonth()], d.getDate() + ' ' + MON[d.getMonth()], DOW_LONG[d.getDay()], STATUS_META[st].label, t.reference || ''].join(' '));
    return hay.includes(q) || t.ref.toLowerCase().includes(qRaw) || t.ref.replace(/-/g, '').toLowerCase().includes(qRaw.replace(/[-\s]/g, '')) || String(t.send).includes(qRaw) || fmt(t.total, t.src).toLowerCase().includes(qRaw);
  });
}

    el._draw = draw;

      list.innerHTML = `<div aria-busy="true" aria-label="Loading transfers"><div class="sk" style="width:80px;height:12px;margin:22px 0 12px"></div><div class="list">${Array.from({ length: 5 }, () => `<div class="sk-row"><div class="sk sk-circle"></div><div style="flex:1;display:grid;gap:8px"><div class="sk sk-line" style="width:48%"></div><div class="sk sk-line" style="width:30%;height:10px"></div></div><div style="display:grid;gap:8px;justify-items:end"><div class="sk sk-line" style="width:64px"></div><div class="sk sk-line" style="width:48px;height:10px"></div></div></div>`).join('')}</div></div>`;
      timer = setTimeout(() => { activityLoaded = true; draw(); }, 650);
    } else draw();
    let qT = null;
    inp.addEventListener('input', () => {
      clr.hidden = !inp.value;
      clearTimeout(qT);
      qT = setTimeout(() => { actState.q = inp.value; actState.shown = 12; if (activityLoaded) { draw(); const n = filterTransfers().length; announce(`${n} transfer${n === 1 ? '' : 's'} found`); } }, 160);
    });
    clr.addEventListener('click', () => { inp.value = ''; actState.q = ''; clr.hidden = true; actState.shown = 12; draw(); inp.focus(); });
    $$('[data-filter]', el).forEach((c) => c.addEventListener('click', () => {
      actState.filter = c.dataset.filter; actState.shown = 12;
      $$('[data-filter]', el).forEach((x) => x.setAttribute('aria-pressed', x === c ? 'true' : 'false'));
      haptic('select');
      if (activityLoaded) { draw(); const n = filterTransfers().length; announce(`${c.textContent}: ${n} transfer${n === 1 ? '' : 's'}`); }
    }));
    const offPtr = enablePTR(el, async () => { try { await api.refresh(); draw(); toast('Updated just now'); } catch (e) { toast('You’re offline. Showing saved activity.', 'wifiOff'); } });
    return () => { offPtr(); if (obs) obs.disconnect(); clearTimeout(timer); clearTimeout(qT); };
  },
  update(el) { if (activityLoaded && el._draw) { const sc = $('.scroll', el), top = sc.scrollTop; el._draw(); sc.scrollTop = top; } },
};
Object.assign(ACTIONS, {
  'reset-activity': () => { actState.q = ''; actState.filter = 'all'; actState.shown = 12; resetTo(['activity'], 'none'); },

/* ---------- Support chat (simulated) ---------- */
function supportReply(text, t) {
  const s = text.toLowerCase();
  const st = t ? statusOf(t) : null;
  if (/cancel|stop/.test(s)) return t ? (canCancel(t) ? 'You can still cancel this one. Go back to the transfer and tap Cancel transfer. If it was paid from your balance, the money comes back straight away.' : 'This transfer has already been sent to the recipient’s bank, so we can’t cancel it. If something’s wrong, tell me what happened and I’ll ask our payments team to contact their bank.') : 'You can cancel a transfer until we send it to the recipient’s bank. Open it from Activity and tap Cancel transfer.';
  if (/fee|cost|charge|expensive/.test(s)) return t ? `Your fee was ${fmt(t.fee.total, t.src)}: a fixed ${fmt(t.fee.fixed, t.src)} plus ${(t.fee.pct * 100).toFixed(2)}% of the amount converted${t.fee.method ? `, and ${fmt(t.fee.method, t.src)} for paying by card` : ''}. We don’t add anything to the exchange rate.` : 'Our fee is a small fixed amount plus a percentage that depends on the currency. You see the exact breakdown before you pay.';
  if (/where|when|late|delay|arriv|money|received|hasn/.test(s)) {
    if (!t) return 'Can you tell me which transfer you mean? You can open it from Activity and tap Contact support so I can see the details.';
    if (st === 'completed') return `This transfer completed on ${longDate(eventAt(t, 'completed'))}. If ${firstName(t.snap.name)} can’t see it yet, their bank may still be updating their balance. The reference ${t.ref} will help their bank find it.`;
    if (st === 'verification') return 'It’s waiting for a quick identity check. Once you complete it in the app, the transfer carries on straight away.';
    if (st === 'delayed') return `${firstName(t.snap.name)}’s bank is taking longer than usual. Our latest estimate is ${arrivalLabel(t.eta)}. I’ve added a note to keep an eye on it, and you’ll get a notification when it moves.`;
    return `It’s currently at “${STAGE_LABEL[stageOf(t)]}” and on track to arrive ${arrivalPhrase(t.eta)}. I’ll stay on this chat if you need anything else.`;
  }
  if (/wrong|mistake|incorrect|typo/.test(s)) return 'Thanks for telling us quickly. I’ve flagged this to our payments team. If the money hasn’t reached the recipient’s bank, we’ll try to stop it. We’ll update you here within 2 hours.';
  if (/thank|cheers|great|ok/.test(s)) return 'You’re welcome. Is there anything else I can help with?';
  return 'Thanks, I’ve passed this to a specialist who’ll reply here, usually within 2 hours. We’ll send you a notification when they do.';
}

function hexToRgb(h) {
  h = h.trim();
  if (h.startsWith('rgb')) { const m = h.match(/[\d.]+/g).map(Number); return m.slice(0, 3); }
  h = h.replace('#', '');
  if (h.length === 3) h = h.split('').map((c) => c + c).join('');
  return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16));
}
function lum(rgb) {
  const [r, g, b] = rgb.map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function contrast(a, b) { const la = lum(hexToRgb(a)), lb = lum(hexToRgb(b)); return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05); }

      <p class="c-note" style="margin-top:0">Each button resets the sample data, opens the task’s starting point and times the attempt. Rates hold for 10 minutes and prototype shortcuts are hidden. Links work too: add #task1 … #task6 to the address.</p>
      <ol class="c-tasks">
        <li>Send £250 to Marie in France.</li>
        <li>Make Marie receive exactly €300.</li>
        <li>Explain the total cost.</li>
        <li>Find when the money will arrive.</li>
        <li>Check the transfer to Priya.</li>
        <li>Fix a wrong IBAN for a new recipient.</li>
      </ol>
      <div class="c-btns">${[1, 2, 3, 4, 5, 6].map((n) => `<button class="c-btn" data-c="tm" data-v="${n}">Task ${n}</button>`).join('')}</div>
    </section>
    <section class="c-sec"><h2>Colour contrast · ${esc(els.device.dataset.appearance === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches || document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light') : els.device.dataset.appearance)} theme</h2>
      <table class="c-contrast"><tbody>${pairs.map(([label, f, b]) => { const r = contrast(tok(f), tok(b)); return `<tr><td><span class="sw" style="background:${tok(b)};box-shadow:inset 0 0 0 4px ${tok(f)}"></span>${esc(label)}</td><td class="${r >= 4.5 ? 'pass' : 'fail'}">${r.toFixed(2)}:1 ${r >= 4.5 ? 'AA' : 'Fail'}</td></tr>`; }).join('')}</tbody></table>
      <p class="c-note">Measured live from the phone’s tokens. The brief’s amber #B86100 measures ${contrast('#B86100', '#FFFFFF').toFixed(2)}:1 on white, just under AA for body text, so warning text uses a deeper #A35600.</p>
    </section>`;
}
function renderConsole() {
  const c = els.console;
  if (c && getComputedStyle(c).display !== 'none') {
    const top = c.scrollTop;
    c.innerHTML = consoleHtml(false);
    c.scrollTop = top;
  }
  if (currentRoute() === 'demo') { const box = $('#demo-box'); if (box) box.innerHTML = consoleHtml(true); }
}
function bindConsole() {
  document.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-c]');
    if (!b || b.disabled) return;
    const c = b.dataset.c;
    const t = consoleTarget();
    if (c === 'sim') {
      const k = b.dataset.k;
      S.sim[k] = !S.sim[k];
      save(); emit('sim');
      if (k === 'offline') { updateOfflineBar(); if (!S.sim.offline) { tick(); emit('online'); } }
    }
    if (c === 'advance' && t) {
      if (t.schedule.length) { const ev = t.schedule.shift(); if (ev.type === 'verification') { applyEvent(t, 'verification'); t.schedule = []; } else applyEvent(t, ev.type); }
      else { const nxt = STAGES[STAGES.indexOf(stageOf(t)) + 1]; if (nxt) applyEvent(t, nxt); }
      // keep later scheduled events in order after a manual jump
      const now = Date.now();
      t.schedule.forEach((s, i) => { s.at = Math.max(s.at, now + (i + 1) * 8000); });
      save(); emit('transfers');
    }
    if (c === 'delay' && t) {
      applyEvent(t, 'delayed');
      const now = Date.now();
      t.schedule.forEach((s, i) => { s.at = now + 60000 + i * 30000; });
      save(); emit('transfers');
    }
    if (c === 'return' && t) {
      t.schedule = [];
      t.failureReason = `The recipient’s bank returned the payment because the account details didn’t match their records. ${getMethod(t.methodId) && getMethod(t.methodId).type === 'balance' ? `We’ve refunded ${fmt(t.total, t.src)} to your balance.` : 'We’ll refund your payment within 3 working days.'}`;
      applyEvent(t, 'returned');
      save(); emit('transfers');
    }
    if (c === 'open-t' && t) { closeAllSheets(); nav.stack = [{ route: 'activity', params: {} }]; go('tracking', { id: t.id }); }
    if (c === 'expire' && DRAFT && DRAFT.quote) { DRAFT.quote.expiresAt = Date.now() - 1; }
    if (c === 'rate-up') driftRates(0.0012);
    if (c === 'rate-down') driftRates(-0.0012);
    if (c === 'tm') { location.hash = 'task' + b.dataset.v; return; }
    if (c === 'appearance') { S.settings.appearance = b.dataset.v; save(); applySettings(); refreshScreen(); }
    if (c === 'text') { S.settings.textScale = Number(b.dataset.v); save(); applySettings(); refreshScreen(); }
    if (c === 'empty') {
      if (S.recipients.length) { S._stash = S.recipients; S.recipients = []; toast('Recipients removed. Try sending money to see the empty state.', 'info'); }
      else { S.recipients = S._stash && S._stash.length ? S._stash : seedState().recipients; S._stash = null; toast('Sample recipients restored'); }
      save(); refreshScreen();
    }
    if (c === 'reset') {
      const ok = await confirmDialog({ title: 'Reset the prototype?', body: 'This restores the sample balances, recipients and transfers, and clears anything you’ve added.', confirm: 'Reset', danger: true });
      if (!ok) return;
      closeAllSheets(); resetDemo(); applySettings(); updateOfflineBar(); resetTo(['home'], 'fade'); toast('Prototype reset');
    }
    renderConsole();
  });
}
SCREENS.demo = {
  label: 'Prototype controls', showTabbar: true,
  render() {
    return `${topbar({ back: true })}
      <div class="scroll"><h1 class="title">Prototype controls</h1>
        <p class="title-sub">Trigger the situations a real transfer can run into. Everything here uses sample data.</p>
        <div class="console-inline" id="demo-box">${consoleHtml(true)}</div>
      </div>`;
  },
};

/* ============================================================
   Boot
   ============================================================ */
function catchUpSchedules() {
  // Apply provider events that happened while the app was closed, without a burst of banners.
  const now = Date.now();
  S.transfers.forEach((t) => {
    while (t.schedule && t.schedule.length && t.schedule[0].at <= now) {
      const ev = t.schedule.shift();
      if (isTerminal(t)) { t.schedule = []; break; }
      applyEvent(t, ev.type, ev.at, true);
      if (ev.type === 'verification') { t.schedule = []; break; }
    }
  });
}
function updateClock() { const el = document.getElementById('sb-time'); if (el) { const d = new Date(); el.textContent = d.getHours() + ':' + pad2(d.getMinutes()); } }

function boot() {
  S = loadState();
  catchUpSchedules();
  save();
  Object.assign(els, {
    device: $('#device'), app: $('#app'), screens: $('#screens'), tabbar: $('#tabbar'),
    sheetLayer: $('#sheet-layer'), toasts: $('#toasts'), banners: $('#banners'), offlineBar: $('#offline-bar'), console: $('#console'),
  });
  els.sheetLayer.style.pointerEvents = 'none';
  renderTabbar();
  applySettings();
  bindGlobal();
  bindConsole();
  watchKeyboard();
  watchIdle();
  updateOfflineBar();
  resetTo(['home'], 'none');
  renderConsole();
  updateClock();

  setInterval(tick, 1000);
  setInterval(() => driftRates(), 25000);
  setInterval(updateClock, 15000);

  onChange((kind, detail) => {
    if (kind === 'transfers' || kind === 'balance') {
      const watch = kind === 'transfers' ? ['home', 'activity', 'tracking', 'details', 'submitted', 'recipient', 'notifications', 'transfers'] : ['home', 'payment', 'review', 'methods', 'profile'];
      if (watch.includes(currentRoute())) refreshScreen();
      updateTabbar(nav.current.def); renderConsole();
    }
    if (kind === 'notification') {
      const n = detail;
      const onIt = n.transferId && nav.current && nav.current.entry.params && nav.current.entry.params.id === n.transferId;
      if (S.settings.notif.push && !onIt && !locked) {
        banner({
          title: n.title, body: n.body,
          action: n.transferId ? { label: 'View', fn: () => { closeAllSheets(); const t = getTransfer(n.transferId); n.read = true; save(); if (n.kind === 'security' && statusOf(t) === 'verification') go('verify', { id: t.id }); else go(isTerminal(t) ? 'details' : 'tracking', { id: t.id }); } } : null,
        });
      }
      announce(n.title + '. ' + n.body);
      if (currentRoute() === 'home' || currentRoute() === 'notifications') refreshScreen();
    }
    if (kind === 'rates') {
      const cur = nav.current;
      if (cur && cur.def.onRates) cur.def.onRates(cur.el);
      if (cur && (cur.entry.route === 'transfers')) refreshScreen();
      renderConsole();
    }
    if (kind === 'sim' || kind === 'online') { updateOfflineBar(); renderConsole(); }
    if (kind === 'settings') renderConsole();
  });

  window.addEventListener('online', () => { updateOfflineBar(); tick(); emit('online'); });
  window.addEventListener('offline', () => { updateOfflineBar(); emit('online'); });
  window.matchMedia('(max-width: 899px), (max-height: 680px)').addEventListener('change', () => { applySettings(); renderConsole(); });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => renderConsole());
  new MutationObserver(() => renderConsole()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

/* ============================================================
   Usability test mode
   Supports the six tasks in the test plan (Figma page 11).
   Open the prototype with #task1 … #task6 to reset the sample
   data, set the task's starting point and time the attempt.
   Test mode also holds rates for 10 minutes (so a think-aloud
   doesn't expire the quote) and hides prototype-only shortcuts.
   ============================================================ */

const TM = { on: false, task: null, startedAt: null, running: false, log: null, barEl: null, cardEl: null };
const TM_TTL = 10 * 60 * SECOND;
const TM_CAMILLE = { name: 'Camille Laurent', good: 'FR1420041010050500013M02606', bad: 'FR1420041010050500013M02696' };

const TM_TASKS = {
  1: {
    title: 'Send money to France',
    say: 'Your friend Marie lives in France. She needs £250 from you for her share of the rent. Please send it to her.',
    start: () => { DRAFT = null; resetTo(['home'], 'none'); },
    check: () => { const t = S.transfers[0]; return !!t && t.createdAt >= TM.startedAt && t.recipientId === 'r_marie' && Math.abs(t.send - 250) < 0.005 && t.dst === 'EUR'; },
  },
  2: {
    title: 'An exact amount',
    say: 'Marie tells you the rent is exactly €300. Change the transfer so that she gets exactly €300, then carry on to the next step.',
    start: () => tmStartAmount(),
    check: () => !!DRAFT && DRAFT.mode === 'receive' && Math.abs(draftCalc().receive - 300) < 0.005 && ['quote', 'payment', 'review', 'submitted'].includes(currentRoute()),
  },
  3: {
    title: 'The total cost',
    say: 'Carry on with this transfer. Before you send it, tell me how much it costs you in total, and what you’re paying for.',
    start: () => tmStartAmount(),
    check: null, // judged by the facilitator: £251.60 total, including a £1.60 fee
  },
  4: {
    title: 'When it arrives',
    say: 'Carry on with this transfer. When will Marie actually have the money?',
    start: () => tmStartAmount(),
    check: null, // judged by the facilitator: tomorrow
  },
  5: {
    title: 'A transfer already sent',
    say: 'You sent some money to Priya in India earlier today. Find out where it is now.',
    start: () => { DRAFT = null; resetTo(['home'], 'none'); },
    check: () => { const e = currentEntry(); const t = e && e.params && e.params.id ? getTransfer(e.params.id) : null; return currentRoute() === 'tracking' && !!t && t.recipientId === 'r_priya'; },
  },
  6: {
    title: 'Fix a wrong detail',
    say: 'You’re adding Camille, a new person to pay in France. One character of her IBAN was typed wrongly. Use the details Camille sent you to find it and put it right, then save her.',
    ref: `Camille sent you: ${TM_CAMILLE.name} · IBAN FR14 2004 1010 0505 0001 3M02 606`,
    start: () => {
      newDraft({ flow: 'recipient-first' });
      resetTo(['home', 'recipients', { route: 'recipientAdd', params: { returnTo: 'flow', country: 'FR', _form: { country: 'FR', type: null, values: { name: TM_CAMILLE.name, iban: TM_CAMILLE.bad }, touched: { iban: true }, check: null } } }], 'none');
    },
    check: () => S.recipients.some((r) => r.details && r.details.iban === TM_CAMILLE.good && r.addedAt >= TM.startedAt),
  },
};

function tmStartAmount() {
  newDraft({ flow: 'recipient-first', recipientId: 'r_marie', dst: 'EUR', origin: 'quick' });
  DRAFT.amount = 250; DRAFT.mode = 'send';
  resetTo(['home', 'amount'], 'none');
}

function tmEnable() {
  if (TM.on) return;
  TM.on = true;
  QUOTE_TTL = TM_TTL;
  document.body.classList.add('tm-on');
  els.device.classList.add('tm-on');
  if (!TM.barEl) {
    TM.barEl = document.createElement('div');
    TM.barEl.className = 'tm-bar'; TM.barEl.hidden = true; TM.barEl.setAttribute('role', 'region'); TM.barEl.setAttribute('aria-label', 'Test task');
    els.app.insertBefore(TM.barEl, els.app.firstChild);
  }
}
function tmDisable() {
  TM.on = false; TM.running = false; TM.task = null;
  QUOTE_TTL = 120 * SECOND;
  document.body.classList.remove('tm-on'); els.device.classList.remove('tm-on');
  if (TM.barEl) TM.barEl.hidden = true;
  tmCloseCard();
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignore */ }
}

function tmStartTask(n) {
  const def = TM_TASKS[n]; if (!def) return;
  tmEnable();
  closeAllSheets();
  resetDemo(); applySettings(); updateOfflineBar();
  QUOTE_TTL = TM_TTL;
  TM.task = n; TM.running = false; TM.startedAt = null;
  def.start();
  TM.barEl.hidden = true;
  tmShowCard(`
    <p class="tm-over">Task ${n} of 6</p>
    <h2 class="tm-title" id="tm-h">${esc(def.title)}</h2>
    <p class="tm-say">${esc(def.say)}</p>
    ${def.ref ? `<p class="tm-ref">${esc(def.ref)}</p>` : ''}
    <p class="tm-note">Think aloud as you go. When you think you’ve finished, tap <b>Done</b> at the top of the screen.</p>
    <button class="btn btn-primary" id="tm-go">Start task</button>`, () => {
    $('#tm-go').addEventListener('click', () => {
      tmCloseCard();
      TM.running = true; TM.startedAt = Date.now();
      TM.log = { task: n, screens: [currentRoute()], backs: 0, info: 0, help: 0 };
      tmRenderBar();
      announce(`Task ${n} started.`);
    });
  });
}

function tmRenderBar() {
  const def = TM_TASKS[TM.task];
  TM.barEl.hidden = false;
  TM.barEl.innerHTML = `<span class="tm-bar-t">Task ${TM.task} · ${esc(def.title)}</span>
    <button class="tm-bar-b" id="tm-task" aria-label="Show the task again">Task</button>
    <button class="tm-bar-b tm-done" id="tm-done">Done</button>`;
  $('#tm-done', TM.barEl).addEventListener('click', tmFinish);
  $('#tm-task', TM.barEl).addEventListener('click', () => {
    tmShowCard(`<p class="tm-over">Task ${TM.task} of 6</p><h2 class="tm-title" id="tm-h">${esc(def.title)}</h2><p class="tm-say">${esc(def.say)}</p>${def.ref ? `<p class="tm-ref">${esc(def.ref)}</p>` : ''}<button class="btn btn-primary" id="tm-back">Back to the task</button>`, () => $('#tm-back').addEventListener('click', tmCloseCard));
  });
}

function tmFinish() {
  if (!TM.running) return;
  TM.running = false;
  const def = TM_TASKS[TM.task];
  const secs = Math.round((Date.now() - TM.startedAt) / 1000);
  const auto = def.check ? !!def.check() : null;
  const path = TM.log.screens.filter((r, i, a) => i === 0 || r !== a[i - 1]);
  const result = { task: TM.task, success: auto, judge: def.check ? 'auto' : 'facilitator', seconds: secs, screens: path, backs: TM.log.backs, infoOpened: TM.log.info, at: new Date().toISOString() };
  TM.barEl.hidden = true;
  const line = JSON.stringify(result);
  const next = TM.task < 6 ? TM.task + 1 : null;
  tmShowCard(`
    <p class="tm-over">Task ${TM.task} finished</p>
    <h2 class="tm-title" id="tm-h">Thank you</h2>
    <p class="tm-say">Please wait for the facilitator.</p>
    <details class="tm-fac"><summary>For the facilitator</summary>
      <dl class="tm-dl">
        <dt>Time</dt><dd>${mmss(secs * 1000)}</dd>
        <dt>Success criterion</dt><dd>${auto === null ? 'Judge from what they said' : auto ? 'Met' : 'Not met'}</dd>
        <dt>Screens</dt><dd>${esc(path.join(' → '))}</dd>
        <dt>Back taps</dt><dd>${result.backs}</dd>
        <dt>Info opened</dt><dd>${result.infoOpened}</dd>
      </dl>
      <p class="tm-note">Paste this line into the session logger:</p>
      <code class="tm-code" id="tm-line">${esc(line)}</code>
      <div class="tm-btns"><button class="btn sm btn-outline" id="tm-copy">Copy result</button>
        ${next ? `<button class="btn sm btn-primary" id="tm-next">Start task ${next}</button>` : ''}
        <button class="btn sm btn-ghost" id="tm-again">Repeat task ${TM.task}</button>
        <button class="btn sm btn-ghost" id="tm-exit">Exit test mode</button></div>
    </details>`, () => {
    $('#tm-copy').addEventListener('click', () => copyText(line, 'Result copied'));
    if (next) $('#tm-next').addEventListener('click', () => { location.hash = 'task' + next; });
    $('#tm-again').addEventListener('click', () => tmStartTask(TM.task));
    $('#tm-exit').addEventListener('click', () => { tmDisable(); resetTo(['home'], 'fade'); });
  });
}

function tmShowCard(html, bind) {
  tmCloseCard();
  const wrap = document.createElement('div');
  wrap.className = 'tm-card-wrap';
  wrap.innerHTML = `<div class="tm-card" role="dialog" aria-modal="true" aria-labelledby="tm-h" tabindex="-1">${html}</div>`;
  els.app.appendChild(wrap);
  TM.cardEl = wrap;
  if (bind) bind();
  setTimeout(() => { const c = $('.tm-card', wrap); if (c) c.focus({ preventScroll: true }); }, 30);
}
function tmCloseCard() { if (TM.cardEl) { TM.cardEl.remove(); TM.cardEl = null; } }

function tmFromHash() {
  const h = (location.hash || '').slice(1);
  const m = /^task([1-6])$/.exec(h);
  if (m) { tmStartTask(Number(m[1])); return; }
  if (h === 'test') tmEnable();
}

function initTestMode() {
  // Record the route path and back taps while a task is running.
  const baseRender = render;
  render = function (anim) {
    const out = baseRender.apply(this, arguments);
    if (TM.running && TM.log) { TM.log.screens.push(currentRoute()); if (anim === 'pop') TM.log.backs++; }
    return out;
  };
  document.addEventListener('click', (e) => {
    if (!TM.running || !TM.log) return;
    const a = e.target.closest('[data-act]');
    if (a && /-(info|detail)$/.test(a.dataset.act)) TM.log.info++;
  }, true);
  window.addEventListener('hashchange', tmFromHash);
  tmFromHash();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initTestMode); else setTimeout(initTestMode, 0);

</script>
