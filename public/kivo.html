html { font-size: calc(16px * var(--ts)); -webkit-text-size-adjust: 100%; height: 100%; }
body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 0.9375rem; line-height: 1.5; -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss01'; overflow: hidden; }
*, *::before, *::after { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
a { color: var(--brand-text); }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; letter-spacing: -0.02em; font-weight: 620; }
p { text-wrap: pretty; }
ul, ol { margin: 0; padding: 0; list-style: none; }
img, svg { max-width: 100%; }
[hidden] { display: none !important; }
.sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.i.sm { width: 18px; height: 18px; }
.i.xs { width: 15px; height: 15px; }
.i.lg { width: 28px; height: 28px; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
h1[tabindex="-1"]:focus, h2[tabindex="-1"]:focus, [data-autofocus][tabindex="-1"]:focus { outline: none; }
.muted { color: var(--fg-2); }
.small { font-size: 0.8125rem; }
.micro { font-size: 0.75rem; }
.strong { font-weight: 620; }
.ok-t { color: var(--success); }
.warn-t { color: var(--warning); }
.err-t { color: var(--error); }
.brand-t { color: var(--brand-text); }
.center { text-align: center; }
.pad-x { padding: 0 16px; }
.row-gap { display: flex; gap: var(--sp2); align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: var(--sp3); }
.stack-sm { display: flex; flex-direction: column; gap: var(--sp2); }
.stack-lg { display: flex; flex-direction: column; gap: var(--sp6); }
.spacer { flex: 1; }
.eyebrow { font-size: 0.8125rem; font-weight: 560; color: var(--fg-2); }
.demo-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--fill); color: var(--fg-2); vertical-align: middle; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Wordmark ---------- */
.wordmark { display: inline-flex; align-items: center; gap: 10px; font-weight: 750; letter-spacing: 0.16em; font-size: 1rem; color: var(--fg); }
.wordmark .mark { width: 30px; height: 30px; }
.wordmark.lg .mark { width: 40px; height: 40px; }
.wordmark.lg { font-size: 1.1875rem; gap: 12px; }

/* ============================================================
   Shell
   ============================================================ */
.app { position: fixed; inset: 0; display: flex; background: var(--bg); color: var(--fg); overflow: hidden; }
.main { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
.screens { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scroll-padding-top: 72px; }
.content { width: 100%; max-width: 600px; margin: 0 auto; padding: var(--sp2) var(--gutter) calc(var(--sp8) + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: var(--sp7); }
.screen.has-tabbar .content { padding-bottom: calc(var(--tabbar-h) + var(--sp8) + env(safe-area-inset-bottom, 0px)); }
.screen.has-footer .content { padding-bottom: calc(132px + env(safe-area-inset-bottom, 0px)); }
.screen.has-tabbar.has-footer .content { padding-bottom: calc(var(--tabbar-h) + 132px + env(safe-area-inset-bottom, 0px)); }
.content.tight { gap: var(--sp5); }
.topbar { position: relative; z-index: 3; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--sp2); min-height: 54px; padding: calc(env(safe-area-inset-top, 0px) + 4px) 8px 2px; background: var(--bg); transition: box-shadow var(--dur); }
.topbar.scrolled { box-shadow: 0 1px 0 var(--hair); }
.tb-side { display: flex; align-items: center; gap: 2px; min-width: 0; }
.tb-side.right { justify-content: flex-end; }
.tb-title { font-weight: 600; font-size: 0.9375rem; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 56vw; opacity: 0; transition: opacity var(--dur) var(--ease); }
.topbar.scrolled .tb-title, .topbar.always .tb-title { opacity: 1; }
.progress-dots { display: flex; gap: 6px; }
.progress-dots span { width: 22px; height: 4px; border-radius: 4px; background: var(--border-2); transition: background var(--dur); }
.progress-dots span.on { background: var(--brand); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--sp3) var(--sp4); padding-top: var(--sp2); flex-wrap: wrap; }
.page-head h1 { font-size: 1.75rem; font-weight: 640; letter-spacing: -0.03em; line-height: 1.15; }
.page-head .sub { margin-top: 4px; color: var(--fg-2); font-size: 0.9375rem; }
.page-head .eyebrow { margin-bottom: 6px; }
.ph-actions { display: flex; gap: var(--sp2); flex: none; }
.ph-text { min-width: 0; flex: 1 1 260px; }
.home-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp3); padding: calc(env(safe-area-inset-top, 0px) + 14px) var(--gutter) 6px; max-width: 600px; width: 100%; margin: 0 auto; }
.home-head h1 { font-size: 1.375rem; font-weight: 640; letter-spacing: -0.025em; line-height: 1.2; }
.home-head .sub { color: var(--fg-2); font-size: 0.875rem; margin-top: 2px; }
.head-actions { display: flex; align-items: center; gap: 6px; }

/* bottom tab bar */
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4); border-top: 1px solid var(--hair); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 54px; border-radius: 14px; color: var(--fg-2); font-size: 0.6875rem; font-weight: 560; position: relative; transition: color var(--dur) var(--ease); }
.tab .i { width: 23px; height: 23px; }
.tab .tab-pill { display: grid; place-items: center; width: 44px; height: 28px; border-radius: 999px; transition: transform 140ms var(--ease); }

/* ============================================================

/* ============================================================

/* service monogram tiles */

.s1 { background: var(--sb1); color: var(--s1); } .s2 { background: var(--sb2); color: var(--s2); } .s3 { background: var(--sb3); color: var(--s3); } .s4 { background: var(--sb4); color: var(--s4); } .s5 { background: var(--sb5); color: var(--s5); }
.s6 { background: var(--sb6); color: var(--s6); } .s7 { background: var(--sb7); color: var(--s7); } .s8 { background: var(--sb8); color: var(--s8); } .s9 { background: var(--sb9); color: var(--s9); } .s10 { background: var(--sb10); color: var(--s10); }

/* ============================================================
   Rows & lists
   ============================================================ */
.list { display: flex; flex-direction: column; }

   ============================================================ */

/* ============================================================
   Forms
   ============================================================ */

.input, .textarea, .select, .select-field { width: 100%; min-height: 52px; padding: 0 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--control); font-size: 1rem; transition: border-color var(--dur), box-shadow var(--dur); }

.input:focus, .textarea:focus, .select:focus, .select-field:focus-visible { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); outline: none; }

.input-wrap { position: relative; display: flex; align-items: center; }

.two-fields { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp3); }
.switch { position: relative; width: 52px; height: 32px; border-radius: 999px; background: var(--border-2); flex: none; transition: background var(--dur) var(--ease); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--control) 50%, transparent); }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform var(--dur) var(--ease); }

.radio-row { display: flex; align-items: center; gap: var(--sp3); min-height: 58px; padding: 8px var(--sp4); width: 100%; text-align: left; border-radius: 14px; }

.radio-row[aria-checked="true"] .rdot { border-color: var(--brand); border-width: 2px; }
.radio-row[aria-checked="true"] .rdot::after { content: ''; width: 11px; height: 11px; border-radius: 50%; background: var(--brand); }
.radio-row:hover { background: var(--surface-2); }
.checkbox { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--control); display: grid; place-items: center; flex: none; color: transparent; background: var(--surface); transition: background var(--dur), border-color var(--dur); }
[aria-checked="true"] > .checkbox, [aria-pressed="true"] > .checkbox, .checkbox.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.checkbox .i { width: 15px; height: 15px; stroke-width: 2.6; }

/* date picker */
.dp { display: flex; flex-direction: column; gap: 10px; }
.dp-head { display: flex; align-items: center; justify-content: space-between; }
.dp-title { font-weight: 660; font-size: 1.0625rem; }
.dp-dow, .dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.dp-dow span { font-size: 0.75rem; font-weight: 650; color: var(--fg-2); padding: 4px 0; }
.dp-cell { height: 44px; border-radius: 12px; font-weight: 600; font-variant-numeric: tabular-nums; transition: background var(--dur), color var(--dur); }
.dp-cell:hover:not([disabled]) { background: var(--surface-3); }
.dp-cell.today { box-shadow: inset 0 0 0 1.5px var(--border-2); }
.dp-cell.sel { background: var(--brand); color: var(--on-brand); box-shadow: none; }
.dp-cell[disabled] { color: var(--fg-3); cursor: not-allowed; opacity: .55; }

/* ============================================================
   Progress, rings
   ============================================================ */
.bar { position: relative; height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
.bar.thin { height: 5px; }
.bar.thick { height: 12px; }
.bar-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--brand); width: 0; transition: width 700ms var(--ease-out); }
.bar.warn .bar-fill { background: var(--warning-fill); }
.bar.ok .bar-fill { background: var(--success); }
.bar.cat .bar-fill { background: var(--sw); }
.ring { display: block; }
.ring .ring-track { stroke: var(--track); }
.ring .ring-fill { stroke: var(--brand); transition: stroke-dashoffset 900ms var(--ease-out); }
.ring.warn .ring-fill { stroke: var(--warning-fill); }
.ring.on-hero .ring-track { stroke: rgba(255,255,255,.18); }
.ring.on-hero .ring-fill { stroke: #fff; }
.ring-wrap { position: relative; display: grid; place-items: center; flex: none; }
.ring-wrap .ring-mid { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; align-content: center; }
.ring-mid .rm-v { font-weight: 720; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; font-size: 1.5rem; line-height: 1; }
.ring-mid .rm-l { font-size: 0.6875rem; font-weight: 600; color: var(--fg-2); margin-top: 2px; }

/* ============================================================
   Notices, empty states, skeletons
   ============================================================ */
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; background: var(--blue-soft); color: var(--fg); font-size: 0.875rem; line-height: 1.45; }
.notice > .i { width: 18px; height: 18px; flex: none; margin-top: 1px; color: var(--blue-text); }
.notice.warn { background: var(--warning-soft); }
.notice.warn > .i { color: var(--warning); }
.notice.error { background: var(--error-soft); }
.notice.error > .i { color: var(--error); }
.notice.success { background: var(--success-soft); }
.notice.success > .i { color: var(--success); }
.notice.brand { background: var(--brand-soft); color: var(--on-soft); }
.notice.brand > .i { color: var(--brand-text); }
.notice.plain { background: var(--fill); }
.notice.plain > .i { color: var(--fg-2); }
.notice .n-title { font-weight: 620; margin-bottom: 2px; }
.notice .n-body { flex: 1; min-width: 0; }
.notice .n-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--sp3); padding: var(--sp7) var(--sp5); }
.empty .empty-art { width: 120px; height: 96px; margin-bottom: var(--sp2); }
.empty h1, .empty h2, .empty h3 { font-size: 1.125rem; font-weight: 620; }
.empty p { color: var(--fg-2); max-width: 36ch; }
.empty .btn-row { justify-content: center; margin-top: var(--sp2); width: 100%; max-width: 380px; }
.sk { background: linear-gradient(90deg, var(--skeleton) 0%, var(--skeleton-hi) 50%, var(--skeleton) 100%); background-size: 200% 100%; animation: shimmer 1.3s ease-in-out infinite; border-radius: 10px; }
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

/* key-value */
.kv { display: flex; flex-direction: column; margin: 0; }
.kv > div { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp4); padding: 13px 0; }
.kv > div + div { box-shadow: inset 0 1px 0 var(--hair); }
.kv dt { color: var(--fg-2); font-size: 0.875rem; flex: none; max-width: 48%; }
.kv dd { margin: 0; text-align: right; font-weight: 560; font-size: 0.9375rem; min-width: 0; overflow-wrap: anywhere; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.kv dd .sub { display: block; color: var(--fg-2); font-weight: 450; font-size: 0.8125rem; }
.kv.card { padding: 2px var(--sp4); }

/* tables */
.tbl-wrap { overflow-x: auto; border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--hair); }
.tbl { width: 100%; border-collapse: collapse; font-size: 0.875rem; font-variant-numeric: tabular-nums; }
.tbl caption { text-align: left; padding: 12px 16px 4px; font-weight: 640; }
.tbl th, .tbl td { padding: 11px 16px; text-align: right; white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl thead th { color: var(--fg-2); font-weight: 600; font-size: 0.8125rem; border-bottom: 1px solid var(--hair); }
.tbl tbody tr + tr td, .tbl tbody tr + tr th { border-top: 1px solid var(--hair); }
.tbl tbody th { font-weight: 600; }
details.alt > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-weight: 620; font-size: 0.875rem; color: var(--brand-text); }
details.alt > summary::-webkit-details-marker { display: none; }
details.alt > summary .i { width: 16px; height: 16px; transition: transform var(--dur); }
details.alt[open] > summary .i { transform: rotate(180deg); }
details.alt[open] > summary { margin-bottom: 8px; }

/* ============================================================
   Charts
   ============================================================ */
.chart { position: relative; width: 100%; user-select: none; -webkit-user-select: none; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--fg-2); font-size: 11px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.chart text.now { fill: var(--fg); font-weight: 650; }
.chart text.zone-l { font-size: 10px; font-weight: 600; }
.chart .grid line { stroke: var(--grid); stroke-width: 1; }
.chart .zero { stroke: var(--axis); stroke-width: 1; }
.chart .line-actual { fill: none; stroke: var(--brand); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .line-est { fill: none; stroke: var(--brand); stroke-width: 2.5; stroke-dasharray: 2 6; stroke-linecap: round; }
.chart .area { fill: var(--brand); opacity: 0.08; }
.chart .future-zone { fill: var(--fill); opacity: .55; }
.chart .bar-rec { fill: var(--brand-soft-2); }
.chart .bar-rec.partial { opacity: .7; }
.chart .bar-exp { fill: none; stroke: var(--control); stroke-width: 1.25; stroke-dasharray: 3 3; }
.chart .nodata-rect { fill: url(#hatch); opacity: 0.6; }
.chart .ev-dot { fill: var(--surface); stroke: var(--brand); stroke-width: 2.25; }
.chart .ev-dot.down { stroke: var(--success); }
.chart .ev-dot.est { stroke-dasharray: 2 2; }
.chart .dot { stroke: var(--surface); stroke-width: 2.5; }
.chart-tip { position: absolute; z-index: 5; pointer-events: none; min-width: 120px; max-width: 240px; padding: 10px 12px; border-radius: 12px; background: var(--toast-bg); color: var(--toast-fg); font-size: 0.8125rem; box-shadow: var(--shadow-3); transform: translate(-50%, calc(-100% - 12px)); white-space: nowrap; }
.chart-tip .tt-v { font-weight: 700; font-size: 0.9375rem; font-variant-numeric: tabular-nums; }
.chart-tip .tt-l { opacity: 0.78; font-size: 0.75rem; }
.chart-tip .tt-row { display: flex; align-items: center; gap: 8px; }
.chart-tip .tt-key { width: 12px; height: 3px; border-radius: 2px; flex: none; background: var(--k); }
.chart-tip .tt-key.dash { background: repeating-linear-gradient(90deg, var(--k) 0 3px, transparent 3px 5px); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.8125rem; color: var(--fg-2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend .k-line { width: 18px; height: 0; border-top: 2.5px solid var(--brand); }
.legend .k-dash { width: 18px; height: 0; border-top: 2.5px dotted var(--brand); }
.legend .k-bar { width: 10px; height: 10px; border-radius: 3px; background: var(--brand-soft-2); }
.legend .k-barx { width: 10px; height: 10px; border-radius: 3px; border: 1.25px dashed var(--control); }
.legend .k-ev { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--brand); }
.legend .k-hatch { width: 12px; height: 10px; border-radius: 3px; background: repeating-linear-gradient(135deg, var(--border-2) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1px var(--border-2); }
.mini-stack text { fill: var(--fg-2); font-size: 10px; font-family: var(--font); }
.donut-wrap { position: relative; width: min(268px, 74vw); aspect-ratio: 1; margin: 0 auto; }
.donut-wrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
.donut-seg { cursor: pointer; transition: opacity var(--dur) var(--ease), transform 260ms var(--ease-out); transform-origin: 50% 50%; outline: none; }
.donut-seg.dim { opacity: 0.25; }
.donut-seg.sel { transform: scale(1.045); }
.donut-seg:focus-visible path { stroke: var(--fg); stroke-width: 2.5; }
.donut-mid { position: absolute; inset: 20%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2px; pointer-events: none; }
.donut-mid .dm-l { font-size: 0.8125rem; color: var(--fg-2); font-weight: 580; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.donut-mid .dm-v { font-size: 1.625rem; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.donut-mid .dm-s { font-size: 0.8125rem; color: var(--fg-2); }
.cat-list .row { min-height: 60px; }
.cat-list .row[aria-pressed="true"] { background: var(--brand-soft); }
.cat-share { width: 100%; height: 4px; background: var(--track); border-radius: 4px; margin-top: 7px; overflow: hidden; }
.cat-share > span { display: block; height: 100%; border-radius: 4px; background: var(--sw); transition: width 600ms var(--ease-out); }

/* ============================================================
   Sheets, dialogs, toasts
   ============================================================ */
.layer { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
.sheet-wrap, .dialog-layer { position: absolute; inset: 0; pointer-events: auto; }
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity 260ms var(--ease); }
.scrim.on { opacity: 1; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100% - 40px - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; background: var(--elevated); border-radius: 26px 26px 0 0; box-shadow: var(--shadow-3); transform: translateY(100%); transition: transform 320ms var(--ease-out); outline: none; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet.on { transform: translateY(0); }
.sheet.dragging { transition: none; }
.sheet.full { height: calc(100% - 24px - env(safe-area-inset-top, 0px)); }
.sheet-handle { width: 40px; height: 5px; border-radius: 3px; background: var(--border-2); margin: 8px auto 0; flex: none; cursor: grab; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp3); padding: 10px 12px 6px 24px; flex: none; touch-action: none; }
.sheet-head h2 { font-size: 1.125rem; font-weight: 620; letter-spacing: -0.015em; }
.sheet-body { padding: 4px 24px 16px; overflow-y: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--sp4); overscroll-behavior: contain; }
.sheet-body.flush { padding-left: 8px; padding-right: 8px; }
.sheet-body.last { padding-bottom: 26px; }
.sheet-foot { padding: 12px 24px 18px; display: flex; flex-direction: column; gap: 8px; box-shadow: inset 0 1px 0 var(--hair); flex: none; background: var(--elevated); }
.sheet-foot.row-btns { flex-direction: row; }
.sheet-foot.row-btns .btn { flex: 1; }
.dialog-layer { display: grid; place-items: center; padding: var(--sp5); }
.dialog { position: relative; width: 100%; max-width: 380px; background: var(--elevated); border-radius: 26px; padding: var(--sp6); box-shadow: var(--shadow-3); transform: scale(.94); opacity: 0; transition: transform 220ms var(--ease-out), opacity 180ms; }
.dialog.on { transform: scale(1); opacity: 1; }
.dialog h2 { font-size: 1.125rem; font-weight: 620; margin-bottom: 8px; }
.dialog p { color: var(--fg-2); }
.dialog .dialog-actions { display: flex; flex-direction: column; gap: 8px; margin-top: var(--sp5); }
.toasts { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(92vw, 440px); }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 16px; border-radius: 16px; background: var(--toast-bg); color: var(--toast-fg); box-shadow: var(--shadow-3); font-size: 0.875rem; font-weight: 500; animation: toastIn 260ms var(--ease-out); max-width: 100%; }
.toast .i { width: 20px; height: 20px; flex: none; }
.toast .t-msg { flex: 1; min-width: 0; }
.toast .t-act { color: var(--toast-link); font-weight: 720; padding: 8px 10px; border-radius: 10px; min-height: 36px; }
.toast.out { animation: toastOut 220ms var(--ease) forwards; }
@keyframes toastIn { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes toastOut { to { transform: translateY(8px); opacity: 0; } }
.ptr { position: absolute; left: 50%; top: 0; z-index: 4; width: 40px; height: 40px; margin-left: -20px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow-2); display: grid; place-items: center; transform: translateY(-60px); transition: transform 240ms var(--ease); color: var(--brand-text); }
.ptr.pulling { transition: none; }
.ptr.spinning .i { animation: spin .8s linear infinite; }

/* ============================================================
   Motion
   ============================================================ */
.screen.enter-push { animation: pushIn 300ms var(--ease-out); }
.screen.exit-push { animation: fadeOut 220ms var(--ease) forwards; }
.screen.enter-pop { animation: popIn 260ms var(--ease-out); }
.screen.exit-pop { animation: pushOutRight 260ms var(--ease) forwards; z-index: 2; }
.screen.enter-fade { animation: fadeIn 220ms var(--ease); }
.screen.exit-fade { animation: fadeOut 160ms var(--ease) forwards; }
@keyframes pushIn { from { transform: translateX(28px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes popIn { from { transform: translateX(-16px); opacity: 0.6; } to { transform: none; opacity: 1; } }
@keyframes pushOutRight { to { transform: translateX(28px); opacity: 0; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; } }
.rise { animation: rise 420ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 45ms); }
.screen.no-anim .rise { animation: none; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.fade-swap { animation: fadeIn 240ms var(--ease); }
.pressed { transform: scale(.97) !important; }
.app.rm *, .app.rm *::before, .app.rm *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; scroll-behavior: auto !important; }
}

/* ============================================================
   Welcome & onboarding
   ============================================================ */
.ob { min-height: 100%; display: flex; flex-direction: column; max-width: 520px; margin: 0 auto; width: 100%; padding: calc(env(safe-area-inset-top, 0px) + 18px) var(--gutter) calc(24px + env(safe-area-inset-bottom, 0px)); gap: var(--sp6); }
.ob-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ob-hero { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: var(--sp6); }
.ob h1 { font-size: 2.125rem; line-height: 1.08; font-weight: 720; letter-spacing: -0.04em; }
.ob .lead { color: var(--fg-2); font-size: 1.0625rem; line-height: 1.5; }
.ob-actions { display: flex; flex-direction: column; gap: var(--sp2); }
.ob-step-head { display: flex; flex-direction: column; gap: var(--sp2); }
.ob-step-head h1 { font-size: 1.75rem; }
.cluster { position: relative; width: 100%; max-width: 360px; aspect-ratio: 1 / 0.9; margin: 0 auto; }
.cluster .cl-total { position: absolute; left: 50%; top: 50%; translate: -50% -50%; animation: totalIn 900ms var(--ease-out) both; width: 66%; padding: 18px 18px 16px; border-radius: 24px; background: radial-gradient(120% 90% at 100% 0%, var(--hero-2) 0%, var(--hero) 60%); color: #fff; box-shadow: 0 28px 50px -22px color-mix(in srgb, var(--hero) 90%, transparent); z-index: 2; }
.cl-total .l { font-size: 0.75rem; color: var(--on-hero-2); font-weight: 600; }
.cl-total .v { font-size: 2rem; font-weight: 720; letter-spacing: -0.045em; font-variant-numeric: tabular-nums; line-height: 1.1; margin-top: 4px; }
.cl-total .s { font-size: 0.75rem; color: var(--on-hero-2); margin-top: 6px; }
.cl-card { position: absolute; display: flex; align-items: center; gap: 9px; padding: 10px 12px 10px 10px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-2); border: 1px solid var(--border); white-space: nowrap; animation: floatIn 700ms var(--ease-out) both, bob 6s ease-in-out infinite; animation-delay: calc(var(--d) * 90ms), calc(var(--d) * 400ms + 700ms); }
.cl-card .svc { width: 32px; height: 32px; border-radius: 10px; font-size: 0.75rem; }
.cl-card { max-width: 49%; }
.cl-card > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.cl-bubble { position: absolute; width: 40px; height: 40px; border-radius: 13px; font-size: 0.8125rem; z-index: 3; box-shadow: var(--shadow-2); animation: floatIn 700ms var(--ease-out) both, bob 7s ease-in-out infinite; animation-delay: calc(var(--d) * 90ms), calc(var(--d) * 300ms + 700ms); }
.cl-card .cn { font-size: 0.8125rem; font-weight: 640; line-height: 1.2; }
.cl-card .cp { font-size: 0.75rem; color: var(--fg-2); font-variant-numeric: tabular-nums; }
@keyframes totalIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
.cl-total .v { animation: fadeIn 900ms 250ms var(--ease) both; }
@keyframes floatIn { from { opacity: 0; transform: translateY(16px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -5px; } }
.cluster .orbit-bg { position: absolute; inset: 4%; z-index: 0; }
.cluster .orbit-bg circle { fill: none; stroke: var(--border-2); }
.cat-pick .tile-ic .i { width: 20px; height: 20px; }
.connect-opt { align-items: flex-start; padding: var(--sp5); }
.connect-opt .co-ic { width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand-text); flex: none; }
.connect-opt .co-t { font-weight: 660; font-size: 1.0625rem; }
.connect-opt .co-s { color: var(--fg-2); font-size: 0.9rem; margin-top: 3px; }
.consent li { display: flex; gap: var(--sp3); align-items: flex-start; padding: 10px 0; font-size: 0.9375rem; }
.consent li .i { margin-top: 1px; }
.consent li.yes .i { color: var(--success); }
.consent li.no .i { color: var(--fg-2); }
.handoff { border-radius: 24px; border: 1.5px dashed var(--border-2); padding: var(--sp5); display: flex; flex-direction: column; gap: var(--sp4); background: var(--surface-2); }
.steps-anim li { display: flex; align-items: center; gap: 12px; padding: 10px 0; color: var(--fg-2); }
.steps-anim li.done { color: var(--fg); }
.steps-anim li .st-ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); flex: none; }
.steps-anim li.done .st-ic { background: var(--brand); color: var(--on-brand); }
.steps-anim li.active .st-ic::after { content: ''; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--brand); border-right-color: transparent; animation: spin .7s linear infinite; }
.steps-anim .st-ic .i { width: 16px; height: 16px; stroke-width: 2.4; }
.found-row .checkbox { margin-left: 4px; }

/* ============================================================
   Home dashboard
   ============================================================ */
.dash { display: grid; grid-template-columns: 1fr; gap: var(--sp7); }
.dash > * { min-width: 0; }
.d-side { display: flex; flex-direction: column; gap: var(--sp4); }
.d-side:empty { display: none; }
.carousel { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 4px var(--gutter) 10px; margin: -4px calc(var(--gutter) * -1) -10px; scroll-padding: 0 var(--gutter); }
.carousel::-webkit-scrollbar { display: none; }
.carousel > li { scroll-snap-align: start; flex: none; }
.renew-card { width: 136px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px; border-radius: 20px; background: var(--surface); text-align: left; transition: background var(--dur), transform 140ms var(--ease); }

function chargeSeries(spec) {
  // spec: { from, to, day, amt(d)->minor, cur, acc, desc, freq }
  const out = []; let d = spec.from; let n = 0;
  while (d <= spec.to && n < 400) {
    const amt = typeof spec.amt === 'function' ? spec.amt(d, n) : spec.amt;
    const next = spec.freq === 'annual' ? addMonths(d, 12, spec.day) : addMonths(d, 1, spec.day);
    out.push({ id: 'ch_' + (spec.key || 'x') + '_' + d, d, amt, cur: spec.cur || 'GBP', gbp: spec.gbp ? spec.gbp(d, n) : toGBP(amt, spec.cur || 'GBP'), acc: spec.acc, status: 'paid', period: [d, addDays(next, -1)], desc: spec.desc });
    d = next; n++;
  }
  return out;
}

/* ---------- Analytics ---------- */
const PERIODS = { now: 'Current commitments', past: 'Last 12 months', next: 'Next 12 months' };

    const put = (s, v) => {
      const key = by === 'cat' ? s.cat : s.id;
      if (!acc.has(key)) acc.set(key, { key, label: by === 'cat' ? catName(s.cat) : s.name, cat: s.cat, value: 0, subs: new Set(), s: by === 'cat' ? null : s });
      const x = acc.get(key); x.value += v; x.subs.add(s.id);

    if (period === 'now') activeSubs().forEach((s) => put(s, perYearGBP(s)));
    else if (period === 'past') recorded(addDays(t, -364), t).forEach((r) => { if (r.c.status === 'paid') put(r.s, r.c.gbp); });
    else expected(t, addDays(t, 364)).forEach((e) => put(e.s, e.gbp));
    let items = [...acc.values()].map((x) => Object.assign(x, { value: Math.round(x.value), subs: [...x.subs] }));
    items = by === 'cat' ? items.sort((a, b) => CAT_ORDER.indexOf(a.key) - CAT_ORDER.indexOf(b.key)) : items.sort((a, b) => b.value - a.value);

}
/* Monthly run-rate of subscriptions active in a month, at the price in effect then */

    const paid = s.charges.filter((c) => c.status === 'paid' && !c.oneOff && (!pend || c.id !== pend.chargeId)).sort((x, y) => x.d.localeCompare(y.d));
    const nowOrLater = mkey >= mk(today());
    let from;

    if (s.trialHistory) from = s.trialHistory.end; else if (s.started && s.started < (paid[0] ? paid[0].d : '9')) from = s.started; else if (s.freq === 'annual') from = coverageStart(s) || (paid[0] && paid[0].d); else from = paid[0] ? paid[0].d : (s.created || today());

    else { const upto = paid.filter((c) => c.d <= b); const c = upto.length ? upto[upto.length - 1] : paid[0]; price = c ? toGBP(c.amt, c.cur) : priceGBP(s); }

}

    const pts = months.map((m) => {
      const a = m + '-01', b = monthEnd(a); const past = m < cur, now = m === cur, fut = m > cur;
      const rec = (past || now) ? sum(recorded(a, b).filter((r) => r.c.status === 'paid' && (!cat || r.s.cat === cat)), (r) => r.c.gbp) : null;

/* ---------- What-if (a scenario, never a promise) ---------- */
function whatIf(ids) {

  const t = today(), end = addDays(t, 364);
  const notes = []; let next12 = 0; let yours = selYear;
  sel.forEach((s) => {
    let ev = expected(t, end).filter((e) => e.s.id === s.id);
    if (s.commitment && s.commitment.termEnd > t) {
      ev = ev.filter((e) => e.d >= s.commitment.termEnd);
      notes.push({ s, tone: 'warn', text: `${s.name} is an annual plan paid monthly until ${fmtDay(s.commitment.termEnd, 'dmy')}. Payments before then may still be due, or the provider may charge a fee to end early. They’re not counted as savings.` });
    }
    if (s.freq === 'annual') notes.push({ s, text: `${s.name} is paid yearly. Cancelling would avoid the next payment on ${fmtDay(s.nextDate, 'dmy')}, not money already paid.` });
    if (s.variable) notes.push({ s, text: `${s.name} varies with usage, so this uses the average of recent charges.` });
    if (s.status === 'cancel-started') notes.push({ s, text: `You’ve already started cancelling ${s.name}.` });
    const g = groupOf(s); if (g && g.payer === 'me') { const back = othersShareMonthly(g) * 12; yours -= back; notes.push({ s, text: `${s.name} is shared. Others contribute about ${money(Math.round(back))} a year, so your own saving would be smaller.` }); }
    if (s.currency !== 'GBP') notes.push({ s, text: `${s.name} is charged in ${CUR[s.currency].name.toLowerCase()}s, converted at a demo rate (${fxLine(s.currency)}).` });
    next12 += sum(ev, (e) => e.gbp);
  });
  return { current: T.monthly, currentYear: T.annual, selMonthly: Math.round(selYear / 12), after: Math.round((T.annual - selYear) / 12), annualDiff: selYear, next12: Math.round(next12), yours: Math.round(yours), notes, sel };
}

/* ---------- Check-up score (optional; transparent factors only) ---------- */

/* ---------- Recent activity ---------- */
function recentActivity(days = 21) {

  const rows = recorded(from, t).map((r) => ({ d: r.c.d, s: r.s, c: r.c, kind: r.c.status }));

/* ============================================================
   Store: persistence and every change a person can make.
   Each change bumps the revision so derived figures recompute.
   ============================================================ */
const STORE_KEY = 'kivo-demo-v1';
const listeners = new Set();
function onChange(fn) { listeners.add(fn); return () => listeners.delete(fn); }
function emit(kind = 'change', detail) { listeners.forEach((fn) => { try { fn(kind, detail); } catch (e) { console.error(e); } }); }
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const st = JSON.parse(raw); if (st && st.v === 1 && Array.isArray(st.subs)) return st; }
  } catch (e) { /* storage unavailable: start fresh */ }
  return null;
}
let _saveT = null;
function save(now = false) {
  if (!S) return;
  S.clockElapsed = clockElapsedNow();
  const doit = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* private mode: keep in memory */ } };
  clearTimeout(_saveT);
  if (now) doit(); else _saveT = setTimeout(doit, 250);
}
function commit(kind = 'change', detail) { bump(); save(); emit(kind, detail); }
function startState(variant = 'full', profile, settings) {
  S = buildDemo(variant, profile);
  if (settings) Object.assign(S.settings, settings);
  CLOCK.elapsed = 0; CLOCK.since = Date.now();
  bump(); save(true);
}
/* Undo: snapshot the whole state and put it back */
function snapshot() { return deepCopy(S); }
function restore(snap) { S = snap; commit('restore'); }
function logEvent(kind, text, subId) { S.log.unshift({ d: today(), kind, text, subId }); if (S.log.length > 80) S.log.length = 80; }

/* ---------- Subscriptions ---------- */
function newId(name) { const base = normQ(name).replace(/[^a-z0-9]+/g, '').slice(0, 12) || 'sub'; let id = base, i = 2; while (S.subs.some((s) => s.id === id)) id = base + i++; return id; }
function addSub(d) {

    id, service: d.service || null, name: d.name.trim().slice(0, 48), plan: (d.plan || '').trim().slice(0, 48), cat: d.cat || 'other',
    amount: d.amount, currency: d.currency || 'GBP', freq: d.freq || 'monthly', anchor: d.nextDate ? +d.nextDate.slice(8, 10) : null,
    nextDate: d.nextDate || null, pay: d.pay || 'pm_other', status: d.trial ? 'trial' : 'active', source: d.source || 'manual',

    usage: null, reviewedOn: today(), started: d.started || null, startedBy: d.started ? 'you' : null, archived: false, created: today(), planId: d.planId || null,

/* ---------- Duplicates: never changes records without a decision ---------- */

    // One subscription, two payment sources over time: keep every charge once, follow the newest source
    const ids = new Set(a.charges.map((c) => c.id));
    b.charges.forEach((c) => { if (!ids.has(c.id)) a.charges.push(Object.assign(deepCopy(c), { mergedFrom: b.id })); });
    a.charges.sort((x, y) => x.d.localeCompare(y.d));

  donut(el, M, opts) {

const LIB = { q: '', filter: 'all', sort: 'next', cat: null };
const SORTS = { next: 'Next renewal', costHi: 'Cost: highest first', costLo: 'Cost: lowest first', az: 'Name: A to Z' };
function libList() {
  const q = normQ(LIB.q);
  let list = allSubs().filter((s) => !s.archived || LIB.filter === 'archived');
  if (LIB.filter === 'active') list = list.filter(isCounted);
  else if (LIB.filter === 'trials') list = list.filter(isTrial);
  else if (LIB.filter === 'cancelled') list = list.filter(isEnded);
  else if (LIB.filter === 'archived') list = list.filter((s) => s.archived);
  else if (LIB.filter === 'nodate') list = list.filter((s) => isCounted(s) && !s.nextDate);
  if (LIB.cat) list = list.filter((s) => s.cat === LIB.cat);
  if (q) list = list.filter((s) => normQ([s.name, s.plan, catName(s.cat), payLabel(s.pay)].join(' ')).includes(q));
  const nextKey = (s) => (isTrial(s) ? s.trial.end : s.nextDate) || (isEnded(s) ? '9999' : '9998');

const NGROUPS = [['payments', 'Upcoming payments'], ['trials', 'Trials'], ['prices', 'Price changes'], ['account', 'Account updates'], ['opps', 'Opportunities']];
function notifications() {

      const days = s.reminder && s.reminder.on ? s.reminder.days : null;
      if (N.renewals && days != null && dd <= days) add({ id: 'rn-' + s.id + e.d, group: 'payments', icon: 'repeat', tone: '', title: `${s.name} renews ${dd === 0 ? 'today' : dd === 1 ? 'tomorrow' : 'on ' + fmtDay(e.d, 'wdm')}`, body: `${expAmt(e)} from ${payLabel(s.pay)}${e.uncertain ? '. Your cancellation isn’t confirmed yet.' : '.'}`, route: 'sub', params: { id: s.id }, when: addDays(e.d, -days) < t ? t : addDays(e.d, -days) });
    });
    if (N.priceChanges) allPriceChanges(120).forEach((c) => add({ id: 'pc-' + c.id, group: 'prices', icon: 'trend', tone: 'warn', title: c.kind === 'possible' ? `${c.s.name} charged ${moneyIn(c.to, c.cur)}` : `${c.s.name} price ${c.diff > 0 ? 'went up' : 'went down'}`, body: c.kind === 'possible' ? `Usually ${moneyIn(c.from, c.cur)}. Based on one charge on ${fmtD(c.d)}. Check whether it’s the new price.` : `${moneyIn(c.from, c.cur)} → ${moneyIn(c.to, c.cur)} from ${fmtD(c.d)}. Now ${money(Math.round(c.newYear))} a year.`, route: 'sub', params: { id: c.s.id }, when: c.d }));
    if (N.failed) {
      allSubs().filter((s) => s.status === 'payment-failed').forEach((s) => add({ id: 'pf-' + s.id + s.failed.d, group: 'account', icon: 'alertCircle', tone: 'err', title: `${s.name} payment failed`, body: `${moneyIn(s.amount, s.currency)} was declined. The subscription isn’t cancelled.`, route: 'sub', params: { id: s.id }, when: s.failed.d }));
      activeSubs().filter((s) => missedCharges(s).length).forEach((s) => add({ id: 'mc-' + s.id + missedCharges(s).join(), group: 'account', icon: 'help', tone: 'blue', title: `No ${s.name} charge seen recently`, body: `Expected on ${listJoin(missedCharges(s).map(fmtD))}. It may be paid another way now.`, route: 'sub', params: { id: s.id }, when: missedCharges(s).pop() }));
    }
    S.sources.filter((s) => s.status === 'expired').forEach((s) => add({ id: 'ex-' + s.id + s.consentUntil, group: 'account', icon: 'unlink', tone: 'warn', title: `${s.name} needs reconnecting`, body: `Information from it stops at ${fmtD(s.lastSync.slice(0, 10))} and may be out of date.`, route: 'source', params: { id: s.id }, when: s.lastSync.slice(0, 10) }));
    if (S.sync.state === 'failed') add({ id: 'sf-' + S.sync.failedAt, group: 'account', icon: 'wifiOff', tone: 'warn', title: 'We couldn’t update Harbour Bank', body: 'Your figures may be out of date. Try again from Connected accounts.', route: 'connections', params: {}, when: t });
    allSubs().filter((s) => (s.status === 'cancel-started' || s.status === 'trial-cancel-started') && s.cancel).forEach((s) => add({ id: 'cv-' + s.id + (s.cancel.remindOn || s.cancel.done), group: 'account', icon: 'clock', tone: 'warn', title: `Has ${s.name} confirmed your cancellation?`, body: `You started cancelling on ${fmtD(s.cancel.done || s.cancel.started)}. KIVO keeps counting it until you confirm.`, route: 'cancel', params: { id: s.id }, when: s.cancel.done || s.cancel.started }));
    if (N.access) endedSubs().filter((s) => s.cancel && s.cancel.accessUntil && s.cancel.accessUntil >= t && daysBetween(t, s.cancel.accessUntil) <= 7).forEach((s) => add({ id: 'ac-' + s.id, group: 'account', icon: 'hourglass', tone: '', title: `${s.name} access ends ${inDays(s.cancel.accessUntil)}`, body: `On ${fmtDay(s.cancel.accessUntil, 'wdm')}. Your cancellation is confirmed.`, route: 'sub', params: { id: s.id }, when: addDays(s.cancel.accessUntil, -7) < t ? t : addDays(s.cancel.accessUntil, -7) }));

    const opps = opportunities().filter((o) => ['annual', 'overlap', 'usage'].includes(o.kind));
    if (opps.length) add({ id: 'op-' + opps.map((o) => o.id).join('|'), group: 'opps', icon: 'percent', tone: 'brand', title: `${plural(opps.length, 'way', 'ways')} you might find better value`, body: listJoin(opps.map((o) => o.kind === 'annual' ? `annual billing for ${o.s.name}` : o.kind === 'overlap' ? 'two cloud storage plans' : `${o.s.name}, which you said you rarely use`)) + '.', route: 'savings', params: {}, when: t });
    return out.filter((n) => !S.notifDismissed[n.id]).map((n) => Object.assign(n, { read: !!S.notifRead[n.id] })).sort((a, b) => b.when.localeCompare(a.when));
  });
}

const DEEP_LINKS = { home: 'home', subs: 'subs', subscriptions: 'subs', calendar: 'calendar', timeline: 'timeline', insights: 'insights', trends: 'trends', savings: 'savings', trials: 'trials', shared: 'shared', notifications: 'notifications', profile: 'profile', detected: 'discover', whatif: 'whatif', review: 'review' };
function boot() {
  const hash = (location.hash || '').replace('#', '');
  const stored = hash === 'reset' ? null : loadState();
  if (stored) { S = stored; CLOCK.elapsed = S.clockElapsed || 0; CLOCK.since = Date.now(); bump(); }
  else { S = buildDemo('full'); S.onboarded = !!(DEEP_LINKS[hash] || hash === 'demo'); CLOCK.elapsed = 0; CLOCK.since = Date.now(); bump(); save(true); }
  if (hash === 'welcome') S.onboarded = false;
  if ((DEEP_LINKS[hash] || hash === 'demo') && !S.onboarded) S.onboarded = true;
  Object.assign(els, { app: $('#app'), sidebar: $('#sidebar'), screens: $('#screens'), tabbar: $('#tabbar'), sheetLayer: $('#sheet-layer'), toasts: $('#toasts'), syncbar: $('#syncbar') });
  els.sheetLayer.style.pointerEvents = 'none';
  document.documentElement.lang = 'en-GB';
  applySettings();
  renderChrome();
  bindGlobal();
  if (!S.onboarded) resetTo(['welcome'], 'none');
  else resetTo([DEEP_LINKS[hash] || 'home'], 'none');
  let pending = false;
  onChange((kind) => {
    if (kind === 'settings' || kind === 'restore') applySettings();
    if (kind === 'user' || kind === 'restore') renderChrome();
    if (pending) return; pending = true;
    requestAnimationFrame(() => { pending = false; refreshScreen(); });
  });
  setInterval(() => save(), 15000);
  window.addEventListener('pagehide', () => save(true));
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(true); });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => refreshScreen());
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
