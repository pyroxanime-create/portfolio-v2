html { font-size: calc(16px * var(--ts)); -webkit-text-size-adjust: 100%; height: 100%; }
body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 0.9375rem; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden; font-feature-settings: 'ss01'; }
*, *::before, *::after { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
a { color: var(--brand-text); }
h1, h2, h3, h4, p, figure, blockquote, dl, dd { margin: 0; }
h1, h2, h3 { text-wrap: balance; letter-spacing: -0.015em; font-weight: 700; }
p { text-wrap: pretty; }
ul, ol { margin: 0; padding: 0; list-style: none; }
img, svg { max-width: 100%; }
[hidden] { display: none !important; }
.sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.i.sm { width: 18px; height: 18px; }
.i.xs { width: 15px; height: 15px; }
.i.lg { width: 28px; height: 28px; }
.i.fill { fill: currentColor; stroke: none; }
:focus { outline: none; }
:focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; border-radius: 10px; }
h1[tabindex="-1"]:focus, h2[tabindex="-1"]:focus, [data-autofocus][tabindex="-1"]:focus { outline: none; }
.muted { color: var(--fg-2); }
.small { font-size: 0.8125rem; }
.micro { font-size: 0.75rem; }
.strong { font-weight: 700; }
.num { font-variant-numeric: tabular-nums; }
.one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ok-t { color: var(--success-text); }
.warn-t { color: var(--warning-text); }
.err-t { color: var(--error); }
.brand-t { color: var(--brand-text); }
.olive-t { color: var(--olive-text); }
.center { text-align: center; }
.row-gap { display: flex; gap: var(--sp2); align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: var(--sp3); }
.stack-sm { display: flex; flex-direction: column; gap: var(--sp2); }
.stack-lg { display: flex; flex-direction: column; gap: var(--sp6); }
.spacer { flex: 1; }
.serif { font-family: var(--serif); }
.display { font-family: var(--serif); font-weight: 560; font-size: 2.5rem; line-height: 1.04; letter-spacing: -0.02em; font-optical-sizing: auto; font-variation-settings: 'opsz' 96; }
.display.xl { font-size: 3rem; line-height: 1; }
.display.md { font-size: 1.875rem; line-height: 1.1; }
.display.sm { font-size: 1.5rem; line-height: 1.15; }

/* paper grain: barely-there texture on the ground, never on photos */
.app::before { content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: var(--grain-opacity); background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.3  0 0 0 0 0.24  0 0 0 0 0.18  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

/* ---------- Wordmark ---------- */

/* ============================================================
   Shell
   ============================================================ */
.app { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); overflow: hidden; }

.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scroll-padding-top: 72px; }
.content { width: 100%; max-width: 680px; margin: 0 auto; padding: var(--sp2) var(--gutter) calc(var(--sp8) + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: var(--sp7); }

.topbar { position: relative; z-index: 6; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--sp2); min-height: 56px; padding: calc(env(safe-area-inset-top, 0px) + 4px) 8px 2px; background: var(--bg); transition: box-shadow var(--dur), background var(--dur); }

.topbar.over:not(.scrolled) .icon-btn:hover { background: #fff; }

.tb-side { display: flex; align-items: center; gap: 4px; min-width: 0; }
.tb-side.right { justify-content: flex-end; }
.tb-title { font-weight: 700; font-size: 0.9375rem; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 56vw; opacity: 0; transition: opacity var(--dur) var(--ease); }
.topbar.scrolled .tb-title, .topbar.always .tb-title { opacity: 1; }
.progress-steps { display: flex; gap: 5px; }
.progress-steps span { width: 20px; height: 4px; border-radius: 4px; background: var(--border-2); transition: background var(--dur), width var(--dur); }
.progress-steps span.on { background: var(--brand); }
.progress-steps span.cur { width: 32px; background: var(--brand); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--sp3) var(--sp4); padding-top: var(--sp2); flex-wrap: wrap; }
.page-head h1 { font-family: var(--serif); font-size: 2.25rem; font-weight: 580; letter-spacing: -0.025em; line-height: 1.04; font-variation-settings: 'opsz' 96; }

.ph-actions { display: flex; gap: var(--sp2); flex: none; }
.ph-text { min-width: 0; flex: 1 1 260px; }

/* ---------- Mobile tab bar ---------- */
/* floating dark pill; the current tab opens into a mint pill with its label */
.tabbar { position: absolute; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: flex; align-items: center; gap: 2px; height: 64px; padding: 6px; max-width: 520px; margin: 0 auto; border-radius: 999px; background: var(--nav-bg); box-shadow: 0 18px 40px -14px rgba(20,14,8,.55), 0 2px 6px rgba(20,14,8,.12); }

/* ---------- Floating basket & live-order bars (mobile) ---------- */
.basketbar-wrap { position: absolute; left: 0; right: 0; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 8px); z-index: 19; display: flex; flex-direction: column; gap: 8px; padding: 0 12px; pointer-events: none; }

.basketbar, .livebar { pointer-events: auto; display: flex; align-items: center; gap: 12px; width: 100%; max-width: 520px; margin: 0 auto; min-height: 58px; padding: 8px 20px 8px 9px; border-radius: 999px; text-align: left; box-shadow: var(--shadow-3); animation: barIn 360ms var(--ease-out); }

.lb-pulse::after { animation: pulse 1.8s var(--ease-out) infinite; opacity: .5; }
@keyframes pulse { from { transform: scale(1); opacity: .55; } to { transform: scale(2.8); opacity: 0; } }

.bump { animation: bump 420ms var(--spring); }

/* connection banner */

/* ---------- Desktop top navigation ---------- */
.topnav { display: none; }

/* ============================================================
   Buttons
   ============================================================ */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: var(--r-btn); font-weight: 700; font-size: 0.9375rem; line-height: 1.2; white-space: nowrap; user-select: none; transition: background var(--dur) var(--ease), color var(--dur) var(--ease), transform 140ms var(--ease), opacity var(--dur), box-shadow var(--dur); text-decoration: none; }

.icon-btn:hover { background: var(--fill); }

.icon-btn.filled:hover { background: var(--surface-2); }

.link { color: var(--brand-text); font-weight: 700; font-size: 0.875rem; display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 2px; text-decoration: none; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }

.btn-row { display: flex; gap: var(--sp3); flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 140px; }
.footer-bar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 8; padding: 12px var(--gutter) calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 0%, transparent), var(--bg) 24%); display: flex; gap: 10px; align-items: center; }

.footer-bar .fb-note { font-size: 0.8125rem; color: var(--fg-2); flex: 1; min-width: 0; }
.screen.has-tabbar .footer-bar { bottom: var(--tabbar-h); }

/* ============================================================
   Photos — every image fades in over a 16px preview of itself
   ============================================================ */
.ph { position: relative; overflow: hidden; background: var(--sand); background-size: cover; background-position: center; isolation: isolate; }
.ph > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 500ms var(--ease); }
.ph > img.in { opacity: 1; }
.ph::before { content: ''; position: absolute; inset: -12px; background: inherit; filter: blur(12px); z-index: -1; }
.ph.ph-none { display: grid; place-items: center; color: var(--fg-3); background: var(--sand); }
.ph.ph-none::before { display: none; }
.ph-tag { position: absolute; z-index: 2; left: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; font-size: 0.6875rem; font-weight: 650; color: #fff; background: rgba(24,18,12,0.5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); pointer-events: none; }

/* ============================================================
   Cards, sections, rows
   ============================================================ */

:where(button.card, a.card) { display: block; width: 100%; text-align: left; text-decoration: none; color: inherit; transition: transform 160ms var(--ease), box-shadow var(--dur) var(--ease), background var(--dur); }

.divider { height: 1px; background: var(--border); border: 0; margin: 0; }

.list.boxed > li + li > .row, .list.boxed > li + li > .switch-row, .list.boxed > li + li > .radio-row, .list.boxed > .row + .row, .list.lined > li + li > .row { box-shadow: inset 0 1px 0 var(--hair); }
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 62px; padding: 10px var(--sp4); text-align: left; color: inherit; text-decoration: none; background: transparent; transition: background var(--dur) var(--ease); }

.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-title { font-weight: 650; font-size: 0.9375rem; line-height: 1.3; overflow-wrap: anywhere; }

.row-ic { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: var(--sand); flex: none; color: var(--fg); }
.row-ic .i { width: 20px; height: 20px; }

.row-ic.brand { background: var(--brand-soft); color: var(--brand-text); }

.row-ic.warn { background: var(--warning-soft); color: var(--warning-text); }

/* pills */
.pill { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; white-space: nowrap; background: var(--fill); color: var(--fg-2); flex: none; }
.pill .i { width: 13px; height: 13px; stroke-width: 2.2; }

.pill.ok { background: var(--success-soft); color: var(--success-text); }
.pill.warn { background: var(--warning-soft); color: var(--warning-text); }
.pill.err { background: var(--error-soft); color: var(--error); }

.pill.olive { background: var(--olive-soft); color: var(--olive-text); }
.pill.outline { background: transparent; box-shadow: inset 0 0 0 1px var(--border-2); color: var(--fg-2); }

/* chips, segmented controls, tabs */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 3px 2px; margin: -3px -2px; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chips.bleed { margin: -3px calc(var(--gutter) * -1); padding: 3px var(--gutter); scroll-padding: 0 var(--gutter); }
.chip { display: inline-flex; align-items: center; gap: 6px; flex: none; min-height: 40px; padding: 0 16px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border), 0 1px 2px rgba(34,30,24,.04); font-size: 0.875rem; font-weight: 650; color: var(--fg); transition: background var(--dur), color var(--dur), box-shadow var(--dur), transform 160ms var(--spring); }
.chip:hover { background: var(--surface-2); }

.chip:active { transform: scale(.96); }

.seg { display: inline-flex; padding: 4px; gap: 2px; border-radius: 999px; background: var(--fill); position: relative; }

.seg > button { min-height: 40px; padding: 0 14px; border-radius: 999px; font-size: 0.875rem; font-weight: 700; color: var(--fg-2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background var(--dur), color var(--dur), box-shadow var(--dur); white-space: nowrap; }
.seg > button[aria-pressed="true"], .seg > button[aria-selected="true"], .seg > button[aria-checked="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(23,18,12,.14); }
.seg > button .i { width: 17px; height: 17px; }
.utabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--border); }
.utabs::-webkit-scrollbar { display: none; }
.utabs button { position: relative; flex: none; min-height: 46px; padding: 0 12px; font-size: 0.9375rem; font-weight: 650; color: var(--fg-2); transition: color var(--dur); }
.utabs button::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2.5px; border-radius: 2px; background: var(--brand); transform: scaleX(0); transition: transform 240ms var(--ease-out); }
.utabs button[aria-selected="true"], .utabs button[aria-current="true"] { color: var(--fg); font-weight: 750; }
.utabs button[aria-selected="true"]::after, .utabs button[aria-current="true"]::after { transform: scaleX(1); }
.utabs .count { font-size: 0.75rem; color: var(--fg-2); margin-left: 4px; }

/* ============================================================
   Forms
   ============================================================ */
.field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.label { font-size: 0.875rem; font-weight: 700; color: var(--fg); }
.label .optional { font-weight: 500; color: var(--fg-2); }
.hint { font-size: 0.8125rem; color: var(--fg-2); }
.field-err { font-size: 0.8125rem; color: var(--error); display: flex; align-items: flex-start; gap: 6px; font-weight: 650; }
.field-err .i { width: 16px; height: 16px; margin-top: 2px; }
.input, .textarea, .select { width: 100%; min-height: 54px; padding: 0 18px; border-radius: var(--r-input); background: var(--surface); border: 1px solid var(--control); font-size: 1rem; transition: border-color var(--dur), box-shadow var(--dur); }
.textarea { padding: 14px 16px; min-height: 96px; resize: vertical; line-height: 1.45; }
.input::placeholder, .textarea::placeholder { color: var(--fg-3); }
.input:focus, .textarea:focus, .select:focus { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); outline: none; }
.field.invalid .input, .field.invalid .textarea { border-color: var(--error); }
.pw-wrap { position: relative; }
.pw-wrap .input { padding-right: 56px; }
.pw-wrap .icon-btn { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); }
.char-count { font-size: 0.75rem; color: var(--fg-2); text-align: right; font-variant-numeric: tabular-nums; }
.search { position: relative; }
.search > .i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--fg-2); width: 20px; height: 20px; pointer-events: none; }
.search .input { padding-left: 48px; padding-right: 48px; min-height: 54px; border-radius: 999px; border-color: transparent; background: var(--surface); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--hair); font-size: 0.9375rem; }
.search .input:focus { background: var(--surface); }
.search .clear { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); }
button.search-fake { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 0 20px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--hair); color: var(--fg-2); font-size: 0.9375rem; text-align: left; transition: background var(--dur); }
button.search-fake:hover { background: var(--surface-2); }
.two-fields { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp3); }
.switch { position: relative; width: 52px; height: 32px; border-radius: 999px; background: var(--border-2); flex: none; transition: background var(--dur) var(--ease); }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform var(--dur) var(--ease); }
[aria-checked="true"] > .switch { background: var(--btn); }
[aria-checked="true"] > .switch::after { transform: translateX(20px); }
.switch-row { display: flex; align-items: center; gap: var(--sp3); min-height: 62px; padding: 10px var(--sp4); width: 100%; text-align: left; }
.switch-row:hover { background: var(--surface-2); }
.switch-row[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.stepper { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: var(--fill); }
.stepper .icon-btn { width: 40px; height: 40px; background: var(--surface); box-shadow: 0 1px 2px rgba(23,18,12,.12); }
.stepper .icon-btn:hover { background: var(--surface-2); }
.stepper .icon-btn[disabled] { opacity: .4; }
.stepper output { min-width: 34px; text-align: center; font-weight: 800; font-size: 1.0625rem; font-variant-numeric: tabular-nums; }
.stepper.sm .icon-btn { width: 32px; height: 32px; }
.stepper.sm .icon-btn .i { width: 16px; height: 16px; }
.stepper.sm output { min-width: 26px; font-size: 0.9375rem; }
.opt { position: relative; display: flex; align-items: center; gap: var(--sp3); padding: 14px var(--sp4); border-radius: 18px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); text-align: left; width: 100%; transition: box-shadow var(--dur), background var(--dur), transform 140ms var(--ease); }
.opt:hover { background: var(--surface-2); }
.opt:active { transform: scale(.99); }
.opt[aria-pressed="true"], .opt[aria-checked="true"] { box-shadow: inset 0 0 0 2px var(--brand); background: var(--brand-soft); }
.opt .o-t { font-weight: 700; }
.opt .o-s { font-size: 0.8125rem; color: var(--fg-2); margin-top: 2px; }
.opt .o-end { margin-left: auto; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; flex: none; }
.radio-row { display: flex; align-items: center; gap: var(--sp3); min-height: 58px; padding: 8px var(--sp4); width: 100%; text-align: left; border-radius: 14px; }
.radio-row .rdot { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--control); flex: none; display: grid; place-items: center; margin-left: auto; }
.radio-row[aria-checked="true"] .rdot { border-color: var(--brand); border-width: 2px; }
.radio-row[aria-checked="true"] .rdot::after { content: ''; width: 11px; height: 11px; border-radius: 50%; background: var(--brand); }
.radio-row:hover { background: var(--surface-2); }
.radio-row[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.checkbox { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--control); display: grid; place-items: center; flex: none; color: transparent; background: var(--surface); transition: background var(--dur), border-color var(--dur); }
[aria-checked="true"] > .checkbox, [aria-pressed="true"] > .checkbox, .checkbox.on { background: var(--btn); border-color: var(--btn); color: var(--on-btn); }
.checkbox .i { width: 15px; height: 15px; stroke-width: 2.6; }

/* progress */
.bar { position: relative; height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
.bar.thin { height: 5px; }
.bar-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--brand); width: 0; transition: width 700ms var(--ease-out); }
.bar.olive .bar-fill { background: var(--olive); }

/* notices & empty states */
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 20px; background: var(--sand); color: var(--fg); font-size: 0.875rem; line-height: 1.45; }
.notice > .i { width: 19px; height: 19px; flex: none; margin-top: 1px; color: var(--fg-2); }
.notice.brand { background: var(--brand-soft); }
.notice.brand > .i { color: var(--brand-text); }
.notice.warn { background: var(--warning-soft); }
.notice.warn > .i { color: var(--warning-text); }
.notice.error { background: var(--error-soft); }
.notice.error > .i { color: var(--error); }
.notice.success { background: var(--success-soft); }
.notice.success > .i { color: var(--success-text); }
.notice.olive { background: var(--olive-soft); }
.notice.olive > .i { color: var(--olive-text); }
.notice .n-title { font-weight: 750; margin-bottom: 2px; }
.notice .n-body { flex: 1; min-width: 0; }
.notice .n-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--sp3); padding: var(--sp7) var(--sp5); }
.empty .empty-art { width: 128px; height: 96px; margin-bottom: var(--sp2); }
.empty h1, .empty h2, .empty h3 { font-size: 1.375rem; font-weight: 560; font-family: var(--serif); }
.empty p { color: var(--fg-2); max-width: 38ch; }
.empty .btn-row { justify-content: center; margin-top: var(--sp2); width: 100%; max-width: 380px; }
.sk { background: linear-gradient(90deg, var(--skeleton) 0%, var(--surface-2) 50%, var(--skeleton) 100%); background-size: 200% 100%; animation: shimmer 1.3s ease-in-out infinite; border-radius: 12px; }
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

/* key-value + receipts */
.kv { display: flex; flex-direction: column; margin: 0; }
.kv > div { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp4); padding: 12px 0; }
.kv > div + div { box-shadow: inset 0 1px 0 var(--hair); }
.kv dt { color: var(--fg-2); font-size: 0.875rem; flex: none; max-width: 52%; }
.kv dd { margin: 0; text-align: right; font-weight: 650; font-size: 0.9375rem; min-width: 0; overflow-wrap: anywhere; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.kv dd .sub { display: block; color: var(--fg-2); font-weight: 500; font-size: 0.8125rem; }
details.more > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-weight: 700; font-size: 0.875rem; color: var(--brand-text); }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary .i { width: 16px; height: 16px; transition: transform var(--dur); }
details.more[open] > summary .i { transform: rotate(180deg); }

/* avatars */
.av { width: 36px; height: 36px; border-radius: 50%; display: inline-grid; place-items: center; font-weight: 800; font-size: 0.8125rem; flex: none; background: var(--brand-soft-2); color: var(--on-soft); letter-spacing: -0.01em; }
.av.t2 { background: var(--olive-soft); color: var(--olive-text); }
.av.t3 { background: #E7E1F3; color: #4C3F75; }
.av.t4 { background: #DCEAF0; color: #2A5566; }
.av.sm { width: 30px; height: 30px; font-size: 0.6875rem; }
.av.lg { width: 56px; height: 56px; font-size: 1.125rem; }
.av.xl { width: 76px; height: 76px; font-size: 1.5rem; }
.av-stack { display: inline-flex; }
.av-stack .av { box-shadow: 0 0 0 2.5px var(--surface); }
.av-stack .av + .av { margin-left: -8px; }

/* ============================================================
   Sheets, dialogs, toasts, motion
   ============================================================ */
.layer { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
.sheet-wrap, .dialog-layer { position: absolute; inset: 0; pointer-events: auto; }
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity 260ms var(--ease); }
.scrim.on { opacity: 1; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100% - 40px - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; background: var(--elevated); border-radius: 28px 28px 0 0; box-shadow: var(--shadow-3); transform: translateY(100%); transition: transform 360ms var(--ease-out); outline: none; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet.on { transform: translateY(0); }
.sheet.dragging { transition: none; }
.sheet.full { height: calc(100% - 24px - env(safe-area-inset-top, 0px)); }
.sheet-handle { width: 40px; height: 5px; border-radius: 3px; background: var(--border-2); margin: 8px auto 0; flex: none; cursor: grab; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp3); padding: 10px 12px 6px 24px; flex: none; touch-action: none; }
.sheet-head.bare { justify-content: flex-end; padding-bottom: 0; }
.sheet-head h2 { font-size: 1.25rem; font-weight: 560; letter-spacing: -0.015em; font-family: var(--serif); }
.sheet-body { padding: 4px 24px 16px; overflow-y: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--sp4); overscroll-behavior: contain; }
.sheet-body.flush { padding-left: 8px; padding-right: 8px; }
.sheet-body.last { padding-bottom: 26px; }
.sheet-foot { padding: 12px 24px 18px; display: flex; flex-direction: column; gap: 8px; box-shadow: inset 0 1px 0 var(--hair); flex: none; background: var(--elevated); }
.sheet-foot.row-btns { flex-direction: row; }
.sheet-foot.row-btns .btn { flex: 1; }
.dialog-layer { display: grid; place-items: center; padding: var(--sp5); }
.dialog { position: relative; width: 100%; max-width: 400px; background: var(--elevated); border-radius: 26px; padding: var(--sp6); box-shadow: var(--shadow-3); transform: scale(.94); opacity: 0; transition: transform 220ms var(--ease-out), opacity 180ms; }
.dialog.on { transform: scale(1); opacity: 1; }
.dialog h2 { font-size: 1.25rem; font-weight: 560; margin-bottom: 8px; font-family: var(--serif); }
.dialog p { color: var(--fg-2); }
.dialog .dialog-actions { display: flex; flex-direction: column; gap: 8px; margin-top: var(--sp5); }
.toasts { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(92vw, 460px); }
.app.has-bbar ~ .toasts, .has-bbar .toasts { bottom: calc(var(--tabbar-h) + 84px + env(safe-area-inset-bottom, 0px)); }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 12px; border-radius: 18px; background: var(--toast-bg); color: var(--toast-fg); box-shadow: var(--shadow-3); font-size: 0.875rem; font-weight: 600; animation: toastIn 300ms var(--ease-out); max-width: 100%; min-height: 54px; }
.toast > .i { width: 20px; height: 20px; flex: none; margin-left: 4px; }
.toast .t-img { width: 40px; height: 40px; border-radius: 11px; flex: none; }
.toast .t-msg { flex: 1; min-width: 0; }
.toast .t-msg small { display: block; opacity: .78; font-size: 0.75rem; margin-top: 1px; font-weight: 500; }
.toast .t-act { color: var(--toast-link); font-weight: 800; padding: 8px 10px; border-radius: 10px; min-height: 40px; white-space: nowrap; }
.toast.out { animation: toastOut 220ms var(--ease) forwards; }
@keyframes toastIn { from { transform: translateY(14px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes toastOut { to { transform: translateY(8px); opacity: 0; } }

/* ============================================================
   Motion
   ============================================================ */
.screen.enter-push { animation: pushIn 340ms var(--ease-out); }
.screen.exit-push { animation: fadeOut 220ms var(--ease) forwards; }
.screen.enter-pop { animation: popIn 260ms var(--ease-out); }
.screen.exit-pop { animation: pushOutRight 260ms var(--ease) forwards; z-index: 2; }
.screen.enter-fade { animation: fadeIn 240ms var(--ease); }
.screen.exit-fade { animation: fadeOut 160ms var(--ease) forwards; }
.screen.enter-rise { animation: riseIn 400ms var(--ease-out); }
.screen.exit-rise { animation: fadeOut 200ms var(--ease) forwards; }
.screen.enter-shared { animation: fadeIn 280ms 140ms var(--ease) both; }
.screen.exit-shared { animation: fadeOut 260ms var(--ease) forwards; }
@keyframes pushIn { from { transform: translateX(28px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes popIn { from { transform: translateX(-16px); opacity: 0.6; } to { transform: none; opacity: 1; } }
@keyframes pushOutRight { to { transform: translateX(28px); opacity: 0; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes riseIn { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.shared-fly { position: fixed; z-index: 45; overflow: hidden; pointer-events: none; will-change: transform, border-radius; background-size: cover; background-position: center; }
.shared-fly img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shared-hide { visibility: hidden; }
.rise { animation: rise 520ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 60ms); }
.screen.no-anim .rise { animation: none; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.fade-swap { animation: fadeIn 240ms var(--ease); }
.flash { animation: flash 1.4s var(--ease); }
@keyframes flash { 0%, 100% { box-shadow: var(--shadow-1), inset 0 0 0 1px var(--hair); } 20% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 30%, transparent), inset 0 0 0 1px var(--brand); } }
.app.rm *, .app.rm *::before, .app.rm *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; scroll-behavior: auto !important; }
}

/* ============================================================
   Desktop shell (≥ 1024px): top navigation, wider content,
   floating sheets, no tab bar
   ============================================================ */
@media (min-width: 1024px) {
  :root { --gutter: 32px; --topnav-h: 72px; }
  .tabbar { display: none; }
  .basketbar-wrap { display: none; }
  .screen.has-tabbar .content, .app.has-bbar .screen.has-tabbar .content { padding-bottom: var(--sp10); }
  .screen.has-tabbar .footer-bar { bottom: 0; }
  .screen.has-tabbar.has-footer .content { padding-bottom: 132px; }
  .toasts, .app.has-bbar ~ .toasts { bottom: 28px; }
  .topnav { display: block; flex: none; height: var(--topnav-h); background: color-mix(in srgb, var(--bg) 94%, transparent); box-shadow: 0 1px 0 var(--hair); z-index: 25; }
  .topnav[hidden] { display: none !important; }
  .tn-inner { height: 100%; max-width: 1304px; margin: 0 auto; padding: 0 var(--gutter); display: flex; align-items: center; gap: 20px; }
  .tn-brand { flex: none; border-radius: 12px; }
  .tn-loc { display: flex; flex-direction: column; align-items: flex-start; padding: 6px 12px; border-radius: 12px; min-width: 0; max-width: 200px; flex: none; }
  .tn-loc:hover { background: var(--fill); }
  .tn-loc-k { font-size: 0.6875rem; font-weight: 700; color: var(--fg-2); }
  .tn-loc-v { display: flex; align-items: center; gap: 5px; font-weight: 750; font-size: 0.875rem; min-width: 0; max-width: 100%; }
  .tn-loc-v .i { color: var(--brand-text); }
  .tn-loc-v .i:last-child { color: var(--fg-2); }
  .tn-search { flex: 1 1 360px; max-width: 460px; display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 12px 0 16px; border-radius: 14px; background: var(--sand); color: var(--fg-2); font-size: 0.875rem; text-align: left; transition: background var(--dur); }
  .tn-search:hover { background: var(--sand-2); }
  .tn-search .i { width: 19px; height: 19px; }
  .tn-search span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tn-search kbd { font-family: var(--font); font-size: 0.75rem; font-weight: 700; padding: 2px 8px; border-radius: 7px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border-2); color: var(--fg-2); }
  .tn-links { display: flex; gap: 2px; flex: none; }
  .tn-link { position: relative; min-height: 44px; padding: 0 12px; white-space: nowrap; border-radius: 12px; font-weight: 700; font-size: 0.9375rem; color: var(--fg-2); }
  .tn-link:hover { color: var(--fg); background: var(--fill); }
  .tn-link[aria-current="page"] { color: var(--fg); }
  .tn-link[aria-current="page"]::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: 4px; height: 2.5px; border-radius: 2px; background: var(--brand); }
  .tn-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .tn-proto { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 12px; font-weight: 700; font-size: 0.8125rem; color: var(--fg-2); box-shadow: inset 0 0 0 1px var(--border-2); }
  .tn-proto:hover { color: var(--fg); background: var(--fill); }
  .tn-basket { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px 0 14px; border-radius: 14px; background: var(--btn); color: var(--on-btn); font-weight: 750; font-size: 0.9375rem; }
  .tn-basket:hover { background: var(--btn-hover); }
  .tn-b-n { min-width: 24px; height: 24px; padding: 0 7px; border-radius: 999px; background: rgba(255,255,255,.24); display: grid; place-items: center; font-size: 0.8125rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .tn-avatar { border-radius: 50%; }
  .tn-avatar .av { width: 40px; height: 40px; font-size: 0.8125rem; }
  .sheet { left: 50%; right: auto; bottom: auto; top: 50%; width: min(560px, calc(100vw - 48px)); max-height: min(800px, calc(100vh - 64px)); border-radius: 28px; transform: translate(-50%, -46%) scale(.97); opacity: 0; transition: transform 260ms var(--ease-out), opacity 200ms; }
  .sheet.on { transform: translate(-50%, -50%); opacity: 1; }
  .sheet.wide { width: min(780px, calc(100vw - 48px)); }
  .sheet.side { left: auto; right: 0; top: 0; bottom: 0; height: 100%; max-height: none; width: min(460px, 92vw); border-radius: 28px 0 0 28px; transform: translateX(100%); opacity: 1; }
  .sheet.side.on { transform: none; }
  .sheet-handle { display: none; }
  .sheet-head { padding-top: 18px; }
  .netbar { padding-top: 8px; }
}

/* Narrow desktops: keep the top bar on one line */
@media (min-width: 1024px) and (max-width: 1319px) {
  .tn-inner { gap: 12px; }
  .tn-link { padding: 0 9px; }
  .tn-loc { max-width: 150px; }
  .tn-search { flex: 1 1 160px; min-width: 0; }
  .tn-search span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tn-search kbd { display: none; }
  .tn-proto span { display: none; }
}

/* ============================================================
   Food: home, collections, search, restaurant cards, dish cards,
   restaurant profile and dish details.
   ============================================================ */

/* ---------- Rails: scroll sideways on phones, grid on desktop ---------- */
.rail { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: -6px calc(var(--gutter) * -1); padding: 6px var(--gutter) 10px; scroll-padding-inline: var(--gutter); }
.rail::-webkit-scrollbar { display: none; }
.rail-i { flex: none; scroll-snap-align: start; width: min(72vw, 300px); display: flex; }
.rail-i > * { flex: 1; min-width: 0; }
.rail.dishes .rail-i { width: min(56vw, 220px); }
.rail.moods .rail-i { width: min(38vw, 160px); }
.rail.ups-rail .rail-i { width: 148px; }
.rest-grid { display: grid; grid-template-columns: 1fr; gap: 22px; }
.dish-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; }
.dg-i { position: relative; display: flex; }
.dg-i > .dcard { flex: 1; }
@media (min-width: 640px) {
  .rest-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 18px; }
  .dish-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (min-width: 1024px) {
  .rest-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px 24px; }
  .rest-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dish-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px 20px; }
  .rail { margin: 0; padding: 0; overflow: visible; display: grid; grid-auto-flow: row; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
  .rail-i, .rail.dishes .rail-i, .rail.moods .rail-i, .rail.ups-rail .rail-i { width: auto; }
  .rail.moods { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .rail.rests { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .rail.ups-rail { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .content.narrow .rail.dishes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* ---------- Restaurant card: white card, photo inset, chips for time and fee ---------- */
.rcard { position: relative; display: flex; flex-direction: column; gap: 10px; min-width: 0; padding: 8px 8px 14px; border-radius: 26px; background: var(--surface); box-shadow: var(--shadow-card), inset 0 0 0 1px var(--hair); }
.rc-link { position: relative; display: block; border-radius: 20px; text-decoration: none; color: inherit; overflow: hidden; }
.rc-ph { aspect-ratio: 16 / 10; border-radius: 20px; transition: transform 420ms var(--ease-out); }
.rc-link:hover .rc-ph { transform: scale(1.03); }
.rcard.compact .rc-ph { aspect-ratio: 4 / 3; }
.rcard.wide .rc-ph { aspect-ratio: 2 / 1; }
.rcard.is-closed .rc-ph img, .rcard.is-far .rc-ph img { filter: saturate(.5) brightness(.9); }
.rc-offer, .rc-new { position: absolute; left: 10px; bottom: 10px; z-index: 2; display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px 6px 9px; border-radius: 999px; font-size: 0.75rem; font-weight: 800; background: var(--deal); color: #FFFFFF; box-shadow: 0 4px 12px -4px rgba(0,40,30,.45); }
.rc-new { background: var(--olive); color: #fff; padding-left: 11px; }
.rc-body { display: flex; flex-direction: column; gap: 4px; padding: 0 8px; }
.rc-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.rc-name { font-size: 1.0625rem; font-weight: 800; letter-spacing: -0.015em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rc-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 7px; font-size: 0.8125rem; color: var(--fg-2); }
.rc-info { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; font-size: 0.75rem; font-weight: 750; color: var(--fg); }
.rc-info > span { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px; background: var(--fill); }
.rc-info .i { color: var(--brand-text); width: 14px; height: 14px; }
.rc-closed, .rc-far { color: var(--warning-text); background: var(--warning-soft) !important; }
.rc-closed .i, .rc-far .i { color: currentColor !important; }
.rc-soon { color: var(--brand-text); background: var(--brand-soft) !important; }
.rating { display: inline-flex; align-items: center; gap: 3px; font-size: 0.8125rem; font-weight: 800; white-space: nowrap; flex: none; }
.rating .i { color: var(--gold); }
.rating .r-c { color: var(--fg-2); font-weight: 600; }
.rc-top .rating { padding: 3px 8px; border-radius: 999px; background: var(--fill); }
.plevel { font-weight: 700; letter-spacing: .02em; }
.plevel .pl-off { color: var(--fg-3); opacity: .5; }
.spons-tag { font-size: 0.6875rem; font-weight: 700; color: var(--fg-2); background: var(--fill); padding: 2px 8px; border-radius: 999px; }
.offer-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 0.8125rem; font-weight: 700; color: var(--brand-text); }

/* favourite heart: white circle on photos */
.fav-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; color: var(--fg); transition: transform 180ms var(--spring), color var(--dur); }
.fav-btn .i { width: 21px; height: 21px; }
.fav-btn[aria-pressed="true"] { color: var(--heart); }
.fav-btn[aria-pressed="true"] .i { fill: currentColor; }
.fav-btn.on-photo { position: absolute; top: 16px; right: 16px; z-index: 3; width: 40px; height: 40px; background: rgba(255,255,255,.94); color: #0F1E1B; box-shadow: 0 6px 16px -6px rgba(0,0,0,.35); }
.fav-btn.on-photo:hover { background: #fff; }
.fav-btn.on-photo[aria-pressed="true"] { color: #E5442A; }
.fav-btn.pop { animation: favPop 420ms var(--spring); }
@keyframes favPop { 0% { transform: scale(1); } 40% { transform: scale(1.28); } 100% { transform: scale(1); } }

/* diet badges */
.diets { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.diet { display: inline-flex; align-items: center; gap: 2px; height: 20px; padding: 0 7px; border-radius: 999px; font-size: 0.6875rem; font-weight: 800; letter-spacing: .02em; background: var(--olive-soft); color: var(--olive-text); }
.diet.d-gf { background: var(--fill); color: var(--fg-2); }
.diet.d-spicy { background: var(--brand-soft); color: var(--brand-text); }
.diet.d-spicy .i { width: 12px; height: 12px; }
.diet.d-pop { background: var(--peach); color: var(--on-peach); font-weight: 750; letter-spacing: 0; }

/* ---------- Dish card: photo tile, price, square add button ---------- */
.dcard { position: relative; display: flex; flex-direction: column; gap: 10px; min-width: 0; padding: 8px 8px 12px; border-radius: 24px; background: var(--surface); box-shadow: var(--shadow-card), inset 0 0 0 1px var(--hair); }
.dc-link { display: block; border-radius: 18px; color: inherit; text-decoration: none; position: relative; overflow: hidden; }
.dc-ph { aspect-ratio: 1 / 1; border-radius: 18px; transition: transform 420ms var(--ease-out); }
.dc-link:hover .dc-ph { transform: scale(1.04); }
.dcard.is-off .dc-ph img { filter: grayscale(.7) brightness(.95); }
.dc-off { position: absolute; left: 8px; bottom: 8px; z-index: 2; padding: 4px 10px; border-radius: 999px; background: var(--surface); font-size: 0.75rem; font-weight: 750; color: var(--error); }
.dc-body { display: flex; flex-direction: column; gap: 2px; padding: 0 6px; min-width: 0; flex: 1; }
.dc-name { font-size: 0.9375rem; font-weight: 800; line-height: 1.3; letter-spacing: -0.01em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dc-rest { font-size: 0.8125rem; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dc-foot { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 8px; padding-right: 44px; flex-wrap: wrap; min-height: 40px; }
.dc-price { font-weight: 800; font-size: 1rem; }
.dcard > .qadd { position: absolute; right: 12px; bottom: 12px; top: auto; }

/* quick add: a mint square, like a key on a till */
.qadd { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 14px; background: var(--btn); color: var(--on-btn); box-shadow: 0 8px 18px -8px color-mix(in srgb, var(--btn) 80%, transparent); z-index: 3; transition: transform 160ms var(--spring), background var(--dur); }
.qadd:hover { background: var(--btn-hover); }
.qadd:active { transform: scale(.9); }
.qadd .i { width: 20px; height: 20px; stroke-width: 2.4; }
.qadd.added { background: var(--success); color: #fff; animation: qaPop 420ms var(--spring); }
.qadd.inline { position: static; flex: none; }
@keyframes qaPop { 0% { transform: scale(.8); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }

/* ---------- Menu row: each dish its own card ---------- */
.menu-list { display: flex; flex-direction: column; gap: 10px; }
.mrow { position: relative; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow-card), inset 0 0 0 1px var(--hair); }
.mr-link { display: flex; gap: 14px; align-items: flex-start; padding: 12px 12px 12px 16px; color: inherit; text-decoration: none; min-height: 72px; }
.mr-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
.mr-name { font-weight: 800; font-size: 1rem; line-height: 1.3; letter-spacing: -0.01em; }
.mr-in { display: inline-grid; place-items: center; min-width: 26px; height: 22px; padding: 0 6px; margin-right: 6px; border-radius: 999px; background: var(--btn); color: var(--on-btn); font-size: 0.75rem; font-weight: 800; vertical-align: 1px; }
.mr-desc { font-size: 0.8125rem; color: var(--fg-2); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mr-foot { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; margin-top: 4px; }
.mr-price { font-weight: 800; font-size: 1rem; }
.mr-kcal { font-size: 0.75rem; color: var(--fg-2); font-weight: 650; }
.mr-ph { width: 108px; height: 108px; border-radius: 18px; flex: none; }
.mrow .qadd { position: absolute; right: 18px; top: 86px; }
.mrow.no-ph .qadd { top: 14px; right: 14px; }
.mrow.no-ph .mr-text { padding-right: 52px; }
.mrow.is-off .mr-name, .mrow.is-off .mr-price { color: var(--fg-2); }
.mrow.is-off .mr-ph img { filter: grayscale(.8); }
@media (min-width: 1024px) { .mr-ph { width: 124px; height: 124px; } .mrow .qadd { top: 102px; } }

/* flying photo when adding to basket */
.fly-dot { position: fixed; z-index: 120; width: 72px; height: 72px; border-radius: 50%; overflow: hidden; box-shadow: var(--shadow-3), 0 0 0 3px var(--surface); background: var(--brand); color: var(--on-btn); display: grid; place-items: center; pointer-events: none; }
.fly-dot img { width: 100%; height: 100%; object-fit: cover; }

/* ---------- Home ---------- */
/* colour-blocked header; the rest of the page slides over it as a sheet */
.home .content { padding-top: 0; }
.home-hero { position: relative; display: flex; flex-direction: column; gap: 16px; margin: 0 calc(var(--gutter) * -1); padding: calc(env(safe-area-inset-top, 0px) + 10px) var(--gutter) 52px; background: radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,.10), transparent 55%), linear-gradient(160deg, var(--block), var(--block-2)); color: var(--on-block); overflow: hidden; isolation: isolate; }
.home-hero::after { content: ''; position: absolute; z-index: -1; right: -70px; top: -60px; width: 220px; height: 220px; border-radius: 50%; border: 36px solid rgba(255,255,255,.06); }
.hh-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.home-hero .loc-btn { color: var(--on-block); }
.loc-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-height: 44px; padding: 2px 6px 2px 0; text-align: left; min-width: 0; }
.loc-btn .lk { font-size: 0.75rem; font-weight: 650; }
.loc-btn .lv { display: inline-flex; align-items: center; gap: 5px; font-weight: 800; font-size: 0.9375rem; min-width: 0; max-width: 52vw; }
.loc-btn .lv .one { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.home-top-r { display: flex; align-items: center; gap: 8px; }
.hh-ic { position: relative; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--block-soft); color: var(--on-block); transition: background var(--dur); }
.hh-ic:hover { background: rgba(255,255,255,.26); }
.bell .dot { position: absolute; top: 10px; right: 11px; width: 10px; height: 10px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 2px var(--block); }
.home-hello { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.hh-greet { font-size: 0.875rem; font-weight: 700; }
.home-hello .display { color: var(--on-block); font-size: clamp(2.25rem, 10vw, 3.5rem); max-width: 13ch; line-height: 1.02; }
.home-hero .search-fake.big { background: #fff; color: #52615D; box-shadow: 0 10px 30px -12px rgba(4,40,30,.45); min-height: 56px; }
.home-hero .search-fake.big:hover { background: #fff; }
.home-hero .fseg { align-self: flex-start; background: var(--block-soft); }
.home-hero .fseg > button { color: var(--on-block); min-height: 38px; padding: 0 16px; font-size: 0.8125rem; }
.home-hero .fseg > button .i { width: 16px; height: 16px; }
.home-hero .fseg > button[aria-checked="true"] { background: #fff; color: #0F1E1B; box-shadow: none; }
.home-sheet { position: relative; z-index: 1; display: flex; flex-direction: column; gap: var(--sp7); margin: -28px calc(var(--gutter) * -1) 0; padding: 22px var(--gutter) 0; border-radius: 28px 28px 0 0; background: var(--bg); }
.fseg > button { min-height: 36px; padding: 0 12px; font-size: 0.8125rem; }
.fseg > button .i { width: 15px; height: 15px; }

.cz-row { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(var(--gutter) * -1); padding: 2px var(--gutter) 4px; }
.cz-row::-webkit-scrollbar { display: none; }
.cz { display: flex; flex-direction: column; align-items: center; gap: 7px; width: 74px; padding: 4px 2px; border-radius: 18px; font-size: 0.8125rem; font-weight: 700; color: var(--fg); transition: transform 160ms var(--spring); }
.cz:active { transform: scale(.94); }
.cz-art { width: 62px; height: 62px; border-radius: 50%; background: var(--surface); padding: 11px; box-shadow: var(--shadow-1), inset 0 0 0 1px var(--hair); transition: background var(--dur), box-shadow var(--dur); }
.cz:hover .cz-art { background: var(--brand-soft); box-shadow: inset 0 0 0 2px var(--brand); }
.cz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.cz.big { width: auto; background: var(--surface); box-shadow: var(--shadow-card), inset 0 0 0 1px var(--hair); padding: 14px 6px; border-radius: 22px; }
.cz.big .cz-art { box-shadow: none; background: var(--sand); }
@media (min-width: 1024px) { .cz-row { margin: 0; padding: 2px 0 4px; justify-content: space-between; } .cz { width: 88px; } }

/* coupon banner */
.promo-banner { position: relative; display: flex; align-items: center; gap: 12px; min-height: 132px; padding: 18px 18px 18px 22px; border-radius: 26px; background: var(--peach); color: var(--on-peach); text-decoration: none; overflow: hidden; isolation: isolate; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--coral) 18%, transparent); }
.promo-banner::before { content: ''; position: absolute; z-index: -1; right: -40px; top: 50%; width: 200px; height: 200px; transform: translateY(-50%); border-radius: 50%; background: color-mix(in srgb, var(--coral) 18%, transparent); }
.pb-t { flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; }
.pb-k { font-size: 0.75rem; font-weight: 750; }
.pb-t strong { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; color: var(--fg); }
.pb-code { margin-top: 6px; padding: 5px 12px; border-radius: 10px; border: 1.5px dashed var(--on-peach); color: var(--on-peach); font-weight: 800; letter-spacing: .08em; font-size: 0.8125rem; background: var(--surface); }
.pb-ph { width: 112px; height: 112px; border-radius: 50%; flex: none; box-shadow: 0 14px 30px -12px rgba(60,30,10,.45); }

.live-card { display: flex; align-items: center; gap: 14px; padding: 12px; text-align: left; width: 100%; }
.lc-ph { width: 64px; height: 64px; border-radius: 18px; flex: none; }
.lc-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.lc-k { display: flex; align-items: center; gap: 8px; font-size: 0.8125rem; font-weight: 700; color: var(--fg-2); }
.lc-k .lb-pulse { width: 8px; height: 8px; }
.lc-t { font-weight: 800; font-size: 1.0625rem; }
.lc-s { font-size: 0.8125rem; color: var(--fg-2); }
.lc-steps { display: flex; align-items: center; gap: 0; margin-top: 10px; }
.lc-steps i { position: relative; width: 12px; height: 12px; border-radius: 50%; flex: none; background: var(--surface); box-shadow: inset 0 0 0 2px var(--track); }
.lc-steps i + i { margin-left: 22px; }
.lc-steps i + i::before { content: ''; position: absolute; right: 14px; top: 5px; width: 18px; border-top: 2px dotted var(--track); }
.lc-steps i.on { background: var(--brand); box-shadow: none; }
.lc-steps i.on + i::before, .lc-steps i.on + i.on::before { border-top-color: var(--brand); }
.lc-steps i.cur { background: var(--surface); box-shadow: inset 0 0 0 3px var(--brand), 0 0 0 4px color-mix(in srgb, var(--brand) 18%, transparent); }
.lc-go { color: var(--fg-2); }

.hero-feature { position: relative; border-radius: 28px; overflow: hidden; min-height: 400px; display: flex; align-items: flex-end; isolation: isolate; color: #fff; box-shadow: var(--shadow-card); }
.hf-link { position: absolute; inset: 0; z-index: 0; }
.hf-ph { position: absolute; inset: 0; border-radius: 0; }
.hf-ph .scrim-b { background: var(--hero-scrim); }
.hf-text { position: relative; z-index: 2; padding: 28px 24px 26px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; max-width: 520px; pointer-events: none; }
.hf-text .btn { pointer-events: auto; margin-top: 8px; }
.hf-text p { color: rgba(255,255,255,.9); font-size: 0.9375rem; }
.hf-k { align-self: flex-start; font-size: 0.75rem !important; font-weight: 800; color: #0F1E1B !important; background: var(--btn); padding: 4px 10px; border-radius: 999px; }
.hero-feature .display { color: #fff; font-size: 2.25rem; }
@media (min-width: 1024px) { .hero-feature { min-height: 440px; } .hf-text { padding: 48px; } .hero-feature .display { font-size: 3.25rem; } }

.mood { position: relative; display: block; border-radius: 22px; overflow: hidden; color: #fff; text-decoration: none; box-shadow: var(--shadow-card); }
.mood-ph { aspect-ratio: 3 / 4; border-radius: 22px; }
.mood-t { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 2; font-weight: 800; font-size: 0.9375rem; line-height: 1.2; text-wrap: balance; }
.again-card { display: flex; flex-direction: column; gap: 10px; padding: 14px; }
.ag-top { display: flex; gap: 12px; align-items: center; }
.ag-ph { width: 52px; height: 52px; border-radius: 16px; flex: none; }
.ag-t h3 { font-size: 1rem; }
.ag-items { color: var(--fg-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.9em; }
.ag-act { display: flex; gap: 8px; margin-top: auto; }
.home-group { flex-direction: row; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; background: var(--nav-bg) !important; color: #fff; }
.home-group > div { flex: 1 1 280px; display: flex; flex-direction: column; gap: 6px; }
.home-group .muted { color: #B5C7C1; }
.home-group .btn-dark { background: var(--btn); color: var(--on-btn); }
.proto-foot { display: flex; gap: 6px; align-items: flex-start; justify-content: center; text-align: center; }
@media (min-width: 1024px) {
  .home .content { padding-top: var(--sp6); }
  .home-hero { margin: 0; padding: 48px 56px 56px; border-radius: 32px; min-height: 300px; justify-content: flex-end; }
  .home-hero::after { width: 420px; height: 420px; right: -120px; top: -140px; border-width: 70px; }
  .home-hero .hh-top, .home-hero .search-fake.big { display: none; }
  .home-hello .display { font-size: 4rem; max-width: 16ch; }
  .home-sheet { margin: 0; padding: 0; border-radius: 0; background: transparent; }
}

/* ---------- Collection / category ---------- */
.coll-hero { position: relative; display: grid; gap: 16px; }
.coll-ph { aspect-ratio: 16 / 9; border-radius: 24px; }
.coll-text { display: flex; flex-direction: column; gap: 6px; }
.coll-art .cz-art { width: 56px; height: 56px; }
.coll-hero.no-ph .coll-text { padding-top: 8px; }
@media (min-width: 1024px) {
  .coll-hero { grid-template-columns: 1.2fr 1fr; align-items: end; gap: 40px; }
  .coll-ph { aspect-ratio: 2 / 1; }
  .coll-text .display { font-size: 2.75rem; }
}
.filter-bar { display: flex; gap: 8px; align-items: center; position: sticky; top: 0; z-index: 4; background: var(--bg); margin: -8px calc(var(--gutter) * -1); padding: 8px var(--gutter); }
.filter-bar > .chip { flex: none; }
.filter-bar .chips { flex: 1; min-width: 0; }

/* ---------- Search ---------- */
.search-head { position: sticky; top: 0; z-index: 4; background: var(--bg); margin: 0 calc(var(--gutter) * -1); padding: 8px var(--gutter) 4px; }
.search.big .input { min-height: 56px; font-size: 1rem; box-shadow: inset 0 0 0 1px var(--hair); }
.diet-chips { margin-top: calc(var(--sp5) * -1); }
.sres-list { display: flex; flex-direction: column; }
.sres { display: flex; align-items: center; gap: 10px; }
.sres + .sres { box-shadow: inset 0 1px 0 var(--hair); }
.sres-link { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; padding: 10px 0; color: inherit; text-decoration: none; min-height: 72px; }
.sres-ph { width: 60px; height: 60px; border-radius: 14px; flex: none; }
.sres-ph.rest { width: 76px; height: 56px; }
.sres-t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.sres-n { font-weight: 750; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sres-r, .sres-m { font-size: 0.8125rem; color: var(--fg-2); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.sres-m { color: var(--fg); font-weight: 600; }
.sres.is-off .sres-n { color: var(--fg-2); }
.recent { display: flex; align-items: center; padding-right: 8px; }
.recent .row { flex: 1; }
.list.boxed > .recent + .recent { box-shadow: inset 0 1px 0 var(--hair); }

/* ---------- Restaurant profile ---------- */
.rest-hero { position: relative; }
.rh-ph { height: min(46vh, 380px); border-radius: 0; }
.rest-content { position: relative; margin-top: -28px; background: var(--bg); border-radius: 28px 28px 0 0; padding-top: 24px; }
.rest-layout { display: flex; flex-direction: column; gap: var(--sp7); }
.rest-main { display: flex; flex-direction: column; gap: var(--sp6); min-width: 0; }
.rest-head { display: flex; flex-direction: column; gap: 6px; }
.rest-head .display { font-size: 2.125rem; }
.rh-cz { font-size: 0.9375rem; color: var(--fg-2); font-weight: 600; }
.rh-blurb { color: var(--fg); max-width: 56ch; }
.rh-rate { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 2px; }
.rh-rate .rating { font-size: 0.9375rem; }
.rfacts { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; margin-top: 14px; }
.rfacts > div { border-radius: 20px; background: var(--surface); box-shadow: var(--shadow-card), inset 0 0 0 1px var(--hair); padding: 12px 4px 10px; }
.rfacts dd { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; }
.rfacts dd .i { width: 34px; height: 34px; padding: 8px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-text); margin-bottom: 4px; }
.rf-v { font-weight: 800; font-size: 0.875rem; white-space: nowrap; }
.rf-k { font-size: 0.6875rem; color: var(--fg-2); font-weight: 650; line-height: 1.2; }
.dish-stats { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 0; margin-top: 6px; padding: 12px 0; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow-card), inset 0 0 0 1px var(--hair); }
.dish-stats > div + div { box-shadow: inset 1px 0 0 var(--hair); }
.dish-stats dd { display: flex; flex-direction: column; align-items: center; gap: 1px; text-align: center; padding: 0 4px; }
.dish-stats dd .i { color: var(--brand-text); margin-bottom: 3px; }
.ds-v { font-weight: 800; font-size: 0.9375rem; }
.ds-k { font-size: 0.6875rem; font-weight: 650; color: var(--fg-2); }
.offer-band { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 20px; background: var(--deal); color: #FFFFFF; }
.offer-band > .i { color: #FFFFFF; margin-top: 2px; }
.ob-t { flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 0.875rem; }
.ob-t .bar { margin-top: 4px; background: rgba(255,255,255,.22); }
.ob-t .bar > * { background: #FFFFFF; }
.rest-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.cat-nav { position: sticky; top: 56px; z-index: 5; margin: 0 calc(var(--gutter) * -1); background: var(--bg); transition: box-shadow var(--dur); }
.cat-nav.stuck { box-shadow: 0 1px 0 var(--hair); }
.cat-nav-in { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 8px var(--gutter); }
.cat-nav-in::-webkit-scrollbar { display: none; }
.cat-link { flex: none; display: inline-flex; align-items: center; min-height: 40px; padding: 0 15px; border-radius: 999px; font-size: 0.875rem; font-weight: 700; color: var(--fg-2); text-decoration: none; transition: background var(--dur), color var(--dur); }
.cat-link:hover { color: var(--fg); background: var(--fill); }
.cat-link[aria-current="true"] { background: var(--fg); color: var(--bg); }
.menu-sec { display: flex; flex-direction: column; gap: 6px; scroll-margin-top: 120px; }
.menu-sec > .sec-title { margin-bottom: 6px; }
.menu-sec:focus { outline: none; }
.allergen-note { display: flex; gap: 12px; align-items: flex-start; }
.allergen-note > .i { color: var(--fg-2); flex: none; margin-top: 2px; }
.desk-basket { display: none; }
table.hours { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
table.hours th, table.hours td { padding: 7px 0; text-align: left; font-weight: 500; border-bottom: 1px solid var(--hair); }
table.hours td { text-align: right; }
table.hours tr.today th, table.hours tr.today td { font-weight: 800; }
.pill-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
@media (min-width: 1024px) {
  .rh-ph { height: 420px; }
  .rest-content { margin-top: -56px; border-radius: 32px 32px 0 0; padding-top: 36px; }
  .rest-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 48px; align-items: start; }
  .rest-head .display { font-size: 3rem; }
  .cat-nav { top: 0; margin: 0; }
  .cat-nav-in { padding: 10px 0; }
  .desk-basket { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 24px; padding: 22px; }
  .db-lines { display: flex; flex-direction: column; gap: 12px; }
  .db-lines li { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; font-size: 0.875rem; }
  .db-n small { display: block; color: var(--fg-2); font-size: 0.75rem; }
  .db-q { font-weight: 800; color: var(--brand-text); }
  .db-empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 12px 0; }
  .db-empty .empty-art { width: 96px; height: 72px; }
}
.db-sub { display: flex; justify-content: space-between; font-weight: 800; padding-top: 12px; border-top: 1px solid var(--hair); }

/* ---------- Dish details ---------- */
.dish-hero { position: relative; }
.dh-ph { aspect-ratio: 4 / 3.3; max-height: 52vh; width: 100%; border-radius: 0; }
.dish-content { position: relative; margin-top: -28px; background: var(--bg); border-radius: 28px 28px 0 0; padding-top: 26px; }
.dish-content.no-ph { margin-top: 0; border-radius: 0; }
.dish-head { display: flex; flex-direction: column; gap: 8px; }
.dh-rest { align-self: flex-start; font-size: 0.8125rem; min-height: 32px; }
.dh-meta { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
.dh-price { font-weight: 800; font-size: 1.25rem; }
.dh-desc { font-size: 1rem; color: var(--fg); line-height: 1.55; }
details.allergens { background: var(--surface); border-radius: 16px; box-shadow: inset 0 0 0 1px var(--hair); padding: 2px 16px; }
details.allergens > summary { display: flex; width: 100%; justify-content: space-between; color: var(--fg); font-weight: 600; min-height: 52px; }
details.allergens > summary > span { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
details.allergens > summary > span .i { color: var(--fg-2); flex: none; }
details.allergens[open] { padding-bottom: 14px; }
#mods { display: flex; flex-direction: column; gap: var(--sp6); }
.mod-group { border: 0; padding: 0; margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.mg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 0; float: left; }
.mg-head + * { clear: both; }
.mg-t { font-weight: 800; font-size: 1.0625rem; }
.mg-badge { font-size: 0.75rem; font-weight: 750; color: var(--fg-2); background: var(--fill); padding: 3px 9px; border-radius: 999px; }
.mg-badge.req { background: var(--brand-soft); color: var(--brand-text); }
.mod-group.invalid .mg-badge.req { background: var(--error); color: #fff; }
.mod-group.invalid .opt { box-shadow: inset 0 0 0 1.5px var(--error); }
.mg-opts { display: flex; flex-direction: column; gap: 8px; }
.o-mark { width: 22px; height: 22px; flex: none; display: grid; place-items: center; border: 1.5px solid var(--control); }
.o-mark.dot { border-radius: 50%; }
.o-mark.box { border-radius: 7px; color: transparent; }
.o-mark .i { width: 14px; height: 14px; stroke-width: 3; }
.opt[aria-checked="true"] .o-mark { border-color: var(--brand); }
.opt[aria-checked="true"] .o-mark.dot::after { content: ''; width: 11px; height: 11px; border-radius: 50%; background: var(--brand); }
.opt[aria-checked="true"] .o-mark.box { background: var(--brand); color: var(--on-btn); }
.opt .o-t { display: flex; flex-direction: column; min-width: 0; }
.opt .o-t .o-s { font-weight: 500; }
.opt[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.hint-row { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.hint-row .char-count { flex: none; margin-top: 6px; }
.dish-screen .footer-bar .stepper { flex: none; }
@media (min-width: 1024px) {
  .dish-screen .dish-hero { max-width: 760px; margin: 24px auto 0; border-radius: 28px; overflow: hidden; }
  .dh-ph { max-height: 460px; }
  .dish-content { margin-top: 0; border-radius: 0; }
}

/* ============================================================
   Flows: onboarding, basket, checkout, tracking, completion,
   orders, reviews, help, saved, recommendations, group orders,
   offers and profile.
   ============================================================ */

/* ---------- Welcome ---------- */
.wel-screen { background: var(--bg); }
.wel { position: relative; height: 100%; display: flex; flex-direction: column; overflow-y: auto; }
.wel-top { position: absolute; z-index: 3; top: calc(env(safe-area-inset-top, 0px) + 18px); left: 0; right: 0; display: flex; justify-content: center; }
.wel-top .wordmark { color: #FFFFFF; }
.wel-photo { position: relative; flex: 1 1 54%; min-height: 300px; }
.wel-photo .ph { position: absolute; inset: 0; border-radius: 0 0 36px 36px; }
.wel-photo .ph::after { content: ''; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(20,14,8,.42), transparent 28%); }
.wel-body { flex: none; display: flex; flex-direction: column; gap: 22px; padding: 28px var(--gutter) calc(24px + env(safe-area-inset-bottom, 0px)); max-width: 520px; width: 100%; margin: 0 auto; }
.wel-desk-brand { display: none; }
.wel-copy { display: flex; flex-direction: column; gap: 12px; }
.wel-copy .display { font-size: clamp(2.375rem, 11vw, 3.25rem); }
.wel-lead { font-size: 1.0625rem; color: var(--fg-2); max-width: 36ch; }
.wel-actions { display: flex; flex-direction: column; gap: 6px; }
.wel-note { display: flex; gap: 6px; font-size: 0.8125rem; color: var(--fg-2); }
.wel-note .i { flex: none; margin-top: 2px; }
.wel-screen.enter-fade .wel-copy, .wel-screen .wel-copy { animation: rise 640ms var(--ease-out) 120ms both; }
.wel-screen .wel-actions { animation: rise 640ms var(--ease-out) 240ms both; }
.wel-screen .wel-photo .ph > img { transform: scale(1.06); transition: opacity 600ms var(--ease), transform 1600ms var(--ease-out); }
.wel-screen .wel-photo .ph > img.in { transform: scale(1); }
@media (min-width: 1024px) {
  .wel { flex-direction: row; }
  .wel-top { display: none; }
  .wel-photo { flex: 1 1 56%; min-height: 0; }
  .wel-photo .ph { inset: 20px 0 20px 20px; border-radius: 32px; }
  .wel-body { flex: 1 1 44%; justify-content: center; padding: 64px; max-width: 600px; }
  .wel-desk-brand { display: block; margin-bottom: 28px; }
  .wel-copy .display { font-size: 3.75rem; }
  .wel-actions { flex-direction: row; } .wel-actions .btn { flex: 1; }
}

/* ---------- Auth ---------- */
.auth-head { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.auth-head .wordmark { margin-bottom: 8px; }
.auth-alt { display: flex; flex-direction: column; gap: 10px; }
.or { display: flex; align-items: center; gap: 12px; color: var(--fg-2); font-size: 0.8125rem; font-weight: 650; }
.or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ---------- Location ---------- */
.loc-head { display: flex; flex-direction: column; gap: 8px; }
.loc-head .progress-steps { margin-bottom: 8px; justify-content: flex-start; }
.loc-current { padding: 10px 14px; }
.loc-current .row-title { color: var(--brand-text); }
.loc-map { overflow: hidden; display: flex; flex-direction: column; }
.loc-map .minimap { width: 100%; height: 180px; display: block; }
.loc-map figcaption { display: flex; gap: 6px; align-items: center; padding: 10px 14px; }
.loc-hint { padding: 14px 16px; }
#loc-results:empty { display: none; }
.minimap { display: block; width: 100%; height: 160px; border-radius: 14px; background: var(--map-block); }
.loc-pinmap { position: relative; overflow: hidden; touch-action: none; cursor: grab; }
.loc-pinmap.dragging { cursor: grabbing; }
.loc-pinmap .minimap { height: 230px; border-radius: var(--r-card); }
.loc-pinmap .pin-g { transition: transform 80ms linear; }
.loc-pinmap.dragging .pin-g { transition: none; }
.loc-pinmap:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.pin-hint { position: absolute; left: 12px; bottom: 12px; display: inline-flex; gap: 6px; align-items: center; padding: 5px 10px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-1); font-size: 0.75rem; font-weight: 700; }

/* ---------- Map markers (shared) ---------- */
.mk-courier .mk-halo { animation: halo 2s ease-out infinite; transform-origin: center; transform-box: fill-box; }
@keyframes halo { 0% { transform: scale(.7); opacity: .5; } 100% { transform: scale(1.7); opacity: 0; } }
.mk-rest.on circle { stroke: var(--brand); }

/* ---------- Basket ---------- */
.basket > .display { margin-bottom: -8px; }
.bk-rest { display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; color: inherit; text-decoration: none; }
.bkr-ph { width: 52px; height: 52px; border-radius: 14px; flex: none; }
.bkr-t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.blines { display: flex; flex-direction: column; }
.bline { display: flex; gap: 14px; padding: 14px 0; }
.bline + .bline { box-shadow: inset 0 1px 0 var(--hair); }
.bl-ph { width: 64px; height: 64px; border-radius: 14px; flex: none; display: grid; place-items: center; background: var(--sand); color: var(--fg-3); }
.bl-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.bl-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.bl-n { font-weight: 750; }
.bl-p { font-weight: 800; flex: none; }
.bl-s { font-size: 0.8125rem; color: var(--fg-2); display: flex; gap: 5px; align-items: center; }
.bl-s.note { font-style: italic; }
.bl-act { display: flex; align-items: center; gap: 14px; margin-top: 6px; }
.bline.is-off .bl-n, .bline.is-off .bl-p { color: var(--fg-2); text-decoration: line-through; }
.bline.is-off .bl-ph img { filter: grayscale(1); }
.bl-group + .bl-group { margin-top: 14px; }
.blg-h { display: flex; align-items: center; gap: 10px; font-size: 0.9375rem; font-weight: 800; padding-bottom: 4px; }
.blg-h .num { margin-left: auto; font-weight: 700; }
.ups { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 18px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--hair); }
.ups-ph { width: 100%; aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; background: var(--sand); color: var(--fg-3); }
.ups-n { font-size: 0.8125rem; font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; padding-right: 36px; }
.ups-p { font-size: 0.8125rem; font-weight: 800; }
.ups .qadd.inline { position: absolute; right: 8px; bottom: 8px; width: 36px; height: 36px; }
.tips > button { padding: 0 6px; }
.promo-row { display: flex; gap: 8px; }
.promo-row .input { text-transform: uppercase; letter-spacing: .04em; }
.promo-row .input::placeholder { text-transform: none; letter-spacing: 0; }
.promo-ok { display: flex; gap: 8px; align-items: center; color: var(--success-text); font-size: 0.875rem; }
.promo-applied { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--hair); }
.promo-applied.ok { background: var(--success-soft); box-shadow: none; }
.promo-applied.ok > .i { color: var(--success-text); }
.promo-applied.bad > .i { color: var(--warning-text); }
.pa-t { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 0.8125rem; }
.pa-t strong { font-size: 0.9375rem; letter-spacing: .04em; }
.price-rows { display: flex; flex-direction: column; gap: 8px; }
.price-rows > div { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 0.9375rem; }
.price-rows dt { display: inline-flex; align-items: center; gap: 2px; color: var(--fg-2); }
.price-rows dd { font-weight: 650; text-align: right; }
.price-rows .pr-total { margin-top: 6px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 1.125rem; }
.price-rows .pr-total dt { color: var(--fg); font-weight: 800; }
.price-rows .pr-total dd { font-weight: 800; }
.pr-note { display: flex; gap: 6px; align-items: flex-start; margin-top: 10px; }
.pr-note .i { flex: none; margin-top: 3px; }
.tip-big { display: flex; justify-content: center; padding: 12px 0; }
.tip-big .stepper output { min-width: 96px; font-size: 1.5rem; }
.sheet-pad { padding: 0 var(--sp4) var(--sp3); }

/* tiles & slots */
.opt-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.opt.tile { flex-direction: column; align-items: flex-start; gap: 8px; padding: 14px; }
.opt.tile > .i { color: var(--brand-text); }
.opt.tile .o-t { font-size: 0.875rem; }
.opt.tile .o-s { font-size: 0.75rem; }
.opt.asap { flex-direction: row; align-items: center; }
.view-grid { display: grid; gap: 8px; }
.view-grid .opt.tile { flex-direction: row; align-items: center; }
@media (max-width: 420px) { .opt-grid { grid-template-columns: 1fr; } .opt-grid .opt.tile { flex-direction: row; align-items: center; } }
.day-tabs { margin-top: -8px; }
.slot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.slot { min-height: 48px; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border-2); font-weight: 700; font-size: 0.875rem; font-variant-numeric: tabular-nums; transition: box-shadow var(--dur), background var(--dur); }
.slot:hover { background: var(--surface-2); }
.slot[aria-checked="true"] { background: var(--btn); color: var(--on-btn); box-shadow: none; }

/* ---------- Checkout ---------- */
.co-list .row { align-items: flex-start; }
.co-list .row > .i, .co-list .row > .link { align-self: center; }
.row-k { font-size: 0.75rem; font-weight: 700; color: var(--fg-2); }
.co-items > summary { display: flex; width: 100%; justify-content: space-between; color: var(--fg); font-weight: 600; }
.co-items[open] { display: flex; flex-direction: column; gap: 8px; }
.co-lines { display: flex; flex-direction: column; gap: 10px; padding: 4px 0 8px; }
.co-lines li { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; font-size: 0.9375rem; }
.co-lines li > span:first-child { font-weight: 800; color: var(--brand-text); }
.co-lines small { display: block; font-size: 0.8125rem; color: var(--fg-2); }
.co-lines li.is-off > span:nth-child(2) { text-decoration: line-through; color: var(--fg-2); }

/* ---------- Confirmation ---------- */
.confirm-screen .content { justify-content: center; min-height: 100%; }
.cf-art { position: relative; width: 168px; height: 168px; margin: 8px auto 4px; }
.cf-ph { width: 100%; height: 100%; border-radius: 50%; }
.cf-badge { position: absolute; right: 2px; bottom: 6px; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--success); color: #fff; box-shadow: 0 0 0 5px var(--bg); }
.cf-badge .i { width: 28px; height: 28px; stroke-width: 3; }
.celebrate .cf-art .cf-ph, .celebrate .done-ph { animation: plateIn 720ms var(--ease-out) both; }
.celebrate .cf-badge, .celebrate .done-check { animation: badgeIn 520ms var(--spring) 420ms both; }
.celebrate .confirm > *:not(.cf-art), .celebrate .done > *:not(.done-art) { animation: rise 560ms var(--ease-out) both; }
.celebrate .confirm > *:nth-child(3), .celebrate .done > *:nth-child(3) { animation-delay: 120ms; }
.celebrate .confirm > *:nth-child(n+4), .celebrate .done > *:nth-child(n+4) { animation-delay: 200ms; }
@keyframes plateIn { from { transform: scale(.82) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes badgeIn { from { transform: scale(0); } to { transform: scale(1); } }
.cf-eta { display: flex; flex-direction: column; gap: 2px; align-items: center; }
.cf-time { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
.btn-row.col { flex-direction: column; }
.btn-row.col > .btn { width: 100%; }

/* ---------- Tracking ---------- */
.track-screen .scroll { scroll-padding-top: 0; }
.track-wrap { display: flex; flex-direction: column; }
.track-map { position: relative; height: 44vh; min-height: 260px; max-height: 420px; background: var(--map-block); overflow: hidden; }
.track-map.dim .tmap { filter: grayscale(.7) opacity(.7); }
.tmap { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.tmap:active { cursor: grabbing; }
.tmap .mk-courier { transition: transform 260ms linear; }
.app.rm .tmap .mk-courier { transition: none; }
