/* ============================================================
   Munchy — food delivery prototype.
   Fictional product. Restaurants, menus, couriers and prices
   are invented demo data. Nothing is ordered, no payment is
   taken and courier movement is simulated.
   ============================================================ */

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const delay = (ms) => new Promise((r) => setTimeout(r, ms));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
let _uidN = 0;
const uid = (p = 'id') => p + '_' + (++_uidN).toString(36) + Math.random().toString(36).slice(2, 6);
const sum = (arr, f = (x) => x) => arr.reduce((a, x) => a + f(x), 0);
const deepCopy = (o) => JSON.parse(JSON.stringify(o));
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
const pad2 = (n) => String(n).padStart(2, '0');
const MINUS = '−';
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;
const cap1 = (s) => (s ? s[0].toUpperCase() + s.slice(1) : s);
const initials = (name) => String(name || '').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join('');
const firstName = (name) => String(name || '').split(/\s+/)[0];
function listJoin(arr) { const a = arr.filter(Boolean); if (a.length <= 1) return a.join(''); return a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }
function normalise(s) { return String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim(); }

/* ============================================================
   Money — integer pence throughout. Every total on screen is
   built from these integers, so the rows always add up.
   ============================================================ */
function money(p, opts = {}) {
  const neg = p < 0; const abs = Math.abs(Math.round(p));
  const w = Math.floor(abs / 100), f = abs % 100;
  const body = (opts.short && f === 0) ? String(w) : w + '.' + pad2(f);

function pct(p, cap) { return Math.round(p * cap / 100); }

const MON_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

function hm12(minute, withMer = true) { const h = Math.floor(((minute % 1440) + 1440) % 1440 / 60), mi = ((minute % 60) + 60) % 60; const h12 = h % 12 || 12; return `${h12}:${pad2(mi)}${withMer ? (h < 12 ? ' AM' : ' PM') : ''}`; }

/* ============================================================
   Pricing, availability and delivery estimates.
   Every figure is computed here from integer pence, so the
   basket, checkout, receipts and the restaurant portal all
   show the same numbers.
   ============================================================ */
const UNIT_M = 4;                 // metres per map unit
const NEAR_KM = 2.0;              // delivery fee band edge
const SERVICE = { pct: 8, min: 50, max: 299 };

function distKm(a, b) { return Math.hypot(a.x - b.x, a.y - b.y) * UNIT_M / 1000; }
function fmtKm(km) { return km < 1 ? `${Math.round(km * 1000 / 50) * 50} m` : `${km.toFixed(1)} km`; }

/* ---------- Opening hours ---------- */
function hoursFor(rest, dow) { const h = rest.hours[dow]; return h ? { open: h[0], close: h[1] } : null; }
/* Is the restaurant open at an instant? Late closes (after midnight) belong to the previous day. */
function openState(rest, ms) {
  const p = lp(ms); const st = restState(rest.id);
  if (st.paused) return { open: false, paused: true, label: 'Not taking orders right now', opensAt: null };
  const today = hoursFor(rest, p.dow); const yest = hoursFor(rest, (p.dow + 6) % 7);
  let openWin = null;
  if (today && p.min >= today.open && p.min < today.close) openWin = { from: fromLondon(p.key, today.open), to: fromLondon(p.key, 0) + today.close * MIN };
  else if (yest && yest.close > 1440 && p.min < yest.close - 1440) { const yk = addDays(p.key, -1); openWin = { from: fromLondon(yk, yest.open), to: fromLondon(yk, 0) + yest.close * MIN }; }
  if (openWin) {
    const cutoff = openWin.to - 10 * MIN;
    const minsLeft = minsBetween(ms, openWin.to);
    if (ms >= cutoff) return { open: false, lastOrders: true, closesAt: openWin.to, opensAt: nextOpening(rest, openWin.to), label: 'Kitchen closing — no new orders' };
    return { open: true, closesAt: openWin.to, cutoff, closingSoon: minsLeft <= 40, minsLeft, label: minsLeft <= 40 ? `Closes at ${fmtTime(openWin.to)}` : `Open until ${fmtTime(openWin.to)}` };
  }
  const opensAt = nextOpening(rest, ms);
  return { open: false, opensAt, label: opensAt ? `Opens ${dayWord(opensAt, ms) === 'Today' ? 'at' : dayWord(opensAt, ms).toLowerCase() + ' at'} ${fmtTime(opensAt)}` : 'Closed' };
}
function nextOpening(rest, ms) {
  const p = lp(ms);
  for (let d = 0; d < 8; d++) {
    const key = addDays(p.key, d); const h = hoursFor(rest, dowOfKey(key)); if (!h) continue;
    const t = fromLondon(key, h.open); if (t > ms) return t;
  }
  return null;
}

/* ---------- Delivery estimates ---------- */
function restState(id) { const s = S && S.rest && S.rest[id]; if (!s) return { paused: false, extraPrep: 0 }; if (s.paused && s.pausedUntil && nowMs() > s.pausedUntil) { s.paused = false; s.pausedUntil = null; } return s; }
function prepMinutes(rest) { return rest.prep + (restState(rest.id).extraPrep || 0); }
function travelMinutes(km) { return Math.round(4 + km * 5); }
/* Can this restaurant deliver here, for how much, and when? */
function deliveryInfo(rest, addr) {
  if (!addr || !addr.at) return { ok: false, reason: 'no-address' };
  const km = distKm(rest.at, addr.at);
  if (km > rest.radius) return { ok: false, reason: 'out-of-range', km, radius: rest.radius };
  const fee = km <= NEAR_KM ? rest.fee.near : rest.fee.far;
  const mid = prepMinutes(rest) + travelMinutes(km);
  const lo = Math.max(10, r5(mid)); const hi = lo + (km > NEAR_KM ? 20 : 15);
  return { ok: true, km, fee, travel: travelMinutes(km), etaLo: lo, etaHi: hi, label: `${lo}–${hi} min` };
}
function pickupInfo(rest) { const lo = Math.max(10, r5(prepMinutes(rest))); return { ok: true, etaLo: lo, etaHi: lo + 10, label: `Ready in ${lo}–${lo + 10} min` }; }
function fulfilInfo(rest, fulfilment, addr) { return fulfilment === 'pickup' ? pickupInfo(rest) : deliveryInfo(rest, addr); }

/* Scheduling slots: 15-minute arrival windows inside opening hours, today and the next two days */
function slotsFor(rest, fulfilment, addr, ms) {
  const info = fulfilInfo(rest, fulfilment, addr); if (!info.ok) return [];
  const out = []; const p = lp(ms);
  for (let d = 0; d < 3; d++) {
    const key = addDays(p.key, d); const h = hoursFor(rest, dowOfKey(key)); if (!h) continue;
    const first = h.open + info.etaLo; const last = h.close - 15;
    for (let m = Math.ceil(first / 15) * 15; m <= last; m += 15) {
      const t = fromLondon(key, 0) + m * MIN;
      if (t < ms + (info.etaHi + 10) * MIN) continue;
      out.push({ at: t, to: t + 15 * MIN, day: key });
    }
  }
  return out;
}

/* ---------- Items & modifiers ---------- */
function itemPrice(itemId) { const o = S && S.menu && S.menu[itemId]; return o && o.price != null ? o.price : ITEMS[itemId].price; }
function itemAvailable(itemId) { const o = S && S.menu && S.menu[itemId]; return !(o && o.off); }
function modGroups(item) { return item.mods.map((g) => Object.assign({ id: g }, MODS[g])); }
function defaultSelections(item) {
  const sel = {};
  modGroups(item).forEach((g) => { const d = g.options.filter((o) => o.def).map((o) => o.id); sel[g.id] = d; });
  return sel;
}
function selectionDelta(item, sel) {
  let d = 0;
  modGroups(item).forEach((g) => { (sel[g.id] || []).forEach((oid) => { const o = g.options.find((x) => x.id === oid); if (o) d += o.price; }); });
  return d;
}
function unitPrice(itemId, sel) { return itemPrice(itemId) + selectionDelta(ITEMS[itemId], sel || {}); }
/* Required choices and maximums. Returns { groupId: message } */
function validateSelections(item, sel) {
  const errs = {};
  modGroups(item).forEach((g) => {
    const n = (sel[g.id] || []).length;
    if (g.required && n < 1) errs[g.id] = `Choose ${g.title.toLowerCase().replace(/^choose /, '')}`;
    if (g.max && n > g.max) errs[g.id] = `Choose up to ${g.max}`;
  });
  return errs;
}
/* Human summary of a line's choices: "Large · Extra parmesan · No onions" */
function selSummary(itemId, sel, opts = {}) {
  const item = ITEMS[itemId]; const parts = [];
  modGroups(item).forEach((g) => (sel[g.id] || []).forEach((oid) => {
    const o = g.options.find((x) => x.id === oid); if (!o) return;
    if (g.type === 'single' && o.def && !opts.all) return; // defaults go without saying
    parts.push(o.label + (opts.prices && o.price ? ` (${money(o.price, { plus: true })})` : ''));
  }));
  return parts;
}
/* Allergens of a line, including any added by modifiers */
function lineAllergens(itemId, sel) {
  const item = ITEMS[itemId]; const set = new Set(item.allergens);
  modGroups(item).forEach((g) => (sel[g.id] || []).forEach((oid) => { const o = g.options.find((x) => x.id === oid); (o && o.allergens || []).forEach((a) => set.add(a)); }));
  return [...set];
}
function lineIsVeg(itemId, sel) {
  const item = ITEMS[itemId]; if (!item.diet.includes('v') && !item.diet.includes('vg')) return false;
  return !modGroups(item).some((g) => (sel[g.id] || []).some((oid) => { const o = g.options.find((x) => x.id === oid); return o && o.notVeg; }));
}

/* ---------- Promotions ---------- */
function hasOrderedFrom(restId) { return Object.values(S.orders).some((o) => o.restId === restId && o.status !== 'cancelled' && o.status !== 'rejected'); }
function isFirstOrder() { return !Object.values(S.orders).some((o) => o.status === 'delivered' || o.status === 'collected'); }
/* Restaurant offer: automatic when its conditions are met */
function restOfferSaving(rest, subtotal, fee, fulfilment) {
  const o = rest.offer; if (!o) return null;
  if (o.firstOrder && hasOrderedFrom(rest.id)) return { ok: false, offer: o, why: 'For your first order from this restaurant' };
  if (subtotal < o.minSpend) return { ok: false, offer: o, why: `Spend ${money(o.minSpend - subtotal)} more to unlock`, short: o.minSpend - subtotal };
  if (o.kind === 'freeDelivery') return fulfilment === 'delivery' && fee > 0 ? { ok: true, offer: o, saving: fee, label: 'Free delivery offer', onFee: true } : { ok: false, offer: o, why: 'Applies to delivery orders' };
  if (o.kind === 'percent') return { ok: true, offer: o, saving: Math.min(o.cap, pct(subtotal, o.pct)), label: `${rest.name} offer (${o.pct}% off)` };
  return null;
}
/* Promo code check: returns { ok, saving, message } with a plain reason when it can't apply */
function checkPromo(code, ctx) {
  const P = PROMOS[String(code || '').toUpperCase().trim()];
  if (!P) return { ok: false, message: 'We don’t recognise that code. Check the spelling, or see Offers for codes you can use.' };
  if (P.firstOrder && !isFirstOrder()) return { ok: false, promo: P, message: `${P.code} is for first orders only, and you’ve ordered with Munchy before.` };
  if (P.restaurants && !P.restaurants.includes(ctx.restId)) return { ok: false, promo: P, message: `${P.code} works at ${listJoin(P.restaurants.map((id) => R[id].name))}.` };
  if (P.window) { const m = lp(ctx.now).min; if (m < P.window[0] || m >= P.window[1]) return { ok: false, promo: P, message: `${P.code} works for orders placed between ${hm12(P.window[0])} and ${hm12(P.window[1])}.` }; }
  if (P.kind === 'freeDelivery' && ctx.fulfilment !== 'delivery') return { ok: false, promo: P, message: `${P.code} gives free delivery, so it doesn’t apply to pickup orders.` };
  if (ctx.subtotal < P.minSpend) return { ok: false, promo: P, message: `Add ${money(P.minSpend - ctx.subtotal)} more to use ${P.code} (minimum ${money(P.minSpend, { short: true })} of food).`, short: P.minSpend - ctx.subtotal };
  let saving = 0;
  if (P.kind === 'amount') saving = Math.min(P.amount, ctx.subtotal);
  if (P.kind === 'percent') saving = Math.min(P.cap, pct(ctx.subtotal, P.pct));
  if (P.kind === 'freeDelivery') saving = ctx.fee;
  return { ok: true, promo: P, saving, onFee: P.kind === 'freeDelivery', label: `Code ${P.code}`, message: P.title };
}

/* ============================================================
   The breakdown. One function used everywhere money appears.
   ============================================================ */
function priceBasket(b = S.basket, opts = {}) {
  const out = { lines: [], subtotal: 0, deliveryFee: 0, serviceFee: 0, discount: 0, discountLabel: '', tip: 0, credit: 0, total: 0, blockers: [], notes: [], changes: [], unavailable: [], info: null, promo: null, offer: null };
  const rest = R[b.restId]; if (!rest || !b.lines.length) return out;
  const now = opts.now || nowMs();
  const addr = addrById(b.addrId || S.addrId);
  b.lines.forEach((l) => {
    const unit = unitPrice(l.itemId, l.sel); const avail = itemAvailable(l.itemId);
    const row = Object.assign({}, l, { unit, total: unit * l.qty, avail, changed: l.unitAtAdd != null && l.unitAtAdd !== unit });
    out.lines.push(row);
    if (row.changed) out.changes.push(row);
    if (!avail) out.unavailable.push(row); else out.subtotal += row.total;
  });
  const info = fulfilInfo(rest, b.fulfilment, addr); out.info = info;

/* ---------- Problems (demo controls & restaurant actions) ---------- */

}

}

}

}

/* ---------- After delivery ---------- */

/* Reorder: only adds what's still sold, at today's prices, and says what changed */
function reorder(o) {

  o.lines.forEach((l) => {
    const item = ITEMS[l.itemId];

    const valid = {}; modGroups(item).forEach((g) => { valid[g.id] = (l.sel[g.id] || []).filter((oid) => g.options.some((x) => x.id === oid)); });

/* Similar dishes from the same restaurant when one sells out */
function alternativesFor(itemId, n = 2) {
  const it = ITEMS[itemId]; const rest = restOf(itemId);
  const pool = rest.menu.flatMap((c) => c.items).filter((x) => x.id !== itemId && itemAvailable(x.id));
  const same = pool.filter((x) => x.cat === it.cat); const veg = it.diet.some((d) => d === 'v' || d === 'vg');
  return same.concat(pool.filter((x) => !same.includes(x))).sort((a, b) => (b.cat === it.cat) - (a.cat === it.cat) || (veg ? (b.diet.length > 0) - (a.diet.length > 0) : 0) || Math.abs(a.price - it.price) - Math.abs(b.price - it.price)).slice(0, n);
}
function altRows(itemId) {
  const alts = alternativesFor(itemId); if (!alts.length) return '';
  return `<ul class="alt-list">${alts.map((x) => `<li><button class="link" data-act="open-dish" data-id="${x.id}">${esc(x.name)}</button><span class="num muted">${money(itemPrice(x.id))}</span>${quickAddBtn(x.id, 'inline')}</li>`).join('')}</ul>`;
}

/* ---------- Adding to the basket (with the one-restaurant rule) ---------- */
async function addWithConflictCheck(itemId, sel, qty, note, who = 'me') {
  let r = addToBasket(itemId, sel, qty, note, who);
  if (r.conflict) {
    const other = R[r.conflict]; const rest = restOf(itemId);
    const ok = await confirmDialog({ title: 'Start a new basket?', body: `Your basket has food from ${other.name}. Orders come from one restaurant at a time, so adding this will clear it.`, confirm: `Clear and add from ${rest.name}`, cancel: `Keep ${other.name}` });
    if (!ok) return null;
    clearBasket(true); r = addToBasket(itemId, sel, qty, note, who);
  }
  updateChrome();
  return r;
}
function addedToast(itemId, qty = 1) {
  const item = ITEMS[itemId]; const pr = priceBasket();
  haptic('success');
  toast(`${qty > 1 ? qty + ' × ' : ''}${item.name} added`, { img: item.img || null, icon: 'checkCircle', sub: `Basket: ${plural(basketCount(), 'item')} · ${money(pr.subtotal)}`, action: { label: 'View basket', fn: () => ACTIONS['open-basket']() } });
  bumpBasket();
}
function bumpBasket() { [$('#tn-basket'), $('.basketbar')].forEach((el) => { if (!el || reducedMotion()) return; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }); }

Object.assign(ACTIONS, {
  'open-rest': (a) => { closeAllSheets(); const sh = sharedFrom(a); go('restaurant', { id: a.dataset.id, sk: sh ? sh.key : null }, { shared: sh }); },
  'open-dish': (a) => { closeAllSheets(); const sh = sharedFrom(a); go('dish', { id: a.dataset.id, edit: a.dataset.line || null, sk: sh ? sh.key : null }, { shared: sh }); },
  'open-collection': (a) => { closeAllSheets(); const sh = sharedFrom(a); go('collection', { id: a.dataset.id, sk: sh ? sh.key : null }, { shared: sh }); },
  'open-cuisine': (a) => { closeAllSheets(); go('collection', { cuisine: a.dataset.id }); },
  fav: (a) => {
    const on = toggleFav(a.dataset.kind, a.dataset.id);
    $$(`.fav-btn[data-kind="${a.dataset.kind}"][data-id="${a.dataset.id}"]`).forEach((b) => b.setAttribute('aria-pressed', on));
    if (on && !reducedMotion()) { a.classList.remove('pop'); void a.offsetWidth; a.classList.add('pop'); }
    const name = a.dataset.kind === 'rest' ? R[a.dataset.id].name : ITEMS[a.dataset.id].name;
    haptic('select'); toast(on ? `Saved ${name}` : `Removed ${name} from Saved`, { icon: on ? 'heart' : 'info', ms: 2600 });

/* ============================================================
   Map illustration: a stylised neighbourhood drawn in SVG.
   Not real map data — streets, canal and parks are a drawing
   that stands in for a map provider in this prototype. Courier
   routes follow its street grid; movement is simulated.
   ============================================================ */
const MAP = {
  w: 1000, h: 700,
  H: [{ y: 70 }, { y: 160, major: true, name: 'Market Road' }, { y: 250 }, { y: 430, major: true, name: 'High Street' }, { y: 520 }, { y: 620 }],
  V: [{ x: 60 }, { x: 180 }, { x: 300, major: true, name: 'Station Road' }, { x: 420 }, { x: 560, major: true, name: 'Upper Road' }, { x: 700 }, { x: 820, major: true }, { x: 940 }],
  canal: 'M-20 318 C 140 292 260 336 400 326 S 640 284 780 306 S 940 334 1020 300',
  parks: [
    'M118 532 h132 a10 10 0 0 1 10 10 v98 a10 10 0 0 1 -10 10 h-132 a10 10 0 0 1 -10 -10 v-98 a10 10 0 0 1 10 -10z',
    'M590 180 h90 a8 8 0 0 1 8 8 v52 a8 8 0 0 1 -8 8 h-90 a8 8 0 0 1 -8 -8 v-52 a8 8 0 0 1 8 -8z',
    'M840 450 h86 a8 8 0 0 1 8 8 v50 a8 8 0 0 1 -8 8 h-86 a8 8 0 0 1 -8 -8 v-50 a8 8 0 0 1 8 -8z',
  ],
};
const nearest = (arr, key, v) => arr.reduce((b, s) => (Math.abs(s[key] - v) < Math.abs(b[key] - v) ? s : b))[key];
/* A street route between two points: along a cross street, a main road, then in */
function routeBetween(a, b) {
  const majorsV = MAP.V.filter((s) => s.major), majorsH = MAP.H.filter((s) => s.major);
  const xa = nearest(MAP.V, 'x', a.x), xb = nearest(MAP.V, 'x', b.x);
  const hy = nearest(majorsH, 'y', (a.y + b.y) / 2);
  const pts = [a, { x: xa, y: a.y }, { x: xa, y: hy }, { x: xb, y: hy }, { x: xb, y: b.y }, b];
  if (Math.abs(a.x - b.x) < 40) { const mx = nearest(majorsV, 'x', a.x); pts.splice(1, 4, { x: mx, y: a.y }, { x: mx, y: b.y }); }
  return pts.filter((p, i) => i === 0 || Math.hypot(p.x - pts[i - 1].x, p.y - pts[i - 1].y) > 0.5);
}
function polyLength(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); return L; }
function pointAlong(pts, f) {
  const L = polyLength(pts); let d = clamp(f, 0, 1) * L;
  for (let i = 1; i < pts.length; i++) {
    const seg = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    if (d <= seg || i === pts.length - 1) { const t = seg ? d / seg : 0; return { x: pts[i - 1].x + (pts[i].x - pts[i - 1].x) * t, y: pts[i - 1].y + (pts[i].y - pts[i - 1].y) * t, ang: Math.atan2(pts[i].y - pts[i - 1].y, pts[i].x - pts[i - 1].x) }; }
    d -= seg;
  }
  return pts[pts.length - 1];
}
const pathD = (pts) => 'M' + pts.map((p) => `${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' L');

/* Base layers (no markers) */
function mapBase() {
  const roads = (major) => MAP.H.filter((s) => !!s.major === major).map((s) => `M-20 ${s.y}H1020`).concat(MAP.V.filter((s) => !!s.major === major).map((s) => `M${s.x} -20V720`)).join('');
  return `<rect x="-200" y="-200" width="1400" height="1100" fill="var(--map-block)"/>
    ${MAP.parks.map((d) => `<path d="${d}" fill="var(--map-park)"/>`).join('')}
    <path d="${MAP.canal}" fill="none" stroke="var(--map-water)" stroke-width="22" stroke-linecap="round"/>
    <path d="${roads(false)}" stroke="var(--map-road-edge)" stroke-width="15" fill="none"/>
    <path d="${roads(false)}" stroke="var(--map-road)" stroke-width="11" fill="none"/>
    <path d="${roads(true)}" stroke="var(--map-road-edge)" stroke-width="23" fill="none"/>
    <path d="${roads(true)}" stroke="var(--map-major)" stroke-width="18" fill="none"/>
    <g class="map-labels" fill="var(--map-label)" font-family="var(--font)" font-weight="700" font-size="13" letter-spacing=".04em">
      <text x="660" y="425">HIGH STREET</text><text x="30" y="155">MARKET ROAD</text>
      <text transform="translate(295 120) rotate(-90)">STATION ROAD</text><text transform="translate(555 690) rotate(-90)">UPPER ROAD</text>
      <text x="420" y="350" font-style="italic" font-weight="600" letter-spacing="0">Canal</text>
      <text x="152" y="600" font-weight="600" letter-spacing="0">The Green</text>

}
function restMarker(rest, opts = {}) {

  return `<g class="mk mk-rest${opts.active ? ' on' : ''}" transform="translate(${x} ${y})"><circle r="${opts.small ? 13 : 17}" fill="var(--surface)" stroke="var(--fg)" stroke-width="2.5"/><path transform="translate(-9 -9) scale(.75)" d="${ICONS.store}" fill="none" stroke="var(--fg)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>`;

/* A small static map centred on a point (address confirmation, order cards) */
function miniMap(at, { zoom = 1.6, label = '', w = 360, h = 180, rests = [], pinDraggable = false } = {}) {
  const vw = w * 1.4 / zoom * 1.2, vh = h * 1.4 / zoom * 1.2;

function greeting(ms = nowMs()) { const m = lp(ms).min; return m < 300 ? 'Up late' : m < 720 ? 'Good morning' : m < 1080 ? 'Good afternoon' : 'Good evening'; }

const railItem = (html) => `<div class="rail-i" role="listitem">${html}</div>`;
/* Ordering for "near you": can deliver and open first, then popularity */
function rankRests(list, addr = currentAddr()) {
  const now = nowMs();
  return list.slice().sort((a, b) => {
    const sa = (fulfilInfo(a, S.basket.fulfilment, addr).ok ? 2 : 0) + (openState(a, now).open ? 1 : 0);
    const sb = (fulfilInfo(b, S.basket.fulfilment, addr).ok ? 2 : 0) + (openState(b, now).open ? 1 : 0);

  });
}

function notifyOrder(o, n) {
  if (!nav.current) return;
  const r = currentRoute(); const p = currentEntry().params;
  if (o && (r === 'track' || r === 'delivered') && p.id === o.id) { announce(n.title + '. ' + n.body); return; }
  if (r === 'portal' || r === 'courier') return;
  toast(n.title, { icon: n.tone === 'error' ? 'alertCircle' : n.tone === 'warn' ? 'alert' : n.tone === 'ok' ? 'checkCircle' : 'bell', tone: n.tone === 'error' ? 'error' : '', sub: n.body, action: o ? { label: o.status === 'delivered' ? 'View' : 'Track', fn: () => ACTIONS.track({ dataset: { id: o.id } }) } : null, ms: 6000 });
}
function onOrdersChanged() {
  updateChrome();
  const cur = nav.current; if (!cur) return;
  const r = currentRoute(); const p = currentEntry().params;
  if (r === 'track') { const o = orderById(p.id); if (o && (o.status === 'delivered' || (o.fulfilment === 'pickup' && o.status === 'collected'))) { go('delivered', { id: o.id }, { replace: true, anim: 'fade' }); return; } }

}

function receiptText(o) {
  const rest = R[o.restId]; const P = o.pricing; const L = [];
  L.push('Munchy — receipt (prototype, no payment taken)', '', `${rest.name}`, `Order ${o.ref} · ${fmtDate(o.placedAt, 'long')} ${fmtTime(o.placedAt)}`, o.fulfilment === 'pickup' ? `Pickup from ${rest.address}` : `Delivered to ${o.addr ? o.addr.line1 + ', ' + o.addr.area : ''}`, '');
  o.lines.forEach((l) => { L.push(`${l.qty} × ${l.name}`.padEnd(40) + money(l.total)); l.selText.forEach((t) => L.push('    ' + t)); });
  L.push('', 'Subtotal'.padEnd(40) + money(P.subtotal));
  if (o.fulfilment !== 'pickup') L.push('Delivery fee'.padEnd(40) + money(P.deliveryFee));
  L.push('Service fee'.padEnd(40) + money(P.serviceFee));
  if (P.discount) L.push((P.discountLabel || 'Discount').padEnd(40) + money(-P.discount));
  if (P.tip) L.push('Courier tip'.padEnd(40) + money(P.tip));
  if (P.credit) L.push('Munchy credit'.padEnd(40) + money(-P.credit));
  L.push('Total'.padEnd(40) + money(P.total), `Paid with ${o.pay.label}`);
  o.refunds.filter((r) => r.amount).forEach((r) => L.push(`Refund: ${r.reason}`.padEnd(40) + money(-r.amount)));
  return L.join('\n');
}

/* ---------- Recommendations: every pick carries its reasons ---------- */
function tasteSignals() {
  const past = orderList().filter((o) => o.status === 'delivered' || o.status === 'collected');
  const cz = {}; const restCount = {}; const items = new Set();
  past.forEach((o) => { const r = R[o.restId]; restCount[r.id] = (restCount[r.id] || 0) + 1; r.cuisines.forEach((c) => { cz[c] = (cz[c] || 0) + 1; }); o.lines.forEach((l) => items.add(l.itemId)); });
  return { cz, restCount, items, liked: new Set(past.filter((o) => o.review && o.review.food >= 4).map((o) => o.restId)) };
}
function recommend() {
  const t = S.taste; const sig = tasteSignals(); const now = nowMs(); const addr = currentAddr(); const out = [];
  Object.values(ITEMS).forEach((it) => {
    if (!it.img || S.dismissed.includes(it.id) || !itemAvailable(it.id)) return;
    const r = restOf(it.id); const why = []; let s = 0;
    if (t.diet.length && !t.diet.every((d) => it.diet.includes(d) || (d === 'v' && it.diet.includes('vg')))) return;
    if (t.avoid.some((a) => it.allergens.includes(a))) return;
    const czHit = r.cuisines.find((c) => t.cuisines.includes(c)); if (czHit) { s += 3; why.push({ icon: 'heart', text: `You said you like ${czHit} food` }); }
    const ordered = r.cuisines.find((c) => sig.cz[c]); if (ordered && t.set) { s += Math.min(3, sig.cz[ordered]); why.push({ icon: 'history', text: `You’ve ordered ${ordered} ${plural(sig.cz[ordered], 'time')} recently` }); }
    if (sig.liked.has(r.id)) { s += 2; why.push({ icon: 'star', text: `You rated ${r.name} highly` }); }
    if (sig.items.has(it.id)) { s += 1; why.push({ icon: 'refresh', text: 'You’ve had this before' }); }
    if (t.spice === 'hot' && it.spicy) { s += 2; why.push({ icon: 'flame', text: 'You like spicy food' }); }
    if (t.spice === 'mild' && it.spicy > 1) s -= 3;
    if (t.diet.length) why.push({ icon: 'leaf', text: `Matches your ${listJoin(t.diet.map((d) => DIET[d].label.toLowerCase()))} preference` });
    if (r.price <= t.price) s += 0.5; else s -= 1;
    if (!fulfilInfo(r, S.basket.fulfilment, addr).ok) return;
    if (!openState(r, now).open) s -= 2;
    if (it.popular) { s += 0.5; why.push({ icon: 'trend', text: 'Popular with Munchy customers nearby' }); }
    if (S.favs.dish.includes(it.id)) { s += 1; why.push({ icon: 'heart', text: 'In your saved dishes' }); }
    out.push({ id: it.id, s, why, newRest: !sig.restCount[r.id] });
  });
  return out.sort((a, b) => b.s - a.s);
}

/* ============================================================
   Restaurant partner portal: live orders, menu availability
   and prices, a dashboard and analytics. Actions here move
   real orders in the customer app. Figures marked "Sample"
   are invented so the screens aren't empty.
   ============================================================ */
const PT_TABS = [['orders', 'Orders', 'inbox'], ['menu', 'Menu', 'list'], ['dash', 'Dashboard', 'grid'], ['analytics', 'Analytics', 'chart'], ['settings', 'Settings', 'settings']];
function seeded(id, n) { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0; const out = []; for (let i = 0; i < n; i++) { h = (h * 1103515245 + 12345) >>> 0; out.push((h >>> 8) / 16777216); } return out; }
function sampleDay(rest) {
  const r = seeded(rest.id, 40); const hours = []; const open = rest.hours[0][0] / 60, close = Math.min(24, rest.hours[0][1] / 60);
  for (let h = Math.ceil(open); h < close; h++) { const peak = Math.exp(-Math.pow((h - 19.5) / 2, 2)) * 1 + Math.exp(-Math.pow((h - 12.8) / 1.3, 2)) * 0.55; hours.push({ h, n: Math.round(2 + peak * (14 + r[h % 40] * 6)) }); }
  const orders = sum(hours, (x) => x.n); const avg = 2300 + Math.round(r[3] * 900);
  const top = rest.menu.flatMap((c) => c.items).slice(0, 12).map((it, i) => ({ id: it.id, n: Math.round((it.popular ? 30 : 9) + r[i + 5] * 18) })).sort((a, b) => b.n - a.n).slice(0, 5);
  const stars = [0.64, 0.24, 0.07, 0.03, 0.02].map((f, i) => Math.round(f * 220 * (1 + r[i + 20] * 0.1)));
  return { hours, orders, sales: orders * avg, avg, prep: rest.prep + Math.round(r[1] * 3 - 1), top, stars };
}
function ptOrders(restId) {
  const today = lp(nowMs()).key;
  return Object.values(S.orders).filter((o) => o.restId === restId && (isLive(o) || lp(o.doneAt || o.placedAt).key === today) && !o.plan.past);
}
function syncWindow(o) { const exp = expectedArrival(o); if (exp > o.window.to) o.window = { from: exp - 10 * MIN, to: exp + 5 * MIN, updated: true }; }
function ticketHTML(o) {
  const mins = Math.max(0, Math.round((nowMs() - o.placedAt) / MIN)); const pickup = o.fulfilment === 'pickup';
  const due = pickup ? o.plan.ready : (o.plan.collected || o.plan.ready);
  const late = o.status !== 'scheduled' && isLive(o) && ['accepted', 'preparing'].includes(o.status) && nowMs() > o.plan.ready;
  let act = '';
  if (o.status === 'placed') act = `<button class="btn btn-primary sm" data-act="pt-accept" data-id="${o.id}">Accept · ${prepMinutes(R[o.restId])} min</button><button class="btn btn-ghost sm" data-act="pt-accept-time" data-id="${o.id}">Other time</button><button class="btn btn-danger-ghost sm" data-act="pt-reject" data-id="${o.id}">Reject</button>`;
  else if (o.status === 'accepted' || o.status === 'preparing') act = `<button class="btn btn-primary sm" data-act="pt-ready" data-id="${o.id}">${ic('check', 'sm')}Mark ready</button><button class="btn btn-secondary sm" data-act="pt-delay" data-id="${o.id}">+10 min</button><button class="btn btn-ghost sm" data-act="pt-out" data-id="${o.id}">Item unavailable</button>`;
  else if (o.status === 'ready' && pickup) act = `<button class="btn btn-primary sm" data-act="pt-collected" data-id="${o.id}">Collected by customer</button>`;

function courierEarnings() { const sample = [{ ref: 'MUN-1983', rest: 'Kōji', amount: 540, at: '5:42 PM', sample: true }, { ref: 'MUN-2016', rest: 'Green Room', amount: 470, at: '6:05 PM', sample: true }]; return sample.concat((S.courierApp.earned || []).map((e) => Object.assign({}, e, { at: fmtTime(e.at) }))); }

function caJobs() {

function caJob(o) {

  const step = cs === 'assigned' ? 0 : cs === 'atRestaurant' ? 1 : cs === 'enroute' ? 2 : 3;
  const steps = ['To restaurant', 'Collect', 'To customer', 'Hand over'];
  let panel = '';
  if (step === 0) panel = `<h2 class="display sm">Head to ${esc(rest.name)}</h2><p class="muted">${esc(rest.address)} · arrive ~${fmtTime(o.plan.atRest)}</p><button class="btn btn-primary lg block" data-act="ca-arrived-rest" data-id="${o.id}">I’ve arrived at the restaurant</button>`;
  if (step === 1) panel = `<h2 class="display sm">Collect order ${esc(o.ref)}</h2><p class="muted">Ask for ${esc(o.ref)} for ${esc(S.user.first)}. ${plural(sum(o.lines, (l) => l.qty), 'item')}.</p>${o.status === 'ready' ? `<ul class="ca-check">${o.lines.filter((l) => !l.out).map((l) => `<li>${ic('check', 'xs')}${l.qty} × ${esc(l.name)}</li>`).join('')}</ul><button class="btn btn-primary lg block" data-act="ca-collect" data-id="${o.id}">Confirm collection</button>` : `${noticeHTML({ icon: 'chefHat', title: 'The kitchen is still cooking', body: `Ready around ${fmtTime(o.plan.ready)}. You’ll be able to collect once they mark it ready.` })}<button class="btn btn-primary lg block" aria-disabled="true">Confirm collection</button>`}`;
  if (step === 2) panel = `<h2 class="display sm">Deliver to ${esc(S.user.first)}</h2><p>${esc(o.addr.line1)}<br><span class="muted">${esc(o.addr.area)}${o.addr.building ? ' · ' + esc(o.addr.building) : ''}</span></p><p class="small">${ic(DROPOFF[o.dropoff].icon, 'xs')} ${esc(DROPOFF[o.dropoff].label)}${o.instructions ? ` · “${esc(o.instructions)}”` : ''}</p><p class="small muted">Arrive ~${fmtTime(o.plan.delivered)}</p><div class="btn-row"><button class="btn btn-secondary" data-act="ca-call" data-id="${o.id}">${ic('phone', 'sm')}Call</button><button class="btn btn-primary" data-act="ca-arrived-cust" data-id="${o.id}">I’ve arrived</button></div>`;
  if (step === 3) panel = `<h2 class="display sm">${o.dropoff === 'leave' ? 'Leave it at the door' : o.dropoff === 'outside' ? 'Meet them outside' : 'Hand it over'}</h2><p class="muted">${esc(o.addr.line1)}${o.instructions ? ` · “${esc(o.instructions)}”` : ''}</p>${o.dropoff === 'leave' ? `<button class="btn btn-secondary block" data-act="ca-photo" data-id="${o.id}" aria-pressed="${!!o.dropPhoto}">${ic(o.dropPhoto ? 'checkCircle' : 'camera', 'sm')}${o.dropPhoto ? 'Photo taken (simulated)' : 'Take a drop-off photo'}</button>` : ''}<button class="btn btn-primary lg block" data-act="ca-complete" data-id="${o.id}"${o.dropoff === 'leave' && !o.dropPhoto ? ' aria-disabled="true"' : ''}>Complete delivery · ${money(jobPay(o))}</button>`;
  return `<div class="ca-job"><div class="ca-map">${courierMap(o, pos)}<span class="map-label">${ic('map', 'xs')}Map illustration</span></div>
    <ol class="ca-steps" aria-label="Delivery steps">${steps.map((s, i) => `<li class="${i < step ? 'done' : i === step ? 'cur' : ''}"${i === step ? ' aria-current="step"' : ''}>${esc(s)}</li>`).join('')}</ol>
    <section class="ca-panel stack">${panel}</section></div>`;
}
function caEarnings(list, total) {

    <ul class="list boxed card">${list.slice().reverse().map((e) => `<li><div class="row compact"><span class="row-main"><span class="row-title">${esc(e.rest)}</span><span class="row-sub">${esc(e.ref)} · ${esc(e.at)}${e.tip ? ` · includes ${money(e.tip)} tip` : ''}</span></span><span class="row-end"><span class="num strong">${money(e.amount)}</span>${e.sample ? '<span class="demo-tag">Sample</span>' : ''}</span></div></li>`).join('')}</ul>

Object.assign(ACTIONS, {
  'ca-tab': (a) => setParams({ t: a.dataset.t }),

  'ca-decline': (a) => { const o = orderById(a.dataset.id); o.courierDeclinedByMe = true; S.courierApp.offers = S.courierApp.offers.filter((f) => f.orderId !== o.id); simTick(); save(); refreshScreen(); toast('Offer declined', { sub: 'It’s gone to another courier' }); },

/* ============================================================
   Prototype controls: switch between the customer app, the

   and trigger the edge cases an order can run into.

const TIME_PRESETS = [['Breakfast', 510], ['Lunch', 750], ['Afternoon', 960], ['Dinner', 1120], ['Late night', 1395]];
function skipAhead(o) {
  const now = nowMs(); const p = o.plan;
  const next = [o.status === 'scheduled' ? o.startAt : null, p.accepted, p.preparing, p.assign, p.atRest, p.ready, p.collected, p.delivered].filter((t) => t && t > now + 1000).sort((a, b) => a - b)[0];
  if (next) setClock(next + 1500); simTick();
}
function demoSheetBody() {
  const live = liveOrders()[0]; const now = nowMs(); const r = currentRoute();
  const view = r === 'portal' ? 'portal' : r === 'courier' ? 'courier' : 'customer';
  return `<section class="stack-sm"><h3 class="sec-title sans">Views</h3><div class="view-grid" role="radiogroup" aria-label="View">${[['customer', 'Customer app', 'user', 'Order food'], ['portal', 'Restaurant portal', 'chefHat', 'Accept and cook orders'], ['courier', 'Courier app', 'bike', 'Collect and deliver']].map(([v, l, i, s]) => `<button class="opt tile" role="radio" aria-checked="${view === v}" data-dv="${v}">${ic(i)}<span class="o-t">${l}<span class="o-s">${s}</span></span></button>`).join('')}</div></section>
    <section class="stack-sm"><h3 class="sec-title sans">Demo clock</h3><p class="small muted">It’s ${fmtTime(now)}, ${esc(dayWord(now, now).toLowerCase())} in the demo. Time runs ${S.sim.speed}× faster while an order is live.</p>
      <div class="chips wrap">${TIME_PRESETS.map(([l, m]) => `<button class="chip" data-dt="${m}">${l} · ${hm12(m)}</button>`).join('')}</div>
      <div class="seg block" role="radiogroup" aria-label="Speed while orders are live">${[[1, 'Real time'], [12, '12×'], [60, '60×']].map(([v, l]) => `<button role="radio" aria-checked="${S.sim.speed === v}" data-ds="${v}">${l}</button>`).join('')}</div>
      <button class="switch-row card" role="switch" aria-checked="${!!S.sim.paused}" data-dsw="paused"><span class="row-main"><span class="row-title">Pause time</span></span><span class="switch" aria-hidden="true"></span></button></section>
    <section class="stack-sm"><h3 class="sec-title sans">Who runs the order</h3><ul class="list boxed card">
      <li><button class="switch-row" role="switch" aria-checked="${S.sim.restaurantAuto}" data-dsw="restaurantAuto"><span class="row-main"><span class="row-title">Kitchen runs automatically</span><span class="row-sub">Off: accept and cook orders in the restaurant portal</span></span><span class="switch" aria-hidden="true"></span></button></li>
      <li><button class="switch-row" role="switch" aria-checked="${S.sim.courierAuto}" data-dsw="courierAuto"><span class="row-main"><span class="row-title">Couriers run automatically</span><span class="row-sub">Off: take deliveries yourself in the courier app</span></span><span class="switch" aria-hidden="true"></span></button></li></ul></section>
    <section class="stack-sm"><h3 class="sec-title sans">Try an edge case</h3>${live ? `<p class="small muted">On your order from ${esc(R[live.restId].name)} (${esc(live.ref)}):</p>
      <div class="list boxed card">${[
        ['skip', 'Skip to the next step', 'fastForward', true],
        ['delay', 'Kitchen running 15 minutes late', 'hourglass', ['placed', 'accepted', 'preparing', 'ready', 'collected'].includes(live.status)],
        ['reject', 'Restaurant rejects the order', 'x', live.status === 'placed' || live.status === 'scheduled'],
        ['item', 'An item runs out', 'alert', ['placed', 'accepted', 'preparing'].includes(live.status) && live.lines.length > 1 && !live.problems.some((x) => x.kind === 'item' && !x.resolved)],

function switchView(v) {

ACTIONS.views = () => {
  const ctl = openSheet({ title: 'Prototype controls', className: 'side', body: demoSheetBody(),
    onMount: (c) => c.body.addEventListener('click', async (e) => {
      const t = e.target.closest('[data-dv],[data-dt],[data-ds],[data-dsw],[data-dx],[data-dd],[data-dnet]'); if (!t || t.getAttribute('aria-disabled') === 'true') return;

      if (t.dataset.dsw) { const k = t.dataset.dsw; S.sim[k] = !S.sim[k]; save(); simTick(); }

   Boot
   ============================================================ */
function boot() {
  Object.assign(els, { app: $('#app'), topnav: $('#topnav'), screens: $('#screens'), tabbar: $('#tabbar'), basketbar: $('#basketbar'), netbar: $('#netbar'), sheetLayer: $('#sheet-layer'), toasts: $('#toasts') });

  const h = (location.hash || '').slice(1);
  const start = h === 'portal' ? 'portal' : h === 'courier' ? 'courier' : S.onboarded ? 'home' : 'welcome';
  resetTo([start], 'none');
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applySettings());
  window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', () => applySettings());
  document.addEventListener('visibilitychange', () => { if (document.hidden) { S.lastSeen = Date.now(); try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } } });
  window.addEventListener('offline', () => { S.net = 'offline'; updateChrome(); });

}
