html { font-size: calc(16px * var(--ts)); -webkit-text-size-adjust: 100%; height: 100%; }
body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 0.9375rem; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden; font-feature-settings: 'ss01'; }
*, *::before, *::after { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
a { color: var(--brand-text); }
h1, h2, h3, h4, p, figure, blockquote, dl, dd { margin: 0; }
h1, h2, h3 { text-wrap: balance; letter-spacing: -0.015em; font-weight: 700; }
p { text-wrap: pretty; }
ul, ol { margin: 0; padding: 0; list-style: none; }
img, svg { max-width: 100%; }
[hidden] { display: none !important; }
.sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.i.sm { width: 18px; height: 18px; }
.i.xs { width: 15px; height: 15px; }
.i.lg { width: 28px; height: 28px; }
.i.fill { fill: currentColor; stroke: none; }
:focus { outline: none; }
:focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; border-radius: 10px; }
h1[tabindex="-1"]:focus, h2[tabindex="-1"]:focus, [data-autofocus][tabindex="-1"]:focus { outline: none; }
.muted { color: var(--fg-2); }
.small { font-size: 0.8125rem; }
.micro { font-size: 0.75rem; }
.strong { font-weight: 700; }
.num { font-variant-numeric: tabular-nums; }
.one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ok-t { color: var(--success-text); }
.warn-t { color: var(--warning-text); }
.err-t { color: var(--error); }
.brand-t { color: var(--brand-text); }
.olive-t { color: var(--olive-text); }
.center { text-align: center; }
.row-gap { display: flex; gap: var(--sp2); align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: var(--sp3); }
.stack-sm { display: flex; flex-direction: column; gap: var(--sp2); }
.stack-lg { display: flex; flex-direction: column; gap: var(--sp6); }
.spacer { flex: 1; }
.serif { font-family: var(--serif); }
.display { font-family: var(--serif); font-weight: 560; font-size: 2.5rem; line-height: 1.04; letter-spacing: -0.02em; font-optical-sizing: auto; font-variation-settings: 'opsz' 96; }
.display.xl { font-size: 3rem; line-height: 1; }
.display.md { font-size: 1.875rem; line-height: 1.1; }
.display.sm { font-size: 1.5rem; line-height: 1.15; }
.kicker { font-size: 0.8125rem; font-weight: 650; color: var(--fg-2); }
.demo-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 0.75rem; font-weight: 650; padding: 3px 9px; border-radius: 999px; background: var(--fill); color: var(--fg-2); vertical-align: middle; white-space: nowrap; }

/* paper grain: barely-there texture on the ground, never on photos */
.app::before { content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: var(--grain-opacity); background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.3  0 0 0 0 0.24  0 0 0 0 0.18  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

/* ---------- Wordmark ---------- */
.wordmark { display: inline-flex; align-items: center; gap: 10px; color: var(--fg); text-decoration: none; }

.wordmark.lg .wm-text { font-size: 1.65rem; }
.wordmark.inv { color: #FFFFFF; }

/* ============================================================
   Shell
   ============================================================ */
.app { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); overflow: hidden; }
.app > * { position: relative; z-index: 1; }
.main { position: relative; flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.screens { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scroll-padding-top: 72px; }
.content { width: 100%; max-width: 680px; margin: 0 auto; padding: var(--sp2) var(--gutter) calc(var(--sp8) + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: var(--sp7); }
.content.wide { max-width: 1240px; }
.content.narrow { max-width: 540px; }
.content.tight { gap: var(--sp5); }
.screen.has-tabbar .content { padding-bottom: calc(var(--tabbar-h) + var(--sp8) + env(safe-area-inset-bottom, 0px)); }

.screen.has-tabbar.has-footer .content { padding-bottom: calc(var(--tabbar-h) + 132px + env(safe-area-inset-bottom, 0px)); }
.topbar { position: relative; z-index: 6; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--sp2); min-height: 56px; padding: calc(env(safe-area-inset-top, 0px) + 4px) 8px 2px; background: var(--bg); transition: box-shadow var(--dur), background var(--dur); }
.topbar.scrolled { box-shadow: 0 1px 0 var(--hair); }

.topbar.over:not(.scrolled) .icon-btn { background: rgba(255,255,255,0.94); color: #0F1E1B; box-shadow: 0 6px 18px -6px rgba(0,0,0,0.35); }
.topbar.over:not(.scrolled) .icon-btn:hover { background: #fff; }
.topbar.over:not(.scrolled) .fav-btn[aria-pressed="true"] { color: #E5442A; }
.topbar.over.scrolled { background: var(--bg); }
.tb-side { display: flex; align-items: center; gap: 4px; min-width: 0; }
.tb-side.right { justify-content: flex-end; }
.tb-title { font-weight: 700; font-size: 0.9375rem; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 56vw; opacity: 0; transition: opacity var(--dur) var(--ease); }
.topbar.scrolled .tb-title, .topbar.always .tb-title { opacity: 1; }
.progress-steps { display: flex; gap: 5px; }
.progress-steps span { width: 20px; height: 4px; border-radius: 4px; background: var(--border-2); transition: background var(--dur), width var(--dur); }
.progress-steps span.on { background: var(--brand); }
.progress-steps span.cur { width: 32px; background: var(--brand); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--sp3) var(--sp4); padding-top: var(--sp2); flex-wrap: wrap; }
.page-head h1 { font-family: var(--serif); font-size: 2.25rem; font-weight: 580; letter-spacing: -0.025em; line-height: 1.04; font-variation-settings: 'opsz' 96; }
.page-head .sub { margin-top: 6px; color: var(--fg-2); font-size: 0.9375rem; }
.ph-actions { display: flex; gap: var(--sp2); flex: none; }
.ph-text { min-width: 0; flex: 1 1 260px; }

/* ---------- Mobile tab bar ---------- */
/* floating dark pill; the current tab opens into a mint pill with its label */
.tabbar { position: absolute; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: flex; align-items: center; gap: 2px; height: 64px; padding: 6px; max-width: 520px; margin: 0 auto; border-radius: 999px; background: var(--nav-bg); box-shadow: 0 18px 40px -14px rgba(20,14,8,.55), 0 2px 6px rgba(20,14,8,.12); }

.tab .tab-ic { position: relative; display: grid; place-items: center; transition: transform 140ms var(--ease); }
.tab .tab-l { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tab[aria-current="page"] { flex-grow: 2.1; background: var(--btn); color: var(--on-btn); }

.tab:active .tab-ic { transform: scale(.92); }
.tab .dot { position: absolute; top: -2px; right: -4px; width: 9px; height: 9px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 2px var(--nav-bg); }
.tab[aria-current="page"] .dot { background: #fff; box-shadow: 0 0 0 2px var(--btn); }

/* ---------- Floating basket & live-order bars (mobile) ---------- */
.basketbar-wrap { position: absolute; left: 0; right: 0; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 8px); z-index: 19; display: flex; flex-direction: column; gap: 8px; padding: 0 12px; pointer-events: none; }

.basketbar, .livebar { pointer-events: auto; display: flex; align-items: center; gap: 12px; width: 100%; max-width: 520px; margin: 0 auto; min-height: 58px; padding: 8px 20px 8px 9px; border-radius: 999px; text-align: left; box-shadow: var(--shadow-3); animation: barIn 360ms var(--ease-out); }

.lb-pulse { position: relative; width: 40px; height: 40px; border-radius: 50%; background: var(--brand-soft); flex: none; }
.lb-pulse::before, .lb-pulse::after { content: ''; position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px; border-radius: 50%; background: var(--brand); }
.lb-pulse::after { animation: pulse 1.8s var(--ease-out) infinite; opacity: .5; }
@keyframes pulse { from { transform: scale(1); opacity: .55; } to { transform: scale(2.8); opacity: 0; } }
@keyframes barIn { from { transform: translateY(18px); opacity: 0; } to { transform: none; opacity: 1; } }
.bump { animation: bump 420ms var(--spring); }
@keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.06); } 100% { transform: scale(1); } }

/* connection banner */

.netbar button { color: inherit; text-decoration: underline; text-underline-offset: 3px; font-weight: 750; min-height: 32px; }

/* ---------- Desktop top navigation ---------- */
.topnav { display: none; }

/* ============================================================
   Buttons
   ============================================================ */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: var(--r-btn); font-weight: 700; font-size: 0.9375rem; line-height: 1.2; white-space: nowrap; user-select: none; transition: background var(--dur) var(--ease), color var(--dur) var(--ease), transform 140ms var(--ease), opacity var(--dur), box-shadow var(--dur); text-decoration: none; }
.btn.lg { min-height: 56px; font-size: 1rem; padding: 0 26px; border-radius: var(--r-btn); }

.btn-glass:hover { background: rgba(255,255,255,0.26); }
.btn .b-price { margin-left: auto; padding-left: 12px; font-variant-numeric: tabular-nums; }
.btn.split { justify-content: space-between; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
.btn[aria-busy="true"] { color: transparent !important; pointer-events: none; }

.btn-secondary[aria-busy="true"]::after, .btn-ghost[aria-busy="true"]::after, .btn-tonal[aria-busy="true"]::after { border-color: var(--fg); border-right-color: transparent; }

@keyframes spin { to { transform: rotate(360deg); } }
.icon-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; color: var(--fg); position: relative; transition: background var(--dur) var(--ease), color var(--dur); flex: none; }
.icon-btn:hover { background: var(--fill); }

.icon-btn.xs { width: 32px; height: 32px; }
.icon-btn.xs .i { width: 18px; height: 18px; }
.icon-btn.filled { background: var(--surface); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--hair); }
.icon-btn.filled:hover { background: var(--surface-2); }
.icon-btn[disabled] { opacity: .4; cursor: not-allowed; }
.link { color: var(--brand-text); font-weight: 700; font-size: 0.875rem; display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 2px; text-decoration: none; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.link .i { width: 16px; height: 16px; }
.link.inline { min-height: 0; display: inline; padding: 0; font-size: inherit; text-decoration: underline; text-underline-offset: 3px; font-weight: 650; }
.btn-row { display: flex; gap: var(--sp3); flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 140px; }
.footer-bar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 8; padding: 12px var(--gutter) calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 0%, transparent), var(--bg) 12px); display: flex; gap: 10px; align-items: center; }
.footer-bar .fb-inner { display: flex; gap: 10px; align-items: center; width: 100%; max-width: 640px; margin: 0 auto; }
.footer-bar .btn { flex: 1; }
.footer-bar .fb-note { font-size: 0.8125rem; color: var(--fg-2); flex: 1; min-width: 0; }
.screen.has-tabbar .footer-bar { bottom: var(--tabbar-h); }

/* ============================================================
   Photos — every image fades in over a 16px preview of itself
   ============================================================ */
.ph { position: relative; overflow: hidden; background: var(--sand); background-size: cover; background-position: center; isolation: isolate; }
.ph > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 500ms var(--ease); }
.ph > img.in { opacity: 1; }
.ph::before { content: ''; position: absolute; inset: -12px; background: inherit; filter: blur(12px); z-index: -1; }
.ph.ph-none { display: grid; place-items: center; color: var(--fg-3); background: var(--sand); }
.ph.ph-none::before { display: none; }
.ph-tag { position: absolute; z-index: 2; left: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; font-size: 0.6875rem; font-weight: 650; color: #fff; background: rgba(24,18,12,0.5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); pointer-events: none; }

/* ============================================================
   Cards, sections, rows
   ============================================================ */

.card.sand { background: var(--sand); box-shadow: none; }
.card.peach { background: var(--peach); box-shadow: none; }
:where(button.card, a.card) { display: block; width: 100%; text-align: left; text-decoration: none; color: inherit; transition: transform 160ms var(--ease), box-shadow var(--dur) var(--ease), background var(--dur); }
button.card:hover, a.card:hover { background: var(--surface-2); }
button.card:active { transform: scale(0.99); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp3); }
.card-title { font-size: 1rem; font-weight: 750; letter-spacing: -0.01em; }

.sec { display: flex; flex-direction: column; gap: 14px; }

.divider { height: 1px; background: var(--border); border: 0; margin: 0; }
.list { display: flex; flex-direction: column; }
.list.boxed { background: var(--surface); border-radius: var(--r-card); overflow: hidden; box-shadow: var(--shadow-card), inset 0 0 0 1px var(--hair); }
.list.boxed > li + li > .row, .list.boxed > li + li > .switch-row, .list.boxed > li + li > .radio-row, .list.boxed > .row + .row, .list.lined > li + li > .row { box-shadow: inset 0 1px 0 var(--hair); }
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 62px; padding: 10px var(--sp4); text-align: left; color: inherit; text-decoration: none; background: transparent; transition: background var(--dur) var(--ease); }
.row.compact { min-height: 52px; padding: 8px var(--sp4); }
.list.flush .row { padding-left: 0; padding-right: 0; }
button.row:hover, a.row:hover { background: var(--surface-2); }
.list.flush button.row:hover { background: transparent; }
.row.danger .row-title, .row.danger > .i { color: var(--error); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-title { font-weight: 650; font-size: 0.9375rem; line-height: 1.3; overflow-wrap: anywhere; }
.row-sub { color: var(--fg-2); font-size: 0.8125rem; line-height: 1.4; }
.row-end { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: none; text-align: right; }
.row-amt { font-weight: 750; font-variant-numeric: tabular-nums; font-size: 0.9375rem; white-space: nowrap; }
.row > .i { color: var(--fg-3); }
.menu .row > .i { color: var(--fg); }
.row-ic { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: var(--sand); flex: none; color: var(--fg); }
.row-ic .i { width: 20px; height: 20px; }
.row-ic.round { border-radius: 50%; }
.row-ic.brand { background: var(--brand-soft); color: var(--brand-text); }
.row-ic.olive { background: var(--olive-soft); color: var(--olive-text); }
.row-ic.warn { background: var(--warning-soft); color: var(--warning-text); }
.row-ic.err { background: var(--error-soft); color: var(--error); }
.row-ic.ok { background: var(--success-soft); color: var(--success-text); }
.row-thumb { width: 56px; height: 56px; border-radius: 14px; flex: none; }
.row-thumb.sm { width: 46px; height: 46px; border-radius: 12px; }

/* pills */
.pill { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; white-space: nowrap; background: var(--fill); color: var(--fg-2); flex: none; }
.pill .i { width: 13px; height: 13px; stroke-width: 2.2; }
.pill.sm { height: 22px; padding: 0 8px; font-size: 0.6875rem; }
.pill.ok { background: var(--success-soft); color: var(--success-text); }
.pill.warn { background: var(--warning-soft); color: var(--warning-text); }
.pill.err { background: var(--error-soft); color: var(--error); }
.pill.brand { background: var(--brand-soft); color: var(--on-soft); }
.pill.olive { background: var(--olive-soft); color: var(--olive-text); }
.pill.outline { background: transparent; box-shadow: inset 0 0 0 1px var(--border-2); color: var(--fg-2); }

/* chips, segmented controls, tabs */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 3px 2px; margin: -3px -2px; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chips.bleed { margin: -3px calc(var(--gutter) * -1); padding: 3px var(--gutter); scroll-padding: 0 var(--gutter); }
.chip { display: inline-flex; align-items: center; gap: 6px; flex: none; min-height: 40px; padding: 0 16px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border), 0 1px 2px rgba(34,30,24,.04); font-size: 0.875rem; font-weight: 650; color: var(--fg); transition: background var(--dur), color var(--dur), box-shadow var(--dur), transform 160ms var(--spring); }
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"], .chip[aria-checked="true"], .chip[aria-selected="true"], .chip.on { background: var(--btn); color: var(--on-btn); box-shadow: none; }
.chip:active { transform: scale(.96); }
.chip .i { width: 16px; height: 16px; }
.chip .count { font-size: 0.75rem; color: var(--fg-2); font-weight: 700; font-variant-numeric: tabular-nums; }

.seg { display: inline-flex; padding: 4px; gap: 2px; border-radius: 999px; background: var(--fill); position: relative; }
.seg.block { display: flex; }

.seg > button { min-height: 40px; padding: 0 14px; border-radius: 999px; font-size: 0.875rem; font-weight: 700; color: var(--fg-2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background var(--dur), color var(--dur), box-shadow var(--dur); white-space: nowrap; }
.seg > button[aria-pressed="true"], .seg > button[aria-selected="true"], .seg > button[aria-checked="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(23,18,12,.14); }
.seg > button .i { width: 17px; height: 17px; }
.utabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--border); }
.utabs::-webkit-scrollbar { display: none; }
.utabs button { position: relative; flex: none; min-height: 46px; padding: 0 12px; font-size: 0.9375rem; font-weight: 650; color: var(--fg-2); transition: color var(--dur); }
.utabs button::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2.5px; border-radius: 2px; background: var(--brand); transform: scaleX(0); transition: transform 240ms var(--ease-out); }
.utabs button[aria-selected="true"], .utabs button[aria-current="true"] { color: var(--fg); font-weight: 750; }
.utabs button[aria-selected="true"]::after, .utabs button[aria-current="true"]::after { transform: scaleX(1); }
.utabs .count { font-size: 0.75rem; color: var(--fg-2); margin-left: 4px; }

/* ============================================================
   Forms
   ============================================================ */
.field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.label { font-size: 0.875rem; font-weight: 700; color: var(--fg); }
.label .optional { font-weight: 500; color: var(--fg-2); }
.hint { font-size: 0.8125rem; color: var(--fg-2); }
.field-err { font-size: 0.8125rem; color: var(--error); display: flex; align-items: flex-start; gap: 6px; font-weight: 650; }
.field-err .i { width: 16px; height: 16px; margin-top: 2px; }
.input, .textarea, .select { width: 100%; min-height: 54px; padding: 0 18px; border-radius: var(--r-input); background: var(--surface); border: 1px solid var(--control); font-size: 1rem; transition: border-color var(--dur), box-shadow var(--dur); }
.textarea { padding: 14px 16px; min-height: 96px; resize: vertical; line-height: 1.45; }
.input::placeholder, .textarea::placeholder { color: var(--fg-3); }
.input:focus, .textarea:focus, .select:focus { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); outline: none; }
.field.invalid .input, .field.invalid .textarea { border-color: var(--error); }
.pw-wrap { position: relative; }
.pw-wrap .input { padding-right: 56px; }
.pw-wrap .icon-btn { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); }
.char-count { font-size: 0.75rem; color: var(--fg-2); text-align: right; font-variant-numeric: tabular-nums; }
.search { position: relative; }
.search > .i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--fg-2); width: 20px; height: 20px; pointer-events: none; }
.search .input { padding-left: 48px; padding-right: 48px; min-height: 54px; border-radius: 999px; border-color: transparent; background: var(--surface); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--hair); font-size: 0.9375rem; }
.search .input:focus { background: var(--surface); }
.search .clear { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); }
button.search-fake { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 0 20px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--hair); color: var(--fg-2); font-size: 0.9375rem; text-align: left; transition: background var(--dur); }
button.search-fake:hover { background: var(--surface-2); }
.two-fields { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp3); }
.switch { position: relative; width: 52px; height: 32px; border-radius: 999px; background: var(--border-2); flex: none; transition: background var(--dur) var(--ease); }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform var(--dur) var(--ease); }
[aria-checked="true"] > .switch { background: var(--btn); }
[aria-checked="true"] > .switch::after { transform: translateX(20px); }
.switch-row { display: flex; align-items: center; gap: var(--sp3); min-height: 62px; padding: 10px var(--sp4); width: 100%; text-align: left; }
.switch-row:hover { background: var(--surface-2); }
.switch-row[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.stepper { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: var(--fill); }
.stepper .icon-btn { width: 40px; height: 40px; background: var(--surface); box-shadow: 0 1px 2px rgba(23,18,12,.12); }
.stepper .icon-btn:hover { background: var(--surface-2); }
.stepper .icon-btn[disabled] { opacity: .4; }
.stepper output { min-width: 34px; text-align: center; font-weight: 800; font-size: 1.0625rem; font-variant-numeric: tabular-nums; }
.stepper.sm .icon-btn { width: 32px; height: 32px; }
.stepper.sm .icon-btn .i { width: 16px; height: 16px; }
.stepper.sm output { min-width: 26px; font-size: 0.9375rem; }
.opt { position: relative; display: flex; align-items: center; gap: var(--sp3); padding: 14px var(--sp4); border-radius: 18px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); text-align: left; width: 100%; transition: box-shadow var(--dur), background var(--dur), transform 140ms var(--ease); }
.opt:hover { background: var(--surface-2); }
.opt:active { transform: scale(.99); }
.opt[aria-pressed="true"], .opt[aria-checked="true"] { box-shadow: inset 0 0 0 2px var(--brand); background: var(--brand-soft); }
.opt .o-t { font-weight: 700; }
.opt .o-s { font-size: 0.8125rem; color: var(--fg-2); margin-top: 2px; }
.opt .o-end { margin-left: auto; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; flex: none; }
.radio-row { display: flex; align-items: center; gap: var(--sp3); min-height: 58px; padding: 8px var(--sp4); width: 100%; text-align: left; border-radius: 14px; }
.radio-row .rdot { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--control); flex: none; display: grid; place-items: center; margin-left: auto; }
.radio-row[aria-checked="true"] .rdot { border-color: var(--brand); border-width: 2px; }
.radio-row[aria-checked="true"] .rdot::after { content: ''; width: 11px; height: 11px; border-radius: 50%; background: var(--brand); }
.radio-row:hover { background: var(--surface-2); }
.radio-row[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.checkbox { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--control); display: grid; place-items: center; flex: none; color: transparent; background: var(--surface); transition: background var(--dur), border-color var(--dur); }
[aria-checked="true"] > .checkbox, [aria-pressed="true"] > .checkbox, .checkbox.on { background: var(--btn); border-color: var(--btn); color: var(--on-btn); }
.checkbox .i { width: 15px; height: 15px; stroke-width: 2.6; }

/* progress */
.bar { position: relative; height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
.bar.thin { height: 5px; }
.bar-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--brand); width: 0; transition: width 700ms var(--ease-out); }
.bar.olive .bar-fill { background: var(--olive); }

/* notices & empty states */
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 20px; background: var(--sand); color: var(--fg); font-size: 0.875rem; line-height: 1.45; }
.notice > .i { width: 19px; height: 19px; flex: none; margin-top: 1px; color: var(--fg-2); }
.notice.brand { background: var(--brand-soft); }
.notice.brand > .i { color: var(--brand-text); }
.notice.warn { background: var(--warning-soft); }
.notice.warn > .i { color: var(--warning-text); }
.notice.error { background: var(--error-soft); }
.notice.error > .i { color: var(--error); }
.notice.success { background: var(--success-soft); }
.notice.success > .i { color: var(--success-text); }
.notice.olive { background: var(--olive-soft); }
.notice.olive > .i { color: var(--olive-text); }
.notice .n-title { font-weight: 750; margin-bottom: 2px; }
.notice .n-body { flex: 1; min-width: 0; }
.notice .n-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--sp3); padding: var(--sp7) var(--sp5); }
.empty .empty-art { width: 128px; height: 96px; margin-bottom: var(--sp2); }
.empty h1, .empty h2, .empty h3 { font-size: 1.375rem; font-weight: 560; font-family: var(--serif); }
.empty p { color: var(--fg-2); max-width: 38ch; }
.empty .btn-row { justify-content: center; margin-top: var(--sp2); width: 100%; max-width: 380px; }
.sk { background: linear-gradient(90deg, var(--skeleton) 0%, var(--surface-2) 50%, var(--skeleton) 100%); background-size: 200% 100%; animation: shimmer 1.3s ease-in-out infinite; border-radius: 12px; }
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

/* key-value + receipts */
.kv { display: flex; flex-direction: column; margin: 0; }
.kv > div { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp4); padding: 12px 0; }
.kv > div + div { box-shadow: inset 0 1px 0 var(--hair); }
.kv dt { color: var(--fg-2); font-size: 0.875rem; flex: none; max-width: 52%; }
.kv dd { margin: 0; text-align: right; font-weight: 650; font-size: 0.9375rem; min-width: 0; overflow-wrap: anywhere; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.kv dd .sub { display: block; color: var(--fg-2); font-weight: 500; font-size: 0.8125rem; }
details.more > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-weight: 700; font-size: 0.875rem; color: var(--brand-text); }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary .i { width: 16px; height: 16px; transition: transform var(--dur); }
details.more[open] > summary .i { transform: rotate(180deg); }

/* avatars */
.av { width: 36px; height: 36px; border-radius: 50%; display: inline-grid; place-items: center; font-weight: 800; font-size: 0.8125rem; flex: none; background: var(--brand-soft-2); color: var(--on-soft); letter-spacing: -0.01em; }
.av.t2 { background: var(--olive-soft); color: var(--olive-text); }
.av.t3 { background: #E7E1F3; color: #4C3F75; }
.av.t4 { background: #DCEAF0; color: #2A5566; }
.av.sm { width: 30px; height: 30px; font-size: 0.6875rem; }
.av.lg { width: 56px; height: 56px; font-size: 1.125rem; }
.av.xl { width: 76px; height: 76px; font-size: 1.5rem; }
.av-stack { display: inline-flex; }
.av-stack .av { box-shadow: 0 0 0 2.5px var(--surface); }
.av-stack .av + .av { margin-left: -8px; }

/* ============================================================
   Sheets, dialogs, toasts, motion
   ============================================================ */
.layer { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
.sheet-wrap, .dialog-layer { position: absolute; inset: 0; pointer-events: auto; }
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity 260ms var(--ease); }
.scrim.on { opacity: 1; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100% - 40px - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; background: var(--elevated); border-radius: 28px 28px 0 0; box-shadow: var(--shadow-3); transform: translateY(100%); transition: transform 360ms var(--ease-out); outline: none; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet.on { transform: translateY(0); }
.sheet.dragging { transition: none; }
.sheet.full { height: calc(100% - 24px - env(safe-area-inset-top, 0px)); }
.sheet-handle { width: 40px; height: 5px; border-radius: 3px; background: var(--border-2); margin: 8px auto 0; flex: none; cursor: grab; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp3); padding: 10px 12px 6px 24px; flex: none; touch-action: none; }
.sheet-head.bare { justify-content: flex-end; padding-bottom: 0; }
.sheet-head h2 { font-size: 1.25rem; font-weight: 560; letter-spacing: -0.015em; font-family: var(--serif); }
.sheet-body { padding: 4px 24px 16px; overflow-y: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--sp4); overscroll-behavior: contain; }
.sheet-body.flush { padding-left: 8px; padding-right: 8px; }
.sheet-body.last { padding-bottom: 26px; }
.sheet-foot { padding: 12px 24px 18px; display: flex; flex-direction: column; gap: 8px; box-shadow: inset 0 1px 0 var(--hair); flex: none; background: var(--elevated); }
.sheet-foot.row-btns { flex-direction: row; }
.sheet-foot.row-btns .btn { flex: 1; }
.dialog-layer { display: grid; place-items: center; padding: var(--sp5); }
.dialog { position: relative; width: 100%; max-width: 400px; background: var(--elevated); border-radius: 26px; padding: var(--sp6); box-shadow: var(--shadow-3); transform: scale(.94); opacity: 0; transition: transform 220ms var(--ease-out), opacity 180ms; }
.dialog.on { transform: scale(1); opacity: 1; }
.dialog h2 { font-size: 1.25rem; font-weight: 560; margin-bottom: 8px; font-family: var(--serif); }
.dialog p { color: var(--fg-2); }
.dialog .dialog-actions { display: flex; flex-direction: column; gap: 8px; margin-top: var(--sp5); }
.toasts { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(92vw, 460px); }
.app.has-bbar ~ .toasts, .has-bbar .toasts { bottom: calc(var(--tabbar-h) + 84px + env(safe-area-inset-bottom, 0px)); }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 12px; border-radius: 18px; background: var(--toast-bg); color: var(--toast-fg); box-shadow: var(--shadow-3); font-size: 0.875rem; font-weight: 600; animation: toastIn 300ms var(--ease-out); max-width: 100%; min-height: 54px; }
.toast > .i { width: 20px; height: 20px; flex: none; margin-left: 4px; }
.toast .t-img { width: 40px; height: 40px; border-radius: 11px; flex: none; }
.toast .t-msg { flex: 1; min-width: 0; }
.toast .t-msg small { display: block; opacity: .78; font-size: 0.75rem; margin-top: 1px; font-weight: 500; }
.toast .t-act { color: var(--toast-link); font-weight: 800; padding: 8px 10px; border-radius: 10px; min-height: 40px; white-space: nowrap; }
.toast.out { animation: toastOut 220ms var(--ease) forwards; }
@keyframes toastIn { from { transform: translateY(14px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes toastOut { to { transform: translateY(8px); opacity: 0; } }

/* ============================================================
   Motion
   ============================================================ */
.screen.enter-push { animation: pushIn 340ms var(--ease-out); }
.screen.exit-push { animation: fadeOut 220ms var(--ease) forwards; }
.screen.enter-pop { animation: popIn 260ms var(--ease-out); }
.screen.exit-pop { animation: pushOutRight 260ms var(--ease) forwards; z-index: 2; }
.screen.enter-fade { animation: fadeIn 240ms var(--ease); }
.screen.exit-fade { animation: fadeOut 160ms var(--ease) forwards; }
.screen.enter-rise { animation: riseIn 400ms var(--ease-out); }
.screen.exit-rise { animation: fadeOut 200ms var(--ease) forwards; }
.screen.enter-shared { animation: fadeIn 280ms 140ms var(--ease) both; }
.screen.exit-shared { animation: fadeOut 260ms var(--ease) forwards; }
@keyframes pushIn { from { transform: translateX(28px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes popIn { from { transform: translateX(-16px); opacity: 0.6; } to { transform: none; opacity: 1; } }
@keyframes pushOutRight { to { transform: translateX(28px); opacity: 0; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes riseIn { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.shared-fly { position: fixed; z-index: 45; overflow: hidden; pointer-events: none; will-change: transform, border-radius; background-size: cover; background-position: center; }
.shared-fly img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shared-hide { visibility: hidden; }
.rise { animation: rise 520ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 60ms); }
.screen.no-anim .rise { animation: none; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.fade-swap { animation: fadeIn 240ms var(--ease); }
.flash { animation: flash 1.4s var(--ease); }
@keyframes flash { 0%, 100% { box-shadow: var(--shadow-1), inset 0 0 0 1px var(--hair); } 20% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 30%, transparent), inset 0 0 0 1px var(--brand); } }
.app.rm *, .app.rm *::before, .app.rm *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; scroll-behavior: auto !important; }
}

/* ============================================================
   Desktop shell (≥ 1024px): top navigation, wider content,
   floating sheets, no tab bar
   ============================================================ */
@media (min-width: 1024px) {
  :root { --gutter: 32px; --topnav-h: 72px; }
  .tabbar { display: none; }
  .basketbar-wrap { display: none; }
  .screen.has-tabbar .content, .app.has-bbar .screen.has-tabbar .content { padding-bottom: var(--sp10); }
  .screen.has-tabbar .footer-bar { bottom: 0; }
  .screen.has-tabbar.has-footer .content { padding-bottom: 132px; }
  .toasts, .app.has-bbar ~ .toasts { bottom: 28px; }
  .topnav { display: block; flex: none; height: var(--topnav-h); background: color-mix(in srgb, var(--bg) 94%, transparent); box-shadow: 0 1px 0 var(--hair); z-index: 25; }
  .topnav[hidden] { display: none !important; }
  .tn-inner { height: 100%; max-width: 1304px; margin: 0 auto; padding: 0 var(--gutter); display: flex; align-items: center; gap: 20px; }
  .tn-brand { flex: none; border-radius: 12px; }
  .tn-loc { display: flex; flex-direction: column; align-items: flex-start; padding: 6px 12px; border-radius: 12px; min-width: 0; max-width: 200px; flex: none; }
  .tn-loc:hover { background: var(--fill); }
  .tn-loc-k { font-size: 0.6875rem; font-weight: 700; color: var(--fg-2); }
  .tn-loc-v { display: flex; align-items: center; gap: 5px; font-weight: 750; font-size: 0.875rem; min-width: 0; max-width: 100%; }
  .tn-loc-v .i { color: var(--brand-text); }
  .tn-loc-v .i:last-child { color: var(--fg-2); }
  .tn-search { flex: 1 1 360px; max-width: 460px; display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 12px 0 16px; border-radius: 14px; background: var(--sand); color: var(--fg-2); font-size: 0.875rem; text-align: left; transition: background var(--dur); }
  .tn-search:hover { background: var(--sand-2); }
  .tn-search .i { width: 19px; height: 19px; }
  .tn-search span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tn-search kbd { font-family: var(--font); font-size: 0.75rem; font-weight: 700; padding: 2px 8px; border-radius: 7px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border-2); color: var(--fg-2); }
  .tn-links { display: flex; gap: 2px; }
  .tn-link { position: relative; min-height: 44px; padding: 0 12px; border-radius: 12px; font-weight: 700; font-size: 0.9375rem; color: var(--fg-2); }
  .tn-link:hover { color: var(--fg); background: var(--fill); }
  .tn-link[aria-current="page"] { color: var(--fg); }
  .tn-link[aria-current="page"]::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: 4px; height: 2.5px; border-radius: 2px; background: var(--brand); }
  .tn-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .tn-proto { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 12px; font-weight: 700; font-size: 0.8125rem; color: var(--fg-2); box-shadow: inset 0 0 0 1px var(--border-2); }
  .tn-proto:hover { color: var(--fg); background: var(--fill); }
  .tn-basket { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px 0 14px; border-radius: 14px; background: var(--btn); color: var(--on-btn); font-weight: 750; font-size: 0.9375rem; }
  .tn-basket:hover { background: var(--btn-hover); }
  .tn-b-n { min-width: 24px; height: 24px; padding: 0 7px; border-radius: 999px; background: rgba(255,255,255,.24); display: grid; place-items: center; font-size: 0.8125rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .tn-avatar { border-radius: 50%; }
  .tn-avatar .av { width: 40px; height: 40px; font-size: 0.8125rem; }
  .sheet { left: 50%; right: auto; bottom: auto; top: 50%; width: min(560px, calc(100vw - 48px)); max-height: min(800px, calc(100vh - 64px)); border-radius: 28px; transform: translate(-50%, -46%) scale(.97); opacity: 0; transition: transform 260ms var(--ease-out), opacity 200ms; }
  .sheet.on { transform: translate(-50%, -50%); opacity: 1; }
  .sheet.wide { width: min(780px, calc(100vw - 48px)); }
  .sheet.side { left: auto; right: 0; top: 0; bottom: 0; height: 100%; max-height: none; width: min(460px, 92vw); border-radius: 28px 0 0 28px; transform: translateX(100%); opacity: 1; }
  .sheet.side.on { transform: none; }
  .sheet-handle { display: none; }
  .sheet-head { padding-top: 18px; }
  .netbar { padding-top: 8px; }
}

/* ============================================================
   VYRA: type, shared commerce pieces
   ============================================================ */
.display, .page-head h1, .sheet-head h2, .dialog h2, .empty h1, .empty h2, .empty h3 { font-family: var(--serif); font-weight: 700; letter-spacing: -0.035em; font-variation-settings: 'wdth' 92; font-optical-sizing: auto; }
.display { font-size: clamp(2rem, 7.6vw, 3.25rem); line-height: 0.98; text-wrap: balance; }
.display.md { font-size: clamp(1.75rem, 6vw, 2.25rem); line-height: 1.02; }
.page-head h1 { font-size: clamp(1.875rem, 6.4vw, 2.5rem); line-height: 1; }
.sheet-head h2 { font-size: 1.3rem; }
.sec-title, .sec-title.sans { font-family: var(--font); font-weight: 700; letter-spacing: -0.015em; }
.wordmark .mark { border-radius: 9px; }

.scroll-x { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; margin: 0 calc(var(--gutter) * -1); padding: 2px var(--gutter) 6px; scroll-padding: 0 var(--gutter); }

.btn-col { display: flex; flex-direction: column; gap: 10px; }

.radio { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--border-2); flex: none; display: grid; place-items: center; }
[aria-checked="true"] > .radio { box-shadow: inset 0 0 0 2px var(--brand-text); }
[aria-checked="true"] > .radio::after { content: ''; width: 11px; height: 11px; border-radius: 50%; background: var(--brand-text); }
.checkbox { width: 22px; height: 22px; border-radius: 7px; box-shadow: inset 0 0 0 2px var(--border-2); display: grid; place-items: center; color: transparent; flex: none; }
[aria-checked="true"] > .checkbox { background: var(--fg); box-shadow: none; color: var(--bg); }
.checkbox .i { width: 15px; height: 15px; stroke-width: 2.6; }
.stepper > span { min-width: 26px; text-align: center; font-weight: 700; }
.link-plain { font-weight: 600; text-align: left; }
.sec-link { display: inline-flex; align-items: center; gap: 2px; font-weight: 700; font-size: 0.875rem; }
.or { display: flex; align-items: center; gap: 12px; color: var(--fg-3); font-size: 0.8125rem; }
.or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.notice.lilac { background: var(--lilac-soft); }
.notice.lilac > .i { color: var(--lilac-text); }
.req { font-family: var(--font); font-size: 0.75rem; font-weight: 700; color: var(--brand-text); margin-left: 6px; }
.fs { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.sel-inline select { appearance: none; border: 0; background: var(--fill) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' width='14' height='14' fill='none' stroke='%235E5E69' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>") no-repeat right 10px center; padding: 8px 32px 8px 12px; border-radius: 999px; font: inherit; font-size: 0.8125rem; font-weight: 650; color: var(--fg); min-height: 40px; }
.table-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
.tbl th, .tbl td { text-align: left; padding: 12px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl thead th { font-size: 0.75rem; font-weight: 700; color: var(--fg-2); background: var(--surface-2); white-space: nowrap; }
.tbl tbody th { font-weight: 600; }
.tbl small { display: block; font-size: 0.75rem; color: var(--fg-2); font-weight: 500; margin-top: 2px; }
.tbl tr.you { background: color-mix(in srgb, var(--brand-soft) 55%, transparent); }
.cbx { width: 20px; height: 20px; accent-color: var(--fg); }
.upload-drop { display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: 18px; border: 1.5px dashed var(--border-2); cursor: pointer; background: var(--surface-2); }
.upload-drop:hover { border-color: var(--brand-text); }
.upload-drop:focus-within { outline: 2.5px solid var(--focus); outline-offset: 2px; }
.upload-drop > .i { width: 26px; height: 26px; color: var(--brand-text); }
.upload-drop span { display: flex; flex-direction: column; }
.upload-drop small { color: var(--fg-2); }
.demo-box { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding: 14px 16px; border-radius: 18px; border: 1.5px dashed var(--border-2); }
.sponsored { display: inline-block; margin-top: 4px; font-size: 0.6875rem; font-weight: 700; color: var(--fg-2); }

/* Prices and ratings */
.price { display: inline-flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; font-weight: 700; }
.price .was { font-weight: 500; color: var(--fg-3); font-size: 0.85em; }
.price .save-pct { font-size: 0.75rem; font-weight: 750; color: var(--deal); background: var(--brand-soft); padding: 1px 7px; border-radius: 999px; }
.price.lg { font-size: 1.25rem; }
.price.xl { font-size: 1.625rem; letter-spacing: -0.02em; }
.rating { display: inline-flex; align-items: center; gap: 4px; font-size: 0.8125rem; }
.rating .i { width: 14px; height: 14px; color: var(--gold); }

.vtick, .ctick { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; margin-left: 4px; vertical-align: -2px; flex: none; }
.vtick { background: var(--fg); color: var(--bg); }
.ctick { background: var(--lilac); color: #fff; }
.vtick .i, .ctick .i { width: 10px; height: 10px; stroke-width: 3.2; }

/* Avatars cropped from creator posters */
.cav { display: inline-block; width: 44px; height: 44px; border-radius: 50%; background-size: 220% auto; background-position: 50% 26%; flex: none; box-shadow: 0 0 0 2px var(--surface); }
.cav.xs { width: 22px; height: 22px; }

.av.t1 { background: var(--brand-soft); color: var(--on-soft); }
.av.t5 { background: var(--sand-2); color: var(--fg); }
.av.t6 { background: var(--lilac-soft); color: var(--lilac-text); }
.seller-mark { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-weight: 800; font-size: 0.875rem; letter-spacing: -0.02em; flex: none; background: var(--sand); color: var(--fg); }
.seller-mark.sm { width: 32px; height: 32px; border-radius: 10px; font-size: 0.75rem; }
.seller-mark.t1 { background: #F3E6DA; color: #5A3A1E; } .seller-mark.t2 { background: #FBE3E6; color: #7A2333; } .seller-mark.t3 { background: #EADFD3; color: #4A3423; } .seller-mark.t4 { background: #EFE7DA; color: #5C4520; } .seller-mark.t5 { background: #E0E9E3; color: #2B4B37; } .seller-mark.t6 { background: #E7E4F6; color: #3D3480; }

/* Disclosure labels */
.disc { display: inline-flex; align-items: center; gap: 4px; min-height: 26px; padding: 0 9px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; background: rgba(255,255,255,.18); color: #fff; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.disc .i { width: 12px; height: 12px; stroke-width: 2.4; }
.disc.paid { background: rgba(255,97,92,.92); color: #15151B; }
.disc.affiliate { background: rgba(149,117,255,.96); color: #15151B; }
.disc-mini { display: inline-block; font-size: 0.6875rem; font-weight: 750; padding: 2px 8px; border-radius: 999px; background: var(--fill); color: var(--fg-2); white-space: nowrap; }
.disc-mini.affiliate { background: var(--lilac-soft); color: var(--lilac-text); }
.disc-mini.paid { background: var(--brand-soft); color: var(--on-soft); }
.live-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px 3px 7px; border-radius: 6px; background: #CF2A24; color: #fff; font-size: 0.6875rem; font-weight: 800; letter-spacing: 0.02em; }
.lb-dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: lbPulse 1.4s ease-in-out infinite; }
@keyframes lbPulse { 50% { opacity: .35; } }

/* Product cards */
.pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; }
.pcard { position: relative; display: flex; flex-direction: column; gap: 10px; min-width: 0; }

.pc-ph { aspect-ratio: 4 / 5; width: 100%; }

.pc-ph img { transition: transform 600ms var(--ease-out); }
.pc-flag { position: absolute; left: 10px; top: 10px; padding: 4px 9px; border-radius: 999px; background: var(--fg); color: var(--bg); font-size: 0.6875rem; font-weight: 750; }
.pc-flag.muted { background: var(--surface); color: var(--fg); }
.pc-rank { position: absolute; left: 10px; bottom: 6px; font-family: var(--serif); font-weight: 800; font-size: 2.6rem; line-height: 1; color: #fff; text-shadow: 0 2px 16px rgba(0,0,0,.35); font-variation-settings: 'wdth' 80; }
.pc-save { position: absolute; right: 8px; top: 8px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); color: var(--fg); box-shadow: var(--shadow-1); }
.pc-save .i { width: 19px; height: 19px; }
.pc-save.on .i, .icon-btn.on .i { fill: var(--heart); stroke: var(--heart); }
.pc-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; padding: 0 2px; }
.pc-seller { display: flex; align-items: center; font-size: 0.75rem; font-weight: 650; color: var(--fg-2); }
.pc-name { font-size: 0.9375rem; font-weight: 600; line-height: 1.3; letter-spacing: -0.005em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pc-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-size: 0.75rem; color: var(--fg-2); margin-top: 2px; }
.pc-del { font-size: 0.75rem; }
.pcard.sm { width: 156px; }
.prail { gap: 14px; }
.prow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 8px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow-card); }
.prow:hover { background: var(--surface-2); }
.prow-ph { width: 56px; height: 64px; border-radius: 12px; flex: none; }
.prow-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.prow-t { font-weight: 600; font-size: 0.9375rem; line-height: 1.3; }
.prow-s { font-size: 0.8125rem; color: var(--fg-2); }
.prow-r { flex: none; padding-right: 6px; }
.col-item { display: flex; align-items: center; gap: 6px; }
.col-item .prow { flex: 1; min-width: 0; }

.seller-card { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow-card); }
.seller-card.compact { box-shadow: none; padding: 0; background: none; }
.sc-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.sc-name { display: flex; align-items: center; font-weight: 700; }
.sc-sub, .sc-meta { font-size: 0.8125rem; color: var(--fg-2); }
.sc-meta .i { width: 13px; height: 13px; color: var(--gold); vertical-align: -2px; }
.sc-meta b { color: var(--fg); }
.shop-row { display: block; width: 100%; text-align: left; padding: 14px; }

/* Shop top bars */
.shop-top { background: var(--bg); }
.bag-btn { position: relative; }
.bag-n { position: absolute; top: 3px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--brand); color: var(--on-btn); font-size: 0.6875rem; font-weight: 800; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.icon-btn.glass { background: var(--video-glass); color: #fff; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.icon-btn.glass:hover { background: rgba(40,40,48,.6); }
.icon-btn.glass-light { background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: var(--fg); box-shadow: var(--shadow-1); }
.btn-glass { background: rgba(255,255,255,.16); color: #fff; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); }
.btn-glass:hover { background: rgba(255,255,255,.24); }

/* ============================================================
   Video: still frames that play like clips
   ============================================================ */
.vid { position: absolute; inset: 0; overflow: hidden; background: var(--video-bg); }
.vid-frame, .vid-frame > .ph { position: absolute; inset: 0; }
.vid-frame .ph img, .vid-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 40%; }
.clip.active.playing .vid-frame img, .vid.playing .vid-frame img { animation: kenburns 16s ease-in-out infinite alternate; }
@keyframes kenburns { from { transform: scale(1.02) translate3d(0, 0, 0); } to { transform: scale(1.14) translate3d(-2.5%, -2%, 0); } }
.vid-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(12,12,16,.42) 0%, rgba(12,12,16,0) 18%, rgba(12,12,16,0) 46%, rgba(12,12,16,.72) 82%, rgba(12,12,16,.86) 100%); pointer-events: none; }
.vid-cc { position: absolute; left: 50%; bottom: calc(46% - 8px); transform: translateX(-50%); max-width: 82%; padding: 5px 11px; border-radius: 8px; background: rgba(12,12,16,.62); color: #fff; font-size: 0.875rem; font-weight: 600; text-align: center; line-height: 1.35; pointer-events: none; transition: opacity 200ms; }
.vid-cc:empty { display: none; }
.vid-prog { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.18); z-index: 3; }
.vid-prog span { position: absolute; inset: 0; background: #fff; transform-origin: 0 50%; transform: scaleX(0); }
.vid-time { position: absolute; right: 12px; bottom: 10px; font-size: 0.6875rem; font-weight: 700; color: rgba(255,255,255,.8); opacity: 0; transition: opacity 200ms; pointer-events: none; }
.clip.paused .vid-time, .clip:hover .vid-time { opacity: 1; }
.vid-big { position: absolute; left: 50%; top: 42%; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%; background: rgba(12,12,16,.42); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: grid; place-items: center; color: #fff; opacity: 0; transform: scale(.85); transition: opacity 200ms, transform 240ms var(--spring); pointer-events: none; }
.vid-big .i { width: 34px; height: 34px; fill: #fff; stroke: none; margin-left: 4px; }
.clip.paused .vid-big { opacity: 1; transform: none; }

/* Feed */
.feed-screen { background: var(--video-bg); }
.feed { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--video-bg); }
.feed-top { position: absolute; z-index: 6; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px; pointer-events: none; }
.feed-top > * { pointer-events: auto; }
.ft-side { display: flex; gap: 6px; flex: 1; }
.ft-side.right { justify-content: flex-end; }
.feed-tabs { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--video-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.feed-tabs button { min-height: 38px; padding: 0 13px; white-space: nowrap; border-radius: 999px; color: rgba(255,255,255,.78); font-weight: 700; font-size: 0.875rem; }
.feed-tabs button[aria-selected="true"] { background: #fff; color: #15151B; }
.feed-scroll { flex: 1; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; overscroll-behavior: contain; }
.feed-scroll::-webkit-scrollbar { display: none; }
.clip { position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden; outline: none; color: #fff; }
.clip:focus-visible { box-shadow: inset 0 0 0 3px var(--focus); }
.clip-tap { position: absolute; inset: 0; z-index: 1; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.clip-tap:focus-visible { outline: none; box-shadow: inset 0 0 0 3px #fff; }
.clip-rail { position: absolute; z-index: 3; right: 8px; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 18px); display: flex; flex-direction: column; align-items: center; gap: 6px; transition: opacity 200ms; }
.rail-av { position: relative; margin-bottom: 10px; }
.rail-av-b { border-radius: 50%; display: block; }
.rail-av .cav, .rail-av .av { width: 48px; height: 48px; box-shadow: 0 0 0 2px #fff; }
.rail-follow { position: absolute; left: 50%; bottom: -10px; width: 24px; height: 24px; margin-left: -12px; border-radius: 50%; background: var(--brand); color: #15151B; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--video-bg); transition: transform 200ms var(--spring); }
.rail-follow.on { background: #fff; }
.rail-follow .i { width: 14px; height: 14px; stroke-width: 3; }
.rail-b { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 52px; min-height: 52px; padding: 6px 2px; border-radius: 16px; color: #fff; font-size: 0.75rem; font-weight: 700; text-shadow: 0 1px 6px rgba(0,0,0,.4); }
.rail-b .i { width: 30px; height: 30px; filter: drop-shadow(0 1px 6px rgba(0,0,0,.35)); transition: transform 180ms var(--spring); }
.rail-b:active .i { transform: scale(.86); }
.rail-b.on .i { fill: currentColor; }
.rail-b[data-act="like"].on .i { fill: var(--heart); stroke: var(--heart); }
.rail-b.tick .i { animation: pop 380ms var(--spring); }
@keyframes pop { 40% { transform: scale(1.32); } }
.clip-info { position: absolute; z-index: 2; left: 0; right: 72px; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 18px); padding: 0 12px 0 14px; display: flex; flex-direction: column; gap: 8px; transition: opacity 200ms; }
.clip.clean .clip-info, .clip.clean .clip-rail, .clip.clean .vid-cc { opacity: 0; pointer-events: none; }
.ci-who { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ci-handle { color: #fff; font-weight: 750; font-size: 1rem; text-shadow: 0 1px 8px rgba(0,0,0,.45); }
.ci-cap { font-size: 0.9375rem; line-height: 1.4; text-shadow: 0 1px 8px rgba(0,0,0,.5); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ci-tag { font-weight: 700; }
.ci-demo { margin-left: 4px; padding: 1px 7px; border-radius: 999px; background: rgba(255,255,255,.16); font-size: 0.6875rem; font-weight: 700; color: #fff; }
.ci-sound { display: flex; align-items: center; gap: 6px; font-size: 0.8125rem; color: var(--video-fg-2); }
.ci-prod { display: flex; align-items: center; gap: 10px; padding: 7px 10px 7px 7px; margin-top: 2px; border-radius: 18px; background: rgba(250,249,247,.94); color: #15151B; text-align: left; box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); max-width: 360px; transition: transform 200ms var(--ease-out); }
.ci-prod:hover { transform: translateY(-2px); }
.ci-prod.mini { max-width: none; }
.cip-ph { width: 46px; height: 46px; border-radius: 12px; flex: none; }
.cip-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.cip-t { font-size: 0.875rem; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cip-p { font-size: 0.875rem; font-weight: 800; }
.cip-p s { font-weight: 500; color: #6B6B77; }
.cip-go { flex: none; display: inline-flex; align-items: center; gap: 2px; min-height: 36px; padding: 0 12px; border-radius: 999px; background: #FF615C; color: #15151B; font-size: 0.8125rem; font-weight: 750; }
.feed-end { height: 60%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--video-fg-2); scroll-snap-align: start; }
.feed-empty { flex: 1; display: grid; place-items: center; padding: 24px; }
.feed-nav { position: absolute; z-index: 5; right: 16px; top: 50%; transform: translateY(-50%); display: none; flex-direction: column; gap: 8px; }
.feed-ctl { position: absolute; z-index: 5; left: 12px; top: calc(env(safe-area-inset-top, 0px) + 60px); display: flex; gap: 6px; }
.heart-burst { position: absolute; z-index: 4; width: 96px; height: 96px; margin: -48px 0 0 -48px; color: var(--heart); pointer-events: none; animation: burst 900ms var(--ease-out) forwards; }
.heart-burst .i { width: 100%; height: 100%; fill: currentColor; stroke: none; filter: drop-shadow(0 6px 20px rgba(0,0,0,.4)); }
@keyframes burst { 0% { transform: scale(.3) rotate(-12deg); opacity: 0; } 25% { transform: scale(1.1) rotate(6deg); opacity: 1; } 100% { transform: scale(1) translateY(-60px); opacity: 0; } }
.tabbar.on-video { background: rgba(21,21,27,.78); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 0 0 1px rgba(255,255,255,.08); }

/* Product preview sheet over the video */
.pp-sheet { max-height: 62%; }
.pp-pick { display: flex; gap: 8px; }
.pp-pick button { border-radius: 14px; padding: 2px; box-shadow: inset 0 0 0 2px transparent; }
.pp-pick button[aria-selected="true"] { box-shadow: inset 0 0 0 2px var(--fg); }
.ppk-ph { width: 52px; height: 52px; border-radius: 11px; }
.pp-top { display: flex; gap: 14px; align-items: flex-start; }
.pp-ph { width: 104px; height: 128px; border-radius: 16px; flex: none; }
.pp-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pp-name { font-size: 1.125rem; font-weight: 650; line-height: 1.25; letter-spacing: -0.01em; }

    catch (e) { const c = e && e.code; toast(c === 'declined' ? 'Download cancelled' : c === 'rate_limited' ? 'A download is already waiting for you to confirm' : 'Downloads aren’t available here', { icon: c === 'declined' ? 'info' : 'alertCircle' }); return false; }
  }
  if (inHost) { toast('Downloads aren’t available here', { icon: 'alertCircle' }); return false; }
  try {
    const url = URL.createObjectURL(new Blob([data], { type: filename.endsWith('.json') ? 'application/json' : 'text/plain' }));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast('Saved ' + filename, { icon: 'download' }); return true;
  } catch (e) { toast('Downloads aren’t available here', { icon: 'alertCircle' }); return false; }
}

function setFieldError(field, msg) {
  if (!field) return;

  let e = $('.field-err', field);
  const input = $('input, textarea, select', field);
  if (msg) {
    if (!e) { e = document.createElement('div'); e.className = 'field-err'; e.id = uid('err'); field.appendChild(e); }
    e.innerHTML = ic('alertCircle') + '<span>' + esc(msg) + '</span>';
    if (input) { input.setAttribute('aria-invalid', 'true'); input.setAttribute('aria-describedby', [input.dataset.hint, e.id].filter(Boolean).join(' ')); }

}

/* ============================================================
   Screen 4–5: the shoppable For You feed and product preview.
   Clips are still frames that play like video: a slow camera
   move, a running progress bar and timed captions. The player
   pauses for sheets, hidden tabs and lost connection, and picks
   up from the same moment afterwards.
   ============================================================ */
const PLAYER = { active: null, t: {}, user: false, muted: true, raf: 0, last: 0, root: null };
function clipBlocked() { return PLAYER.user || sheetStack.length > 0 || document.hidden || S.net === 'offline' || !PLAYER.root || !PLAYER.root.isConnected; }
function playerFrame(ts) {
  const dt = PLAYER.last ? Math.min(100, ts - PLAYER.last) : 0; PLAYER.last = ts;
  const id = PLAYER.active; const root = PLAYER.root;
  if (id && root && root.isConnected) {
    const v = videoById(id); const clip = $(`.clip[data-vid="${id}"]`, root);
    const blocked = clipBlocked();
    if (clip) {
      clip.classList.toggle('playing', !blocked);
      if (!blocked) PLAYER.t[id] = ((PLAYER.t[id] || 0) + dt) % (v.dur * 1000);
      const t = PLAYER.t[id] || 0; const f = t / (v.dur * 1000);
      const bar = $('.vid-prog span', clip); if (bar) bar.style.transform = `scaleX(${f})`;
      const cc = $('.vid-cc', clip);
      if (cc) { const ln = v.lines[Math.min(v.lines.length - 1, Math.floor(f * v.lines.length))]; if (cc.dataset.l !== ln) { cc.dataset.l = ln; cc.textContent = ln; } cc.hidden = !S.settings.captions; }
      const tc = $('.vid-time', clip); if (tc) tc.textContent = `${Math.floor(t / 60000)}:${pad2(Math.floor(t / 1000) % 60)} / ${Math.floor(v.dur / 60)}:${pad2(v.dur % 60)}`;
    }
  }
  PLAYER.raf = requestAnimationFrame(playerFrame);
}
function startPlayer(root) { PLAYER.root = root; PLAYER.user = false; if (!PLAYER.raf) { PLAYER.last = 0; PLAYER.raf = requestAnimationFrame(playerFrame); } }
function stopPlayer() { cancelAnimationFrame(PLAYER.raf); PLAYER.raf = 0; PLAYER.root = null; }

/* ---------- Search ---------- */
const VOCAB = () => { const w = new Set(); Object.values(PRODUCTS).forEach((p) => normalise(p.name + ' ' + p.cat + ' ' + SELLERS[p.seller].name).split(' ').forEach((x) => x.length > 2 && w.add(x))); Object.values(CREATORS).forEach((c) => { w.add(c.handle); normalise(c.name).split(' ').forEach((x) => w.add(x)); }); return [...w]; };
function lev(a, b) { const m = a.length, n = b.length; const d = Array.from({ length: m + 1 }, (_, i) => [i]); for (let j = 1; j <= n; j++) d[0][j] = j; for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[m][n]; }
function searchAll(q) {
  const n = normalise(q); if (!n) return { products: [], videos: [], creators: [], shops: [] };
  const terms = n.split(' ');
  const hit = (txt) => { const t = normalise(txt); return terms.every((x) => t.includes(x) || (x.endsWith('s') && t.includes(x.slice(0, -1)))); };
  return {
    products: Object.values(PRODUCTS).filter((p) => hit([p.name, p.cat, (CATS.find((c) => c.id === p.cat) || {}).label, SELLERS[p.seller].name, p.desc, (p.opts || []).map((o) => o.values.map((v) => v.v).join(' ')).join(' ')].join(' '))).map((p) => p.id),
    videos: VIDEOS.filter((v) => hit([v.caption, (v.tags || []).join(' '), CREATORS[v.creator].name, CREATORS[v.creator].handle, v.pids.map((id) => PRODUCTS[id].name).join(' ')].join(' '))).map((v) => v.id),
    creators: Object.values(CREATORS).filter((c) => hit([c.name, c.handle, c.cat, c.bio].join(' '))).map((c) => c.id),
    shops: Object.values(SELLERS).filter((s) => hit([s.name, s.tag].join(' '))).map((s) => s.id),
  };
}
function suggestFix(q) { const n = normalise(q); if (!n) return null; const voc = VOCAB(); let changed = false; const fixed = n.split(' ').map((w) => { if (voc.includes(w) || w.length < 3) return w; let best = null, bd = 3; voc.forEach((v) => { const d = lev(w, v); if (d < bd) { bd = d; best = v; } }); if (best && bd <= (w.length > 5 ? 2 : 1)) { changed = true; return best; } return w; }).join(' '); return changed ? fixed : null; }
const SORTS = [['rel', 'Most relevant'], ['low', 'Price: low to high'], ['high', 'Price: high to low'], ['rating', 'Highest rated'], ['new', 'Newest']];
function applyFilters(ids, f = {}) {
  let list = ids.map((id) => PRODUCTS[id]);
  if (f.cat) list = list.filter((p) => p.cat === f.cat);
  if (f.max) list = list.filter((p) => p.price <= f.max);
  if (f.rating) list = list.filter((p) => p.rating >= f.rating);
  if (f.verified) list = list.filter((p) => SELLERS[p.seller].verified);
  if (f.freeDel) list = list.filter((p) => SELLERS[p.seller].ship.std === 0 || SELLERS[p.seller].ship.free <= 3000);
  if (f.inStock) list = list.filter((p) => stockFor(p, defaultSel(p)) > 0);
  if (f.sale) list = list.filter((p) => p.was);
  const s = f.sort || 'rel';
  if (s === 'low') list.sort((a, b) => a.price - b.price); if (s === 'high') list.sort((a, b) => b.price - a.price); if (s === 'rating') list.sort((a, b) => b.rating - a.rating); if (s === 'new') list.sort((a, b) => NEW_IN.indexOf(b.id) - NEW_IN.indexOf(a.id));
  return list.map((p) => p.id);
}
const filterCount = (f) => ['cat', 'max', 'rating', 'verified', 'freeDel', 'inStock', 'sale'].filter((k) => f[k]).length;
function filterBar(f, scope) { const n = filterCount(f); return `<div class="filter-bar"><button class="chip${n ? ' on' : ''}" data-act="filters" data-scope="${scope}" aria-pressed="${!!n}">${ic('sliders')}Filters${n ? ` · ${n}` : ''}</button><button class="chip" data-act="sort" data-scope="${scope}">${ic('sort')}${esc((SORTS.find((x) => x[0] === (f.sort || 'rel')) || SORTS[0])[1])}</button>${f.inStock ? '' : `<button class="chip" data-act="quick-filter" data-k="inStock" data-scope="${scope}">In stock</button>`}${f.freeDel ? '' : `<button class="chip" data-act="quick-filter" data-k="freeDel" data-scope="${scope}">Free delivery</button>`}${f.sale ? '' : `<button class="chip" data-act="quick-filter" data-k="sale" data-scope="${scope}">On sale</button>`}</div>`; }

}

async function pdpAdd(buy) {
  const e = currentEntry(); const pr = PRODUCTS[e.params.id]; const b = $(buy ? '[data-act="pdp-buy"]' : '[data-act="pdp-add"]');
  busy(b, true); await delay(450); const res = addToBag(pr.id, e.params.sel, 1, e.params.from || { type: 'product' }); busy(b, false);
  if (!res.ok) { toast(res.reason === 'out' ? 'That option just sold out' : `You already have all ${res.left} available in your bag`, { icon: 'alertCircle', tone: 'error' }); refreshScreen(); return; }
  updateChrome(); haptic('success');
  if (buy) { go('checkout'); return; }
  toast('Added to bag', { img: imgFor(pr, e.params.sel), sub: `${pr.name}${selText(pr, e.params.sel) ? ' · ' + selText(pr, e.params.sel) : ''}`, action: { label: 'View bag', fn: () => openBag() } });
}

  const live = liveState('l1'); const act = S.orders.find((o) => orderStatus(o) === 'active');
  return `<section class="stack-sm"><h3 class="sec-title sans">Views</h3><div class="view-grid" role="radiogroup" aria-label="View">${[['shop', 'Shopper app', 'user', 'Watch, shop and track'], ['studio', 'Creator Studio', 'video', 'Post videos, see commission'], ['seller', 'Seller Centre', 'store', 'Fulfil orders, run lives']].map(([k, l, i, s]) => `<button class="opt tile" role="radio" aria-checked="${view === k}" data-dv="${k}">${ic(i)}<span class="o-t">${l}<span class="o-s">${s}</span></span></button>`).join('')}</div></section>
    <section class="stack-sm"><h3 class="sec-title sans">Try an edge case</h3><ul class="list boxed card">
      <li><button class="row compact" data-dx="soldout"${S.bag.length ? '' : ' aria-disabled="true"'}><span class="row-ic">${ic('eyeOff')}</span><span class="row-main"><span class="row-title">Sell out an item in your bag</span><span class="row-sub">${S.bag.length ? 'Shows the stock-change notice' : 'Add something to your bag first'}</span></span></button></li>
      <li><button class="row compact" data-dx="price"${S.bag.length ? '' : ' aria-disabled="true"'}><span class="row-ic">${ic('tag')}</span><span class="row-main"><span class="row-title">Raise a price in your bag by £2</span><span class="row-sub">Checkout asks you to accept it</span></span></button></li>
      <li><button class="switch-row" role="switch" aria-checked="${!!S.demo.declineNext}" data-dsw="decline"><span class="row-main"><span class="row-title">Next payment is declined</span><span class="row-sub">Shows payment recovery</span></span><span class="switch" aria-hidden="true"></span></button></li>
      <li><button class="row compact" data-dx="endlive"><span class="row-ic">${ic('radio')}</span><span class="row-main"><span class="row-title">${live.ended ? 'Restart Maya’s live stream' : 'End Maya’s live stream'}</span><span class="row-sub">${live.ended ? 'Brings the stream back' : 'Try it while checking out from the stream'}</span></span></button></li>
      <li><button class="row compact" data-dx="ship"${act ? '' : ' aria-disabled="true"'}><span class="row-ic">${ic('truck')}</span><span class="row-main"><span class="row-title">Advance your latest parcel</span><span class="row-sub">${act ? `${esc(act.ref)} · ${esc(SELLERS[act.shipments.find((s) => s.status !== 'delivered').seller].name)}` : 'No active orders'}</span></span></button></li>
      <li><button class="switch-row" role="switch" aria-checked="${S.net === 'offline'}" data-dsw="net"><span class="row-main"><span class="row-title">Lose connection</span><span class="row-sub">Videos pause and your bag stays saved</span></span><span class="switch" aria-hidden="true"></span></button></li>
    </ul></section>
    <section class="stack-sm"><h3 class="sec-title sans">Data</h3><div class="btn-row"><button class="btn btn-secondary" data-dx="onboard">Replay onboarding</button><button class="btn btn-danger-ghost" data-dx="reset">Reset the demo</button></div><p class="small muted">Everything is saved in this browser only.</p></section>`;
}
ACTIONS.views = () => {
  closeAllSheets();
  openSheet({ title: 'Prototype controls', className: 'side', body: demoBody(), onMount: (c) => c.body.addEventListener('click', async (e) => {
    const v = e.target.closest('[data-dv]'); if (v) { c.close(); switchView(v.dataset.dv); return; }
    const sw = e.target.closest('[data-dsw]'); if (sw) { if (sw.dataset.dsw === 'decline') S.demo.declineNext = !S.demo.declineNext; else { S.net = S.net === 'offline' ? 'online' : 'offline'; updateChrome(); } save(); c.setBody(demoBody()); return; }
    const x = e.target.closest('[data-dx]'); if (!x || x.getAttribute('aria-disabled') === 'true') return; const k = x.dataset.dx;
    if (k === 'soldout') { const l = S.bag[0]; const p = PRODUCTS[l.pid]; S.stock[p.id + ':' + variantKey(p, l.sel)] = 0; save(); c.close(); openBag(); setTimeout(() => refreshScreen(), 60); toast(`${p.name} sold out in ${selText(p, l.sel) || 'its only option'}`, { icon: 'alert' }); }
    if (k === 'price') { const l = S.bag[0]; S.priceBump[l.pid] = (S.priceBump[l.pid] || 0) + 200; save(); c.close(); toast(`${PRODUCTS[l.pid].name} is now £2 more`, { icon: 'tag', action: { label: 'Check out', fn: () => go('checkout') } }); }
    if (k === 'endlive') { const st = liveState('l1'); st.ended = !st.ended; save(); updatePip(); c.close(); refreshScreen(); toast(st.ended ? 'Maya’s stream has ended' : 'Maya is live again', { icon: 'radio' }); }
    if (k === 'ship') { const o = S.orders.find((x2) => orderStatus(x2) === 'active'); const sh = o.shipments.find((s) => s.status !== 'delivered'); advanceShipment(o, sh); c.setBody(demoBody()); refreshScreen(); toast(`${SELLERS[sh.seller].name}: ${shipLabel(sh)}`, { icon: 'truck' }); }
    if (k === 'onboard') { c.close(); S.onboarded = false; save(); resetTo(['welcome']); }
    if (k === 'reset') { if (await confirmDialog({ title: 'Reset the demo?', body: 'This clears your bag, orders, saves and settings in this browser.', confirm: 'Reset', danger: true })) { resetState(); save(); applySettings(); renderChrome(); closeAllSheets(); resetTo(['welcome']); } }
  }) });
};

/* ============================================================
   Boot
   ============================================================ */
function boot() {
  Object.assign(els, { app: $('#app'), topnav: $('#topnav'), screens: $('#screens'), tabbar: $('#tabbar'), basketbar: $('#basketbar'), netbar: $('#netbar'), sheetLayer: $('#sheet-layer'), toasts: $('#toasts') });
  watchHostTheme(); loadState(); applySettings(); renderChrome(); bindGlobal();
  setTimeout(() => downloadsCap(), 0);
  const h = (location.hash || '').slice(1);
  const start = h === 'studio' ? { route: 'studio', params: { tab: 'dash' } } : h === 'seller' ? { route: 'seller', params: { tab: 'dash' } } : S.onboarded ? 'feed' : 'welcome';
  resetTo([start], 'none');
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applySettings());
  window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', () => applySettings());
  document.addEventListener('visibilitychange', () => { if (document.hidden) { S.lastSeen = Date.now(); try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } } });
  window.addEventListener('offline', () => { S.net = 'offline'; updateChrome(); });
  window.addEventListener('online', () => { if (S.net === 'offline') { S.net = 'online'; updateChrome(); } });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
